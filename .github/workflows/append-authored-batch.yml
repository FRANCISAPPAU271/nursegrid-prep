name: Append authored question batch

on:
  workflow_dispatch:

jobs:
  append-question-batch:
    name: Append questions to production database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASEURL }}

    steps:
      - name: Check out the production branch
        uses: actions/checkout@v4
        with:
          ref: enforce-48-hour-access

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate authored bank
        run: npm run verify:bank

      - name: Confirm database secret is available
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is missing"
            exit 1
          fi
          echo "DATABASE_URL is available"

      - name: Append new questions
        run: npm run append:authored-batch
