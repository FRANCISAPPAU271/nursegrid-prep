name: Append authored question batch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  append-question-batch:
    name: Append questions to production database
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate authored bank
        run: npm run verify:bank

      - name: Append new questions without replacing existing data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run append:authored-batch
