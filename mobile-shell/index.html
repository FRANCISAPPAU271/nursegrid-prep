<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NurseGrid Prep</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #059669;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .wrap { text-align: center; color: #fff; }
      .icon { font-size: 48px; }
      p { opacity: 0.85; font-size: 14px; margin-top: 12px; }
    </style>
  </head>
  <body>
    <!--
      This file is only a placeholder required by Capacitor's `webDir` setting.
      In production, capacitor.config.ts points `server.url` at the deployed
      NurseGrid Prep web app, so the native shell navigates directly to the
      live, server-rendered Next.js app instead of loading this local file.
      This file only appears briefly if the remote URL is unreachable.
    -->
    <div class="wrap">
      <div class="icon">🩺</div>
      <p>Loading NurseGrid Prep…</p>
    </div>
  </body>
</html>
