<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — NurseGrid Prep</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #0f172a;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        max-width: 420px;
        text-align: center;
        background: #fff;
        border-radius: 24px;
        padding: 40px 32px;
        box-shadow: 0 24px 60px rgba(16, 24, 40, 0.12);
      }
      .icon {
        font-size: 40px;
        display: inline-grid;
        place-items: center;
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: #059669;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        color: #475569;
        line-height: 1.5;
        margin: 0 0 24px;
      }
      button {
        border: none;
        background: #059669;
        color: white;
        font-weight: 600;
        font-size: 15px;
        padding: 12px 24px;
        border-radius: 12px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">🩺</div>
      <h1>You're offline</h1>
      <p>NurseGrid Prep needs an internet connection to sync your tasks, notes, and question bank progress. Reconnect and try again.</p>
      <button onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
