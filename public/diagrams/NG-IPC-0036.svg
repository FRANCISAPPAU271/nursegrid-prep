<svg viewBox="0 0 460 230" role="img" xmlns="http://www.w3.org/2000/svg"><title>Sterile field boundaries</title>
<rect width="460" height="230" fill="#f6f8fc"/>
<rect x="70" y="60" width="320" height="130" fill="#fff" stroke="#0a1628" stroke-width="2"/>
<rect x="70" y="60" width="320" height="25" fill="#e2574c" opacity=".18"/>
<rect x="70" y="165" width="320" height="25" fill="#e2574c" opacity=".18"/>
<rect x="70" y="60" width="25" height="130" fill="#e2574c" opacity=".18"/>
<rect x="365" y="60" width="25" height="130" fill="#e2574c" opacity=".18"/>
<rect x="95" y="85" width="270" height="80" fill="#0f9d76" opacity=".16"/>
<text x="230" y="120" font-size="14" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#0f9d76">STERILE</text>
<text x="230" y="140" font-size="10.5" text-anchor="middle" font-family="system-ui" fill="#0f9d76">keep in sight · above waist</text>
<text x="230" y="76" font-size="10" text-anchor="middle" font-family="system-ui" font-weight="600" fill="#a8352c">outer 2.5 cm border = CONTAMINATED</text>
<text x="230" y="182" font-size="10" text-anchor="middle" font-family="system-ui" font-weight="600" fill="#a8352c">anything below table level = CONTAMINATED</text>
<line x1="70" y1="205" x2="390" y2="205" stroke="#8aa0bf" stroke-dasharray="4 3"/>
<text x="230" y="222" font-size="11" text-anchor="middle" font-family="system-ui" fill="#5a6b85">Out of sight · below the waist · wet through — all count as dirty</text>
<text x="230" y="38" font-size="12" text-anchor="middle" font-family="system-ui" font-weight="700">If in doubt, it is contaminated</text>
</svg>