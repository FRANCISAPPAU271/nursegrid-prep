<svg viewBox="0 0 460 210" role="img" xmlns="http://www.w3.org/2000/svg"><title>Insulin onset and peak</title>
<rect width="460" height="210" fill="#f6f8fc"/>
<line x1="50" y1="160" x2="430" y2="160" stroke="#0a1628" stroke-width="2"/>
<line x1="50" y1="30" x2="50" y2="160" stroke="#0a1628" stroke-width="2"/>
<path d="M50 160 Q90 50 130 90 Q170 130 230 158" fill="none" stroke="#e2574c" stroke-width="3"/>
<path d="M70 160 Q150 60 240 95 Q330 130 410 158" fill="none" stroke="#0f9d76" stroke-width="3" stroke-dasharray="6 4"/>
<circle cx="105" cy="66" r="4" fill="#e2574c"/>
<text x="112" y="58" font-size="11" font-family="system-ui" fill="#e2574c" font-weight="700">PEAK 2–4 h</text>
<text x="112" y="72" font-size="10" font-family="system-ui" fill="#e2574c">soluble / regular</text>
<circle cx="205" cy="82" r="4" fill="#0f9d76"/>
<text x="214" y="78" font-size="11" font-family="system-ui" fill="#0f9d76" font-weight="700">PEAK 6–12 h</text>
<text x="214" y="92" font-size="10" font-family="system-ui" fill="#0f9d76">isophane / NPH</text>
<text x="240" y="180" font-size="11" text-anchor="middle" font-family="system-ui" fill="#5a6b85">hours after injection</text>
<text x="30" y="95" font-size="11" font-family="system-ui" fill="#5a6b85" transform="rotate(-90 30 95)">effect</text>
<text x="230" y="200" font-size="11" text-anchor="middle" font-family="system-ui" font-weight="600">Hypoglycaemia is most likely AT THE PEAK</text>
</svg>