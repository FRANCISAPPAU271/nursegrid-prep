<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="420" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">THE NURSING PROCESS — A CYCLE, NOT A LIST</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">Each step depends on the one before it. Skip assessment and everything after it is a guess.</text>

<circle cx="320" cy="200" r="118" fill="none" stroke="#c8c0b4" stroke-width="1.5" stroke-dasharray="5 5"/>

<circle cx="320" cy="90" r="46" fill="#1a3a5c"/>
<text x="320" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">ASSESS</text>
<text x="320" y="102" text-anchor="middle" font-size="8.5" fill="#cfe0ec">collect the data</text>

<circle cx="424" cy="152" r="46" fill="#2f5f8a"/>
<text x="424" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">DIAGNOSE</text>
<text x="424" y="164" text-anchor="middle" font-size="8.5" fill="#cfe0ec">name the problem</text>

<circle cx="424" cy="266" r="46" fill="#5a86a8"/>
<text x="424" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">PLAN</text>
<text x="424" y="278" text-anchor="middle" font-size="8.5" fill="#f0f6fa">set the goal</text>

<circle cx="320" cy="322" r="46" fill="#1a5c3a"/>
<text x="320" y="318" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">IMPLEMENT</text>
<text x="320" y="334" text-anchor="middle" font-size="8.5" fill="#d8ecd8">carry it out</text>

<circle cx="216" cy="266" r="46" fill="#8a6d1e"/>
<text x="216" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">EVALUATE</text>
<text x="216" y="278" text-anchor="middle" font-size="8.5" fill="#f6eed8">did it work?</text>

<circle cx="216" cy="152" r="46" fill="#8b2f2f"/>
<text x="216" y="146" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">REASSESS</text>
<text x="216" y="160" text-anchor="middle" font-size="8.5" fill="#f4dcdc">and go round</text>
<text x="216" y="172" text-anchor="middle" font-size="8.5" fill="#f4dcdc">again</text>

<g fill="#8a7f70">
<polygon points="374,104 388,110 378,120"/>
<polygon points="446,208 440,222 432,210"/>
<polygon points="378,306 366,314 372,300"/>
<polygon points="262,306 274,314 268,300"/>
<polygon points="194,208 200,222 208,210"/>
<polygon points="266,104 252,110 262,120"/>
</g>

<rect x="20" y="352" width="290" height="56" fill="#eaf3ea" stroke="#8fb98f" stroke-width="1.5"/>
<text x="165" y="371" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a5c3a">A NURSING DIAGNOSIS</text>
<text x="32" y="389" font-size="10">Names a RESPONSE the nurse can treat:</text>
<text x="32" y="403" font-size="10" font-style="italic">"Risk of falls related to weakness and poor vision"</text>

<rect x="330" y="352" width="290" height="56" fill="#f7ecec" stroke="#c08a8a" stroke-width="1.5"/>
<text x="475" y="371" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b2f2f">A MEDICAL DIAGNOSIS</text>
<text x="342" y="389" font-size="10">Names the DISEASE, treated by the doctor:</text>
<text x="342" y="403" font-size="10" font-style="italic">"Stroke"  ·  "Diabetes mellitus"  ·  "Pneumonia"</text>
</svg>