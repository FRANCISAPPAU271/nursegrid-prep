<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 490" font-family="sans-serif">
<rect x="0" y="0" width="460" height="490" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#111827">Cognition + mood screens + the CGA wheel</text>
<g font-size="9" fill="#111827" text-anchor="middle">
<rect x="20" y="36" width="132" height="88" rx="6" fill="#eef2ff" stroke="#3730a3" stroke-width="1.5"/>
<text x="86" y="56" font-weight="bold" font-size="10">AMT-10</text>
<text x="86" y="70" font-size="8">10 quick Qs (age,</text>
<text x="86" y="81" font-size="8">time, place, recall)</text>
<text x="86" y="94" font-size="8" fill="#b91c1c">&lt;8 = impaired,</text>
<text x="86" y="105" font-size="8" fill="#b91c1c">assess further</text>
<text x="86" y="116" font-size="8" fill="#6b7280">2 minutes, bedside</text>
<rect x="164" y="36" width="132" height="88" rx="6" fill="#dcfce7" stroke="#065f46" stroke-width="1.5"/>
<text x="230" y="56" font-weight="bold" font-size="10">CLOCK DRAW</text>
<text x="230" y="70" font-size="8">"draw 10 past 11"</text>
<text x="230" y="81" font-size="8">numbers + hands</text>
<text x="230" y="94" font-size="8" fill="#b91c1c">errors = executive</text>
<text x="230" y="105" font-size="8" fill="#b91c1c">dysfunction flag</text>
<text x="230" y="116" font-size="8" fill="#6b7280">language-free-ish</text>
<rect x="308" y="36" width="132" height="88" rx="6" fill="#fef9c3" stroke="#713f12" stroke-width="1"/>
<text x="374" y="56" font-weight="bold" font-size="10">GDS-15</text>
<text x="374" y="70" font-size="8">15 yes/no mood Qs</text>
<text x="374" y="81" font-size="8">(satisfied? empty?</text>
<text x="374" y="94" font-size="8" fill="#b91c1c">≥5 = depressed,</text>
<text x="374" y="105" font-size="8" fill="#b91c1c">≥10 severe</text>
<text x="374" y="116" font-size="8" fill="#6b7280">ask suicide kindly</text>
</g>
<text x="20" y="146" font-size="12" font-weight="bold" fill="#111827">CGA WHEEL (8 domains, team sport)</text>
<g font-size="9" fill="#111827" text-anchor="middle">
<rect x="20" y="154" width="96" height="56" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="68" y="174" font-weight="bold" font-size="8">MEDICAL</text>
<text x="68" y="187" font-size="8">diseases, pain,</text>
<text x="68" y="198" font-size="8">sensory, continence</text>
<rect x="124" y="154" width="96" height="56" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
<text x="172" y="174" font-weight="bold" font-size="8">MEDS</text>
<text x="172" y="187" font-size="8">reconcile, Beers,</text>
<text x="172" y="198" font-size="8">adherence (M04)</text>
<rect x="228" y="154" width="96" height="56" rx="6" fill="#fef9c3" stroke="#713f12" stroke-width="1"/>
<text x="276" y="174" font-weight="bold" font-size="8">FUNCTION</text>
<text x="276" y="187" font-size="8">Katz, Lawton,</text>
<text x="276" y="198" font-size="8">TUG, frailty</text>
<rect x="332" y="154" width="108" height="56" rx="6" fill="#dcfce7" stroke="#065f46" stroke-width="1.5"/>
<text x="386" y="174" font-weight="bold" font-size="8">MIND+MOOD</text>
<text x="386" y="187" font-size="8">AMT, clock,</text>
<text x="386" y="198" font-size="8">GDS, delirium</text>
<rect x="20" y="218" width="96" height="56" rx="6" fill="#eef2ff" stroke="#3730a3" stroke-width="1.5"/>
<text x="68" y="238" font-weight="bold" font-size="8">NUTRITION</text>
<text x="68" y="251" font-size="8">MUST/MNA,</text>
<text x="68" y="262" font-size="8">teeth, swallow</text>
<rect x="124" y="218" width="96" height="56" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/>
<text x="172" y="238" font-weight="bold" font-size="8">SOCIAL</text>
<text x="172" y="251" font-size="8">home, money,</text>
<text x="172" y="262" font-size="8">carers, abuse?</text>
<rect x="228" y="218" width="96" height="56" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="276" y="238" font-weight="bold" font-size="8">ENVIRON.</text>
<text x="276" y="251" font-size="8">hazards, toilet,</text>
<text x="276" y="262" font-size="8">light, transport</text>
<rect x="332" y="218" width="108" height="56" rx="6" fill="#111827"/>
<text x="386" y="238" font-weight="bold" font-size="8" fill="#ffffff">GOALS</text>
<text x="386" y="251" font-size="8" fill="#ffffff">what matters</text>
<text x="386" y="262" font-size="8" fill="#ffffff">to THEM (M01)</text>
</g>
<rect x="0" y="286" width="460" height="204" fill="#f1f5f9"/>
<g font-size="10" fill="#111827">
<text x="20" y="308" font-weight="bold">SCREEN RULES: aids ON first (glasses, hearing aids, dentures — test the person,</text>
<text x="20" y="322">not the deficit); language matched (translate, don't shout); delirium EXCLUDED first</text>
<text x="20" y="336">(acute + fluctuating + inattentive = delirium until proven — M03, never label dementia</text>
<text x="20" y="350">in delirium); collateral from family (\"usual self? since when?\"); depression mimics</text>
<text x="20" y="364">dementia (\"don't know\" + distressed = mood; confabulate + unbothered = cognition).</text>
<text x="20" y="384">CGA FLOW: screen all 8 → problems list → goals with elder + family → plan (who/what/when)</text>
<text x="20" y="398">→ review date. Team: nurse (co-ordinator) + doctor + pharmacist (M04) + physio + dietician</text>
<text x="20" y="412">+ social welfare + family + elder IN the room. CGA pays: fewer falls, less delirium,</text>
<text x="20" y="426">shorter stays, more home discharges — the assessment that treats. Mini-CGA in OPD:</text>
<text x="20" y="440">CFS + Katz/IADL + TUG + AMT + GDS-4 + meds + MUST + goals — 15 minutes that change</text>
<text x="20" y="454">trajectories. Document all (PRO-I M5); re-screen each admission + yearly.</text>
<text x="20" y="474">Exam line: \"aids on, delirium out, collateral in — then all eight domains to one goals-list.\"</text>
</g>
</svg>