<svg viewBox="0 0 460 210" role="img" xmlns="http://www.w3.org/2000/svg"><title>Snakebite first aid do and do not</title>
<rect width="460" height="210" fill="#f6f8fc"/>
<text x="230" y="24" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">Snakebite — the traditional remedies cause the harm</text>
<rect x="18" y="38" width="205" height="152" rx="10" fill="#fff" stroke="#0f9d76" stroke-width="2.5"/>
<rect x="237" y="38" width="205" height="152" rx="10" fill="#fff" stroke="#e2574c" stroke-width="2.5"/>
<text x="120" y="62" font-size="13" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#0f9d76">DO</text>
<text x="339" y="62" font-size="13" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#e2574c">NEVER</text>
<g font-family="system-ui" font-size="10.5">
<text x="32" y="86">Reassure — keep the person calm</text>
<text x="32" y="106">Immobilise the limb, keep it</text><text x="32" y="120">at or below heart level</text>
<text x="32" y="140">Remove rings, bangles, watch</text>
<text x="32" y="160">Transport urgently — antivenom</text><text x="32" y="174">is the only real treatment</text>
<text x="251" y="86" fill="#a8352c">Apply a tight tourniquet</text>
<text x="251" y="106" fill="#a8352c">Cut the wound or suck out venom</text>
<text x="251" y="126" fill="#a8352c">Apply ice, herbs or black stone</text>
<text x="251" y="146" fill="#a8352c">Give alcohol or aspirin</text>
<text x="251" y="166" fill="#a8352c">Waste time catching the snake</text>
</g>
<text x="230" y="204" font-size="10.5" text-anchor="middle" font-family="system-ui" fill="#5a6b85">Photograph the snake from a safe distance if it can be done without delay</text>
</svg>