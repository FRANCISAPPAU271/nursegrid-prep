<svg viewBox="0 0 470 220" role="img" xmlns="http://www.w3.org/2000/svg"><title>Lymphatic drainage and oedema</title>
<rect width="470" height="220" fill="#f6f8fc"/>
<text x="235" y="20" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">Lymph is a ONE-WAY drainage system, not a circuit</text>
<rect x="26" y="44" width="120" height="54" rx="8" fill="#e2574c" opacity=".2" stroke="#e2574c" stroke-width="2"/>
<text x="86" y="66" font-size="10.5" text-anchor="middle" font-family="system-ui" font-weight="700">CAPILLARY</text>
<text x="86" y="82" font-size="9.5" text-anchor="middle" font-family="system-ui">fluid leaks out</text>
<rect x="176" y="44" width="120" height="54" rx="8" fill="#f2b705" opacity=".28" stroke="#f2b705" stroke-width="2"/>
<text x="236" y="66" font-size="10.5" text-anchor="middle" font-family="system-ui" font-weight="700">TISSUE SPACE</text>
<text x="236" y="82" font-size="9.5" text-anchor="middle" font-family="system-ui">interstitial fluid</text>
<rect x="326" y="44" width="120" height="54" rx="8" fill="#0f9d76" opacity=".22" stroke="#0f9d76" stroke-width="2"/>
<text x="386" y="66" font-size="10.5" text-anchor="middle" font-family="system-ui" font-weight="700">LYMPH VESSEL</text>
<text x="386" y="82" font-size="9.5" text-anchor="middle" font-family="system-ui">picks up excess</text>
<path d="M148 71 h24" stroke="#0a1628" stroke-width="2" marker-end="url(#l1)"/>
<path d="M298 71 h24" stroke="#0a1628" stroke-width="2" marker-end="url(#l1)"/>
<defs><marker id="l1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#0a1628"/></marker></defs>
<path d="M386 98 v22 h-160 v18" fill="none" stroke="#0f9d76" stroke-width="2" marker-end="url(#l1)"/>
<rect x="150" y="140" width="152" height="34" rx="8" fill="#fff" stroke="#0f9d76" stroke-width="2"/>
<text x="226" y="155" font-size="10" text-anchor="middle" font-family="system-ui" font-weight="700">LYMPH NODE — filters</text>
<text x="226" y="168" font-size="9" text-anchor="middle" font-family="system-ui">traps organisms and cancer cells</text>
<path d="M150 157 h-40 v-30" fill="none" stroke="#0f9d76" stroke-width="2" marker-end="url(#l1)"/>
<text x="60" y="128" font-size="9.5" font-family="system-ui" fill="#0f9d76" font-weight="600">back to</text>
<text x="60" y="140" font-size="9.5" font-family="system-ui" fill="#0f9d76" font-weight="600">subclavian vein</text>
<text x="235" y="196" font-size="10.5" text-anchor="middle" font-family="system-ui" fill="#5a6b85">Block the vessels or remove the nodes → fluid accumulates → LYMPHOEDEMA</text>
<text x="235" y="212" font-size="10" text-anchor="middle" font-family="system-ui" fill="#5a6b85">This is why filariasis and axillary node clearance both cause swelling</text>
</svg>