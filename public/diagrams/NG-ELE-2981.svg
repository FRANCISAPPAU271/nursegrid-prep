<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" role="img">
<rect width="460" height="300" fill="#ffffff"/>
<text x="230" y="26" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Anion gap: sorting a metabolic acidosis</text>
<text x="230" y="46" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">Gap = Na+ &#8722; (Cl&#8722; + HCO3&#8722;)   normal 8&#8211;12 mmol/L</text>
<rect x="40" y="66" width="110" height="150" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="95" y="86" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">Na+ 140</text>
<text x="95" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e3a8a">cations</text>
<rect x="180" y="66" width="110" height="96" fill="#fee2e2" stroke="#b91c1c"/>
<text x="235" y="86" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7f1d1d">Cl&#8722; 104</text>
<rect x="180" y="162" width="110" height="54" fill="#fef3c7" stroke="#b45309"/>
<text x="235" y="184" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350f">HCO3&#8722; 24</text>
<text x="235" y="200" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">measured anions</text>
<path d="M300 66 L300 216" stroke="#0f172a" stroke-width="1" stroke-dasharray="4 3"/>
<text x="320" y="120" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">GAP = 12</text>
<text x="320" y="138" font-family="sans-serif" font-size="10" fill="#475569">unmeasured</text>
<text x="320" y="152" font-family="sans-serif" font-size="10" fill="#475569">anions</text>
<text x="40" y="244" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">HIGH gap = acid ADDED</text>
<text x="40" y="260" font-family="sans-serif" font-size="10" fill="#475569">ketones, lactate, urate, salicylate, methanol</text>
<text x="40" y="278" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">NORMAL gap = bicarbonate LOST</text>
<text x="40" y="292" font-family="sans-serif" font-size="10" fill="#475569">diarrhoea, ileostomy, renal tubular acidosis</text>
</svg>