<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 482" width="100%" role="img">
<rect x="0" y="0" width="760" height="482" fill="#fdfcfa"/>
<text x="20" y="30" font-family="Georgia,serif" font-size="19" font-weight="bold" fill="#1d4e63">Why the same four habits cause five different diseases</text>
<text x="20" y="52" font-family="Georgia,serif" font-size="13" fill="#555">Ghana's NCD burden is not five separate problems. It is one set of exposures arriving at five different organs.</text>

<rect x="20" y="68" width="720" height="66" rx="6" fill="#fff3f0" stroke="#c0392b"/>
<text x="34" y="90" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#7a2020">Four shared behavioural risks</text>
<text x="34" y="114" font-family="Georgia,serif" font-size="12" fill="#333">Tobacco · harmful alcohol use · unhealthy diet, especially salt and sugar · physical inactivity</text>

<line x1="140" y1="140" x2="120" y2="176" stroke="#c0392b" stroke-width="2"/>
<line x1="290" y1="140" x2="278" y2="176" stroke="#c0392b" stroke-width="2"/>
<line x1="400" y1="140" x2="400" y2="176" stroke="#c0392b" stroke-width="2"/>
<line x1="510" y1="140" x2="522" y2="176" stroke="#c0392b" stroke-width="2"/>
<line x1="640" y1="140" x2="662" y2="176" stroke="#c0392b" stroke-width="2"/>

<rect x="20" y="180" width="720" height="60" rx="6" fill="#fff8e8" stroke="#b8860b"/>
<text x="34" y="202" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#8a6508">Three intermediate states — all silent, all measurable</text>
<text x="34" y="226" font-family="Georgia,serif" font-size="12" fill="#333">Raised blood pressure · raised blood glucose · raised body mass and waist circumference</text>

<line x1="200" y1="246" x2="140" y2="278" stroke="#b8860b" stroke-width="2"/>
<line x1="330" y1="246" x2="310" y2="278" stroke="#b8860b" stroke-width="2"/>
<line x1="430" y1="246" x2="450" y2="278" stroke="#b8860b" stroke-width="2"/>
<line x1="560" y1="246" x2="620" y2="278" stroke="#b8860b" stroke-width="2"/>

<rect x="20" y="282" width="172" height="86" rx="6" fill="#eef4f8" stroke="#2b6b8a"/>
<text x="34" y="304" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#1d4e63">Stroke</text>
<text x="34" y="324" font-family="Georgia,serif" font-size="11" fill="#333">The leading cause of</text>
<text x="34" y="340" font-family="Georgia,serif" font-size="11" fill="#333">adult disability on</text>
<text x="34" y="356" font-family="Georgia,serif" font-size="11" fill="#333">Ghanaian medical wards.</text>

<rect x="202" y="282" width="172" height="86" rx="6" fill="#eef4f8" stroke="#2b6b8a"/>
<text x="216" y="304" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#1d4e63">Heart failure</text>
<text x="216" y="324" font-family="Georgia,serif" font-size="11" fill="#333">Often the end point of</text>
<text x="216" y="340" font-family="Georgia,serif" font-size="11" fill="#333">years of untreated</text>
<text x="216" y="356" font-family="Georgia,serif" font-size="11" fill="#333">hypertension.</text>

<rect x="384" y="282" width="172" height="86" rx="6" fill="#eef4f8" stroke="#2b6b8a"/>
<text x="398" y="304" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#1d4e63">Kidney failure</text>
<text x="398" y="324" font-family="Georgia,serif" font-size="11" fill="#333">Diabetes and pressure</text>
<text x="398" y="340" font-family="Georgia,serif" font-size="11" fill="#333">together cause most of</text>
<text x="398" y="356" font-family="Georgia,serif" font-size="11" fill="#333">it, and dialysis is costly.</text>

<rect x="566" y="282" width="174" height="86" rx="6" fill="#eef4f8" stroke="#2b6b8a"/>
<text x="580" y="304" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#1d4e63">Blindness · amputation</text>
<text x="580" y="324" font-family="Georgia,serif" font-size="11" fill="#333">Diabetes reaching the</text>
<text x="580" y="340" font-family="Georgia,serif" font-size="11" fill="#333">retina and the foot, both</text>
<text x="580" y="356" font-family="Georgia,serif" font-size="11" fill="#333">preventable by screening.</text>

<rect x="20" y="384" width="720" height="80" rx="6" fill="#f2f7f2" stroke="#2e7d5b"/>
<text x="34" y="406" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#1d5c42">What this means for the nurse in front of one patient</text>
<text x="34" y="428" font-family="Georgia,serif" font-size="12" fill="#333">A patient who arrives with any one of these needs the others looked for, because the exposures were shared. Take a</text>
<text x="34" y="446" font-family="Georgia,serif" font-size="12" fill="#333">pressure from the diabetic, a glucose from the hypertensive, and a waist measurement from both.</text>
<text x="34" y="462" font-family="Georgia,serif" font-size="11" font-style="italic" fill="#1d5c42">One diagnosis is a reason to screen for the rest, not a reason to stop looking.</text>
</svg>