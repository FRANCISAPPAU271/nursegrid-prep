<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 464" width="100%" role="img">
<rect x="0" y="0" width="760" height="464" fill="#fdfcfa"/>
<text x="20" y="30" font-family="Georgia,serif" font-size="19" font-weight="bold" fill="#1d4e63">Milestones: the ages worth knowing, and the ones that mean act now</text>
<text x="20" y="52" font-family="Georgia,serif" font-size="13" fill="#555">Development runs head downwards and centre outwards, in a fixed order, at a variable pace.</text>

<rect x="20" y="68" width="720" height="128" rx="6" fill="#eef4f8" stroke="#2b6b8a"/>
<line x1="60" y1="140" x2="700" y2="140" stroke="#2b6b8a" stroke-width="2"/>
<circle cx="110" cy="140" r="6" fill="#2b6b8a"/><text x="82" y="126" font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#1d4e63">6 weeks</text><text x="76" y="164" font-family="Georgia,serif" font-size="11" fill="#333">social smile</text>
<circle cx="226" cy="140" r="6" fill="#2b6b8a"/><text x="200" y="126" font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#1d4e63">6 months</text><text x="196" y="164" font-family="Georgia,serif" font-size="11" fill="#333">sits with support</text>
<circle cx="342" cy="140" r="6" fill="#2b6b8a"/><text x="316" y="126" font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#1d4e63">9 months</text><text x="312" y="164" font-family="Georgia,serif" font-size="11" fill="#333">sits unsupported</text>
<circle cx="458" cy="140" r="6" fill="#2b6b8a"/><text x="428" y="126" font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#1d4e63">12 months</text><text x="424" y="164" font-family="Georgia,serif" font-size="11" fill="#333">stands, first words</text>
<circle cx="574" cy="140" r="6" fill="#2b6b8a"/><text x="544" y="126" font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#1d4e63">18 months</text><text x="546" y="164" font-family="Georgia,serif" font-size="11" fill="#333">walks alone</text>
<circle cx="682" cy="140" r="6" fill="#2b6b8a"/><text x="654" y="126" font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#1d4e63">2 years</text><text x="640" y="164" font-family="Georgia,serif" font-size="11" fill="#333">two-word phrases</text>
<text x="34" y="188" font-family="Georgia,serif" font-size="11" font-style="italic" fill="#1d4e63">The sequence never varies. A child cannot walk before she can stand, whatever her age.</text>

<rect x="20" y="212" width="352" height="140" rx="6" fill="#fff3f0" stroke="#c0392b"/>
<text x="34" y="234" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#7a2020">Red flags — refer, do not reassure</text>
<text x="34" y="258" font-family="Georgia,serif" font-size="12" fill="#333">Not sitting unsupported by 9 months</text>
<text x="34" y="278" font-family="Georgia,serif" font-size="12" fill="#333">Not walking by 18 months</text>
<text x="34" y="298" font-family="Georgia,serif" font-size="12" fill="#333">No single words by 18 months</text>
<text x="34" y="318" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#7a2020">Loss of a skill she previously had</text>
<text x="34" y="342" font-family="Georgia,serif" font-size="11" font-style="italic" fill="#7a2020">Regression is the most serious of all of these.</text>

<rect x="388" y="212" width="352" height="140" rx="6" fill="#f2f7f2" stroke="#2e7d5b"/>
<text x="402" y="234" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#1d5c42">Correcting for prematurity</text>
<text x="402" y="258" font-family="Georgia,serif" font-size="12" fill="#333">A baby born two months early is assessed</text>
<text x="402" y="276" font-family="Georgia,serif" font-size="12" fill="#333">against her corrected age, not the date on</text>
<text x="402" y="294" font-family="Georgia,serif" font-size="12" fill="#333">the birth certificate, until about two years.</text>
<text x="402" y="318" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#1d5c42">At 6 months old, born 2 months early,</text>
<text x="402" y="336" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#1d5c42">expect what a 4-month-old can do.</text>

<rect x="20" y="368" width="720" height="80" rx="6" fill="#fff8e8" stroke="#b8860b"/>
<text x="34" y="390" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#8a6508">The mother is the best instrument you have</text>
<text x="34" y="412" font-family="Georgia,serif" font-size="12" fill="#333">A mother who says something is wrong with her child's development is right far more often than she is wrong,</text>
<text x="34" y="430" font-family="Georgia,serif" font-size="12" fill="#333">and she sees the child every day where you see her for ten minutes. Take the concern as a finding.</text>
<text x="34" y="446" font-family="Georgia,serif" font-size="11" font-style="italic" fill="#8a6508">Never answer a developmental worry with wait and see and no appointment.</text>
</svg>