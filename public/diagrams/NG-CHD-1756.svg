<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%" role="img">
<rect x="0" y="0" width="760" height="470" fill="#fdfcfa"/>
<text x="20" y="30" font-family="Georgia,serif" font-size="19" font-weight="bold" fill="#1d4e63">The sick child: count, look, then classify</text>
<text x="20" y="52" font-family="Georgia,serif" font-size="13" fill="#555">Two numbers and one look separate a child who can go home from a child who must not.</text>

<rect x="20" y="68" width="352" height="176" rx="6" fill="#fff3f0" stroke="#c0392b"/>
<text x="34" y="90" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#7a2020">General danger signs — any one means refer</text>
<text x="34" y="114" font-family="Georgia,serif" font-size="12" fill="#333">Unable to drink or breastfeed</text>
<text x="34" y="136" font-family="Georgia,serif" font-size="12" fill="#333">Vomits everything</text>
<text x="34" y="158" font-family="Georgia,serif" font-size="12" fill="#333">Convulsions</text>
<text x="34" y="180" font-family="Georgia,serif" font-size="12" fill="#333">Lethargic or unconscious</text>
<text x="34" y="206" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#7a2020">Ask for these in every sick child, whatever</text>
<text x="34" y="224" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#7a2020">the mother came to complain about.</text>

<rect x="388" y="68" width="352" height="176" rx="6" fill="#eef4f8" stroke="#2b6b8a"/>
<text x="402" y="90" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#1d4e63">Fast breathing depends on age</text>
<text x="402" y="116" font-family="Georgia,serif" font-size="12" fill="#333">Under 2 months</text>
<text x="620" y="116" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#1d4e63">60 or more</text>
<text x="402" y="142" font-family="Georgia,serif" font-size="12" fill="#333">2 to 11 months</text>
<text x="620" y="142" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#1d4e63">50 or more</text>
<text x="402" y="168" font-family="Georgia,serif" font-size="12" fill="#333">12 months to 5 years</text>
<text x="620" y="168" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#1d4e63">40 or more</text>
<line x1="402" y1="182" x2="726" y2="182" stroke="#2b6b8a"/>
<text x="402" y="204" font-family="Georgia,serif" font-size="12" fill="#333">Count for a full minute, with the child calm</text>
<text x="402" y="222" font-family="Georgia,serif" font-size="12" fill="#333">and the chest uncovered. Not fifteen seconds.</text>

<rect x="20" y="260" width="352" height="96" rx="6" fill="#fff8e8" stroke="#b8860b"/>
<text x="34" y="282" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#8a6508">Chest indrawing</text>
<text x="34" y="304" font-family="Georgia,serif" font-size="12" fill="#333">The lower chest wall goes IN as the child</text>
<text x="34" y="322" font-family="Georgia,serif" font-size="12" fill="#333">breathes in. It is severe pneumonia.</text>
<text x="34" y="344" font-family="Georgia,serif" font-size="11" font-style="italic" fill="#8a6508">Soft tissue between the ribs moving is not this sign.</text>

<rect x="388" y="260" width="352" height="96" rx="6" fill="#f6f2fa" stroke="#6b4c93"/>
<text x="402" y="282" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#4a326b">Every fever in Ghana</text>
<text x="402" y="304" font-family="Georgia,serif" font-size="12" fill="#333">Do a rapid diagnostic test before treating.</text>
<text x="402" y="322" font-family="Georgia,serif" font-size="12" fill="#333">A negative test means look for another cause,</text>
<text x="402" y="340" font-family="Georgia,serif" font-size="12" fill="#333">not give antimalarials anyway.</text>

<rect x="20" y="372" width="720" height="82" rx="6" fill="#f2f7f2" stroke="#2e7d5b"/>
<text x="34" y="394" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#1d5c42">Diarrhoea: what the child needs is almost never a drug</text>
<text x="34" y="416" font-family="Georgia,serif" font-size="12" fill="#333">Low-osmolarity ORS after every loose stool, plus zinc for fourteen days, plus continued feeding and breastfeeding.</text>
<text x="34" y="434" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#1d5c42">Antidiarrhoeal medicines and antibiotics are not given for ordinary watery diarrhoea in a child.</text>
<text x="34" y="450" font-family="Georgia,serif" font-size="11" font-style="italic" fill="#1d5c42">Zinc shortens this episode and reduces the next one. It is not optional.</text>
</svg>