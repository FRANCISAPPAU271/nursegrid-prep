<svg viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect x="0" y="0" width="720" height="470" fill="#fbf8f3"/>
<text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#5b3a1e">Antenatal care: what each contact is actually for</text>
<text x="360" y="50" text-anchor="middle" font-size="12.5" fill="#7a6a58">Eight contacts is not eight repetitions of the same visit</text>

<line x1="60" y1="95" x2="660" y2="95" stroke="#8a6a45" stroke-width="2.5"/>
<g font-size="10.5" fill="#5b3a1e" text-anchor="middle">
<circle cx="80" cy="95" r="7" fill="#8a6a45"/><text x="80" y="80">&#8804;12 wk</text>
<circle cx="163" cy="95" r="6" fill="#b39066"/><text x="163" y="80">20</text>
<circle cx="246" cy="95" r="6" fill="#b39066"/><text x="246" y="80">26</text>
<circle cx="329" cy="95" r="6" fill="#b39066"/><text x="329" y="80">30</text>
<circle cx="412" cy="95" r="6" fill="#b39066"/><text x="412" y="80">34</text>
<circle cx="495" cy="95" r="6" fill="#b39066"/><text x="495" y="80">36</text>
<circle cx="578" cy="95" r="6" fill="#b39066"/><text x="578" y="80">38</text>
<circle cx="660" cy="95" r="7" fill="#8a6a45"/><text x="660" y="80">40 wk</text>
</g>
<text x="80" y="116" text-anchor="middle" font-size="10" fill="#7a6a58">booking</text>
<text x="660" y="116" text-anchor="middle" font-size="10" fill="#7a6a58">term</text>

<rect x="30" y="132" width="325" height="150" rx="7" fill="#f2ece2" stroke="#c9b79c"/>
<text x="45" y="153" font-size="13.5" font-weight="bold" fill="#5b3a1e">The booking contact establishes the baseline</text>
<text x="45" y="174" font-size="11.5" fill="#3f3428">Dates &#8212; every later judgement of growth depends</text>
<text x="45" y="190" font-size="11.5" fill="#3f3428">on them being right the first time</text>
<text x="45" y="209" font-size="11.5" fill="#3f3428">Haemoglobin, blood group and Rhesus status</text>
<text x="45" y="228" font-size="11.5" fill="#3f3428">HIV, syphilis, hepatitis B &#8212; all treatable now</text>
<text x="45" y="247" font-size="11.5" fill="#3f3428">Blood pressure &#8212; a reading before 20 weeks tells</text>
<text x="45" y="263" font-size="11.5" fill="#3f3428">you whether later hypertension is new</text>

<rect x="365" y="132" width="325" height="150" rx="7" fill="#f2ece2" stroke="#c9b79c"/>
<text x="380" y="153" font-size="13.5" font-weight="bold" fill="#5b3a1e">Later contacts look for what changes</text>
<text x="380" y="174" font-size="11.5" fill="#3f3428">Blood pressure and urine &#8212; pre-eclampsia is</text>
<text x="380" y="190" font-size="11.5" fill="#3f3428">silent until it is severe</text>
<text x="380" y="209" font-size="11.5" fill="#3f3428">Fundal height &#8212; growth, not size</text>
<text x="380" y="228" font-size="11.5" fill="#3f3428">Lie and presentation &#8212; matters from 36 weeks</text>
<text x="380" y="247" font-size="11.5" fill="#3f3428">SP for malaria, iron and folate, tetanus cover,</text>
<text x="380" y="263" font-size="11.5" fill="#3f3428">a treated net, and the birth plan</text>

<rect x="30" y="296" width="660" height="72" rx="7" fill="#efe4d4" stroke="#c9a678"/>
<text x="45" y="317" font-size="13.5" font-weight="bold" fill="#7a4a12">Why the first contact must be early, not merely present</text>
<text x="45" y="337" font-size="11.5" fill="#3f3428">Anaemia, syphilis, HIV and hypertension are all cheapest to treat before 20 weeks, and dating is</text>
<text x="45" y="353" font-size="11.5" fill="#3f3428">most accurate then. A woman booking at 30 weeks has not had late care &#8212; she has missed care.</text>

<rect x="30" y="382" width="660" height="72" rx="7" fill="#f6e9e6" stroke="#c98f80"/>
<text x="45" y="403" font-size="13.5" font-weight="bold" fill="#8a3018">The counting trap</text>
<text x="45" y="423" font-size="11.5" fill="#3f3428">A woman who attended eight times but was never weighed, never had her urine tested and never</text>
<text x="45" y="439" font-size="11.5" fill="#3f3428">had her blood pressure taken has eight contacts and no antenatal care. Count what was done.</text>
</svg>