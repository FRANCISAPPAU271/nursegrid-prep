<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 456" width="100%" role="img">
<rect x="0" y="0" width="760" height="456" fill="#fdfcfa"/>
<text x="20" y="30" font-family="Georgia,serif" font-size="19" font-weight="bold" fill="#1d5c42">Anorectal problems: the symptom points to the lesion</text>
<text x="20" y="52" font-family="Georgia,serif" font-size="13" fill="#555">Patients delay for months out of embarrassment. Ask directly, and ask about pain, blood and discharge separately.</text>

<rect x="20" y="68" width="232" height="164" rx="6" fill="#eef4f8" stroke="#2b6b8a"/>
<text x="34" y="90" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#1d4e63">Blood, little pain</text>
<text x="34" y="112" font-family="Georgia,serif" font-size="12" fill="#333">Bright red blood on the paper</text>
<text x="34" y="130" font-family="Georgia,serif" font-size="12" fill="#333">or dripping after stool.</text>
<text x="34" y="148" font-family="Georgia,serif" font-size="12" fill="#333">Itching, a lump that may</text>
<text x="34" y="166" font-family="Georgia,serif" font-size="12" fill="#333">reduce on its own.</text>
<text x="34" y="190" font-family="Georgia,serif" font-size="12" font-style="italic" fill="#1d4e63">Haemorrhoids</text>
<text x="34" y="214" font-family="Georgia,serif" font-size="12" fill="#333">Never assume. Exclude cancer.</text>

<rect x="264" y="68" width="232" height="164" rx="6" fill="#fff3f0" stroke="#c0392b"/>
<text x="278" y="90" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#7a2020">Severe pain on stool</text>
<text x="278" y="112" font-family="Georgia,serif" font-size="12" fill="#333">Sharp tearing pain during</text>
<text x="278" y="130" font-family="Georgia,serif" font-size="12" fill="#333">defaecation, lasting an hour</text>
<text x="278" y="148" font-family="Georgia,serif" font-size="12" fill="#333">afterwards. A little blood.</text>
<text x="278" y="170" font-family="Georgia,serif" font-size="12" fill="#333">The patient starts avoiding</text>
<text x="278" y="188" font-family="Georgia,serif" font-size="12" fill="#333">stool, which hardens it more.</text>
<text x="278" y="212" font-family="Georgia,serif" font-size="12" font-style="italic" fill="#7a2020">Anal fissure — a vicious circle</text>

<rect x="508" y="68" width="232" height="164" rx="6" fill="#fff8e8" stroke="#b8860b"/>
<text x="522" y="90" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#8a6508">Discharge that keeps coming</text>
<text x="522" y="112" font-family="Georgia,serif" font-size="12" fill="#333">Pus or moisture staining the</text>
<text x="522" y="130" font-family="Georgia,serif" font-size="12" fill="#333">underclothes, an opening near</text>
<text x="522" y="148" font-family="Georgia,serif" font-size="12" fill="#333">the anus, recurrent abscess</text>
<text x="522" y="166" font-family="Georgia,serif" font-size="12" fill="#333">that drains and returns.</text>
<text x="522" y="190" font-family="Georgia,serif" font-size="12" font-style="italic" fill="#8a6508">Fistula-in-ano</text>
<text x="522" y="214" font-family="Georgia,serif" font-size="12" fill="#333">A track will not heal shut.</text>

<rect x="20" y="248" width="720" height="86" rx="6" fill="#f2f7f2" stroke="#2e7d5b"/>
<text x="34" y="270" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#1d5c42">The care that decides whether the operation succeeds</text>
<text x="34" y="292" font-family="Georgia,serif" font-size="12" fill="#333">Soft stool is the treatment. A high-fibre diet, plenty of water, and a prescribed stool softener protect the</text>
<text x="34" y="310" font-family="Georgia,serif" font-size="12" fill="#333">repair; one hard, straining stool can tear it open. Warm sitz baths relieve spasm and keep the area clean.</text>
<text x="34" y="328" font-family="Georgia,serif" font-size="12" fill="#333">Analgesia before the first bowel action, because fear of pain is what makes patients avoid going.</text>

<rect x="20" y="350" width="720" height="90" rx="6" fill="#fff3f0" stroke="#c0392b"/>
<text x="34" y="372" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#7a2020">The trap: calling it piles without looking</text>
<text x="34" y="394" font-family="Georgia,serif" font-size="12" fill="#333">Rectal bleeding is assumed to be haemorrhoids more often than any other symptom is assumed to be anything,</text>
<text x="34" y="412" font-family="Georgia,serif" font-size="12" fill="#333">and rectal cancer is missed as a result. Change in bowel habit, weight loss, anaemia, or bleeding mixed</text>
<text x="34" y="430" font-family="Georgia,serif" font-size="12" fill="#333">through the stool rather than on its surface means the bowel must be examined properly.</text>
</svg>