<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 490" font-family="sans-serif">
<rect x="0" y="0" width="460" height="490" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#111827">Ear + Rinne/Weber + vertigo sort</text>
<!-- ear schematic -->
<path d="M40,80 C70,75 90,90 95,120" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round"/>
<text x="40" y="68" font-size="9" fill="#111827">canal (wax protects)</text>
<line x1="100" y1="105" x2="100" y2="140" stroke="#b91c1c" stroke-width="3"/>
<text x="112" y="112" font-size="8" fill="#111827">TM</text>
<g stroke="#334155" stroke-width="2.5">
<line x1="110" y1="112" x2="140" y2="112"/><line x1="140" y1="112" x2="160" y2="122"/><line x1="160" y1="122" x2="180" y2="122"/>
</g>
<text x="130" y="104" font-size="8" fill="#111827">malleus → incus → stapes</text>
<path d="M180,122 m-14,0 a14,14 0 1,0 28,0 a10,10 0 1,0 -20,0 a6,6 0 1,0 12,0" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="200" y="126" font-size="8" fill="#111827">cochlea (hearing)</text>
<g fill="none" stroke="#7c3aed" stroke-width="2">
<circle cx="260" cy="100" r="16"/><circle cx="292" cy="100" r="16"/><circle cx="276" cy="124" r="16"/>
</g>
<text x="276" y="156" font-size="8" fill="#111827" text-anchor="middle">canals + otoliths (balance)</text>
<path d="M100,140 C90,170 110,190 150,195" fill="none" stroke="#0d9488" stroke-width="3"/>
<text x="155" y="198" font-size="8" fill="#111827">Eustachian tube (pressure; blocked = glue ear)</text>
<!-- Rinne/Weber -->
<text x="20" y="226" font-size="12" font-weight="bold" fill="#111827">512 Hz fork: Rinne (AC vs BC) + Weber (midline?)</text>
<g font-size="9" fill="#111827">
<rect x="20" y="234" width="420" height="22" fill="#ecfdf5" stroke="#065f46" stroke-width="1"/>
<text x="30" y="249">NORMAL: Rinne AC &gt; BC both ears • Weber MIDLINE</text>
<rect x="20" y="258" width="420" height="22" fill="#fef9c3" stroke="#713f12" stroke-width="1"/>
<text x="30" y="273">CONDUCTIVE (wax/otitis/perforation/otosclerosis): Rinne BC &gt; AC affected • Weber TO the bad ear</text>
<rect x="20" y="282" width="420" height="22" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
<text x="30" y="297">SENSORINEURAL (presbycusis/noise/drugs/Ménière's): Rinne AC &gt; BC both (reduced) • Weber AWAY to good ear</text>
</g>
<!-- vertigo -->
<text x="20" y="326" font-size="12" font-weight="bold" fill="#111827">Vertigo: four sorts</text>
<g font-size="9" fill="#111827" text-anchor="middle">
<rect x="20" y="334" width="100" height="72" rx="8" fill="#dcfce7" stroke="#065f46" stroke-width="1.5"/>
<text x="70" y="352" font-weight="bold">BPPV</text>
<text x="70" y="365" font-size="8">seconds, rolling</text>
<text x="70" y="376" font-size="8">in bed; Dix-Hallpike</text>
<text x="70" y="387" font-size="8">→ Epley cures</text>
<text x="70" y="398" font-size="8" fill="#6b7280">crystals loose</text>
<rect x="126" y="334" width="100" height="72" rx="8" fill="#fef9c3" stroke="#713f12" stroke-width="1.5"/>
<text x="176" y="352" font-weight="bold">NEURITIS</text>
<text x="176" y="365" font-size="8">days, post-viral;</text>
<text x="176" y="376" font-size="8">HINTS peripheral;</text>
<text x="176" y="387" font-size="8">steroids + support</text>
<text x="176" y="398" font-size="8" fill="#6b7280">+ hearing = labyrinthitis</text>
<rect x="232" y="334" width="100" height="72" rx="8" fill="#ffedd5" stroke="#7c2d12" stroke-width="1.5"/>
<text x="282" y="352" font-weight="bold">MÉNIÈRE'S</text>
<text x="282" y="365" font-size="8">vertigo + tinnitus +</text>
<text x="282" y="376" font-size="8">fullness + low-tone</text>
<text x="282" y="387" font-size="8">loss; low-salt, diuretic</text>
<text x="282" y="398" font-size="8" fill="#6b7280">drop attacks warn</text>
<rect x="338" y="334" width="102" height="72" rx="8" fill="#fef2f2" stroke="#7f1d1d" stroke-width="2"/>
<text x="389" y="352" font-weight="bold">STROKE</text>
<text x="389" y="365" font-size="8">HINTS central /</text>
<text x="389" y="376" font-size="8">BE-FAST signs /</text>
<text x="389" y="387" font-size="8">can't walk unaided</text>
<text x="389" y="398" font-size="8" fill="#6b7280">→ thrombolysis path</text>
</g>
<rect x="0" y="418" width="460" height="72" fill="#f1f5f9"/>
<text x="20" y="440" font-size="10" fill="#111827">Ototoxic duo: aminoglycosides + furosemide (levels + hearing watch, warn tinnitus).</text>
<text x="20" y="454" font-size="10" fill="#111827">Never syringe without otoscopy + history (perforation/grommets/mastoid = ENT).</text>
<text x="20" y="468" font-size="10" fill="#111827">Anosmia: viral/COVID, polyps, head injury (cribriform shear), Parkinson's prodrome.</text>
</svg>