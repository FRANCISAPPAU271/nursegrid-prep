<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 240" role="img" aria-label="Nutrients required for wound and pressure ulcer healing and what each one does">
<rect width="460" height="240" fill="#ffffff"/>
<text x="230" y="22" text-anchor="middle" font-family="Georgia,serif" font-size="15" font-weight="bold" fill="#14532d">What a healing wound is built from</text>
<rect x="26" y="40" width="200" height="40" fill="#dbeafe" stroke="#1e3a8a"/>
<text x="36" y="58" font-family="Georgia,serif" font-size="11.5" font-weight="bold">Protein</text>
<text x="36" y="74" font-family="Georgia,serif" font-size="10">collagen, new tissue, immune cells</text>
<rect x="234" y="40" width="200" height="40" fill="#dcfce7" stroke="#14532d"/>
<text x="244" y="58" font-family="Georgia,serif" font-size="11.5" font-weight="bold">Energy</text>
<text x="244" y="74" font-family="Georgia,serif" font-size="10">spares protein for repair, not fuel</text>
<rect x="26" y="88" width="200" height="40" fill="#fef3c7" stroke="#92400e"/>
<text x="36" y="106" font-family="Georgia,serif" font-size="11.5" font-weight="bold">Vitamin C</text>
<text x="36" y="122" font-family="Georgia,serif" font-size="10">cross-links collagen; lack = weak scar</text>
<rect x="234" y="88" width="200" height="40" fill="#ede9fe" stroke="#5b21b6"/>
<text x="244" y="106" font-family="Georgia,serif" font-size="11.5" font-weight="bold">Zinc</text>
<text x="244" y="122" font-family="Georgia,serif" font-size="10">cell division, epithelial cover</text>
<rect x="26" y="136" width="408" height="40" fill="#e0f2fe" stroke="#1e3a8a"/>
<text x="36" y="154" font-family="Georgia,serif" font-size="11.5" font-weight="bold">Fluid</text>
<text x="36" y="170" font-family="Georgia,serif" font-size="10">skin turgor and perfusion — a dehydrated wound bed does not granulate</text>
<text x="230" y="200" text-anchor="middle" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#7c2d12">No dressing repairs a wound the diet cannot build.</text>
<text x="230" y="222" text-anchor="middle" font-family="Georgia,serif" font-size="10.8" font-style="italic" fill="#334155">Repositioning, pressure relief and nutrition work together, never alone.</text>
</svg>