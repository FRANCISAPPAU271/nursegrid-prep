<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" role="img">
<rect width="460" height="300" fill="#ffffff"/>
<text x="230" y="26" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Potassium on the ECG</text>
<text x="60" y="66" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">HIGH K+ &#8212; tall peaked T</text>
<path d="M40 110 L70 110 L78 96 L86 110 L110 110 L118 74 L126 110 L170 110" fill="none" stroke="#b91c1c" stroke-width="2"/>
<text x="180" y="100" font-family="sans-serif" font-size="10" fill="#7f1d1d">T narrow and tented;</text>
<text x="180" y="114" font-family="sans-serif" font-size="10" fill="#7f1d1d">then QRS widens, P flattens</text>
<text x="60" y="176" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">LOW K+ &#8212; flat T, U wave</text>
<path d="M40 220 L70 220 L78 206 L86 220 L110 220 L118 210 L126 220 L140 220 L148 212 L156 220 L190 220" fill="none" stroke="#1d4ed8" stroke-width="2"/>
<text x="200" y="210" font-family="sans-serif" font-size="10" fill="#1e3a8a">small T, then a U wave</text>
<text x="200" y="224" font-family="sans-serif" font-size="10" fill="#1e3a8a">after it; ST depresses</text>
<rect x="40" y="248" width="380" height="40" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="230" y="264" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">In hyperkalaemia with ECG change, calcium first.</text>
<text x="230" y="280" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">Calcium protects the myocardium; insulin-dextrose and salbutamol only move K+ inside the cell.</text>
</svg>