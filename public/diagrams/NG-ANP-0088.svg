<svg viewBox="0 0 470 250" role="img" xmlns="http://www.w3.org/2000/svg"><title>The nephron and urine formation</title>
<rect width="470" height="250" fill="#f6f8fc"/>
<text x="235" y="20" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">Three processes make urine</text>
<circle cx="80" cy="70" r="26" fill="#e2574c" opacity=".25" stroke="#e2574c" stroke-width="2"/>
<circle cx="80" cy="70" r="13" fill="#e2574c" opacity=".5"/>
<text x="80" y="112" font-size="10.5" text-anchor="middle" font-family="system-ui" font-weight="700">Glomerulus</text>
<text x="80" y="126" font-size="9" text-anchor="middle" font-family="system-ui">in Bowman&#39;s capsule</text>
<path d="M106 70 h44" stroke="#0a1628" stroke-width="2" marker-end="url(#n1)"/>
<defs><marker id="n1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#0a1628"/></marker></defs>
<path d="M155 70 h50 v40 h-38 v40 h60 v-30 h50" fill="none" stroke="#2b6fa8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
<text x="180" y="60" font-size="9.5" font-family="system-ui" font-weight="700">PCT</text>
<text x="168" y="168" font-size="9.5" font-family="system-ui" font-weight="700">loop of Henle</text>
<text x="250" y="108" font-size="9.5" font-family="system-ui" font-weight="700">DCT</text>
<text x="300" y="108" font-size="9.5" font-family="system-ui" font-weight="700">collecting duct</text>
<g font-family="system-ui" font-size="10.5">
<circle cx="360" cy="46" r="9" fill="#e2574c"/><text x="357" y="50" font-size="11" fill="#fff" font-weight="700">1</text>
<text x="376" y="44" font-weight="700">FILTRATION</text><text x="376" y="57" font-size="9.5">glomerulus → capsule</text>
<circle cx="360" cy="86" r="9" fill="#0f9d76"/><text x="357" y="90" font-size="11" fill="#fff" font-weight="700">2</text>
<text x="376" y="84" font-weight="700">REABSORPTION</text><text x="376" y="97" font-size="9.5">tubule → blood</text>
<circle cx="360" cy="126" r="9" fill="#f2b705"/><text x="357" y="130" font-size="11" fill="#4a3a00" font-weight="700">3</text>
<text x="376" y="124" font-weight="700">SECRETION</text><text x="376" y="137" font-size="9.5">blood → tubule</text>
</g>
<rect x="30" y="196" width="410" height="42" rx="8" fill="#fff" stroke="#0f9d76" stroke-width="2"/>
<text x="235" y="214" font-size="10.5" text-anchor="middle" font-family="system-ui" font-weight="700">Protein and blood cells are too LARGE to filter</text>
<text x="235" y="230" font-size="10" text-anchor="middle" font-family="system-ui" fill="#5a6b85">Finding them in urine means the filter is damaged</text>
</svg>