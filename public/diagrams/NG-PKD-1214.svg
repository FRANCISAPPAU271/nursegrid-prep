<svg viewBox="0 0 640 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="450" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">ANTIMALARIALS IN GHANA</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">Uncomplicated and severe malaria are different diseases for the purposes of treatment.</text>

<rect x="20" y="60" width="292" height="110" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.8"/>
<text x="166" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5c3a">UNCOMPLICATED — CAN SWALLOW</text>
<g font-size="10" fill="#222">
<text x="34" y="102">Artemisinin-based combination therapy,</text>
<text x="34" y="120">by mouth, for the full three days.</text>
<text x="34" y="140">Two drugs, deliberately: one clears fast,</text>
<text x="34" y="156">the other clears what is left behind.</text>
</g>

<rect x="328" y="60" width="292" height="110" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.8"/>
<text x="474" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b2f2f">SEVERE — CANNOT SWALLOW, OR DANGER SIGNS</text>
<g font-size="10" fill="#222">
<text x="342" y="102">Injectable artesunate first, without delay.</text>
<text x="342" y="122">Convulsions, coma, inability to drink,</text>
<text x="342" y="138">repeated vomiting, dark urine, severe</text>
<text x="342" y="154">anaemia, jaundice, shock.</text>
</g>

<rect x="20" y="186" width="600" height="70" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.8"/>
<text x="320" y="206" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1e">FINISH THE INJECTIONS, THEN GIVE A FULL ORAL COURSE</text>
<g font-size="10.5" fill="#222">
<text x="34" y="228">A patient who wakes up and looks well after two injections is not cured. Stopping there is how treatment</text>
<text x="34" y="246">failure and recrudescence happen, and the family is often the one asking to go home.</text>
</g>

<rect x="20" y="272" width="292" height="96" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.6"/>
<text x="166" y="292" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">TEST BEFORE YOU TREAT</text>
<g font-size="9.5" fill="#222">
<text x="34" y="314">A rapid test or a blood film first. Fever</text>
<text x="34" y="330">in Ghana is not automatically malaria,</text>
<text x="34" y="346">and treating blindly means missing</text>
<text x="34" y="360">pneumonia, typhoid and meningitis.</text>
</g>

<rect x="328" y="272" width="292" height="96" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.6"/>
<text x="474" y="292" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6b3a6b">IN PREGNANCY</text>
<g font-size="9.5" fill="#222">
<text x="342" y="314">Malaria causes anaemia, miscarriage,</text>
<text x="342" y="330">low birth weight and stillbirth.</text>
<text x="342" y="348">Preventive treatment in pregnancy is</text>
<text x="342" y="362">given under supervision at the clinic.</text>
</g>

<rect x="20" y="384" width="600" height="42" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.7"/>
<text x="320" y="404" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8b2f2f">Quinine causes hypoglycaemia, especially in pregnancy. Check the blood sugar, do not assume the coma is malaria.</text>
<text x="320" y="420" text-anchor="middle" font-size="10.5" font-style="italic" fill="#222">A child who becomes drowsy again after improving may be hypoglycaemic, not simply deteriorating.</text>

<text x="320" y="444" text-anchor="middle" font-size="10.5" font-style="italic" fill="#1a3a5c">Never give an artemisinin alone as a single agent. Monotherapy is how resistance is created.</text>
</svg>