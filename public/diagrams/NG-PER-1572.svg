<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%" role="img">
<rect x="0" y="0" width="760" height="470" fill="#fdfcfa"/>
<text x="20" y="30" font-family="Georgia,serif" font-size="19" font-weight="bold" fill="#7a2020">Surgical emergencies in small children</text>
<text x="20" y="52" font-family="Georgia,serif" font-size="13" fill="#555">Children compensate beautifully and then collapse suddenly. The history from the mother is the diagnosis.</text>

<rect x="20" y="68" width="232" height="196" rx="6" fill="#fff3f0" stroke="#c0392b"/>
<text x="34" y="90" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#7a2020">Screaming, then quiet</text>
<text x="34" y="112" font-family="Georgia,serif" font-size="12" fill="#333">Infant draws up the legs and</text>
<text x="34" y="130" font-family="Georgia,serif" font-size="12" fill="#333">screams, then goes limp and</text>
<text x="34" y="148" font-family="Georgia,serif" font-size="12" fill="#333">pale between attacks.</text>
<text x="34" y="170" font-family="Georgia,serif" font-size="12" fill="#333">Vomiting. Stool like red</text>
<text x="34" y="188" font-family="Georgia,serif" font-size="12" fill="#333">jelly is a late sign.</text>
<text x="34" y="212" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#7a2020">Bowel telescoping into</text>
<text x="34" y="230" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#7a2020">itself. Urgent.</text>
<text x="34" y="252" font-family="Georgia,serif" font-size="12" font-style="italic" fill="#7a2020">Intussusception</text>

<rect x="264" y="68" width="232" height="196" rx="6" fill="#fff8e8" stroke="#b8860b"/>
<text x="278" y="90" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#8a6508">Vomiting across the room</text>
<text x="278" y="112" font-family="Georgia,serif" font-size="12" fill="#333">Baby of a few weeks old.</text>
<text x="278" y="130" font-family="Georgia,serif" font-size="12" fill="#333">Forceful vomiting after every</text>
<text x="278" y="148" font-family="Georgia,serif" font-size="12" fill="#333">feed, no bile in the vomit.</text>
<text x="278" y="170" font-family="Georgia,serif" font-size="12" fill="#333">Hungry again straight after.</text>
<text x="278" y="188" font-family="Georgia,serif" font-size="12" fill="#333">Losing weight, few wet nappies.</text>
<text x="278" y="212" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#8a6508">Correct the fluids and salts</text>
<text x="278" y="230" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#8a6508">before any operation.</text>
<text x="278" y="252" font-family="Georgia,serif" font-size="12" font-style="italic" fill="#8a6508">Pyloric stenosis</text>

<rect x="508" y="68" width="232" height="196" rx="6" fill="#f2f7f2" stroke="#2e7d5b"/>
<text x="522" y="90" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#1d5c42">Green vomit in a newborn</text>
<text x="522" y="112" font-family="Georgia,serif" font-size="12" fill="#333">Bile-stained vomiting in a</text>
<text x="522" y="130" font-family="Georgia,serif" font-size="12" fill="#333">newborn is never normal.</text>
<text x="522" y="152" font-family="Georgia,serif" font-size="12" fill="#333">It means obstruction below</text>
<text x="522" y="170" font-family="Georgia,serif" font-size="12" fill="#333">the stomach outlet until</text>
<text x="522" y="188" font-family="Georgia,serif" font-size="12" fill="#333">proved otherwise.</text>
<text x="522" y="212" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#1d5c42">Nil by mouth, tube to</text>
<text x="522" y="230" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#1d5c42">drain, refer the same day.</text>
<text x="522" y="252" font-family="Georgia,serif" font-size="12" font-style="italic" fill="#1d5c42">Neonatal obstruction</text>

<rect x="20" y="282" width="720" height="82" rx="6" fill="#eef4f8" stroke="#2b6b8a"/>
<text x="34" y="304" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#1d4e63">Why a child's shock is missed</text>
<text x="34" y="326" font-family="Georgia,serif" font-size="12" fill="#333">A child holds her blood pressure normal until she has lost a great deal of volume, then falls off a cliff.</text>
<text x="34" y="344" font-family="Georgia,serif" font-size="12" fill="#333">Read instead: heart rate, capillary refill, cool hands, sunken eyes, dry nappies, and how she behaves.</text>
<text x="34" y="360" font-family="Georgia,serif" font-size="12" font-style="italic" fill="#1d4e63">A quiet, uninterested child in a busy ward is a serious sign, not a well-behaved one.</text>

<rect x="20" y="378" width="720" height="74" rx="6" fill="#f4f4fb" stroke="#4a4a8a"/>
<text x="34" y="400" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#33336b">Two Ghanaian realities to write into every plan</text>
<text x="34" y="422" font-family="Georgia,serif" font-size="12" fill="#333">Children arrive late, often after treatment elsewhere, so they are more dehydrated than the story suggests.</text>
<text x="34" y="440" font-family="Georgia,serif" font-size="12" fill="#333">And the mother stays and gives much of the care: teach her what to watch for, and believe what she tells you.</text>
</svg>