<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 560" font-family="sans-serif">
<defs>
<marker id="rh" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#b91c1c"/></marker>
<marker id="rht" markerWidth="8" markerHeight="8" refX="1" refY="3" orient="auto"><path d="M7,0 L0,3 L7,6 Z" fill="#b91c1c"/></marker>
<marker id="bh" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1d4ed8"/></marker>
<marker id="bht" markerWidth="8" markerHeight="8" refX="1" refY="3" orient="auto"><path d="M7,0 L0,3 L7,6 Z" fill="#1d4ed8"/></marker>
</defs>
<rect x="0" y="0" width="460" height="560" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#111827">Anatomical position, directions and planes</text>
<text x="20" y="52" font-size="12" font-weight="bold" fill="#111827">A — DIRECTIONAL TERMS</text>
<text x="250" y="52" font-size="12" font-weight="bold" fill="#111827">B — BODY PLANES</text>
<!-- midline -->
<line x1="110" y1="60" x2="110" y2="322" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
<!-- figure -->
<g stroke="#334155" stroke-linecap="round" fill="none">
<circle cx="110" cy="86" r="15" fill="#e2e8f0"/>
<rect x="90" y="104" width="40" height="96" rx="12" fill="#e2e8f0"/>
<line x1="90" y1="120" x2="72" y2="196" stroke-width="9"/>
<line x1="130" y1="120" x2="148" y2="196" stroke-width="9"/>
<line x1="101" y1="200" x2="96" y2="296" stroke-width="11"/>
<line x1="119" y1="200" x2="124" y2="296" stroke-width="11"/>
<line x1="88" y1="296" x2="104" y2="296" stroke-width="6"/>
<line x1="116" y1="296" x2="132" y2="296" stroke-width="6"/>
</g>
<!-- superior / inferior -->
<line x1="172" y1="72" x2="172" y2="310" stroke="#b91c1c" stroke-width="2" marker-start="url(#rht)" marker-end="url(#rh)"/>
<text x="180" y="80" font-size="10" font-weight="bold" fill="#b91c1c">superior</text>
<text x="180" y="92" font-size="9" fill="#6b7280">toward the head</text>
<text x="180" y="306" font-size="10" font-weight="bold" fill="#b91c1c">inferior</text>
<text x="180" y="318" font-size="9" fill="#6b7280">toward the feet</text>
<!-- medial / lateral -->
<line x1="64" y1="330" x2="156" y2="330" stroke="#1d4ed8" stroke-width="2" marker-start="url(#bht)" marker-end="url(#bh)"/>
<text x="60" y="333" font-size="10" font-weight="bold" fill="#1d4ed8" text-anchor="end">lateral</text>
<text x="110" y="348" font-size="10" fill="#1d4ed8" text-anchor="middle">midline = medial</text>
<text x="160" y="333" font-size="10" font-weight="bold" fill="#1d4ed8" text-anchor="start">lateral</text>
<!-- proximal / distal -->
<circle cx="135" cy="134" r="2.5" fill="#111827"/>
<circle cx="145" cy="188" r="2.5" fill="#111827"/>
<line x1="138" y1="134" x2="180" y2="128" stroke="#6b7280" stroke-width="1"/>
<line x1="148" y1="188" x2="180" y2="194" stroke="#6b7280" stroke-width="1"/>
<text x="183" y="131" font-size="10" font-weight="bold" fill="#111827">proximal</text>
<text x="183" y="197" font-size="10" font-weight="bold" fill="#111827">distal</text>
<text x="20" y="372" font-size="10" fill="#374151">anterior = facing you  •  posterior = facing away</text>
<text x="20" y="386" font-size="10" fill="#374151">superficial = near the surface  •  deep = further in</text>
<!-- panel B -->
<g font-size="11" font-weight="bold" fill="#111827">
<text x="260" y="80">Sagittal</text>
<text x="260" y="196">Frontal (coronal)</text>
<text x="260" y="312">Transverse</text>
</g>
<!-- sagittal icon -->
<g>
<circle cx="330" cy="100" r="9" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<rect x="318" y="112" width="24" height="34" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<line x1="330" y1="88" x2="330" y2="150" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 3"/>
<text x="342" y="132" font-size="10" fill="#b91c1c">L | R</text>
</g>
<text x="260" y="118" font-size="9" fill="#374151">vertical cut,</text>
<text x="260" y="130" font-size="9" fill="#374151">left from right</text>
<!-- frontal icon -->
<g>
<circle cx="330" cy="216" r="9" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<rect x="318" y="228" width="24" height="34" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="352" y="252" font-size="10" fill="#b91c1c">front</text>
</g>
<text x="260" y="234" font-size="9" fill="#374151">the plane of</text>
<text x="260" y="246" font-size="9" fill="#374151">the page itself:</text>
<text x="260" y="258" font-size="9" fill="#374151">front from back</text>
<!-- transverse icon -->
<g>
<circle cx="330" cy="332" r="9" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<rect x="318" y="344" width="24" height="34" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<line x1="312" y1="352" x2="348" y2="352" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 3"/>
<text x="352" y="356" font-size="10" fill="#1d4ed8">cut</text>
</g>
<text x="260" y="350" font-size="9" fill="#374151">horizontal cut,</text>
<text x="260" y="362" font-size="9" fill="#374151">upper from lower</text>
<text x="260" y="378" font-size="9" fill="#374151">— CT slices</text>
<text x="20" y="420" font-size="10" fill="#374151">The <tspan font-weight="bold">midsagittal</tspan> plane runs exactly through the midline;</text>
<text x="20" y="434" font-size="10" fill="#374151">any parallel cut is <tspan font-weight="bold">parasagittal</tspan>. Oblique cuts run at an angle.</text>
<text x="20" y="458" font-size="10" fill="#374151">Standing, facing forward, arms at the sides, <tspan font-weight="bold">palms forward</tspan> —</text>
<text x="20" y="472" font-size="10" fill="#374151">that is the position every direction above is described from.</text>
<rect x="0" y="500" width="460" height="60" fill="#f1f5f9"/>
<text x="20" y="522" font-size="10" fill="#111827">Ward rule: describe every finding against the anatomical position, or superior /</text>
<text x="20" y="536" font-size="10" fill="#111827">inferior and left / right lose their meaning — and so does your documentation.</text>
</svg>