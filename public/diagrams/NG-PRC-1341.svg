<svg viewBox="0 0 640 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="470" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">POSITION FOLLOWS THE ANATOMY, NOT THE HABIT</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">Each position exists to bring one structure within reach, or to keep gravity on your side.</text>

<rect x="24" y="58" width="192" height="128" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.6"/>
<text x="120" y="78" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">LITHOTOMY</text>
<path d="M44 130 L96 130" stroke="#1a3a5c" stroke-width="3"/>
<path d="M96 130 L124 106 M96 130 L124 152" stroke="#1a3a5c" stroke-width="3"/>
<circle cx="40" cy="130" r="7" fill="#1a3a5c"/>
<g font-size="9.5" fill="#222">
<text x="34" y="164">Vaginal examination, delivery,</text>
<text x="34" y="178">bladder and perineal surgery.</text>
</g>

<rect x="224" y="58" width="192" height="128" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.6"/>
<text x="320" y="78" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a5c3a">LEFT LATERAL / SIMS</text>
<path d="M246 132 L306 132 L330 116" stroke="#1a5c3a" stroke-width="3" fill="none"/>
<circle cx="242" cy="132" r="7" fill="#1a5c3a"/>
<g font-size="9.5" fill="#222">
<text x="234" y="164">Enema, suppository, rectal</text>
<text x="234" y="178">examination, proctoscopy.</text>
</g>

<rect x="424" y="58" width="192" height="128" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.6"/>
<text x="520" y="78" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1e">CURLED LATERAL</text>
<path d="M448 136 Q470 108 500 112 Q522 116 528 138" stroke="#8a6d1e" stroke-width="3" fill="none"/>
<g font-size="9.5" fill="#222">
<text x="434" y="164">Lumbar puncture. Curling opens</text>
<text x="434" y="178">the spaces between the spines.</text>
</g>

<rect x="24" y="198" width="192" height="128" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.6"/>
<text x="120" y="218" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6b3a6b">UPRIGHT, LEANING FORWARD</text>
<path d="M120 240 L120 286" stroke="#6b3a6b" stroke-width="3"/>
<path d="M120 254 L146 268" stroke="#6b3a6b" stroke-width="3"/>
<rect x="132" y="266" width="48" height="6" fill="#6b3a6b"/>
<g font-size="9.5" fill="#222">
<text x="34" y="304">Pleural aspiration, paracentesis.</text>
<text x="34" y="318">Fluid pools where you can reach it.</text>
</g>

<rect x="224" y="198" width="192" height="128" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.6"/>
<text x="320" y="218" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8b2f2f">RECOVERY POSITION</text>
<path d="M246 272 L300 272 L322 258" stroke="#8b2f2f" stroke-width="3" fill="none"/>
<circle cx="242" cy="272" r="7" fill="#8b2f2f"/>
<g font-size="9.5" fill="#222">
<text x="234" y="304">Unconscious, breathing patient.</text>
<text x="234" y="318">The mouth becomes the lowest point.</text>
</g>

<rect x="424" y="198" width="192" height="128" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.6"/>
<text x="520" y="218" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">HEAD UP 30 TO 45</text>
<path d="M444 286 L580 286" stroke="#1a3a5c" stroke-width="2"/>
<path d="M444 286 L520 250" stroke="#1a3a5c" stroke-width="3"/>
<g font-size="9.5" fill="#222">
<text x="434" y="304">Breathlessness, head injury,</text>
<text x="434" y="318">after nasogastric feeding.</text>
</g>

<rect x="24" y="340" width="592" height="58" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.8"/>
<text x="320" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5c3a">THE TWO QUESTIONS THAT GIVE YOU THE POSITION</text>
<g font-size="10" fill="#222">
<text x="40" y="382">What must the operator reach, and which way do you want gravity to move fluid, air or the tongue?</text>
</g>

<rect x="24" y="410" width="592" height="48" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.7"/>
<g font-size="10" fill="#222">
<text x="40" y="430">Expose only the part being worked on. Screen first, uncover last, and cover again the moment you finish.</text>
<text x="40" y="448">Dignity is not a courtesy added at the end. It is part of the procedure.</text>
</g>
</svg>