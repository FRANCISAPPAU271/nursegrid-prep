<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="440" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">EVIDENCE-BASED PRACTICE — STRENGTH OF EVIDENCE</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">Higher up means the finding is less easily explained by chance, bias or the researcher's hopes.</text>

<polygon points="320,62 600,392 40,392" fill="#f4f7f9" stroke="#5a86a8" stroke-width="1.5"/>
<line x1="266" y1="126" x2="374" y2="126" stroke="#5a86a8" stroke-width="1.2"/>
<line x1="222" y1="188" x2="418" y2="188" stroke="#5a86a8" stroke-width="1.2"/>
<line x1="178" y1="250" x2="462" y2="250" stroke="#5a86a8" stroke-width="1.2"/>
<line x1="128" y1="318" x2="512" y2="318" stroke="#5a86a8" stroke-width="1.2"/>

<text x="320" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a5c3a">SYSTEMATIC REVIEW</text>
<text x="320" y="120" text-anchor="middle" font-size="9" fill="#222">all the studies, appraised together</text>
<text x="320" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a5c3a">RANDOMISED CONTROLLED TRIAL</text>
<text x="320" y="166" text-anchor="middle" font-size="9" fill="#222">chance decides who gets the treatment</text>
<text x="320" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1e">COHORT AND CASE-CONTROL</text>
<text x="320" y="230" text-anchor="middle" font-size="9" fill="#222">observed, not allocated</text>
<text x="320" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1e">CROSS-SECTIONAL AND CASE SERIES</text>
<text x="320" y="298" text-anchor="middle" font-size="9" fill="#222">a description, at one moment</text>
<text x="320" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b2f2f">EXPERT OPINION AND CUSTOM</text>
<text x="320" y="364" text-anchor="middle" font-size="9" fill="#222">"we have always done it this way"</text>
<text x="320" y="382" text-anchor="middle" font-size="9" font-style="italic" fill="#8b2f2f">still the commonest reason given on a ward</text>

<rect x="30" y="404" width="285" height="30" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.4"/>
<text x="172" y="424" text-anchor="middle" font-size="10.5" fill="#222">Evidence is one of three: add the patient's</text>

<rect x="325" y="404" width="285" height="30" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.4"/>
<text x="467" y="424" text-anchor="middle" font-size="10.5" fill="#222">values and your clinical judgement.</text>
</svg>