<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 250" role="img">
<rect width="470" height="250" fill="#ffffff"/>
<text x="235" y="26" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Lithium: a narrow therapeutic window</text>
<rect x="40" y="56" width="120" height="34" fill="#e2e8f0" stroke="#64748b"/>
<rect x="160" y="56" width="120" height="34" fill="#dcfce7" stroke="#15803d"/>
<rect x="280" y="56" width="70" height="34" fill="#fef3c7" stroke="#b45309"/>
<rect x="350" y="56" width="80" height="34" fill="#fee2e2" stroke="#b91c1c"/>
<text x="100" y="78" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">sub-therapeutic</text>
<text x="220" y="78" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">0.6 &#8211; 1.2</text>
<text x="315" y="78" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78350f">1.2&#8211;1.5</text>
<text x="390" y="78" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7f1d1d">&gt; 1.5 toxic</text>
<text x="160" y="106" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">0.6</text>
<text x="280" y="106" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">1.2</text>
<text x="350" y="106" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">1.5</text>
<text x="235" y="126" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">serum lithium (mmol/L), sampled 12 hours after the dose</text>
<text x="40" y="154" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Anything that concentrates lithium pushes it right:</text>
<text x="52" y="172" font-family="sans-serif" font-size="11" fill="#334155">dehydration &#183; vomiting or diarrhoea &#183; low sodium intake</text>
<text x="52" y="188" font-family="sans-serif" font-size="11" fill="#334155">NSAIDs &#183; thiazide diuretics &#183; ACE inhibitors &#183; renal impairment</text>
<rect x="40" y="200" width="390" height="38" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="235" y="216" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Early toxicity is gastrointestinal, then neurological.</text>
<text x="235" y="231" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">Vomiting and diarrhoea both cause toxicity and are caused by it &#8212; the loop that kills.</text>
</svg>