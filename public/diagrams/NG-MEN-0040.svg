<svg viewBox="0 0 470 210" role="img" xmlns="http://www.w3.org/2000/svg"><title>Grief is not a straight line</title>
<rect width="470" height="210" fill="#f6f8fc"/>
<line x1="40" y1="160" x2="440" y2="160" stroke="#0a1628" stroke-width="2"/>
<path d="M45 150 Q80 60 110 130 Q140 185 175 95 Q205 40 240 140 Q275 175 305 100 Q340 55 375 135 Q405 165 435 120"
fill="none" stroke="#0f9d76" stroke-width="3"/>
<g font-family="system-ui" text-anchor="middle" font-size="10.5">
<text x="70" y="182" font-weight="700">Denial</text>
<text x="150" y="182" font-weight="700">Anger</text>
<text x="235" y="182" font-weight="700">Bargaining</text>
<text x="320" y="182" font-weight="700">Depression</text>
<text x="410" y="182" font-weight="700">Acceptance</text>
</g>
<text x="235" y="24" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">The stages are a map, not a timetable</text>
<text x="235" y="200" font-size="10.5" text-anchor="middle" font-family="system-ui" fill="#5a6b85">People revisit stages, skip them, and move at their own pace</text>
</svg>