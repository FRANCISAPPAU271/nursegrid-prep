<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 480" font-family="sans-serif">
<rect x="0" y="0" width="460" height="480" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#111827">O₂–haemoglobin curve + what shifts it</text>
<!-- axes -->
<line x1="60" y1="40" x2="60" y2="240" stroke="#111827" stroke-width="1.5"/>
<line x1="60" y1="240" x2="440" y2="240" stroke="#111827" stroke-width="1.5"/>
<text x="14" y="140" font-size="9" fill="#6b7280" transform="rotate(-90 14,140)" text-anchor="middle">% saturated</text>
<text x="250" y="256" font-size="9" fill="#6b7280" text-anchor="middle">PaO₂ (mmHg) →</text>
<!-- sigmoid -->
<path d="M60,225 C120,220 140,200 180,150 C220,100 260,70 440,55" fill="none" stroke="#b91c1c" stroke-width="3"/>
<!-- key points -->
<g font-size="9" fill="#111827">
<line x1="390" y1="60" x2="390" y2="240" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
<text x="390" y="232" text-anchor="middle">100 → 98%</text>
<line x1="250" y1="72" x2="250" y2="240" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
<text x="250" y="232" text-anchor="middle">60 → 90%</text>
<line x1="180" y1="150" x2="180" y2="240" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
<text x="180" y="232" text-anchor="middle">40 → 75%</text>
</g>
<!-- shift arrows -->
<g font-size="10" font-weight="bold">
<text x="300" y="140" fill="#1d4ed8">← LEFT: loads easy,</text>
<text x="300" y="154" fill="#1d4ed8">holds tight (lungs)</text>
<text x="300" y="176" fill="#b91c1c">RIGHT: unloads easy →</text>
<text x="300" y="190" fill="#b91c1c">(tissues: Bohr)</text>
</g>
<rect x="60" y="266" width="380" height="52" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
<text x="250" y="284" font-size="10" fill="#111827" text-anchor="middle" font-weight="bold">O₂ delivery = cardiac output × Hb × saturation</text>
<text x="250" y="298" font-size="9" fill="#374151" text-anchor="middle">Lungs load it, Hb carries it, the pump delivers it — failure at ANY leg starves tissues.</text>
<text x="250" y="311" font-size="9" fill="#374151" text-anchor="middle">Right shift (↓pH, ↑CO₂, fever, ↑2,3-DPG): unloads at working tissues. Left shift: opposite.</text>
<rect x="0" y="330" width="460" height="150" fill="#f1f5f9"/>
<text x="20" y="352" font-size="10" fill="#111827">90% saturation ≈ PaO₂ 60 — the cliff edge: below it, tiny PaO₂ falls crash saturation.</text>
<text x="20" y="366" font-size="10" fill="#111827">Above it the flat top forgives: 100% to 95% is a big PaO₂ fall for a small sat change —</text>
<text x="20" y="380" font-size="10" fill="#111827">so a \"normal\" 96% can still mean real hypoxaemia in a sick patient. Cyanosis needs</text>
<text x="20" y="394" font-size="10" fill="#111827">~5 g/dL deoxygenated Hb — the anaemic patient desaturates WITHOUT turning blue,</text>
<text x="20" y="408" font-size="10" fill="#111827">and CO poisoning pinks while killing (sats lie — need co-oximetry). Targets: 94–98%</text>
<text x="20" y="422" font-size="10" fill="#111827">most patients; 88–92% CO₂ retainers. Lactate &gt;2 = tissues already in debt: believe it</text>
<text x="20" y="436" font-size="10" fill="#111827">over the reassuring trace. Pulse oximetry lags minutes behind the lungs.</text>
</svg>