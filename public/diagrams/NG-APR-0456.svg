<svg viewBox="0 0 640 370" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="370" fill="#fbfaf7"/>
<text x="320" y="27" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">LUMBAR PUNCTURE — POSITION, SITE AND AFTERCARE</text>

<rect x="24" y="44" width="300" height="170" fill="#fff" stroke="#d8d2c4" stroke-width="1.5"/>
<text x="174" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">THE POSITION</text>
<path d="M60 150 Q75 100 120 92 Q170 84 215 100 Q255 116 262 150" fill="none" stroke="#8b6a2f" stroke-width="10" stroke-linecap="round"/>
<circle cx="58" cy="158" r="16" fill="#f0e2d0" stroke="#8b6a2f" stroke-width="2"/>
<text x="160" y="186" text-anchor="middle" font-size="10" fill="#333">Lateral, knees drawn to chest, chin tucked.</text>
<text x="160" y="202" text-anchor="middle" font-size="10" fill="#333">The curve opens the gaps between the spines.</text>
<line x1="150" y1="88" x2="150" y2="70" stroke="#8b2f2f" stroke-width="1.5"/>
<text x="150" y="64" text-anchor="middle" font-size="9" fill="#8b2f2f">back arched outwards</text>

<rect x="340" y="44" width="276" height="170" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.5"/>
<text x="478" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">THE SITE — AND WHY</text>
<line x1="478" y1="80" x2="478" y2="180" stroke="#999" stroke-width="16"/>
<line x1="440" y1="100" x2="516" y2="100" stroke="#8b2f2f" stroke-width="2"/>
<text x="530" y="104" font-size="9" fill="#8b2f2f">L1 — cord ends</text>
<line x1="440" y1="140" x2="516" y2="140" stroke="#1a5c3a" stroke-width="3"/>
<text x="530" y="144" font-size="9" font-weight="bold" fill="#1a5c3a">L3/L4 — needle</text>
<line x1="440" y1="160" x2="516" y2="160" stroke="#1a5c3a" stroke-width="2"/>
<text x="530" y="164" font-size="9" fill="#1a5c3a">L4/L5 — also safe</text>
<text x="350" y="196" font-size="10" fill="#333">Below L1 there is no cord to injure —</text>
<text x="350" y="209" font-size="10" fill="#333">only free nerve roots that drift aside.</text>

<rect x="24" y="224" width="288" height="60" fill="#f7e9e9" stroke="#c78f8f" stroke-width="1.5"/>
<text x="168" y="244" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b2f2f">CHECK BEFORE, NOT AFTER</text>
<text x="34" y="262" font-size="10" fill="#333">Raised intracranial pressure is the key danger.</text>
<text x="34" y="277" font-size="10" fill="#333">Withdrawing fluid below a pressurised brain can</text>
<text x="34" y="290" font-size="1" fill="#fff">.</text>

<rect x="328" y="224" width="288" height="60" fill="#f7e9e9" stroke="#c78f8f" stroke-width="1.5"/>
<text x="472" y="244" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b2f2f">CONING</text>
<text x="338" y="262" font-size="10" fill="#333">The brain stem is forced down through the</text>
<text x="338" y="277" font-size="10" fill="#333">foramen magnum. Rapidly fatal.</text>

<rect x="24" y="292" width="592" height="66" fill="#eaf3ea" stroke="#8fb98f" stroke-width="1.5"/>
<text x="320" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5c3a">AFTERCARE</text>
<text x="34" y="330" font-size="10" fill="#333">Lie flat, encourage fluids — both reduce the low-pressure headache.  ·  Observe the puncture site for leakage.</text>
<text x="34" y="348" font-size="10" fill="#333">Neurological observations.  ·  Label specimens in order and send immediately — cells lyse and glucose falls on standing.</text>
</svg>