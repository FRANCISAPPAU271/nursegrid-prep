<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="320" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">SKEW: WHERE THE MEAN, MEDIAN AND MODE SIT</text>

<line x1="30" y1="200" x2="210" y2="200" stroke="#333" stroke-width="1.5"/>
<path d="M40 200 Q120 60 200 200" fill="#dbe6f0" stroke="#1a3a5c" stroke-width="2"/>
<line x1="120" y1="200" x2="120" y2="95" stroke="#8b2f2f" stroke-width="1.5" stroke-dasharray="3,2"/>
<text x="120" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">SYMMETRICAL</text>
<text x="120" y="240" text-anchor="middle" font-size="11" fill="#444">mean = median = mode</text>
<text x="120" y="258" text-anchor="middle" font-size="10" fill="#666">All three at the peak.</text>
<text x="120" y="274" text-anchor="middle" font-size="10" fill="#666">Use the MEAN.</text>

<line x1="235" y1="200" x2="415" y2="200" stroke="#333" stroke-width="1.5"/>
<path d="M245 200 Q285 60 320 140 Q355 195 405 200" fill="#f0e2db" stroke="#8b2f2f" stroke-width="2"/>
<line x1="283" y1="200" x2="283" y2="90" stroke="#1a5c3a" stroke-width="1.5" stroke-dasharray="3,2"/>
<text x="283" y="84" text-anchor="middle" font-size="9" fill="#1a5c3a">mode</text>
<line x1="305" y1="200" x2="305" y2="120" stroke="#1a5c3a" stroke-width="1"/>
<text x="313" y="116" font-size="9" fill="#1a5c3a">median</text>
<line x1="340" y1="200" x2="340" y2="150" stroke="#8b2f2f" stroke-width="1.5"/>
<text x="348" y="146" font-size="9" font-weight="bold" fill="#8b2f2f">mean</text>
<text x="325" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b2f2f">POSITIVE SKEW</text>
<text x="325" y="240" text-anchor="middle" font-size="11" fill="#444">mode &lt; median &lt; mean</text>
<text x="325" y="258" text-anchor="middle" font-size="10" fill="#666">Tail to the right. A few</text>
<text x="325" y="272" text-anchor="middle" font-size="10" fill="#666">very high values pull the</text>
<text x="325" y="286" text-anchor="middle" font-size="10" fill="#666">mean up. Use the MEDIAN.</text>

<line x1="440" y1="200" x2="620" y2="200" stroke="#333" stroke-width="1.5"/>
<path d="M450 200 Q500 195 535 140 Q570 60 610 200" fill="#dbe6f0" stroke="#1a3a5c" stroke-width="2"/>
<line x1="572" y1="200" x2="572" y2="90" stroke="#1a5c3a" stroke-width="1.5" stroke-dasharray="3,2"/>
<text x="572" y="84" text-anchor="middle" font-size="9" fill="#1a5c3a">mode</text>
<line x1="550" y1="200" x2="550" y2="120" stroke="#1a5c3a" stroke-width="1"/>
<text x="512" y="116" font-size="9" fill="#1a5c3a">median</text>
<line x1="515" y1="200" x2="515" y2="150" stroke="#8b2f2f" stroke-width="1.5"/>
<text x="478" y="146" font-size="9" font-weight="bold" fill="#8b2f2f">mean</text>
<text x="530" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">NEGATIVE SKEW</text>
<text x="530" y="240" text-anchor="middle" font-size="11" fill="#444">mean &lt; median &lt; mode</text>
<text x="530" y="258" text-anchor="middle" font-size="10" fill="#666">Tail to the left. A few very</text>
<text x="530" y="272" text-anchor="middle" font-size="10" fill="#666">low values pull the mean</text>
<text x="530" y="286" text-anchor="middle" font-size="10" fill="#666">down. Use the MEDIAN.</text>

<rect x="24" y="296" width="592" height="20" fill="#fff3cd" stroke="#e0c86a"/>
<text x="320" y="310" text-anchor="middle" font-size="11" font-style="italic" fill="#6b5410">The skew is named after the TAIL, not the hump. The mean always chases the tail, which is why outliers make it lie.</text>
</svg>