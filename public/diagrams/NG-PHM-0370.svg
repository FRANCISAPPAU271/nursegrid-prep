<svg viewBox="0 0 470 270" role="img" xmlns="http://www.w3.org/2000/svg"><title>Antibiotic classes and their key nursing risks</title>
<rect width="470" height="270" fill="#f6f8fc"/>
<text x="235" y="18" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">Antibiotic classes — the one risk you must remember</text>
<g font-family="system-ui" font-size="9.5">
<rect x="14" y="28" width="442" height="22" fill="#2b6fa8"/>
<text x="70" y="43" fill="#fff" font-weight="700" text-anchor="middle">CLASS</text>
<text x="200" y="43" fill="#fff" font-weight="700" text-anchor="middle">EXAMPLES</text>
<text x="370" y="43" fill="#fff" font-weight="700" text-anchor="middle">KEY RISK / NURSING POINT</text>
<rect x="14" y="50" width="442" height="26" fill="#fff" stroke="#dde5ef"/>
<text x="22" y="67" font-weight="700">Penicillins</text>
<text x="130" y="67">benzylpenicillin, amoxicillin</text>
<text x="270" y="67" fill="#a8352c" font-weight="700">Anaphylaxis — always ask about allergy</text>
<rect x="14" y="76" width="442" height="26" fill="#f6f8fc" stroke="#dde5ef"/>
<text x="22" y="93" font-weight="700">Aminoglycosides</text>
<text x="130" y="93">gentamicin, streptomycin</text>
<text x="270" y="93" fill="#a8352c" font-weight="700">Ear and kidney damage — monitor levels</text>
<rect x="14" y="102" width="442" height="26" fill="#fff" stroke="#dde5ef"/>
<text x="22" y="119" font-weight="700">Tetracyclines</text>
<text x="130" y="119">doxycycline, tetracycline</text>
<text x="270" y="119" fill="#a8352c" font-weight="700">Stains teeth — avoid under 8 and in pregnancy</text>
<rect x="14" y="128" width="442" height="26" fill="#f6f8fc" stroke="#dde5ef"/>
<text x="22" y="145" font-weight="700">Chloramphenicol</text>
<text x="130" y="145">chloramphenicol</text>
<text x="270" y="145" fill="#a8352c" font-weight="700">Aplastic anaemia; grey baby syndrome</text>
<rect x="14" y="154" width="442" height="26" fill="#fff" stroke="#dde5ef"/>
<text x="22" y="171" font-weight="700">Macrolides</text>
<text x="130" y="171">erythromycin</text>
<text x="270" y="171" fill="#a8352c" font-weight="700">Nausea; many drug interactions</text>
<rect x="14" y="180" width="442" height="26" fill="#f6f8fc" stroke="#dde5ef"/>
<text x="22" y="197" font-weight="700">Sulphonamides</text>
<text x="130" y="197">cotrimoxazole</text>
<text x="270" y="197" fill="#a8352c" font-weight="700">Severe skin reaction; push fluids</text>
<rect x="14" y="206" width="442" height="26" fill="#fff" stroke="#dde5ef"/>
<text x="22" y="223" font-weight="700">Metronidazole</text>
<text x="130" y="223">metronidazole</text>
<text x="270" y="223" fill="#a8352c" font-weight="700">NO alcohol — violent vomiting reaction</text>
</g>
<rect x="14" y="238" width="442" height="26" rx="6" fill="#fff" stroke="#0f9d76" stroke-width="2"/>
<text x="235" y="255" font-size="10" text-anchor="middle" font-family="system-ui" font-weight="700">Finish the full course. Stopping when symptoms settle breeds resistance.</text>
</svg>