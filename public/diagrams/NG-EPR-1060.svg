<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="440" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">THE MALE TRACT — WHERE SPERM ARE MADE, STORED AND SENT</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">Follow the route. Every structure on it has one job, and one thing that can go wrong.</text>

<rect x="24" y="64" width="108" height="66" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.7"/>
<text x="78" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">TESTIS</text>
<text x="78" y="102" text-anchor="middle" font-size="9" fill="#222">makes sperm and</text>
<text x="78" y="116" text-anchor="middle" font-size="9" fill="#222">testosterone</text>

<rect x="148" y="64" width="108" height="66" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.7"/>
<text x="202" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">EPIDIDYMIS</text>
<text x="202" y="102" text-anchor="middle" font-size="9" fill="#222">sperm mature here</text>
<text x="202" y="116" text-anchor="middle" font-size="9" fill="#222">and are stored</text>

<rect x="272" y="64" width="108" height="66" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.7"/>
<text x="326" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a5c3a">VAS DEFERENS</text>
<text x="326" y="102" text-anchor="middle" font-size="9" fill="#222">the tube that is cut</text>
<text x="326" y="116" text-anchor="middle" font-size="9" fill="#222">in a vasectomy</text>

<rect x="396" y="64" width="108" height="66" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.7"/>
<text x="450" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1e">GLANDS</text>
<text x="450" y="102" text-anchor="middle" font-size="9" fill="#222">seminal vesicle and</text>
<text x="450" y="116" text-anchor="middle" font-size="9" fill="#222">prostate add fluid</text>

<rect x="520" y="64" width="96" height="66" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.7"/>
<text x="568" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b3a6b">URETHRA</text>
<text x="568" y="102" text-anchor="middle" font-size="9" fill="#222">shared route for</text>
<text x="568" y="116" text-anchor="middle" font-size="9" fill="#222">urine and semen</text>

<rect x="30" y="152" width="285" height="106" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.7"/>
<text x="172" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b2f2f">WHY THE TESTES HANG OUTSIDE</text>
<g font-size="10" fill="#222">
<text x="44" y="194">Sperm need a temperature a little below</text>
<text x="44" y="210">the body's. The scrotum is a thermostat.</text>
<text x="44" y="232">An undescended testis stays too warm.</text>
<text x="44" y="248">It will not make sperm, and it is at risk.</text>
</g>

<rect x="325" y="152" width="285" height="106" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.7"/>
<text x="467" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5c3a">THE PROSTATE SURROUNDS THE URETHRA</text>
<g font-size="10" fill="#222">
<text x="339" y="194">That is the whole reason an enlarged</text>
<text x="339" y="210">prostate causes urinary symptoms:</text>
<text x="339" y="232">poor stream, hesitancy, dribbling,</text>
<text x="339" y="248">getting up at night, and retention.</text>
</g>

<rect x="30" y="276" width="580" height="80" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.7"/>
<text x="320" y="296" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a3a5c">SPERM TAKE ABOUT TWO TO THREE MONTHS TO MAKE</text>
<g font-size="10.5" fill="#222">
<text x="44" y="318">So a fever, an illness, heat or a drug affects the count seen two to three months LATER, not today.</text>
<text x="44" y="338">And a man who changes something today must wait that long before a repeat count means anything.</text>
</g>

<text x="320" y="382" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8b2f2f">In Ghana, infertility is still commonly blamed on the woman alone.</text>
<text x="320" y="404" text-anchor="middle" font-size="11" fill="#222">A male factor is involved in roughly half of couples. Investigate both partners, and start with the simpler test.</text>
<text x="320" y="428" text-anchor="middle" font-size="10.5" font-style="italic" fill="#1a3a5c">Semen analysis is cheaper, quicker and less invasive than anything done to the woman.</text>
</svg>