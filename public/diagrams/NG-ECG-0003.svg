<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 590" role="img">
<rect width="460" height="590" fill="#ffffff"/>
<text x="230" y="26" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">Heart blocks: from delay to dissociation</text><text x="40" y="58" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">1ST-DEGREE — PR over 0.20 s, but every P still conducts</text><path d="M50 112 L60 100 L70 112 L130 112 L130 112 L138 72 L146 112 L190 112 L200 100 L210 112 L270 112 L270 112 L278 72 L286 112 L420 112" fill="none" stroke="#1d4ed8" stroke-width="2"/><text x="40" y="142" font-family="sans-serif" font-size="10" fill="#1e3a8a">Long PR, nothing dropped — find the cause; usually needs nothing.</text><text x="40" y="178" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">MOBITZ I (Wenckebach) — PR lengthens, then a beat drops</text><path d="M45 232 L55 220 L65 232 L95 232 L95 232 L103 192 L111 232 L140 232 L150 220 L160 232 L205 232 L205 232 L213 192 L221 232 L255 232 L265 220 L275 232 L330 232 L330 232 L340 220 L350 232 L420 232" fill="none" stroke="#1d4ed8" stroke-width="2"/><text x="40" y="262" font-family="sans-serif" font-size="10" fill="#1e3a8a">'Grouped beating' — often transient (inferior MI, drugs); watch it closely.</text><text x="40" y="298" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">MOBITZ II — constant PR, sudden dropped beats</text><path d="M45 352 L55 340 L65 352 L95 352 L95 352 L103 312 L111 352 L150 352 L160 340 L170 352 L200 352 L200 352 L208 312 L216 352 L260 352 L270 340 L280 352 L320 352 L320 352 L330 340 L340 352 L420 352" fill="none" stroke="#b91c1c" stroke-width="2"/><text x="40" y="382" font-family="sans-serif" font-size="10" fill="#7f1d1d">Unstable — pads on, prepare to pace; it can stop without warning.</text><text x="40" y="418" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">COMPLETE (3RD-DEGREE) — P and QRS independent</text><path d="M40 472 L50 460 L60 472 L70 472 L125 472 L135 460 L145 472 L155 472 L210 472 L220 460 L230 472 L240 472 L295 472 L305 460 L315 472 L325 472 L420 472" fill="none" stroke="#b91c1c" stroke-width="2"/><path d="M85 472 L97 432 L109 480 L115 472" fill="none" stroke="#b91c1c" stroke-width="2"/><path d="M250 472 L262 432 L274 480 L280 472" fill="none" stroke="#b91c1c" stroke-width="2"/><path d="M395 472 L407 432 L419 480 L425 472" fill="none" stroke="#b91c1c" stroke-width="2"/><text x="40" y="502" font-family="sans-serif" font-size="10" fill="#7f1d1d">Atria and ventricles beat separately; escape 20–40/min — pace it.</text><rect x="30" y="522" width="400" height="50" fill="#f1f5f9" stroke="#94a3b8"/><text x="230" y="540" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0f172a">Mobitz II and complete block can stop without warning:</text><text x="230" y="555" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#475569">atropine now, pacing pads on, call for help.</text>
</svg>
