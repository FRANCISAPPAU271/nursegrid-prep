<svg viewBox="0 0 640 390" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="390" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">HERBAL MEDICINE INSIDE THE GHANAIAN HOSPITAL</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">Ghana is one of few African countries to place herbal units inside public hospitals.</text>

<rect x="20" y="60" width="600" height="26" fill="#1a5c3a"/>
<text x="320" y="79" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#fff">THE PILOT — HERBAL UNITS IN PUBLIC HOSPITALS FROM 2011 ONWARDS</text>

<rect x="20" y="98" width="290" height="130" fill="#eaf3ea" stroke="#8fb98f" stroke-width="1.5"/>
<text x="165" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5c3a">WHO STAFFS THE UNIT</text>
<g font-size="10.5" fill="#222">
<text x="32" y="138">A Medical Herbalist — a university</text>
<text x="32" y="154">graduate in herbal medicine, with an</text>
<text x="32" y="170">internship at Mampong-Akuapem</text>
<text x="32" y="190">Not the same as a herbalist practising</text>
<text x="32" y="206">in the community, and not the same</text>
<text x="32" y="222">as a spiritual or faith healer</text>
</g>

<rect x="330" y="98" width="290" height="130" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.5"/>
<text x="475" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">WHAT IS DISPENSED</text>
<g font-size="10.5" fill="#222">
<text x="342" y="138">Only certified preparations, largely</text>
<text x="342" y="154">from the Centre for Plant Medicine</text>
<text x="342" y="170">Research at Mampong-Akuapem</text>
<text x="342" y="190">Prescribed, labelled and recorded in</text>
<text x="342" y="206">the same folder as everything else the</text>
<text x="342" y="222">patient is taking</text>
</g>

<rect x="20" y="244" width="600" height="60" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.5"/>
<text x="320" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1e">THE GAP PATIENTS FEEL</text>
<text x="34" y="284" font-size="10.5" fill="#222">The consultation is covered by health insurance, but the certified herbal medicines are not on the insurance drug list,</text>
<text x="34" y="298" font-size="10.5" fill="#222">so the patient pays for them out of pocket. This, more than belief, is what limits use of the unit.</text>

<rect x="20" y="316" width="600" height="60" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.5"/>
<text x="320" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">WHY IT IS WORTH DOING</text>
<text x="34" y="356" font-size="10.5" fill="#222">Use is already near universal; integration simply makes it visible. It brings the product under quality control, puts it</text>
<text x="34" y="370" font-size="10.5" fill="#222">in one record where interactions can be seen, and gives the patient one place to be honest.</text>
</svg>