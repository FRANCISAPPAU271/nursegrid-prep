<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 490" font-family="sans-serif">
<rect x="0" y="0" width="460" height="490" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#111827">Ghana's health system: levels + referral</text>
<g font-size="9" fill="#111827" text-anchor="middle">
<rect x="150" y="36" width="160" height="52" rx="6" fill="#3730a3"/>
<text x="230" y="56" font-weight="bold" font-size="9" fill="#ffffff">TEACHING / SPECIALIST</text>
<text x="230" y="70" font-size="8" fill="#ffffff">Korle-Bu, KATH, Tamale...</text>
<text x="230" y="81" font-size="8" fill="#ffffff">tertiary + training + research</text>
<rect x="120" y="94" width="220" height="52" rx="6" fill="#4f46e5"/>
<text x="230" y="114" font-weight="bold" font-size="9" fill="#ffffff">REGIONAL HOSPITALS</text>
<text x="230" y="128" font-size="8" fill="#ffffff">secondary: specialists, ICU,</text>
<text x="230" y="139" font-size="8" fill="#ffffff">referral hub per region</text>
<rect x="90" y="152" width="280" height="52" rx="6" fill="#6366f1"/>
<text x="230" y="172" font-weight="bold" font-size="9" fill="#ffffff">DISTRICT HOSPITALS</text>
<text x="230" y="186" font-size="8" fill="#ffffff">first referral: surgery, O&amp;G, paeds,</text>
<text x="230" y="197" font-size="8" fill="#ffffff">medical — district backbone</text>
<rect x="60" y="210" width="340" height="52" rx="6" fill="#065f46"/>
<text x="230" y="230" font-weight="bold" font-size="9" fill="#ffffff">HEALTH CENTRES + CLINICS</text>
<text x="230" y="244" font-size="8" fill="#ffffff">sub-district: OPD, ANC/PNC, minor</text>
<text x="230" y="255" font-size="8" fill="#ffffff">ailments, referrals up</text>
<rect x="30" y="268" width="400" height="52" rx="6" fill="#059669"/>
<text x="230" y="288" font-weight="bold" font-size="9" fill="#ffffff">CHPS COMPOUNDS</text>
<text x="230" y="302" font-size="8" fill="#ffffff">community doorstep: home visits, immunisation,</text>
<text x="230" y="313" font-size="8" fill="#ffffff">FP, health talks, first aid — nurses lead here</text>
</g>
<rect x="0" y="330" width="460" height="160" fill="#f1f5f9"/>
<g font-size="10" fill="#111827">
<text x="20" y="352" font-weight="bold">GOVERNANCE: MOH (policy) → GHS (public delivery: national/regional/district/</text>
<text x="20" y="366">sub-district) + teaching hospitals (own boards) + CHAG/faith-based + private + quasi-</text>
<text x="20" y="380">government. HeFRA licenses facilities; NMC licenses professionals (PRO-I); FDA guards</text>
<text x="20" y="394">drugs/food; NHIA runs insurance (next lesson).</text>
<text x="20" y="414" font-weight="bold">REFERRAL RULES: up with letter + reason + stabilise first (ABCs, IV, oxygen — never</text>
<text x="20" y="428">"go and come" unstable); receive with feedback DOWN (counter-referral: what was done,</text>
<text x="20" y="442">what continues — the loop that teaches). Bypassing (CHPS → teaching) chokes tertiary</text>
<text x="20" y="456">care: educate gatekeeping kindly. Emergencies jump queues; paperwork follows patients,</text>
<text x="20" y="470">never precedes them. Nurses oil every hinge of this ladder.</text>
</g>
</svg>