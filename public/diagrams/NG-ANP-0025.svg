<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 480" font-family="sans-serif">
<rect x="0" y="0" width="460" height="480" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#111827">Autonomic balance: fight-or-flight vs rest-and-digest</text>
<rect x="20" y="40" width="205" height="34" rx="8" fill="#fef2f2" stroke="#7f1d1d" stroke-width="2"/>
<text x="122" y="55" font-size="11" font-weight="bold" fill="#7f1d1d" text-anchor="middle">SYMPATHETIC</text>
<text x="122" y="68" font-size="9" fill="#7f1d1d" text-anchor="middle">thoracolumbar • noradrenaline</text>
<rect x="235" y="40" width="205" height="34" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="337" y="55" font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="middle">PARASYMPATHETIC</text>
<text x="337" y="68" font-size="9" fill="#1d4ed8" text-anchor="middle">craniosacral (vagus) • acetylcholine</text>
<g font-size="10" fill="#111827">
<text x="30" y="96">pupils DILATE (see threat)</text>
<text x="245" y="96">pupils CONSTRICT (read book)</text>
<text x="30" y="116">HR ↑, force ↑, BP ↑</text>
<text x="245" y="116">HR ↓ (vagal — suction, straining)</text>
<text x="30" y="136">bronchi DILATE (more air)</text>
<text x="245" y="136">bronchi constrict (wheeze)</text>
<text x="30" y="156">gut SLOWS, sphincters shut</text>
<text x="245" y="156">gut MOVES, glands flow</text>
<text x="30" y="176">bladder RELAXES (holds)</text>
<text x="245" y="176">bladder SQUEEZES (goes)</text>
<text x="30" y="196">sweat + glucose UP (fuel)</text>
<text x="245" y="196">pupils/saliva/tears flow</text>
<text x="30" y="216">adrenals dump adrenaline</text>
<text x="245" y="216">genitals: arousal side</text>
</g>
<rect x="20" y="228" width="420" height="52" fill="#fef9c3" stroke="#713f12" stroke-width="1"/>
<text x="230" y="246" font-size="10" fill="#111827" text-anchor="middle" font-weight="bold">Drugs pick sides: atropine blocks vagal (HR up, dry, can't pee/see);</text>
<text x="230" y="260" font-size="10" fill="#111827" text-anchor="middle">beta-blockers blunt sympathetic (HR down, wheeze risk, masks hypos);</text>
<text x="230" y="274" font-size="10" fill="#111827" text-anchor="middle">adrenaline shouts sympathetic (anaphylaxis, arrest, croup).</text>
<rect x="0" y="292" width="460" height="188" fill="#f1f5f9"/>
<text x="20" y="314" font-size="10" fill="#111827" font-weight="bold">AUTONOMIC DYSREFLEXIA — cord injury at/above T6, a hypertensive emergency:</text>
<text x="20" y="328" font-size="10" fill="#111827">a trigger BELOW the lesion (full bladder — commonest; constipation/impaction;</text>
<text x="20" y="342" font-size="10" fill="#111827">pressure sore, tight clothes, ingrown nail) fires unopposed sympathetic storm below</text>
<text x="20" y="356" font-size="10" fill="#111827">while the brain can only vagal above: POUNDING headache, SEVERE hypertension,</text>
<text x="20" y="370" font-size="10" fill="#111827">flushing + sweating ABOVE the lesion, pale gooseflesh BELOW, bradycardia,</text>
<text x="20" y="384" font-size="10" fill="#111827">anxiety, nasal stuffiness — stroke/seizure/death if missed. DRILL: sit UP 90° (drop</text>
<text x="20" y="398" font-size="10" fill="#111827">the BP orthostatically), loosen everything, check + drain BLADDER first (kinked</text>
<text x="20" y="412" font-size="10" fill="#111827">catheter? blocked bag? scan + straight cath per protocol), then bowel, then skin;</text>
<text x="20" y="426" font-size="10" fill="#111827">monitor BP q2–5 min; nifedipine/nitrates per protocol if pressure won't fall; senior</text>
<text x="20" y="440" font-size="10" fill="#111827">help + document trigger, peak BP, actions. These patients often know their drill —</text>
<text x="20" y="454" font-size="10" fill="#111827">believe the expert in the bed and move fast.</text>
</svg>