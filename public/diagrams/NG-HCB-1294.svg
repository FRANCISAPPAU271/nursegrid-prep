<svg viewBox="0 0 640 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="450" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">THE SANITATION AND WATER LADDER</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">Coverage figures mean nothing until you know which rung is being counted.</text>

<rect x="24" y="58" width="290" height="196" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.7"/>
<text x="169" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a3a5c">SANITATION, BOTTOM TO TOP</text>
<rect x="40" y="212" width="258" height="30" fill="#e8cfcf" stroke="#8b2f2f"/><text x="48" y="232" font-size="10.5" fill="#222">OPEN DEFECATION — no facility at all</text>
<rect x="40" y="178" width="258" height="30" fill="#f2e3cf" stroke="#a87a30"/><text x="48" y="198" font-size="10.5" fill="#222">UNIMPROVED — open pit, hanging latrine</text>
<rect x="40" y="144" width="258" height="30" fill="#f4f0d0" stroke="#a89a30"/><text x="48" y="164" font-size="10.5" fill="#222">LIMITED — improved but shared</text>
<rect x="40" y="110" width="258" height="30" fill="#dceadc" stroke="#3a7a4a"/><text x="48" y="130" font-size="10.5" fill="#222">BASIC — improved, not shared</text>
<rect x="40" y="86" width="258" height="22" fill="#c7e0c7" stroke="#1a5c3a"/><text x="48" y="101" font-size="10.5" fill="#222">SAFELY MANAGED — waste treated too</text>

<rect x="326" y="58" width="290" height="196" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.7"/>
<text x="471" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a5c3a">COMMUNITY-LED TOTAL SANITATION</text>
<g font-size="10" fill="#222">
<text x="338" y="100">It does not build or subsidise latrines.</text>
<text x="338" y="118">Facilitators walk the community to its</text>
<text x="338" y="136">own defecation sites and let residents</text>
<text x="338" y="154">work out where the waste ends up.</text>
<text x="338" y="176">The community then decides to act,</text>
<text x="338" y="194">builds with its own materials, and is</text>
<text x="338" y="212">verified as open defecation free at</text>
<text x="338" y="230">80% household latrine coverage.</text>
</g>
<text x="471" y="248" text-anchor="middle" font-size="10" font-style="italic" fill="#1a5c3a">Ownership is the mechanism, not the slogan.</text>

<rect x="24" y="266" width="592" height="80" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.8"/>
<text x="320" y="286" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1e">WHY COMMUNITIES SLIDE BACK DOWN</text>
<g font-size="10" fill="#222">
<text x="38" y="308">Pits and superstructures collapse in the rains, and the poorest households cannot rebuild.</text>
<text x="38" y="326">Coverage falls year on year after verification unless someone keeps returning. Declaring is not finishing.</text>
</g>

<rect x="24" y="358" width="592" height="76" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.7"/>
<text x="320" y="378" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6b3a6b">THE SAME LOGIC APPLIES TO WATER</text>
<g font-size="10" fill="#222">
<text x="38" y="400">A borehole counts as basic only if the round trip to collect water is under thirty minutes.</text>
<text x="38" y="418">A safe source carried in a dirty bucket and stored uncovered is no longer a safe supply.</text>
</g>
</svg>