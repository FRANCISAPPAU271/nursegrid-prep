<svg viewBox="0 0 470 220" role="img" xmlns="http://www.w3.org/2000/svg"><title>MUAC tape colour zones</title>
<rect width="470" height="220" fill="#f6f8fc"/>
<text x="235" y="20" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">MUAC — children 6 to 59 months</text>
<rect x="30" y="40" width="130" height="52" rx="6" fill="#e2574c"/>
<rect x="160" y="40" width="120" height="52" fill="#f2b705"/>
<rect x="280" y="40" width="160" height="52" rx="6" fill="#0f9d76"/>
<text x="95" y="62" font-size="12" text-anchor="middle" font-family="system-ui" fill="#fff" font-weight="700">RED</text>
<text x="95" y="80" font-size="11" text-anchor="middle" font-family="system-ui" fill="#fff">under 11.5 cm</text>
<text x="220" y="62" font-size="12" text-anchor="middle" font-family="system-ui" fill="#4a3a00" font-weight="700">YELLOW</text>
<text x="220" y="80" font-size="11" text-anchor="middle" font-family="system-ui" fill="#4a3a00">11.5 – 12.4 cm</text>
<text x="360" y="62" font-size="12" text-anchor="middle" font-family="system-ui" fill="#fff" font-weight="700">GREEN</text>
<text x="360" y="80" font-size="11" text-anchor="middle" font-family="system-ui" fill="#fff">12.5 cm and above</text>
<text x="95" y="112" font-size="10.5" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#a8352c">SEVERE acute</text>
<text x="95" y="126" font-size="10.5" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#a8352c">malnutrition</text>
<text x="95" y="146" font-size="9.5" text-anchor="middle" font-family="system-ui">refer urgently</text>
<text x="220" y="112" font-size="10.5" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#8a6d00">MODERATE acute</text>
<text x="220" y="126" font-size="10.5" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#8a6d00">malnutrition</text>
<text x="220" y="146" font-size="9.5" text-anchor="middle" font-family="system-ui">supplementary feeding</text>
<text x="360" y="112" font-size="10.5" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#0b7a5c">Adequate</text>
<text x="360" y="146" font-size="9.5" text-anchor="middle" font-family="system-ui">counsel and follow up</text>
<rect x="30" y="166" width="410" height="42" rx="8" fill="#fff" stroke="#e2574c" stroke-width="2"/>
<text x="235" y="184" font-size="10.5" text-anchor="middle" font-family="system-ui" font-weight="700">Bilateral pitting oedema = SEVERE whatever the MUAC reads</text>
<text x="235" y="199" font-size="9.5" text-anchor="middle" font-family="system-ui" fill="#5a6b85">Measure LEFT upper arm, midway shoulder tip to elbow, arm relaxed</text>
</svg>