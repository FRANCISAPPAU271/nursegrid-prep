<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="460" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">THE PROCEDURE TROLLEY: CLEAN TRAVELS DOWNWARDS</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">Every rule about a trolley exists to stop something dirty moving upwards onto something sterile.</text>

<rect x="26" y="58" width="266" height="196" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.8"/>
<text x="159" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a3a5c">HOW IT IS LOADED</text>
<line x1="46" y1="120" x2="272" y2="120" stroke="#1a3a5c" stroke-width="3"/>
<text x="52" y="112" font-size="10.5" font-weight="bold" fill="#1a3a5c">TOP SHELF — sterile only</text>
<text x="52" y="138" font-size="9.5" fill="#222">Sterile pack, dressings, instruments,</text>
<text x="52" y="152" font-size="9.5" fill="#222">lotions poured into the sterile bowl.</text>
<line x1="46" y1="180" x2="272" y2="180" stroke="#3a7a4a" stroke-width="3"/>
<text x="52" y="172" font-size="10.5" font-weight="bold" fill="#3a7a4a">BOTTOM SHELF — clean supplies</text>
<text x="52" y="198" font-size="9.5" fill="#222">Spare packs, tape, gloves, sharps box,</text>
<text x="52" y="212" font-size="9.5" fill="#222">receiver for used items.</text>
<text x="52" y="236" font-size="9.5" font-style="italic" fill="#8b2f2f">Nothing used ever returns to the top.</text>

<rect x="308" y="58" width="306" height="196" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.8"/>
<text x="461" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a5c3a">THE ORDER THAT NEVER CHANGES</text>
<g font-size="10" fill="#222">
<text x="320" y="100">1  Check the order and identify the patient</text>
<text x="320" y="120">2  Explain, gain consent, offer a chaperone</text>
<text x="320" y="140">3  Clean the trolley, then wash hands</text>
<text x="320" y="160">4  Assemble everything before starting</text>
<text x="320" y="180">5  Screen, position, expose only what is needed</text>
<text x="320" y="200">6  Perform, observing the patient not the tray</text>
<text x="320" y="220">7  Dispose, decontaminate, wash hands</text>
<text x="320" y="240">8  Document, including what the patient tolerated</text>
</g>

<rect x="26" y="268" width="588" height="76" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.8"/>
<text x="320" y="288" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8b2f2f">WHAT BREAKS A STERILE FIELD</text>
<g font-size="10" fill="#222">
<text x="40" y="310">Anything below waist level  ·  turning your back on it  ·  reaching across it  ·  the outer 2.5 cm of the drape</text>
<text x="40" y="328">Moisture wicking through from below  ·  talking or coughing over it  ·  a pack whose seal or expiry has failed</text>
</g>

<rect x="26" y="358" width="286" height="88" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.7"/>
<text x="169" y="378" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1e">WHY ASSEMBLE EVERYTHING FIRST</text>
<g font-size="9.5" fill="#222">
<text x="38" y="398">Leaving mid-procedure means either</text>
<text x="38" y="414">abandoning a sterile field or carrying</text>
<text x="38" y="430">contamination back to it. There is no</text>
</g>
<text x="38" y="444" font-size="9.5" fill="#222">third option once you have started.</text>

<rect x="328" y="358" width="286" height="88" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.7"/>
<text x="471" y="378" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6b3a6b">WET EQUALS CONTAMINATED</text>
<g font-size="9.5" fill="#222">
<text x="340" y="398">A damp drape is a wick. Organisms</text>
<text x="340" y="414">travel up through moisture from the</text>
<text x="340" y="430">unsterile surface beneath, whatever</text>
</g>
<text x="340" y="444" font-size="9.5" fill="#222">the drape looked like when you laid it.</text>
</svg>