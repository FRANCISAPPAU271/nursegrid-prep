<svg viewBox="0 0 470 260" role="img" xmlns="http://www.w3.org/2000/svg"><title>Pharmacokinetics: what the body does to the drug</title>
<rect width="470" height="260" fill="#f6f8fc"/>
<text x="235" y="20" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">Pharmacokinetics — what the BODY does to the DRUG</text>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#5a6b85"/></marker></defs>
<g font-family="system-ui">
<rect x="14" y="34" width="104" height="62" rx="8" fill="#fff" stroke="#2b6fa8" stroke-width="2"/>
<rect x="128" y="34" width="104" height="62" rx="8" fill="#fff" stroke="#2b6fa8" stroke-width="2"/>
<rect x="242" y="34" width="104" height="62" rx="8" fill="#fff" stroke="#2b6fa8" stroke-width="2"/>
<rect x="356" y="34" width="100" height="62" rx="8" fill="#fff" stroke="#2b6fa8" stroke-width="2"/>
<text x="66" y="54" font-size="11" text-anchor="middle" font-weight="700" fill="#2b6fa8">ABSORPTION</text>
<text x="180" y="54" font-size="11" text-anchor="middle" font-weight="700" fill="#2b6fa8">DISTRIBUTION</text>
<text x="294" y="54" font-size="11" text-anchor="middle" font-weight="700" fill="#2b6fa8">METABOLISM</text>
<text x="406" y="54" font-size="11" text-anchor="middle" font-weight="700" fill="#2b6fa8">EXCRETION</text>
<g font-size="9">
<text x="66" y="70" text-anchor="middle">gut into blood</text>
<text x="66" y="84" text-anchor="middle" fill="#5a6b85">IV skips this step</text>
<text x="180" y="70" text-anchor="middle">blood to tissues</text>
<text x="180" y="84" text-anchor="middle" fill="#5a6b85">albumin carries it</text>
<text x="294" y="70" text-anchor="middle">mostly the LIVER</text>
<text x="294" y="84" text-anchor="middle" fill="#5a6b85">makes it water soluble</text>
<text x="406" y="70" text-anchor="middle">mostly the KIDNEY</text>
<text x="406" y="84" text-anchor="middle" fill="#5a6b85">also bile, lungs, milk</text>
</g>
<line x1="118" y1="65" x2="126" y2="65" stroke="#5a6b85" stroke-width="2" marker-end="url(#ar)"/>
<line x1="232" y1="65" x2="240" y2="65" stroke="#5a6b85" stroke-width="2" marker-end="url(#ar)"/>
<line x1="346" y1="65" x2="354" y2="65" stroke="#5a6b85" stroke-width="2" marker-end="url(#ar)"/>
</g>
<rect x="14" y="108" width="442" height="52" rx="8" fill="#fff8e8" stroke="#f2b705" stroke-width="2"/>
<text x="235" y="126" font-size="11" text-anchor="middle" font-family="system-ui" font-weight="700">FIRST PASS EFFECT</text>
<text x="235" y="142" font-size="9.5" text-anchor="middle" font-family="system-ui">An oral drug goes gut → portal vein → LIVER → rest of the body</text>
<text x="235" y="155" font-size="9.5" text-anchor="middle" font-family="system-ui" fill="#5a6b85">Much is destroyed before it ever works, which is why the oral dose exceeds the IV dose</text>
<rect x="14" y="170" width="216" height="76" rx="8" fill="#fff" stroke="#e2574c" stroke-width="2"/>
<text x="122" y="188" font-size="10.5" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#a8352c">LIVER failing?</text>
<g font-family="system-ui" font-size="9.5">
<text x="24" y="206">Metabolism slows, drug accumulates</text>
<text x="24" y="222">Reduce the dose of drugs the liver</text>
<text x="24" y="236">clears: diazepam, morphine, phenytoin</text></g>
<rect x="240" y="170" width="216" height="76" rx="8" fill="#fff" stroke="#e2574c" stroke-width="2"/>
<text x="348" y="188" font-size="10.5" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#a8352c">KIDNEY failing?</text>
<g font-family="system-ui" font-size="9.5">
<text x="250" y="206">Excretion slows, drug accumulates</text>
<text x="250" y="222">Reduce the dose of drugs the kidney</text>
<text x="250" y="236">clears: gentamicin, digoxin, penicillin</text></g>
</svg>