<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 490" font-family="sans-serif">
<rect x="0" y="0" width="460" height="490" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#111827">Eye: globe + pathway + field defects</text>
<!-- globe -->
<circle cx="130" cy="130" r="70" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<path d="M62,130 A68,68 0 0 1 90,72" fill="none" stroke="#0ea5e9" stroke-width="4"/>
<text x="40" y="100" font-size="8" fill="#111827">cornea</text>
<ellipse cx="105" cy="130" rx="8" ry="22" fill="#7c3aed"/>
<circle cx="105" cy="130" r="9" fill="#111827"/>
<text x="30" y="155" font-size="8" fill="#111827">iris/pupil</text>
<ellipse cx="135" cy="130" rx="14" ry="26" fill="#fef9c3" stroke="#713f12" stroke-width="1.5"/>
<text x="150" y="112" font-size="8" fill="#111827">lens</text>
<path d="M185,75 C200,110 200,150 185,185" fill="none" stroke="#b91c1c" stroke-width="5"/>
<text x="200" y="130" font-size="8" fill="#111827">retina</text>
<circle cx="192" cy="130" r="4" fill="#111827"/>
<text x="205" y="150" font-size="8" fill="#111827">fovea/macula</text>
<g font-size="8" fill="#111827">
<text x="100" y="215">aqueous: ciliary → pupil → trabecular → Schlemm (blocked = glaucoma)</text>
<text x="100" y="227">vitreous: gel holding retina on (flashes/floaters = tugging)</text>
</g>
<text x="130" y="248" font-size="9" fill="#6b7280" text-anchor="middle">sclera outside • choroid feeds • retina sees • disc = blind spot</text>
<!-- pathway -->
<text x="20" y="272" font-size="12" font-weight="bold" fill="#111827">Pathway: nasal fibres cross; temporal stay</text>
<g font-size="9" fill="#111827" text-anchor="middle">
<circle cx="70" cy="300" r="14" fill="none" stroke="#334155" stroke-width="1.5"/><text x="70" y="304">L eye</text>
<circle cx="160" cy="300" r="14" fill="none" stroke="#334155" stroke-width="1.5"/><text x="160" y="304">R eye</text>
<rect x="90" y="330" width="50" height="24" rx="6" fill="#fef9c3" stroke="#713f12" stroke-width="1.5"/>
<text x="115" y="345" font-size="8">CHIASM</text>
<rect x="280" y="290" width="130" height="24" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
<text x="345" y="305" font-size="8">L occipital (R field)</text>
<rect x="280" y="320" width="130" height="24" rx="6" fill="#fecaca" stroke="#7f1d1d" stroke-width="1"/>
<text x="345" y="335" font-size="8">R occipital (L field)</text>
<line x1="70" y1="314" x2="100" y2="330" stroke="#334155" stroke-width="1.5"/>
<line x1="160" y1="314" x2="130" y2="330" stroke="#334155" stroke-width="1.5"/>
<line x1="140" y1="335" x2="280" y2="302" stroke="#334155" stroke-width="1.5"/>
<line x1="90" y1="354" x2="280" y2="332" stroke="#334155" stroke-width="1.5"/>
</g>
<g font-size="9" fill="#111827">
<text x="30" y="378" font-weight="bold">Optic nerve cut: that eye BLIND (RAPD +).</text>
<text x="30" y="392" font-weight="bold">Chiasm squeezed (pituitary): BITEMPORAL loss (can't see out the sides).</text>
<text x="30" y="406" font-weight="bold">Tract/radiation/occipital: HOMONYMOUS HEMIANOPIA (same half both eyes).</text>
</g>
<rect x="0" y="418" width="460" height="72" fill="#f1f5f9"/>
<text x="20" y="440" font-size="10" fill="#111827">Cataract clouds (painless blur + glare — replace lens, day case). Open-angle glaucoma</text>
<text x="20" y="454" font-size="10" fill="#111827">steals sides silently (drops → laser → surgery; drops for LIFE). Diabetics: retinal</text>
<text x="20" y="468" font-size="10" fill="#111827">screening YEARLY — laser saves sight only before bleeding. Red reflex absent = refer.</text>
</svg>