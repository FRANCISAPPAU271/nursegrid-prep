<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 490" font-family="sans-serif">
<rect x="0" y="0" width="460" height="490" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#111827">Delegation 5 rights + negligence 4 elements</text>
<text x="20" y="52" font-size="12" font-weight="bold" fill="#111827">DELEGATION: task moves, accountability doesn't</text>
<g font-size="9" fill="#111827" text-anchor="middle">
<rect x="20" y="60" width="78" height="70" rx="6" fill="#eef2ff" stroke="#3730a3" stroke-width="1.5"/>
<text x="59" y="78" font-weight="bold" font-size="9">RIGHT</text>
<text x="59" y="90" font-weight="bold" font-size="9">TASK</text>
<text x="59" y="103" font-size="8">delegable?</text>
<text x="59" y="114" font-size="8">(vitals, hygiene,</text>
<text x="59" y="124" font-size="8">feeds — NOT</text>
<text x="59" y="133" font-size="8" fill="#6b7280">judgment)</text>
<rect x="102" y="60" width="78" height="70" rx="6" fill="#eef2ff" stroke="#3730a3" stroke-width="1"/>
<text x="141" y="78" font-weight="bold" font-size="9">RIGHT</text>
<text x="141" y="90" font-weight="bold" font-size="9">CONTEXT</text>
<text x="141" y="103" font-size="8">stable patient,</text>
<text x="141" y="114" font-size="8">right setting,</text>
<text x="141" y="124" font-size="8">orders clear</text>
<rect x="184" y="60" width="78" height="70" rx="6" fill="#eef2ff" stroke="#3730a3" stroke-width="1.5"/>
<text x="223" y="78" font-weight="bold" font-size="9">RIGHT</text>
<text x="223" y="90" font-weight="bold" font-size="9">PERSON</text>
<text x="223" y="103" font-size="8">trained +</text>
<text x="223" y="114" font-size="8">competent +</text>
<text x="223" y="124" font-size="8">willing?</text>
<rect x="266" y="60" width="78" height="70" rx="6" fill="#eef2ff" stroke="#3730a3" stroke-width="1"/>
<text x="305" y="78" font-weight="bold" font-size="9">RIGHT</text>
<text x="305" y="90" font-weight="bold" font-size="9">DIRECTION</text>
<text x="305" y="103" font-size="8">what, when,</text>
<text x="305" y="114" font-size="8">limits, report-</text>
<text x="305" y="124" font-size="8">back triggers</text>
<rect x="348" y="60" width="92" height="70" rx="6" fill="#eef2ff" stroke="#3730a3" stroke-width="1.5"/>
<text x="394" y="78" font-weight="bold" font-size="9">RIGHT</text>
<text x="394" y="90" font-weight="bold" font-size="9">SUPERVISION</text>
<text x="394" y="103" font-size="8">direct/indirect,</text>
<text x="394" y="114" font-size="8">check + feedback,</text>
<text x="394" y="124" font-size="8">evaluate</text>
</g>
<text x="20" y="154" font-size="12" font-weight="bold" fill="#111827">NEGLIGENCE: all four, or no case</text>
<g font-size="10" fill="#111827" text-anchor="middle">
<rect x="20" y="162" width="100" height="60" rx="6" fill="#fef2f2" stroke="#7f1d1d" stroke-width="1.5"/>
<text x="70" y="182" font-weight="bold">1. DUTY</text>
<text x="70" y="196" font-size="8">nurse–patient link +</text>
<text x="70" y="207" font-size="8">foreseeable harm</text>
<rect x="126" y="162" width="100" height="60" rx="6" fill="#fef2f2" stroke="#7f1d1d" stroke-width="1.5"/>
<text x="176" y="182" font-weight="bold">2. BREACH</text>
<text x="176" y="196" font-size="8">below Bolam: no</text>
<text x="176" y="207" font-size="8">reasonable nurse would</text>
<rect x="232" y="162" width="100" height="60" rx="6" fill="#fef2f2" stroke="#7f1d1d" stroke-width="1.5"/>
<text x="282" y="182" font-weight="bold">3. CAUSATION</text>
<text x="282" y="196" font-size="8">but-for + material</text>
<text x="282" y="207" font-size="8">contribution</text>
<rect x="338" y="162" width="102" height="60" rx="6" fill="#fef2f2" stroke="#7f1d1d" stroke-width="1.5"/>
<text x="389" y="182" font-weight="bold">4. DAMAGE</text>
<text x="389" y="196" font-size="8">real, compensable</text>
<text x="389" y="207" font-size="8">harm (not near-miss)</text>
</g>
<rect x="0" y="234" width="460" height="256" fill="#f1f5f9"/>
<text x="20" y="256" font-size="10" fill="#111827">NEVER delegate: assessment, nursing judgment, discharge decisions, prescribing</text>
<text x="20" y="270" font-size="10" fill="#111827">responsibility, complex evaluation, breaking bad news alone. Delegatee may REFUSE</text>
<text x="20" y="284" font-size="10" fill="#111827">beyond competence — refusal is professionalism, not disobedience. Delegator owns</text>
<text x="20" y="298" font-size="10" fill="#111827">the DECISION to delegate; delegatee owns the ACT — both answerable. Employer</text>
<text x="20" y="312" font-size="10" fill="#111827">carries vicarious liability AND the nurse keeps personal liability — suing names both.</text>
<text x="20" y="326" font-size="10" fill="#111827">Res ipsa loquitur (\"the thing speaks\"): swab left inside, wrong limb, burn from hot</text>
<text x="20" y="340" font-size="10" fill="#111827">pack — negligence presumed, nurse must explain. Defences: valid consent, no</text>
<text x="20" y="354" font-size="10" fill="#111827">breach (Bolam peer support), no causation, limitation time. DOCUMENTATION is the</text>
<text x="20" y="368" font-size="10" fill="#111827">defence: contemporaneous + factual + timed + signed + unaltered — \"not documented,</text>
<text x="20" y="382" font-size="10" fill="#111827">not done\" litigates daily. Incident form + open disclosure + reflection: file all three,</text>
<text x="20" y="396" font-size="10" fill="#111827">hide nothing. \"I was told to\" / \"short-staffed\" / \"new on the ward\" excuse NOTHING</text>
<text x="20" y="410" font-size="10" fill="#111827">— escalate, refuse beyond competence, document the refusal. Indemnity: employer</text>
<text x="20" y="424" font-size="10" fill="#111827">covers employment acts; private/agency work needs OWN cover — check before the</text>
<text x="20" y="438" font-size="10" fill="#111827">shift, not after the writ. Crime needs intent/recklessness (assault, theft, fraud,</text>
<text x="20" y="452" font-size="10" fill="#111827">falsification) — negligence is civil compensation; crimes prosecute.</text>
</svg>