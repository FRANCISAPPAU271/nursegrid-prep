<svg viewBox="0 0 640 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="450" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">EXAMINING A PATIENT — ORDER MATTERS</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">Look, feel, tap, listen. Doing it in this order stops you changing what you are trying to measure.</text>

<rect x="24" y="60" width="140" height="72" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.7"/>
<text x="94" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">1. INSPECT</text>
<text x="94" y="99" text-anchor="middle" font-size="9.5" fill="#222">Look before touching.</text>
<text x="94" y="113" text-anchor="middle" font-size="9.5" fill="#222">Colour, breathing,</text>
<text x="94" y="126" text-anchor="middle" font-size="9.5" fill="#222">swelling, distress.</text>

<rect x="180" y="60" width="140" height="72" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.7"/>
<text x="250" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">2. PALPATE</text>
<text x="250" y="99" text-anchor="middle" font-size="9.5" fill="#222">Warm hands. Painful</text>
<text x="250" y="113" text-anchor="middle" font-size="9.5" fill="#222">area LAST, or the</text>
<text x="250" y="126" text-anchor="middle" font-size="9.5" fill="#222">patient guards.</text>

<rect x="336" y="60" width="140" height="72" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.7"/>
<text x="406" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">3. PERCUSS</text>
<text x="406" y="99" text-anchor="middle" font-size="9.5" fill="#222">Dull means fluid or</text>
<text x="406" y="113" text-anchor="middle" font-size="9.5" fill="#222">solid. Resonant means</text>
<text x="406" y="126" text-anchor="middle" font-size="9.5" fill="#222">air underneath.</text>

<rect x="492" y="60" width="124" height="72" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.7"/>
<text x="554" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">4. AUSCULTATE</text>
<text x="554" y="99" text-anchor="middle" font-size="9.5" fill="#222">Quiet room. Bare</text>
<text x="554" y="113" text-anchor="middle" font-size="9.5" fill="#222">skin, never through</text>
<text x="554" y="126" text-anchor="middle" font-size="9.5" fill="#222">clothing.</text>

<rect x="24" y="148" width="592" height="62" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.7"/>
<text x="320" y="168" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8b2f2f">THE ABDOMEN IS THE EXCEPTION</text>
<g font-size="10.5" fill="#222">
<text x="38" y="188">Inspect, then LISTEN, then percuss and palpate. Pressing the abdomen first changes the bowel sounds you</text>
<text x="38" y="204">were about to count, so you would be listening to your own examination rather than to the patient.</text>
</g>

<rect x="24" y="226" width="285" height="106" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.7"/>
<text x="166" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5c3a">SUBJECTIVE vs OBJECTIVE</text>
<g font-size="10" fill="#222">
<text x="38" y="268">Subjective — what the patient tells you.</text>
<text x="38" y="284">Pain, nausea, dizziness, fear.</text>
<text x="38" y="306">Objective — what you can measure or see.</text>
<text x="38" y="322">Pulse 118, temperature 39.2, pallor.</text>
</g>

<rect x="331" y="226" width="285" height="106" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.7"/>
<text x="473" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1e">GENERAL BEFORE SPECIFIC</text>
<g font-size="10" fill="#222">
<text x="345" y="268">Start at the end of the bed. Is this patient</text>
<text x="345" y="284">sick or not sick? Airway, breathing, colour,</text>
<text x="345" y="300">conscious level.</text>
<text x="345" y="322" font-style="italic">A sick patient is resuscitated, not examined.</text>
</g>

<rect x="24" y="348" width="592" height="58" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.6"/>
<text x="320" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b3a6b">COMPARE SIDE WITH SIDE</text>
<g font-size="10.5" fill="#222">
<text x="38" y="390">Right chest against left, right calf against left. The patient is their own control, and a difference between</text>
</g>
<text x="38" y="402" font-size="10.5" fill="#222">the two sides is far more informative than any single reading taken on its own.</text>

<text x="320" y="432" text-anchor="middle" font-size="10.5" font-style="italic" fill="#1a3a5c">Expose properly, keep the patient covered otherwise, explain each step before you do it, and ask permission.</text>
</svg>