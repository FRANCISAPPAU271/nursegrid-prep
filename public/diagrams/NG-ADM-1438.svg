<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="460" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">WHERE A GHANAIAN FACILITY'S MONEY COMES FROM</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">Four streams, four different masters, and only one of them arrives predictably.</text>

<rect x="24" y="58" width="142" height="118" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.6"/>
<text x="95" y="78" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">GOVERNMENT</text>
<g font-size="9" fill="#222">
<text x="32" y="98">Salaries of established</text>
<text x="32" y="112">staff, paid centrally.</text>
<text x="32" y="134" font-style="italic">Reliable, but the facility</text>
<text x="32" y="148" font-style="italic">manager controls none</text>
<text x="32" y="162" font-style="italic">of it.</text>
</g>

<rect x="176" y="58" width="142" height="118" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.6"/>
<text x="247" y="78" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a5c3a">NHIS CLAIMS</text>
<g font-size="9" fill="#222">
<text x="184" y="98">Reimbursement for</text>
<text x="184" y="112">insured patients treated.</text>
<text x="184" y="134" font-style="italic">The largest source of</text>
<text x="184" y="148" font-style="italic">operating cash, and the</text>
<text x="184" y="162" font-style="italic">slowest to arrive.</text>
</g>

<rect x="328" y="58" width="142" height="118" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.6"/>
<text x="399" y="78" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1e">INTERNALLY GENERATED</text>
<g font-size="9" fill="#222">
<text x="336" y="98">Cash paid by uninsured</text>
<text x="336" y="112">patients at the point of care.</text>
<text x="336" y="134" font-style="italic">Immediate and flexible,</text>
<text x="336" y="148" font-style="italic">but it is the money the</text>
<text x="336" y="162" font-style="italic">poorest cannot pay.</text>
</g>

<rect x="480" y="58" width="136" height="118" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.6"/>
<text x="548" y="78" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6b3a6b">DONOR AND PROGRAMME</text>
<g font-size="9" fill="#222">
<text x="488" y="98">Vaccines, ARVs, TB drugs,</text>
<text x="488" y="112">nets, project funds.</text>
<text x="488" y="134" font-style="italic">Free at the point of use,</text>
<text x="488" y="148" font-style="italic">tied to one disease, and</text>
<text x="488" y="162" font-style="italic">it ends.</text>
</g>

<rect x="24" y="190" width="592" height="96" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.8"/>
<text x="320" y="210" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8b2f2f">THE CLAIMS CYCLE IS WHY THE STORE IS EMPTY</text>
<g font-size="10" fill="#222">
<text x="38" y="232">Treat the patient  →  complete the claim form  →  submit within the deadline  →  the scheme vets it  →  payment.</text>
<text x="38" y="254">A form with a missing diagnosis, an unsigned page or a wrong tariff is rejected, and rejection means the</text>
<text x="38" y="272">facility treated that patient for nothing. Clinical documentation is therefore a financial act as well as a legal one.</text>
</g>

<rect x="24" y="300" width="290" height="70" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.7"/>
<text x="169" y="320" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">PAID BY DIAGNOSIS, NOT BY EFFORT</text>
<g font-size="9.5" fill="#222">
<text x="34" y="340">Ghana pays a bundled tariff per diagnosis group,</text>
<text x="34" y="356">with medicines claimed separately. A longer stay</text>
</g>
<text x="34" y="366" font-size="9.5" fill="#222"> </text>

<rect x="326" y="300" width="290" height="70" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.7"/>
<text x="471" y="320" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a5c3a">WHAT THE WARD SISTER CONTROLS</text>
<g font-size="9.5" fill="#222">
<text x="336" y="340">Not the salary bill. She controls waste, stock</text>
<text x="336" y="356">losses, length of stay and claim quality.</text>
</g>

<rect x="24" y="384" width="592" height="62" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.8"/>
<g font-size="10" fill="#222">
<text x="38" y="406" font-weight="bold" fill="#8a6d1e">A budget is a plan expressed in money. If the plan changes and the budget does not, one of them is fiction.</text>
<text x="38" y="428">Ask of every shortage: is there no money, has the money not arrived, or was it never requested in the plan?</text>
</g>
</svg>