<svg viewBox="0 0 640 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="450" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">SEXUALLY TRANSMITTED INFECTION — TREAT THE SYNDROME</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">Ghana uses syndromic management: treat what you see, today, without waiting for a laboratory result.</text>

<rect x="24" y="60" width="285" height="94" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.7"/>
<text x="166" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">URETHRAL DISCHARGE IN A MAN</text>
<g font-size="9.5" fill="#222">
<text x="36" y="100">Could be gonorrhoea or chlamydia, and</text>
<text x="36" y="115">very often it is both together.</text>
<text x="36" y="135" font-weight="bold">So cover both. Treating one and missing</text>
<text x="36" y="148">the other is why symptoms come back.</text>
</g>

<rect x="331" y="60" width="285" height="94" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.7"/>
<text x="473" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a5c3a">VAGINAL DISCHARGE</text>
<g font-size="9.5" fill="#222">
<text x="345" y="100">Itchy and white and thick suggests thrush.</text>
<text x="345" y="115">Frothy, greenish and offensive suggests</text>
<text x="345" y="130">trichomonas. Grey with a fishy smell</text>
<text x="345" y="145">suggests bacterial vaginosis.</text>
</g>

<rect x="24" y="168" width="285" height="94" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.7"/>
<text x="166" y="188" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1e">GENITAL ULCER</text>
<g font-size="9.5" fill="#222">
<text x="36" y="208">Painless and firm suggests syphilis.</text>
<text x="36" y="223">Painful and ragged suggests chancroid.</text>
<text x="36" y="238">Multiple small painful blisters that</text>
<text x="36" y="253">recur suggest herpes.</text>
</g>

<rect x="331" y="168" width="285" height="94" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.7"/>
<text x="473" y="188" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8b2f2f">LOWER ABDOMINAL PAIN IN A WOMAN</text>
<g font-size="9.5" fill="#222">
<text x="345" y="208">Think pelvic inflammatory disease, but</text>
<text x="345" y="223">FIRST exclude pregnancy. An ectopic</text>
<text x="345" y="238">pregnancy presents exactly like this</text>
<text x="345" y="253">and it kills.</text>
</g>

<rect x="24" y="276" width="592" height="76" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.8"/>
<text x="320" y="296" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6b3a6b">TREATING ONE PARTNER IS TREATING NOBODY</text>
<g font-size="10.5" fill="#222">
<text x="38" y="318">Partners must be treated at the same time or the infection simply travels back. Offer partner notification,</text>
<text x="38" y="336">condoms, an HIV test and a syphilis test to everyone with any sexually transmitted infection.</text>
</g>

<rect x="24" y="366" width="592" height="58" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.7"/>
<text x="320" y="386" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5c3a">THE CONSULTATION IS THE TREATMENT TOO</text>
<g font-size="10.5" fill="#222">
<text x="38" y="408">Private room, no lecture, no raised eyebrow. A patient who feels judged does not return, does not bring a</text>
</g>
<text x="38" y="420" font-size="10.5" fill="#222">partner, and does not disclose the next time. Shame spreads infection more efficiently than any organism.</text>

<text x="320" y="442" text-anchor="middle" font-size="10.5" font-style="italic" fill="#1a3a5c">A young person under 16 with an STI raises a safeguarding question. Ask about the age of the partner.</text>
</svg>