<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="420" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">BREAK-EVEN — HOW MANY CLIENTS BEFORE YOU EARN ANYTHING</text>

<line x1="80" y1="300" x2="500" y2="300" stroke="#333" stroke-width="1.6"/>
<line x1="80" y1="300" x2="80" y2="70" stroke="#333" stroke-width="1.6"/>
<text x="290" y="326" text-anchor="middle" font-size="11" fill="#333">number of clients served per month</text>
<text x="60" y="185" text-anchor="middle" font-size="11" fill="#333" transform="rotate(-90 60 185)">GH¢</text>

<line x1="80" y1="230" x2="500" y2="230" stroke="#8a6d1e" stroke-width="2.2" stroke-dasharray="7 4"/>
<text x="506" y="234" font-size="10.5" font-weight="bold" fill="#8a6d1e">fixed costs</text>

<line x1="80" y1="230" x2="500" y2="130" stroke="#8b2f2f" stroke-width="2.2"/>
<text x="506" y="130" font-size="10.5" font-weight="bold" fill="#8b2f2f">total cost</text>

<line x1="80" y1="300" x2="500" y2="80" stroke="#1a5c3a" stroke-width="2.2"/>
<text x="506" y="82" font-size="10.5" font-weight="bold" fill="#1a5c3a">income</text>

<circle cx="262" cy="187" r="6" fill="#1a3a5c"/>
<line x1="262" y1="187" x2="262" y2="300" stroke="#1a3a5c" stroke-dasharray="4 3"/>
<text x="262" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">BREAK-EVEN POINT</text>
<text x="262" y="316" text-anchor="middle" font-size="10" fill="#1a3a5c">this many clients</text>

<text x="160" y="266" font-size="11" font-weight="bold" fill="#8b2f2f">LOSS</text>
<text x="400" y="120" font-size="11" font-weight="bold" fill="#1a5c3a">PROFIT</text>

<rect x="20" y="336" width="290" height="70" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.5"/>
<text x="165" y="356" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1e">FIXED COSTS</text>
<text x="32" y="376" font-size="10.5" fill="#222">Paid whether or not a single client comes:</text>
<text x="32" y="394" font-size="10.5" fill="#222">rent, licence, salary, insurance, electricity</text>

<rect x="330" y="336" width="290" height="70" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.5"/>
<text x="475" y="356" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">VARIABLE COSTS</text>
<text x="342" y="376" font-size="10.5" fill="#222">Rise with each client treated: dressings,</text>
<text x="342" y="394" font-size="10.5" fill="#222">gloves, drugs, fuel to reach the house</text>

<rect x="20" y="52" width="300" height="0" fill="none"/>
<text x="320" y="52" text-anchor="middle" font-size="11" font-style="italic" fill="#8b2f2f">Break-even clients = fixed costs ÷ (price per client − variable cost per client)</text>
</svg>