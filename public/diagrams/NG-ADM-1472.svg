<svg viewBox="0 0 640 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="450" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">PATIENT FLOW: FIND THE BOTTLENECK, NOT THE BLAME</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">A queue is a symptom. It forms at the slowest step, and it never forms where people are working hardest.</text>

<rect x="34" y="76" width="82" height="46" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.6"/>
<text x="75" y="96" text-anchor="middle" font-size="9.5" fill="#222">Arrival and</text><text x="75" y="110" text-anchor="middle" font-size="9.5" fill="#222">registration</text>
<rect x="140" y="76" width="82" height="46" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.6"/>
<text x="181" y="96" text-anchor="middle" font-size="9.5" fill="#222">Vital signs</text><text x="181" y="110" text-anchor="middle" font-size="9.5" fill="#222">and triage</text>
<rect x="246" y="76" width="82" height="46" fill="#f7ecec" stroke="#8b2f2f" stroke-width="2.4"/>
<text x="287" y="96" text-anchor="middle" font-size="9.5" fill="#8b2f2f" font-weight="bold">Consultation</text><text x="287" y="110" text-anchor="middle" font-size="9" fill="#8b2f2f">2 clinicians</text>
<rect x="352" y="76" width="82" height="46" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.6"/>
<text x="393" y="96" text-anchor="middle" font-size="9.5" fill="#222">Laboratory</text>
<rect x="458" y="76" width="82" height="46" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.6"/>
<text x="499" y="96" text-anchor="middle" font-size="9.5" fill="#222">Pharmacy</text><text x="499" y="110" text-anchor="middle" font-size="9.5" fill="#222">and exit</text>
<path d="M116 99 L138 99 M222 99 L244 99 M328 99 L350 99 M434 99 L456 99" stroke="#333" stroke-width="2"/>
<polygon points="138,99 130,95 130,103" fill="#333"/><polygon points="244,99 236,95 236,103" fill="#333"/>
<polygon points="350,99 342,95 342,103" fill="#333"/><polygon points="456,99 448,95 448,103" fill="#333"/>
<text x="287" y="142" text-anchor="middle" font-size="10" font-weight="bold" fill="#8b2f2f">THE QUEUE FORMS HERE</text>
<g fill="#8b2f2f"><circle cx="252" cy="158" r="5"/><circle cx="266" cy="158" r="5"/><circle cx="280" cy="158" r="5"/><circle cx="294" cy="158" r="5"/><circle cx="308" cy="158" r="5"/><circle cx="322" cy="158" r="5"/></g>

<rect x="24" y="180" width="592" height="72" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.8"/>
<text x="320" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b2f2f">SPEEDING UP ANY OTHER STEP CHANGES NOTHING</text>
<g font-size="10" fill="#222">
<text x="38" y="222">Adding a second registration clerk moves patients to the consultation queue faster. The waiting room is calmer</text>
<text x="38" y="240">nowhere and the total wait is unchanged. Only the constraint sets the throughput of the whole system.</text>
</g>

<rect x="24" y="266" width="290" height="96" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.7"/>
<text x="169" y="286" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a5c3a">HOW TO FIND IT</text>
<g font-size="9.5" fill="#222">
<text x="34" y="306">Walk the patient's route yourself, with a watch.</text>
<text x="34" y="324">Record the time at every step for twenty patients.</text>
<text x="34" y="342">The step where people accumulate is the constraint,</text>
<text x="34" y="356">whatever the staff at each step believe.</text>
</g>

<rect x="326" y="266" width="290" height="96" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.7"/>
<text x="471" y="286" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1e">DISCHARGE IS A FLOW PROBLEM TOO</text>
<g font-size="9.5" fill="#222">
<text x="336" y="306">A ward is full at ten in the morning because</text>
<text x="336" y="324">yesterday's discharges leave at four in the</text>
<text x="336" y="342">afternoon. Plan the discharge on admission,</text>
<text x="336" y="356">not on the morning it happens.</text>
</g>

<rect x="24" y="376" width="592" height="60" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.7"/>
<g font-size="10" fill="#222">
<text x="38" y="398" font-weight="bold" fill="#6b3a6b">Before adding staff or money to a service, find out where the work actually stops moving.</text>
<text x="38" y="420">Most queues are caused by a decision nobody is available to make, not by a task nobody has time to do.</text>
</g>
</svg>