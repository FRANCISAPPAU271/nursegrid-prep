<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420"><rect width="800" height="420" rx="28" fill="#eff6ff"/><text x="40" y="55" font-family="Arial" font-size="28" font-weight="700" fill="#0f172a">Pre-eclampsia: urgent warning pattern</text><circle cx="210" cy="210" r="95" fill="#fecaca" stroke="#be123c" stroke-width="5"/><text x="145" y="205" font-family="Arial" font-size="26" font-weight="700" fill="#881337">BP ≥140/90</text><text x="112" y="240" font-family="Arial" font-size="20" fill="#881337">+ headache / vision</text><path d="M310 210h100" stroke="#64748b" stroke-width="6" marker-end="url(#a)"/><rect x="440" y="130" width="280" height="160" rx="18" fill="#dcfce7" stroke="#059669" stroke-width="4"/><text x="480" y="185" font-family="Arial" font-size="24" font-weight="700" fill="#065f46">Assess + escalate</text><text x="480" y="225" font-family="Arial" font-size="19" fill="#065f46">maternal safety</text><text x="480" y="255" font-family="Arial" font-size="19" fill="#065f46">and fetal status</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs></svg>
