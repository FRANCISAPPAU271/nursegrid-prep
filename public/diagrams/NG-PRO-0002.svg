<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 480" font-family="sans-serif">
<rect x="0" y="0" width="460" height="480" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#111827">Classroom to licence: the journey (NMC Ghana)</text>
<g font-size="10" fill="#111827" text-anchor="middle">
<rect x="20" y="44" width="128" height="72" rx="8" fill="#eef2ff" stroke="#3730a3" stroke-width="1.5"/>
<text x="84" y="62" font-weight="bold">1. INDEXING</text>
<text x="84" y="76" font-size="9">admitted to accredited</text>
<text x="84" y="88" font-size="9">school → NMC index</text>
<text x="84" y="100" font-size="9">number (your file opens)</text>
<text x="84" y="110" font-size="8" fill="#6b7280">supervised + accountable</text>
<rect x="156" y="44" width="128" height="72" rx="8" fill="#eef2ff" stroke="#3730a3" stroke-width="1.5"/>
<text x="220" y="62" font-weight="bold">2. TRAINING</text>
<text x="220" y="76" font-size="9">theory + clinical hours</text>
<text x="220" y="88" font-size="9">per curriculum; logbook</text>
<text x="220" y="100" font-size="9">+ assessments signed</text>
<text x="220" y="110" font-size="8" fill="#6b7280">school vouches for you</text>
<rect x="292" y="44" width="148" height="72" rx="8" fill="#eef2ff" stroke="#3730a3" stroke-width="2"/>
<text x="366" y="62" font-weight="bold">3. LICENSURE EXAM</text>
<text x="366" y="76" font-size="9">NMC licensing exam</text>
<text x="366" y="88" font-size="9">(theory + practical) —</text>
<text x="366" y="100" font-size="9">pass = eligible</text>
<text x="366" y="110" font-size="8" fill="#6b7280">fail = resit, not practice</text>
<g stroke="#3730a3" stroke-width="1.5">
<line x1="148" y1="80" x2="156" y2="80"/><path d="M156,80 l-7,-3.5 l0,7 Z" fill="#3730a3"/>
<line x1="284" y1="80" x2="292" y2="80"/><path d="M292,80 l-7,-3.5 l0,7 Z" fill="#3730a3"/>
</g>
<rect x="20" y="132" width="200" height="72" rx="8" fill="#dcfce7" stroke="#065f46" stroke-width="2"/>
<text x="120" y="150" font-weight="bold">4. REGISTRATION + PIN</text>
<text x="120" y="164" font-size="9">name on the register, licence</text>
<text x="120" y="176" font-size="9">(PIN) issued — NOW you may</text>
<text x="120" y="188" font-size="9">call yourself nurse + practise</text>
<text x="120" y="198" font-size="8" fill="#6b7280">unlicensed practice = offence</text>
<rect x="240" y="132" width="200" height="72" rx="8" fill="#fef9c3" stroke="#713f12" stroke-width="1.5"/>
<text x="340" y="150" font-weight="bold">5. RENEWAL + CPD</text>
<text x="340" y="164" font-size="9">PIN renewed yearly;</text>
<text x="340" y="176" font-size="9">CPD points keep it alive;</text>
<text x="340" y="188" font-size="9">lapse = practise barred</text>
<text x="340" y="198" font-size="8" fill="#6b7280">verification for abroad via NMC</text>
<line x1="230" y1="116" x2="230" y2="132" stroke="#3730a3" stroke-width="1.5"/>
<path d="M230,132 l-4,-7 l8,0 Z" fill="#3730a3"/>
<line x1="220" y1="168" x2="240" y2="168" stroke="#3730a3" stroke-width="1.5"/>
<path d="M240,168 l-7,-3.5 l0,7 Z" fill="#3730a3"/>
</g>
<rect x="20" y="216" width="420" height="72" rx="8" fill="#fef2f2" stroke="#7f1d1d" stroke-width="1.5"/>
<g font-size="10" fill="#111827" text-anchor="middle">
<text x="230" y="236" font-weight="bold" font-size="11">FITNESS-TO-PRACTICE (the exit door)</text>
<text x="230" y="252" font-size="9">complaint (patient, employer, police, NMC) → investigation → disciplinary tribunal →</text>
<text x="230" y="266" font-size="9" font-weight="bold">caution • conditions • suspension • ERASURE (struck off — no appeal to GRNA)</text>
<text x="230" y="280" font-size="8" fill="#6b7280">misconduct, incompetence, fraud, criminal conviction, practising while suspended</text>
</g>
<rect x="0" y="300" width="460" height="180" fill="#f1f5f9"/>
<text x="20" y="322" font-size="10" fill="#111827">Practising with an expired PIN or no licence is an OFFENCE under Act 857 — for</text>
<text x="20" y="336" font-size="10" fill="#111827">you AND any employer who knowingly uses you. Students practise ONLY supervised,</text>
<text x="20" y="350" font-size="10" fill="#111827">within taught competence, under school + ward authority — indexed from admission,</text>
<text x="20" y="364" font-size="10" fill="#111827">so misconduct as a student follows the file to registration. Failed the licensure?</text>
<text x="20" y="378" font-size="10" fill="#111827">Resit — working \"small small\" while failed is unlicensed practice. Going abroad?</text>
<text x="20" y="392" font-size="10" fill="#111827">NMC verifies good standing (CGFNS/NNAS/NMC-UK) — sanctions travel with you.</text>
<text x="20" y="406" font-size="10" fill="#111827">CPD is not decoration: points + reflection + renewal keep the PIN — and the PIN</text>
<text x="20" y="420" font-size="10" fill="#111827">is the only paper between you and \"unqualified\". Guard it like the drug keys.</text>
</svg>