<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 526" role="img">
<rect width="460" height="526" fill="#ffffff"/>
<text x="230" y="26" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">Slow rhythms: the escape ladder</text><text x="40" y="58" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e293b">SINUS BRADYCARDIA — slow but normal</text><path d="M40 130 L60 130 L70 118 L80 130 L100 130 L104 136 L112 76 L118 142 L124 130 L144 130 L144 130 L162 108 L180 130 L180 130 L270 130 L270 130 L280 118 L290 130 L310 130 L314 136 L322 76 L328 142 L334 130 L354 130 L354 130 L372 108 L390 130 L430 130" fill="none" stroke="#1e293b" stroke-width="2"/><text x="40" y="160" font-family="sans-serif" font-size="10" fill="#475569">P before every QRS — fit, asleep, beta-blocked, or hypothermic.</text><text x="40" y="210" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">JUNCTIONAL — narrow, 40–60/min, P absent</text><path d="M40 256 L50 256 L80 256 L88 220 L96 256 L120 256 L170 256 L200 256 L208 220 L216 256 L240 256 L290 256 L320 256 L328 220 L336 256 L360 256 L430 256" fill="none" stroke="#1d4ed8" stroke-width="2"/><text x="40" y="286" font-family="sans-serif" font-size="10" fill="#1e3a8a">The AV junction has taken over — look for the cause (drugs, ischaemia).</text><text x="40" y="336" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">IDIOVENTRICULAR — wide, 20–40/min, the last back-up</text><path d="M40 408 L110 408 L122 352 L134 416 L140 408 L200 408 L280 408 L292 352 L304 416 L310 408 L430 408" fill="none" stroke="#b91c1c" stroke-width="2"/><text x="40" y="438" font-family="sans-serif" font-size="10" fill="#7f1d1d">Too slow to perfuse for long — pads on, atropine, prepare to pace.</text><rect x="30" y="458" width="400" height="50" fill="#f1f5f9" stroke="#94a3b8"/><text x="230" y="476" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0f172a">Treat the patient, not the number: unwell plus slow = atropine plus pacing.</text><text x="230" y="491" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#475569">Unwell + slow = atropine + pacing; find the cause.</text>
</svg>
