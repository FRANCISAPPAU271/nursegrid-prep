<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 276" role="img" aria-label="Stages of behaviour change and the matching nursing response at each stage">
<rect width="470" height="276" fill="#ffffff"/>
<text x="235" y="22" text-anchor="middle" font-family="Georgia,serif" font-size="15" font-weight="bold" fill="#14532d">Match the response to the stage</text>
<rect x="24" y="34" width="422" height="24" fill="#e2e8f0" stroke="#334155"/>
<text x="36" y="51" font-family="Georgia,serif" font-size="11.5" font-weight="bold">Stage</text>
<text x="185" y="51" font-family="Georgia,serif" font-size="11.5" font-weight="bold">The person says</text>
<text x="330" y="51" font-family="Georgia,serif" font-size="11.5" font-weight="bold">You should</text>
<rect x="24" y="58" width="422" height="30" fill="#fef3c7" stroke="#92400e"/>
<text x="36" y="78" font-family="Georgia,serif" font-size="11" font-weight="bold">Pre-contemplation</text>
<text x="185" y="78" font-family="Georgia,serif" font-size="10.5">I do not have a problem</text>
<text x="330" y="78" font-family="Georgia,serif" font-size="10.5">raise it, keep the door open</text>
<rect x="24" y="88" width="422" height="30" fill="#ffffff" stroke="#92400e"/>
<text x="36" y="108" font-family="Georgia,serif" font-size="11" font-weight="bold">Contemplation</text>
<text x="185" y="108" font-family="Georgia,serif" font-size="10.5">maybe, but I enjoy it</text>
<text x="330" y="108" font-family="Georgia,serif" font-size="10.5">explore both sides with them</text>
<rect x="24" y="118" width="422" height="30" fill="#fef3c7" stroke="#92400e"/>
<text x="36" y="138" font-family="Georgia,serif" font-size="11" font-weight="bold">Preparation</text>
<text x="185" y="138" font-family="Georgia,serif" font-size="10.5">I want to stop soon</text>
<text x="330" y="138" font-family="Georgia,serif" font-size="10.5">help make a concrete plan</text>
<rect x="24" y="148" width="422" height="30" fill="#dcfce7" stroke="#14532d"/>
<text x="36" y="168" font-family="Georgia,serif" font-size="11" font-weight="bold">Action</text>
<text x="185" y="168" font-family="Georgia,serif" font-size="10.5">I stopped last week</text>
<text x="330" y="168" font-family="Georgia,serif" font-size="10.5">support and problem-solve</text>
<rect x="24" y="178" width="422" height="30" fill="#ffffff" stroke="#14532d"/>
<text x="36" y="198" font-family="Georgia,serif" font-size="11" font-weight="bold">Maintenance</text>
<text x="185" y="198" font-family="Georgia,serif" font-size="10.5">it has been six months</text>
<text x="330" y="198" font-family="Georgia,serif" font-size="10.5">plan for high-risk situations</text>
<rect x="24" y="208" width="422" height="30" fill="#e0f2fe" stroke="#1e3a8a"/>
<text x="36" y="228" font-family="Georgia,serif" font-size="11" font-weight="bold">Relapse</text>
<text x="185" y="228" font-family="Georgia,serif" font-size="10.5">I used again</text>
<text x="330" y="228" font-family="Georgia,serif" font-size="10.5">normalise, re-enter the cycle</text>
<text x="235" y="256" text-anchor="middle" font-family="Georgia,serif" font-size="11.5" font-weight="bold" fill="#7c2d12">Advice given at the wrong stage produces resistance, not change.</text>
<text x="235" y="270" text-anchor="middle" font-family="Georgia,serif" font-size="10.8" font-style="italic" fill="#334155">Relapse is part of the cycle, not the end of it.</text>
</svg>