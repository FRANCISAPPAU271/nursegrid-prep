<svg viewBox="0 0 470 230" role="img" xmlns="http://www.w3.org/2000/svg"><title>Hospital diet progression</title>
<rect width="470" height="230" fill="#f6f8fc"/>
<text x="235" y="20" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">Progression of hospital diets after surgery</text>
<g font-family="system-ui">
<rect x="14" y="34" width="98" height="120" rx="8" fill="#e8f1f8" stroke="#2b6fa8" stroke-width="2"/>
<rect x="126" y="34" width="98" height="120" rx="8" fill="#e8f1f8" stroke="#2b6fa8" stroke-width="2"/>
<rect x="238" y="34" width="98" height="120" rx="8" fill="#e8f1f8" stroke="#2b6fa8" stroke-width="2"/>
<rect x="350" y="34" width="106" height="120" rx="8" fill="#dff3ec" stroke="#0f9d76" stroke-width="2"/>
<text x="63" y="54" font-size="11" text-anchor="middle" font-weight="700">Clear fluid</text>
<text x="175" y="54" font-size="11" text-anchor="middle" font-weight="700">Full fluid</text>
<text x="287" y="54" font-size="11" text-anchor="middle" font-weight="700">Soft / light</text>
<text x="403" y="54" font-size="11" text-anchor="middle" font-weight="700" fill="#0b7a5c">Normal</text>
<g font-size="9.5">
<text x="24" y="76">Water, weak tea</text>
<text x="24" y="90">Strained broth</text>
<text x="24" y="104">Clear fruit juice</text>
<text x="136" y="76">Milk, custard</text>
<text x="136" y="90">Thin porridge</text>
<text x="136" y="104">Strained soup</text>
<text x="248" y="76">Mashed kenkey</text>
<text x="248" y="90">Rice, boiled yam</text>
<text x="248" y="104">Soft-cooked fish</text>
<text x="360" y="76">Full family diet</text>
<text x="360" y="90">Normal texture</text>
<text x="360" y="104">Usual portions</text>
</g>
<text x="63" y="130" font-size="9" text-anchor="middle" fill="#a8352c" font-weight="700">Nutritionally poor</text>
<text x="63" y="143" font-size="9" text-anchor="middle" fill="#a8352c">short term only</text>
<text x="175" y="130" font-size="9" text-anchor="middle" fill="#a8352c" font-weight="700">Low in fibre</text>
<text x="287" y="130" font-size="9" text-anchor="middle" fill="#5a6b85" font-weight="700">Low fibre and spice</text>
<text x="403" y="130" font-size="9" text-anchor="middle" fill="#0b7a5c" font-weight="700">Goal of admission</text>
</g>
<text x="235" y="176" font-size="11" text-anchor="middle" font-family="system-ui" font-weight="700">Advance when bowel sounds return, flatus is passed and the last step was tolerated</text>
<rect x="60" y="188" width="350" height="32" rx="8" fill="#fff" stroke="#e2574c" stroke-width="2"/>
<text x="235" y="202" font-size="10" text-anchor="middle" font-family="system-ui" font-weight="700">Nil by mouth is a holding position, never a plan</text>
<text x="235" y="215" font-size="9.5" text-anchor="middle" font-family="system-ui" fill="#5a6b85">Beyond 5 to 7 days without adequate intake, arrange enteral feeding</text>
</svg>