<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="440" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">HOW MEDICINES ARE GOVERNED IN GHANA</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">Four different bodies, four different jobs. Examiners test whether you can tell them apart.</text>

<rect x="20" y="60" width="292" height="96" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.7"/>
<text x="166" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">FOOD AND DRUGS AUTHORITY</text>
<g font-size="10" fill="#222">
<text x="34" y="102">Registers the product before it may</text>
<text x="34" y="120">be sold. Inspects, recalls unsafe</text>
<text x="34" y="138">batches, and receives adverse</text>
<text x="34" y="152">reaction reports.</text>
</g>

<rect x="328" y="60" width="292" height="96" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.7"/>
<text x="474" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a5c3a">PHARMACY COUNCIL</text>
<g font-size="10" fill="#222">
<text x="342" y="102">Registers the people and the</text>
<text x="342" y="120">premises. Decides who may</text>
<text x="342" y="138">dispense, and where a pharmacy</text>
<text x="342" y="152">may lawfully operate.</text>
</g>

<rect x="20" y="172" width="292" height="96" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.7"/>
<text x="166" y="192" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1e">ESSENTIAL MEDICINES LIST</text>
<g font-size="10" fill="#222">
<text x="34" y="214">The medicines that should always be</text>
<text x="34" y="232">available at each level of care, chosen</text>
<text x="34" y="250">for need, evidence, safety and cost.</text>
</g>

<rect x="328" y="172" width="292" height="96" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.7"/>
<text x="474" y="192" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6b3a6b">NHIS MEDICINES LIST</text>
<g font-size="10" fill="#222">
<text x="342" y="214">What the insurance scheme will pay</text>
<text x="342" y="232">for. A medicine can be essential and</text>
<text x="342" y="250">still not be reimbursed.</text>
</g>

<rect x="20" y="284" width="600" height="72" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.8"/>
<text x="320" y="304" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8b2f2f">WHY GENERIC PRESCRIBING IS POLICY</text>
<g font-size="10.5" fill="#222">
<text x="34" y="326">The generic name is the same everywhere, so it can be dispensed from whatever brand is in stock, it costs</text>
<text x="34" y="346">less, and it prevents a patient taking the same drug twice under two different brand names.</text>
</g>

<rect x="20" y="370" width="600" height="46" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.7"/>
<text x="320" y="390" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a5c3a">Report a suspected adverse reaction even if you are not certain the drug caused it.</text>
<text x="320" y="408" text-anchor="middle" font-size="10.5" fill="#222">Certainty is established by collecting many reports. Waiting for it is how signals are missed.</text>

<text x="320" y="434" text-anchor="middle" font-size="10.5" font-style="italic" fill="#1a3a5c">Medicines bought from hawkers and lorry stations are outside all of this. There is no batch, no recall, no redress.</text>
</svg>