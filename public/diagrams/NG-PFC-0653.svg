<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="400" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">VALID CONSENT — A SIGNATURE IS NOT CONSENT</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">A signed form records a conversation. Without the conversation, the form records nothing.</text>

<rect x="20" y="58" width="192" height="150" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.5"/>
<text x="116" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">CAPACITY</text>
<g font-size="10.5" fill="#222">
<text x="30" y="102">The person can:</text>
<text x="30" y="122">understand the information,</text>
<text x="30" y="140">retain it long enough,</text>
<text x="30" y="158">weigh it against their values,</text>
<text x="30" y="176">and communicate a choice.</text>
<text x="30" y="198" font-style="italic" fill="#1a3a5c">Assume it until shown otherwise.</text>
</g>

<rect x="224" y="58" width="192" height="150" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.5"/>
<text x="320" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">INFORMATION</text>
<g font-size="10.5" fill="#222">
<text x="234" y="102">In a language they speak,</text>
<text x="234" y="120">at a level they follow:</text>
<text x="234" y="140">what it is and why,</text>
<text x="234" y="158">the risks and benefits,</text>
<text x="234" y="176">the alternatives — including</text>
<text x="234" y="194">doing nothing at all.</text>
</g>

<rect x="428" y="58" width="192" height="150" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.5"/>
<text x="524" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">VOLUNTARINESS</text>
<g font-size="10.5" fill="#222">
<text x="438" y="102">Freely given, with no</text>
<text x="438" y="120">pressure from staff, from</text>
<text x="438" y="138">family or from a husband.</text>
<text x="438" y="158">It may be withdrawn at any</text>
<text x="438" y="176">moment, including after</text>
<text x="438" y="194">the form has been signed.</text>
</g>

<rect x="20" y="222" width="600" height="26" fill="#8b2f2f"/>
<text x="320" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">ALL THREE, OR IT IS NOT CONSENT</text>

<rect x="20" y="262" width="290" height="120" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.5"/>
<text x="165" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1e">WHERE IT GOES WRONG</text>
<g font-size="10.5" fill="#222">
<text x="32" y="302">The form is signed on the trolley at the door</text>
<text x="32" y="320">Explained in a language the patient half follows</text>
<text x="32" y="338">A relative signs for a competent adult</text>
<text x="32" y="356">"Just sign here" — with no explanation at all</text>
<text x="32" y="374">The patient is sedated when they sign</text>
</g>

<rect x="330" y="262" width="290" height="120" fill="#eaf3ea" stroke="#8fb98f" stroke-width="1.5"/>
<text x="475" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5c3a">THE NURSE'S ROLE</text>
<g font-size="10.5" fill="#222">
<text x="342" y="302">Check the patient understands what was said</text>
<text x="342" y="320">If they cannot repeat it back, they were not informed</text>
<text x="342" y="338">Stop the process and call the person who advised</text>
<text x="342" y="356">Arrange proper interpretation — not a passing relative</text>
<text x="342" y="374">Record what you checked and what you did</text>
</g>
</svg>