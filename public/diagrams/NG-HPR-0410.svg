<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="330" fill="#fbfaf7"/>
<text x="320" y="27" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">THE FOUR LEVELS OF PREVENTION</text>
<text x="320" y="46" text-anchor="middle" font-size="12" fill="#555">Named by where they sit on the road of the disease, not by how hard they are</text>

<line x1="40" y1="90" x2="600" y2="90" stroke="#333" stroke-width="2"/>
<polygon points="600,90 590,85 590,95" fill="#333"/>
<text x="40" y="80" font-size="10" fill="#666">no disease</text>
<text x="230" y="80" font-size="10" fill="#666">exposure begins</text>
<text x="390" y="80" font-size="10" fill="#666">disease present</text>
<text x="530" y="80" font-size="10" fill="#666">complications</text>
<circle cx="150" cy="90" r="5" fill="#1a5c3a"/>
<circle cx="300" cy="90" r="5" fill="#8b6a2f"/>
<circle cx="440" cy="90" r="5" fill="#8b2f2f"/>
<circle cx="560" cy="90" r="5" fill="#5a2f6b"/>

<rect x="24" y="110" width="140" height="150" fill="#eaf3ea" stroke="#8fb98f"/>
<text x="94" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5c3a">PRIMORDIAL</text>
<text x="94" y="147" text-anchor="middle" font-size="10" fill="#555">stop the risk factor</text>
<text x="94" y="160" text-anchor="middle" font-size="10" fill="#555">ever appearing</text>
<text x="34" y="182" font-size="10" fill="#333">Ban on tobacco</text>
<text x="34" y="197" font-size="10" fill="#333">advertising.</text>
<text x="34" y="217" font-size="10" fill="#333">Town planning that</text>
<text x="34" y="232" font-size="10" fill="#333">keeps a settlement</text>
<text x="34" y="247" font-size="10" fill="#333">off a floodplain.</text>

<rect x="170" y="110" width="140" height="150" fill="#f6f3ec" stroke="#c9b98f"/>
<text x="240" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b6a2f">PRIMARY</text>
<text x="240" y="147" text-anchor="middle" font-size="10" fill="#555">healthy people,</text>
<text x="240" y="160" text-anchor="middle" font-size="10" fill="#555">prevent the disease</text>
<text x="180" y="182" font-size="10" fill="#333">Immunisation.</text>
<text x="180" y="202" font-size="10" fill="#333">Insecticide treated</text>
<text x="180" y="217" font-size="10" fill="#333">bed nets.</text>
<text x="180" y="237" font-size="10" fill="#333">Safe water, latrines,</text>
<text x="180" y="252" font-size="10" fill="#333">handwashing.</text>

<rect x="316" y="110" width="140" height="150" fill="#f7e9e9" stroke="#c78f8f"/>
<text x="386" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b2f2f">SECONDARY</text>
<text x="386" y="147" text-anchor="middle" font-size="10" fill="#555">early disease,</text>
<text x="386" y="160" text-anchor="middle" font-size="10" fill="#555">find and treat it now</text>
<text x="326" y="182" font-size="10" fill="#333">Screening: VIA for</text>
<text x="326" y="197" font-size="10" fill="#333">cervical cancer, BP</text>
<text x="326" y="212" font-size="10" fill="#333">checks, HIV testing.</text>
<text x="326" y="232" font-size="10" fill="#333">Growth monitoring</text>
<text x="326" y="247" font-size="10" fill="#333">at child welfare.</text>

<rect x="462" y="110" width="154" height="150" fill="#efe7f3" stroke="#a98fc0"/>
<text x="539" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a2f6b">TERTIARY</text>
<text x="539" y="147" text-anchor="middle" font-size="10" fill="#555">disease established,</text>
<text x="539" y="160" text-anchor="middle" font-size="10" fill="#555">limit the damage</text>
<text x="472" y="182" font-size="10" fill="#333">Rehabilitation after</text>
<text x="472" y="197" font-size="10" fill="#333">stroke.</text>
<text x="472" y="217" font-size="10" fill="#333">Foot care to prevent</text>
<text x="472" y="232" font-size="10" fill="#333">diabetic amputation.</text>
<text x="472" y="252" font-size="10" fill="#333">CBR in the community.</text>

<rect x="24" y="272" width="592" height="46" fill="#fff3cd" stroke="#e0c86a"/>
<text x="320" y="290" text-anchor="middle" font-size="11" font-style="italic" fill="#6b5410">The trap: screening feels like prevention, but the disease is already there, so it is SECONDARY.</text>
<text x="320" y="308" text-anchor="middle" font-size="11" font-style="italic" fill="#6b5410">Ask only one question — at the moment you act, does the person already have the disease?</text>
</svg>