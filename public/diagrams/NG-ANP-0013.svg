<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 480" font-family="sans-serif">
<rect x="0" y="0" width="460" height="480" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#111827">Skin warnings: ABCDE + pressure stages</text>
<text x="20" y="52" font-size="12" font-weight="bold" fill="#111827">MELANOMA: ABCDE — any one earns referral</text>
<g font-size="9" fill="#111827">
<rect x="20" y="60" width="78" height="86" fill="#fef2f2" stroke="#7f1d1d" stroke-width="1"/>
<ellipse cx="59" cy="90" rx="22" ry="14" fill="#78350f"/>
<path d="M59,76 L59,104 M37,90 L81,90" stroke="#fca5a5" stroke-width="1" stroke-dasharray="3 2"/>
<text x="59" y="122" text-anchor="middle" font-weight="bold">A: Asymmetry</text>
<text x="59" y="134" text-anchor="middle" font-size="8" fill="#6b7280">halves don't match</text>
<rect x="102" y="60" width="78" height="86" fill="#fef2f2" stroke="#7f1d1d" stroke-width="1"/>
<path d="M141,78 l8,4 l-3,7 l9,2 l-7,6 l4,8 l-9,-1 l-3,7 l-6,-6 l-9,3 l2,-8 l-8,-4 l7,-5 l-2,-7 l8,-1 Z" fill="#78350f"/>
<text x="141" y="122" text-anchor="middle" font-weight="bold">B: Border</text>
<text x="141" y="134" text-anchor="middle" font-size="8" fill="#6b7280">ragged, blurred</text>
<rect x="184" y="60" width="78" height="86" fill="#fef2f2" stroke="#7f1d1d" stroke-width="1"/>
<circle cx="223" cy="90" r="14" fill="#78350f"/>
<circle cx="218" cy="86" r="5" fill="#000000"/><circle cx="229" cy="94" r="4" fill="#b91c1c"/>
<text x="223" y="122" text-anchor="middle" font-weight="bold">C: Colour</text>
<text x="223" y="134" text-anchor="middle" font-size="8" fill="#6b7280">mixed, changing</text>
<rect x="266" y="60" width="78" height="86" fill="#fef2f2" stroke="#7f1d1d" stroke-width="1"/>
<circle cx="305" cy="90" r="15" fill="#78350f"/>
<line x1="290" y1="108" x2="320" y2="108" stroke="#111827" stroke-width="1"/>
<text x="305" y="122" text-anchor="middle" font-weight="bold">D: Diameter</text>
<text x="305" y="134" text-anchor="middle" font-size="8" fill="#6b7280">&gt;6 mm (pencil eraser)</text>
<rect x="348" y="60" width="92" height="86" fill="#fef2f2" stroke="#7f1d1d" stroke-width="1"/>
<circle cx="380" cy="86" r="7" fill="#78350f"/>
<path d="M390,86 L402,86 M398,82 L402,86 L398,90" stroke="#111827" stroke-width="1.5" fill="none"/>
<circle cx="414" cy="86" r="12" fill="#451a03"/>
<text x="394" y="122" text-anchor="middle" font-weight="bold">E: Evolving</text>
<text x="394" y="134" text-anchor="middle" font-size="8" fill="#6b7280">any change = refer</text>
</g>
<text x="20" y="170" font-size="12" font-weight="bold" fill="#111827">PRESSURE INJURY: depth decides the stage</text>
<g font-size="9" fill="#111827">
<rect x="20" y="178" width="100" height="90" fill="#fff7ed" stroke="#7c2d12" stroke-width="1"/>
<rect x="30" y="188" width="80" height="10" fill="#fdbaba" stroke="#7c2d12" stroke-width="1"/>
<rect x="30" y="198" width="80" height="22" fill="#ffe5d9" stroke="#9d0208" stroke-width="0.5"/>
<rect x="30" y="220" width="80" height="14" fill="#fef9c3" stroke="#713f12" stroke-width="0.5"/>
<text x="70" y="250" text-anchor="middle" font-weight="bold">Stage 1: intact,</text>
<text x="70" y="261" text-anchor="middle" font-weight="bold">non-blanching</text>
<rect x="126" y="178" width="100" height="90" fill="#fff7ed" stroke="#7c2d12" stroke-width="1"/>
<rect x="136" y="188" width="80" height="10" fill="#ffffff" stroke="#7c2d12" stroke-width="1" stroke-dasharray="3 2"/>
<rect x="136" y="198" width="80" height="22" fill="#fecaca" stroke="#9d0208" stroke-width="1"/>
<rect x="136" y="220" width="80" height="14" fill="#fef9c3" stroke="#713f12" stroke-width="0.5"/>
<text x="176" y="250" text-anchor="middle" font-weight="bold">Stage 2: shallow</text>
<text x="176" y="261" text-anchor="middle" font-weight="bold">open / blister</text>
<rect x="232" y="178" width="100" height="90" fill="#fff7ed" stroke="#7c2d12" stroke-width="1"/>
<rect x="242" y="188" width="80" height="10" fill="#ffffff" stroke="#7c2d12" stroke-width="1" stroke-dasharray="3 2"/>
<rect x="242" y="198" width="80" height="22" fill="#ffffff" stroke="#9d0208" stroke-width="1" stroke-dasharray="3 2"/>
<rect x="242" y="220" width="80" height="14" fill="#fca5a5" stroke="#713f12" stroke-width="1"/>
<text x="282" y="250" text-anchor="middle" font-weight="bold">Stage 3: into fat,</text>
<text x="282" y="261" text-anchor="middle" font-weight="bold">no muscle seen</text>
<rect x="338" y="178" width="102" height="90" fill="#fff7ed" stroke="#7c2d12" stroke-width="1"/>
<rect x="348" y="188" width="82" height="46" fill="#7f1d1d" stroke="#111827" stroke-width="1"/>
<text x="389" y="214" text-anchor="middle" fill="#ffffff" font-size="8">muscle / bone</text>
<text x="389" y="250" text-anchor="middle" font-weight="bold">Stage 4: muscle,</text>
<text x="389" y="261" text-anchor="middle" font-weight="bold">tendon or bone</text>
</g>
<text x="20" y="288" font-size="9" fill="#374151">+ Unstageable (slough/eschar hides depth) and suspected deep-tissue injury (purple/maroon intact skin) — both need senior review.</text>
<rect x="0" y="300" width="460" height="180" fill="#f1f5f9"/>
<text x="20" y="322" font-size="10" fill="#111827">Two rules cover both panels. One: never stage an ulcer you haven't measured — length ×</text>
<text x="20" y="336" font-size="10" fill="#111827">width × depth, edges, bed, exudate, odour, surrounding skin, pain — with the same ruler</text>
<text x="20" y="350" font-size="10" fill="#111827">and the same words every time, so change is visible. Two: never watch and wait on</text>
<text x="20" y="364" font-size="10" fill="#111827">pressure or pigment — offload and escalate the pressure injury the shift you find it,</text>
<text x="20" y="378" font-size="10" fill="#111827">and refer any ABCDE mole rather than reassuring. On dark skin, Stage 1 shows purple,</text>
<text x="20" y="392" font-size="10" fill="#111827">blue or ashen — not red — and melanomas hide on palms, soles and under nails:</text>
<text x="20" y="406" font-size="10" fill="#111827">acral sites are where dark-skinned patients most often grow them. Look there.</text>
<text x="20" y="428" font-size="10" fill="#111827">Document, photograph per policy, offload, refer — in that order, every time.</text>
</svg>