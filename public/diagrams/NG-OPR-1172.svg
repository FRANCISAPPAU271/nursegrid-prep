<svg viewBox="0 0 640 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="450" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">GYNAECOLOGICAL PROBLEMS — SORT BY THE MAIN COMPLAINT</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">Bleeding, pain, a lump, or a discharge. Each points to a different short list.</text>

<rect x="24" y="60" width="285" height="100" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.7"/>
<text x="166" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8b2f2f">HEAVY OR IRREGULAR BLEEDING</text>
<g font-size="9.5" fill="#222">
<text x="36" y="100">Fibroids, polyps, hormonal imbalance</text>
<text x="36" y="116">Always check haemoglobin — chronic</text>
<text x="36" y="132">loss causes severe anaemia quietly</text>
<text x="36" y="152" font-weight="bold">Bleeding after menopause is cancer</text>
</g>

<rect x="331" y="60" width="285" height="100" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.7"/>
<text x="473" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">PELVIC PAIN</text>
<g font-size="9.5" fill="#222">
<text x="345" y="100">Sudden and severe: ovarian torsion,</text>
<text x="345" y="116">ruptured cyst, ectopic pregnancy</text>
<text x="345" y="132">Cyclical and long-standing:</text>
<text x="345" y="152">endometriosis, chronic infection</text>
</g>

<text x="36" y="166" font-size="9.5" font-weight="bold" fill="#8b2f2f">until proved otherwise.</text>

<rect x="24" y="176" width="285" height="100" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.7"/>
<text x="166" y="196" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a5c3a">A LUMP OR SOMETHING COMING DOWN</text>
<g font-size="9.5" fill="#222">
<text x="36" y="216">Prolapse — worse on standing and</text>
<text x="36" y="232">straining, better lying down</text>
<text x="36" y="248">Fibroid — firm, in the abdomen</text>
<text x="36" y="264">Bartholin cyst — beside the opening</text>
</g>

<rect x="331" y="176" width="285" height="100" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.7"/>
<text x="473" y="196" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1e">THE QUESTION ASKED FIRST, ALWAYS</text>
<g font-size="9.5" fill="#222">
<text x="345" y="216">Could she be pregnant?</text>
<text x="345" y="234">An ectopic pregnancy imitates every</text>
<text x="345" y="250">condition on this page, and it is the</text>
<text x="345" y="266">only one that kills within the hour.</text>
</g>

<rect x="24" y="292" width="592" height="72" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.8"/>
<text x="320" y="312" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6b3a6b">CERVICAL CANCER IS THE PREVENTABLE ONE</text>
<g font-size="10.5" fill="#222">
<text x="38" y="334">Caused by persistent human papillomavirus infection. Vaccination protects before exposure, and screening</text>
<text x="38" y="352">finds the changes years before cancer. Ghana vaccinates girls at nine years and screens with visual inspection.</text>
</g>

<rect x="24" y="376" width="592" height="52" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.7"/>
<text x="320" y="396" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">EXAMINATION IS AN INTIMATE PROCEDURE</text>
<g font-size="10.5" fill="#222">
<text x="38" y="418">Private room, closed door, chaperone offered and recorded, explanation before exposure, and the right to</text>
</g>
<text x="38" y="426" font-size="10.5" fill="#222"> </text>
<text x="320" y="444" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8b2f2f">stop at any moment. Women who feel exposed or judged do not return for the screening that saves them.</text>
</svg>