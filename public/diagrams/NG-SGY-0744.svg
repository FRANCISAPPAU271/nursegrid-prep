<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="400" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">AFTER THYROIDECTOMY — SORT THE RISKS BY THE CLOCK</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">Each complication has its own hour. Knowing when tells you what to look for now.</text>

<line x1="60" y1="86" x2="600" y2="86" stroke="#1a3a5c" stroke-width="2"/>
<circle cx="120" cy="86" r="5" fill="#8b2f2f"/><circle cx="270" cy="86" r="5" fill="#8b2f2f"/>
<circle cx="420" cy="86" r="5" fill="#8a6d1e"/><circle cx="555" cy="86" r="5" fill="#1a5c3a"/>
<text x="120" y="76" text-anchor="middle" font-size="10" fill="#333">immediate</text>
<text x="270" y="76" text-anchor="middle" font-size="10" fill="#333">first 24 hours</text>
<text x="420" y="76" text-anchor="middle" font-size="10" fill="#333">24 to 72 hours</text>
<text x="555" y="76" text-anchor="middle" font-size="10" fill="#333">later</text>

<rect x="48" y="102" width="176" height="126" fill="#f7ecec" stroke="#c08a8a" stroke-width="1.5"/>
<text x="136" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b2f2f">HAEMORRHAGE</text>
<g font-size="10" fill="#222">
<text x="58" y="142">Neck swelling, tight dressing</text>
<text x="58" y="158">Patient cannot swallow</text>
<text x="58" y="174">Stridor, then airway loss</text>
<text x="58" y="196" fill="#8b2f2f" font-weight="bold">Clip and suture remover</text>
<text x="58" y="210" fill="#8b2f2f" font-weight="bold">must be at the bedside</text>
</g>

<rect x="234" y="102" width="176" height="126" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.5"/>
<text x="322" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1e">NERVE INJURY</text>
<g font-size="10" fill="#222">
<text x="244" y="142">Recurrent laryngeal nerve</text>
<text x="244" y="158">Hoarse or weak voice</text>
<text x="244" y="174">Both sides: airway obstruction</text>
<text x="244" y="196">Ask the patient to speak</text>
<text x="244" y="210">on every set of observations</text>
</g>

<rect x="420" y="102" width="176" height="126" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.5"/>
<text x="508" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">HYPOCALCAEMIA</text>
<g font-size="10" fill="#222">
<text x="430" y="142">Parathyroids bruised or removed</text>
<text x="430" y="158">Tingling round mouth and fingers</text>
<text x="430" y="174">Carpopedal spasm, twitching</text>
<text x="430" y="196">Peaks on the second or third day,</text>
<text x="430" y="210">not on the day of surgery</text>
</g>

<rect x="48" y="248" width="548" height="72" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.5"/>
<text x="322" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b3a6b">THYROID STORM — uncommon, and rapidly fatal if missed</text>
<g font-size="10.5" fill="#222">
<text x="60" y="292">Fever above 38.5 degrees Celsius, racing pulse, atrial fibrillation, agitation then confusion,</text>
<text x="60" y="310">vomiting and diarrhoea. Most likely where the patient came to theatre still thyrotoxic.</text>
</g>

<text x="320" y="348" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">POSITION: sit the patient upright once awake, and support the head when they move.</text>
<text x="320" y="372" text-anchor="middle" font-size="10.5" fill="#333">Feel behind the neck as well as looking at the dressing — blood tracks backwards onto the pillow.</text>
<text x="320" y="392" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8b2f2f">A patient who says the dressing feels tight is describing a haematoma until proved otherwise.</text>
</svg>