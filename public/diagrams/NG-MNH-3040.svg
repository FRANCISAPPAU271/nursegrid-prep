<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 300" role="img">
<rect width="470" height="300" fill="#ffffff"/>
<text x="235" y="24" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Shoulder dystocia: the order that saves the baby</text>
<text x="235" y="42" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">Head delivers, then retracts against the perineum &#8212; the turtle sign</text>
<rect x="25" y="54" width="200" height="30" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="125" y="74" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">1. Call for help. Stop pushing.</text>
<rect x="25" y="88" width="200" height="46" fill="#dcfce7" stroke="#15803d"/>
<text x="125" y="106" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">2. McRoberts: hyperflex hips,</text>
<text x="125" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">knees to chest</text>
<rect x="25" y="138" width="200" height="46" fill="#dcfce7" stroke="#15803d"/>
<text x="125" y="156" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">3. SUPRApubic pressure</text>
<text x="125" y="172" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">behind the anterior shoulder</text>
<rect x="25" y="188" width="200" height="46" fill="#fef3c7" stroke="#b45309"/>
<text x="125" y="206" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78350f">4. Internal rotation, or</text>
<text x="125" y="222" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78350f">deliver the posterior arm</text>
<text x="125" y="252" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">McRoberts + suprapubic pressure</text>
<text x="125" y="266" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">resolve most cases on their own</text>
<rect x="240" y="54" width="205" height="180" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="342" y="76" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7f1d1d">NEVER</text>
<text x="342" y="102" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7f1d1d">FUNDAL pressure</text>
<text x="342" y="118" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f1d1d">drives the shoulder harder into</text>
<text x="342" y="132" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f1d1d">the symphysis; ruptures the uterus</text>
<text x="342" y="158" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7f1d1d">Downward traction on the head</text>
<text x="342" y="174" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f1d1d">tears the brachial plexus &#8212; Erb palsy</text>
<text x="342" y="200" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f1d1d">Use axial traction only, in line</text>
<text x="342" y="214" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f1d1d">with the baby&#8217;s spine</text>
<rect x="25" y="270" width="420" height="24" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="235" y="286" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">SUPRApubic frees the shoulder. FUNDAL impacts it further. One letter, two outcomes.</text>
</svg>