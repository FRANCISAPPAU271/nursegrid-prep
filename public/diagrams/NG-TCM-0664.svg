<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="420" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">WHO REGULATES WHAT IN GHANAIAN TRADITIONAL MEDICINE</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">Two different bodies. One licenses the PERSON and the PREMISES; the other registers the PRODUCT.</text>

<rect x="20" y="60" width="290" height="176" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.5"/>
<text x="165" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">TRADITIONAL MEDICINE</text>
<text x="165" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">PRACTICE COUNCIL</text>
<text x="165" y="118" text-anchor="middle" font-size="10" font-style="italic" fill="#1a3a5c">created by Act 575 of 2000</text>
<g font-size="10.5" fill="#222">
<text x="32" y="140">Registers the PRACTITIONER</text>
<text x="32" y="158">Licenses the PREMISES</text>
<text x="32" y="176">Sets standards and a code of ethics</text>
<text x="32" y="194">Inspects each practice at least yearly</text>
<text x="32" y="212">May suspend, cancel or close a practice</text>
<text x="32" y="230">Certificate expires every 31 December</text>
</g>

<rect x="330" y="60" width="290" height="176" fill="#eaf3ea" stroke="#8fb98f" stroke-width="1.5"/>
<text x="475" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a5c3a">FOOD AND DRUGS</text>
<text x="475" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a5c3a">AUTHORITY</text>
<text x="475" y="118" text-anchor="middle" font-size="10" font-style="italic" fill="#1a5c3a">the product regulator</text>
<g font-size="10.5" fill="#222">
<text x="342" y="140">Registers the herbal PRODUCT itself</text>
<text x="342" y="158">Requires safety and quality data</text>
<text x="342" y="176">Controls labelling and advertising</text>
<text x="342" y="194">Tests for microbial and heavy metal</text>
<text x="342" y="212">contamination</text>
<text x="342" y="230">An FDA number is on the product, not the person</text>
</g>

<rect x="20" y="250" width="600" height="26" fill="#8b2f2f"/>
<text x="320" y="269" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#fff">A REGISTERED PRACTITIONER MAY STILL SELL AN UNREGISTERED PRODUCT — CHECK BOTH</text>

<rect x="20" y="288" width="290" height="118" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.5"/>
<text x="165" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1e">THE SUPPORTING INSTITUTIONS</text>
<g font-size="10.5" fill="#222">
<text x="32" y="328">Traditional and Alternative Medicine</text>
<text x="32" y="344">Directorate — policy, within the MoH</text>
<text x="32" y="364">Centre for Plant Medicine Research,</text>
<text x="32" y="380">Mampong-Akuapem — research and</text>
<text x="32" y="396">production of certified preparations</text>
</g>

<rect x="330" y="288" width="290" height="118" fill="#f7ecec" stroke="#c08a8a" stroke-width="1.5"/>
<text x="475" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b2f2f">WHAT THE LAW DEMANDS OF A PRACTICE</text>
<g font-size="10.5" fill="#222">
<text x="342" y="328">Keep records of the people treated</text>
<text x="342" y="346">Notify a coroner within 24 hours of any</text>
<text x="342" y="362">death occurring on the premises</text>
<text x="342" y="382">Practising or owning premises without</text>
<text x="342" y="398">registration is an offence</text>
</g>
</svg>