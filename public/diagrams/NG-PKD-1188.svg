<svg viewBox="0 0 640 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="450" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">THE JOURNEY OF A DRUG — FOUR STAGES</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">Absorption, distribution, metabolism, excretion. Damage any stage and the dose must change.</text>

<rect x="20" y="60" width="146" height="80" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.7"/>
<text x="93" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">ABSORPTION</text>
<text x="93" y="99" text-anchor="middle" font-size="9" fill="#222">Getting into the blood</text>
<text x="93" y="114" text-anchor="middle" font-size="9" fill="#222">Food, vomiting and</text>
<text x="93" y="128" text-anchor="middle" font-size="9" fill="#222">antacids all interfere</text>

<rect x="178" y="60" width="146" height="80" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.7"/>
<text x="251" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a5c3a">DISTRIBUTION</text>
<text x="251" y="99" text-anchor="middle" font-size="9" fill="#222">Travelling to the tissue</text>
<text x="251" y="114" text-anchor="middle" font-size="9" fill="#222">Only the UNBOUND drug</text>
<text x="251" y="128" text-anchor="middle" font-size="9" fill="#222">can act. Albumin matters.</text>

<rect x="336" y="60" width="146" height="80" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.7"/>
<text x="409" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1e">METABOLISM</text>
<text x="409" y="99" text-anchor="middle" font-size="9" fill="#222">Mostly the LIVER</text>
<text x="409" y="114" text-anchor="middle" font-size="9" fill="#222">Turns the drug into</text>
<text x="409" y="128" text-anchor="middle" font-size="9" fill="#222">something excretable</text>

<rect x="494" y="60" width="126" height="80" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.7"/>
<text x="557" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8b2f2f">EXCRETION</text>
<text x="557" y="99" text-anchor="middle" font-size="9" fill="#222">Mostly the KIDNEY</text>
<text x="557" y="114" text-anchor="middle" font-size="9" fill="#222">Poor kidneys mean</text>
<text x="557" y="128" text-anchor="middle" font-size="9" fill="#222">the drug accumulates</text>

<rect x="20" y="156" width="600" height="72" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.8"/>
<text x="320" y="176" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6b3a6b">FIRST PASS — WHY THE ORAL DOSE IS BIGGER THAN THE INJECTED ONE</text>
<g font-size="10.5" fill="#222">
<text x="34" y="198">A swallowed drug goes from gut to liver BEFORE it reaches the rest of the body, and the liver destroys part</text>
<text x="34" y="218">of it on the way through. Given by vein, under the tongue or rectally, it bypasses that first pass entirely.</text>
</g>

<rect x="20" y="244" width="292" height="94" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.6"/>
<text x="166" y="264" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">HALF-LIFE DECIDES THE TIMETABLE</text>
<g font-size="9.5" fill="#222">
<text x="34" y="286">The time for the level to fall by half.</text>
<text x="34" y="302">It takes about five half-lives to reach</text>
<text x="34" y="318">a steady level, and five more to clear</text>
<text x="34" y="332">after stopping.</text>
</g>

<rect x="328" y="244" width="292" height="94" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.6"/>
<text x="474" y="264" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a5c3a">WHY A LOADING DOSE EXISTS</text>
<g font-size="9.5" fill="#222">
<text x="342" y="286">Waiting five half-lives is too slow when</text>
<text x="342" y="302">the patient is ill now. A larger first dose</text>
<text x="342" y="318">fills the tank immediately; the smaller</text>
<text x="342" y="332">maintenance dose then keeps it there.</text>
</g>

<rect x="20" y="354" width="600" height="66" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.8"/>
<text x="320" y="374" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8b2f2f">THE TWO ORGANS TO ASK ABOUT BEFORE ANY DOSE</text>
<g font-size="10.5" fill="#222">
<text x="34" y="396">Liver and kidney. If either is failing, the usual dose becomes an overdose, because the drug is not being</text>
<text x="34" y="412">removed at the usual speed. The very young and the very old have less of both to spare.</text>
</g>

<text x="320" y="440" text-anchor="middle" font-size="10.5" font-style="italic" fill="#1a3a5c">Pharmacokinetics is what the body does to the drug. Pharmacodynamics is what the drug does to the body.</text>
</svg>