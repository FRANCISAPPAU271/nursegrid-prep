<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="400" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">HYPERTENSION — WHY IT IS CALLED THE SILENT KILLER</text>
<text x="320" y="45" text-anchor="middle" font-size="12" fill="#555">No symptoms while the damage accumulates. The organs tell the story.</text>

<ellipse cx="320" cy="128" rx="86" ry="34" fill="#f7d9d9" stroke="#8b2f2f" stroke-width="2"/>
<text x="320" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#8b2f2f">RAISED PRESSURE</text>
<text x="320" y="140" text-anchor="middle" font-size="10" fill="#8b2f2f">felt by the patient as nothing</text>

<line x1="250" y1="150" x2="120" y2="200" stroke="#8b2f2f" stroke-width="1.5"/>
<line x1="300" y1="162" x2="250" y2="200" stroke="#8b2f2f" stroke-width="1.5"/>
<line x1="340" y1="162" x2="390" y2="200" stroke="#8b2f2f" stroke-width="1.5"/>
<line x1="390" y1="150" x2="520" y2="200" stroke="#8b2f2f" stroke-width="1.5"/>

<rect x="24" y="202" width="140" height="104" fill="#fff" stroke="#d8d2c4"/>
<text x="94" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">BRAIN</text>
<text x="34" y="242" font-size="10" fill="#333">Stroke</text>
<text x="34" y="258" font-size="10" fill="#333">Hypertensive</text>
<text x="34" y="272" font-size="10" fill="#333">encephalopathy</text>
<text x="34" y="292" font-size="10" font-style="italic" fill="#8b2f2f">sudden weakness,</text>
<text x="34" y="303" font-size="10" font-style="italic" fill="#8b2f2f">slurred speech</text>

<rect x="172" y="202" width="140" height="104" fill="#f6f3ec" stroke="#d8d2c4"/>
<text x="242" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">EYES</text>
<text x="182" y="242" font-size="10" fill="#333">Retinopathy</text>
<text x="182" y="258" font-size="10" fill="#333">Haemorrhages</text>
<text x="182" y="272" font-size="10" fill="#333">Papilloedema</text>
<text x="182" y="292" font-size="10" font-style="italic" fill="#8b2f2f">blurred vision —</text>
<text x="182" y="303" font-size="10" font-style="italic" fill="#8b2f2f">a late sign</text>

<rect x="320" y="202" width="140" height="104" fill="#fff" stroke="#d8d2c4"/>
<text x="390" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">HEART</text>
<text x="330" y="242" font-size="10" fill="#333">Left ventricular</text>
<text x="330" y="256" font-size="10" fill="#333">hypertrophy</text>
<text x="330" y="272" font-size="10" fill="#333">Failure, angina</text>
<text x="330" y="292" font-size="10" font-style="italic" fill="#8b2f2f">breathless on</text>
<text x="330" y="303" font-size="10" font-style="italic" fill="#8b2f2f">exertion, swelling</text>

<rect x="468" y="202" width="148" height="104" fill="#f6f3ec" stroke="#d8d2c4"/>
<text x="542" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">KIDNEY</text>
<text x="478" y="242" font-size="10" fill="#333">Chronic kidney</text>
<text x="478" y="256" font-size="10" fill="#333">disease, failure</text>
<text x="478" y="272" font-size="10" fill="#333">Protein in urine</text>
<text x="478" y="292" font-size="10" font-style="italic" fill="#8b2f2f">detected on testing,</text>
<text x="478" y="303" font-size="10" font-style="italic" fill="#8b2f2f">not by the patient</text>

<rect x="24" y="316" width="592" height="30" fill="#eaf3ea" stroke="#8fb98f"/>
<text x="320" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5c3a">MEASURING IT PROPERLY — errors that create false diagnoses</text>

<rect x="24" y="348" width="592" height="46" fill="#fff" stroke="#d8d2c4"/>
<text x="34" y="366" font-size="10" fill="#333">Rested 5 minutes · seated, back supported, legs uncrossed · arm at heart level · correct cuff size — a cuff too small</text>
<text x="34" y="384" font-size="10" fill="#333">reads FALSELY HIGH · no talking · two readings, and confirm on a separate occasion before diagnosing.</text>
</svg>