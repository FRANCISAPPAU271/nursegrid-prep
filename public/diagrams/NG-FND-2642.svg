<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" role="img">
<style>
.t{font:700 19px Georgia,serif;fill:#0f5a52}.h{font:700 14px Georgia,serif;fill:#123}
.b{font:13px Georgia,serif;fill:#26333d}.s{font:12px Georgia,serif;fill:#5a6b78}
.k{font:700 13px Georgia,serif;fill:#8c2f1d}.i{font:italic 12px Georgia,serif;fill:#5a6b78}
.box{fill:#fff;stroke:#c3d2dd;stroke-width:1.4;rx:8}
.warn{fill:#fdf0ec;stroke:#c9714f;stroke-width:1.6;rx:8}
.ok{fill:#eef7f1;stroke:#7ba98c;stroke-width:1.4;rx:8}
.stp{fill:#eef4f8;stroke:#8fa9bd;stroke-width:1.4;rx:6}
.row{fill:#f2f7fa}
</style>
<rect width="880" height="640" fill="#f7fafb"/>
<text class="t" x="24" y="32">Basic life support — the adult sequence</text>

<rect class="stp" x="24" y="48" width="160" height="62"/><text class="b" x="40" y="74">1  DANGER</text><text class="s" x="40" y="94">is it safe for you?</text>
<rect class="stp" x="200" y="48" width="160" height="62"/><text class="b" x="216" y="74">2  RESPONSE</text><text class="s" x="216" y="94">shout and shake</text>
<rect class="stp" x="376" y="48" width="160" height="62"/><text class="b" x="392" y="74">3  SHOUT for help</text><text class="s" x="392" y="94">call the team</text>
<rect class="stp" x="552" y="48" width="160" height="62"/><text class="b" x="568" y="74">4  AIRWAY</text><text class="s" x="568" y="94">head tilt, chin lift</text>
<rect class="stp" x="728" y="48" width="128" height="62"/><text class="b" x="744" y="74">5  BREATHING</text><text class="s" x="744" y="94">look, listen, feel</text>

<rect class="warn" x="24" y="124" width="832" height="72"/>
<text class="k" x="42" y="150">Check breathing for NO MORE THAN 10 SECONDS.</text>
<text class="b" x="42" y="176">Occasional gasping — agonal breathing — is NOT normal breathing. Treat it as cardiac arrest and start compressions.</text>

<rect class="box" x="24" y="212" width="410" height="212"/>
<text class="h" x="42" y="236">Chest compressions — adult</text>
<rect class="row" x="34" y="248" width="390" height="28"/>
<text class="b" x="48" y="268">Position</text><text class="b" x="230" y="268">centre of the chest, lower half of sternum</text>
<text class="b" x="48" y="298">Depth</text><text class="k" x="230" y="298">5 to 6 cm</text>
<rect class="row" x="34" y="308" width="390" height="28"/>
<text class="b" x="48" y="328">Rate</text><text class="k" x="230" y="328">100 to 120 per minute</text>
<text class="b" x="48" y="358">Ratio</text><text class="k" x="230" y="358">30 compressions : 2 breaths</text>
<rect class="row" x="34" y="368" width="390" height="28"/>
<text class="b" x="48" y="388">Recoil</text><text class="b" x="230" y="388">allow FULL recoil between each</text>
<text class="i" x="48" y="416">Change the compressor every 2 minutes — quality falls fast.</text>

<rect class="box" x="450" y="212" width="406" height="212"/>
<text class="h" x="468" y="236">Children and infants — what changes</text>
<text class="b" x="468" y="264">Give 5 RESCUE BREATHS first, before compressions.</text>
<text class="s" x="468" y="284">Cardiac arrest in children is usually respiratory in origin.</text>
<text class="k" x="468" y="312">Ratio 15 : 2 when two rescuers are present</text>
<text class="b" x="468" y="340">Depth: at least one THIRD of chest depth</text>
<text class="s" x="468" y="360">Child — one or two hands. Infant — two fingers,</text>
<text class="s" x="468" y="378">or two thumbs encircling with two rescuers.</text>
<text class="i" x="468" y="406">Adults arrest from the heart; children from hypoxia.</text>

<rect class="warn" x="24" y="440" width="410" height="184"/>
<text class="k" x="468" y="0"> </text>
<text class="k" x="42" y="464">Choking — conscious adult</text>
<text class="b" x="42" y="492">Coughing effectively? Encourage the cough.</text>
<text class="b" x="42" y="514">Do nothing else. The cough is stronger than you.</text>
<text class="k" x="42" y="544">Cough ineffective, cannot speak or breathe:</text>
<text class="b" x="42" y="570">5 BACK BLOWS between the shoulder blades,</text>
<text class="b" x="42" y="592">then 5 ABDOMINAL THRUSTS. Alternate.</text>
<text class="i" x="42" y="614">If they go unconscious — lower them, start CPR.</text>

<rect class="ok" x="450" y="440" width="406" height="184"/>
<text class="h" x="468" y="464">Choking — INFANT under 1 year</text>
<text class="k" x="468" y="492">NEVER give abdominal thrusts to an infant.</text>
<text class="s" x="468" y="512">The liver is large and unprotected and will rupture.</text>
<text class="b" x="468" y="540">5 BACK BLOWS, head down along your forearm</text>
<text class="b" x="468" y="562">then 5 CHEST THRUSTS with two fingers</text>
<text class="s" x="468" y="586">Same landmark as compressions, but sharper</text>
<text class="s" x="468" y="604">and slower. Alternate the two sets.</text>
</svg>