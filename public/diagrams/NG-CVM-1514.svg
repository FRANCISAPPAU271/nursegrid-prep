<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="100%" role="img">
<rect x="0" y="0" width="760" height="460" fill="#fdfcfa"/>
<text x="20" y="30" font-family="Georgia,serif" font-size="19" font-weight="bold" fill="#7a2020">When the marrow fails, three symptoms arrive together</text>
<text x="20" y="52" font-family="Georgia,serif" font-size="13" fill="#555">The bone marrow makes three things. Crowd it out with abnormal cells and all three run short at once.</text>

<rect x="20" y="68" width="232" height="164" rx="6" fill="#fff3f0" stroke="#c0392b"/>
<circle cx="60" cy="102" r="14" fill="#c0392b" opacity="0.7"/>
<text x="86" y="107" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#7a2020">Red cells fall</text>
<text x="34" y="132" font-family="Georgia,serif" font-size="12" fill="#333">Tiredness on exertion,</text>
<text x="34" y="150" font-family="Georgia,serif" font-size="12" fill="#333">breathlessness, pallor of</text>
<text x="34" y="168" font-family="Georgia,serif" font-size="12" fill="#333">the conjunctiva and palms.</text>
<text x="34" y="196" font-family="Georgia,serif" font-size="12" font-style="italic" fill="#7a2020">Anaemia</text>

<rect x="264" y="68" width="232" height="164" rx="6" fill="#f2f7f2" stroke="#2e7d5b"/>
<circle cx="304" cy="102" r="14" fill="#2e7d5b" opacity="0.55"/>
<text x="330" y="107" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#1d5c42">White cells fail</text>
<text x="278" y="132" font-family="Georgia,serif" font-size="12" fill="#333">Repeated infections, mouth</text>
<text x="278" y="150" font-family="Georgia,serif" font-size="12" fill="#333">ulcers, fever with no pus</text>
<text x="278" y="168" font-family="Georgia,serif" font-size="12" fill="#333">and no obvious focus.</text>
<text x="278" y="196" font-family="Georgia,serif" font-size="12" font-style="italic" fill="#1d5c42">Infection risk</text>

<rect x="508" y="68" width="232" height="164" rx="6" fill="#f4f4fb" stroke="#4a4a8a"/>
<circle cx="548" cy="102" r="14" fill="#4a4a8a" opacity="0.55"/>
<text x="574" y="107" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#33336b">Platelets fall</text>
<text x="522" y="132" font-family="Georgia,serif" font-size="12" fill="#333">Bruising without injury,</text>
<text x="522" y="150" font-family="Georgia,serif" font-size="12" fill="#333">bleeding gums, nosebleeds,</text>
<text x="522" y="168" font-family="Georgia,serif" font-size="12" fill="#333">heavy periods, pinpoint spots.</text>
<text x="522" y="196" font-family="Georgia,serif" font-size="12" font-style="italic" fill="#33336b">Bleeding risk</text>

<rect x="20" y="248" width="720" height="92" rx="6" fill="#fff8e8" stroke="#b8860b"/>
<text x="34" y="270" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#8a6508">Why a fever here is an emergency and a fever elsewhere is not</text>
<text x="34" y="292" font-family="Georgia,serif" font-size="12" fill="#333">Pus, redness and swelling are made by white cells. A patient with almost no white cells cannot produce those</text>
<text x="34" y="310" font-family="Georgia,serif" font-size="12" fill="#333">signs, so infection arrives with nothing but a temperature — and progresses to septic shock in hours.</text>
<text x="34" y="332" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#8a6508">A single fever in a patient with a low white count means antibiotics now, not observation overnight.</text>

<rect x="20" y="356" width="720" height="88" rx="6" fill="#eef4f8" stroke="#2b6b8a"/>
<text x="34" y="378" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#1d4e63">Nursing a patient with a low platelet count</text>
<text x="34" y="400" font-family="Georgia,serif" font-size="12" fill="#333">Soft toothbrush, no intramuscular injections, no rectal thermometers or suppositories, pressure on every</text>
<text x="34" y="418" font-family="Georgia,serif" font-size="12" fill="#333">puncture site for several minutes, no anti-inflammatory painkillers, and careful handling during transfers.</text>
<text x="34" y="438" font-family="Georgia,serif" font-size="12" font-style="italic" fill="#1d4e63">Every routine act you perform on this patient can start a bleed that will not stop by itself.</text>
</svg>