<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" role="img">
<rect width="460" height="380" fill="#ffffff"/>
<text x="230" y="26" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">ST segments: ischaemia to infarction</text><text x="85" y="80" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#1e293b">Normal</text><line x1="30" y1="132" x2="140" y2="132" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/><path d="M51 132 L55 140 L63 102 L69 138 L73 132 L73 132 L93 132 L93 132 L111 114 L129 132" fill="none" stroke="#1e293b" stroke-width="2"/><text x="228" y="80" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Hyperacute T</text><line x1="173" y1="132" x2="283" y2="132" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/><path d="M194 132 L198 140 L206 102 L212 138 L216 132 L216 132 L232 132 L232 132 L250 88 L268 132" fill="none" stroke="#1d4ed8" stroke-width="2"/><text x="371" y="80" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#b91c1c">ST elevation (injury)</text><line x1="316" y1="132" x2="426" y2="132" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/><path d="M337 132 L341 140 L349 102 L355 138 L359 132 L359 132 L369 106 L389 102 L405 124" fill="none" stroke="#b91c1c" stroke-width="2"/><text x="85" y="210" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#b91c1c">Q wave (necrosis)</text><line x1="30" y1="262" x2="140" y2="262" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/><path d="M41 262 L49 282 L57 236 L65 266 L73 262 L73 262 L83 244 L103 242 L119 262 L125 262" fill="none" stroke="#b91c1c" stroke-width="2"/><text x="228" y="210" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#1d4ed8">T inversion (evolving)</text><line x1="173" y1="262" x2="283" y2="262" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/><path d="M194 262 L198 270 L206 232 L212 268 L216 262 L216 262 L236 262 L236 262 L254 286 L272 262" fill="none" stroke="#1d4ed8" stroke-width="2"/><text x="371" y="210" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#1d4ed8">ST depression</text><line x1="316" y1="262" x2="426" y2="262" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/><path d="M337 262 L341 270 L349 232 L355 268 L359 262 L359 262 L375 272 L393 270 L401 262 L401 262 L419 246 L437 262" fill="none" stroke="#1d4ed8" stroke-width="2"/><rect x="30" y="300" width="400" height="65" fill="#f1f5f9" stroke="#94a3b8"/><text x="230" y="318" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0f172a">Elevation in contiguous leads plus pain = STEMI:</text><text x="230" y="333" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#475569">12-lead in 10 min, reperfusion now.</text><text x="230" y="348" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#475569">Depression or inversion: serial ECGs plus troponin.</text>
</svg>
