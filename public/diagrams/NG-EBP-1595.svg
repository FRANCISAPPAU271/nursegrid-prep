<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%" role="img">
<rect x="0" y="0" width="760" height="470" fill="#fdfcfa"/>
<text x="20" y="30" font-family="Georgia,serif" font-size="19" font-weight="bold" fill="#1d5c42">From a vague worry to a searchable question</text>
<text x="20" y="52" font-family="Georgia,serif" font-size="13" fill="#555">A question you cannot search is a question you cannot answer. Break it into four parts.</text>

<rect x="20" y="68" width="720" height="52" rx="6" fill="#fff3f0" stroke="#c0392b"/>
<text x="34" y="90" font-family="Georgia,serif" font-size="13" font-style="italic" fill="#7a2020">The worry as it first arrives:</text>
<text x="34" y="110" font-family="Georgia,serif" font-size="13" fill="#333">"I think our patients get too many pressure sores."</text>

<rect x="20" y="134" width="172" height="112" rx="6" fill="#eef4f8" stroke="#2b6b8a"/>
<text x="34" y="156" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#1d4e63">Population</text>
<text x="34" y="178" font-family="Georgia,serif" font-size="12" fill="#333">Who exactly?</text>
<text x="34" y="200" font-family="Georgia,serif" font-size="12" fill="#333">Adults immobile for</text>
<text x="34" y="218" font-family="Georgia,serif" font-size="12" fill="#333">more than 48 hours on</text>
<text x="34" y="236" font-family="Georgia,serif" font-size="12" fill="#333">a medical ward</text>

<rect x="204" y="134" width="172" height="112" rx="6" fill="#fff8e8" stroke="#b8860b"/>
<text x="218" y="156" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#8a6508">Intervention</text>
<text x="218" y="178" font-family="Georgia,serif" font-size="12" fill="#333">What would you do?</text>
<text x="218" y="200" font-family="Georgia,serif" font-size="12" fill="#333">Two-hourly repositioning</text>
<text x="218" y="218" font-family="Georgia,serif" font-size="12" fill="#333">on a written schedule</text>

<rect x="388" y="134" width="172" height="112" rx="6" fill="#f2f7f2" stroke="#2e7d5b"/>
<text x="402" y="156" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#1d5c42">Comparison</text>
<text x="402" y="178" font-family="Georgia,serif" font-size="12" fill="#333">Compared with what?</text>
<text x="402" y="200" font-family="Georgia,serif" font-size="12" fill="#333">Repositioning when</text>
<text x="402" y="218" font-family="Georgia,serif" font-size="12" fill="#333">staff judge it necessary</text>

<rect x="572" y="134" width="168" height="112" rx="6" fill="#f4f4fb" stroke="#4a4a8a"/>
<text x="586" y="156" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#33336b">Outcome</text>
<text x="586" y="178" font-family="Georgia,serif" font-size="12" fill="#333">Measured how?</text>
<text x="586" y="200" font-family="Georgia,serif" font-size="12" fill="#333">New pressure ulcers of</text>
<text x="586" y="218" font-family="Georgia,serif" font-size="12" fill="#333">grade 2 or worse, in</text>
<text x="586" y="236" font-family="Georgia,serif" font-size="12" fill="#333">14 days</text>

<rect x="20" y="262" width="720" height="66" rx="6" fill="#f2f7f2" stroke="#2e7d5b"/>
<text x="34" y="284" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#1d5c42">The question you can now search and answer:</text>
<text x="34" y="306" font-family="Georgia,serif" font-size="12.5" fill="#333">In adults immobile beyond 48 hours, does scheduled two-hourly repositioning, compared with repositioning at</text>
<text x="34" y="322" font-family="Georgia,serif" font-size="12.5" fill="#333">staff discretion, reduce new grade 2 pressure ulcers within 14 days?</text>

<rect x="20" y="342" width="352" height="118" rx="6" fill="#fff8e8" stroke="#b8860b"/>
<text x="34" y="364" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#8a6508">The four parts also write the study</text>
<text x="34" y="386" font-family="Georgia,serif" font-size="12" fill="#333">P becomes your inclusion criteria.</text>
<text x="34" y="404" font-family="Georgia,serif" font-size="12" fill="#333">I and C become your two groups.</text>
<text x="34" y="422" font-family="Georgia,serif" font-size="12" fill="#333">O becomes the thing you measure, and</text>
<text x="34" y="440" font-family="Georgia,serif" font-size="12" fill="#333">therefore your sample size calculation.</text>

<rect x="388" y="342" width="352" height="118" rx="6" fill="#f4f4fb" stroke="#4a4a8a"/>
<text x="402" y="364" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#33336b">If the question is not about an intervention</text>
<text x="402" y="386" font-family="Georgia,serif" font-size="12" fill="#333">Qualitative work asks about experience and</text>
<text x="402" y="404" font-family="Georgia,serif" font-size="12" fill="#333">meaning, so there is no comparison group and</text>
<text x="402" y="422" font-family="Georgia,serif" font-size="12" fill="#333">no measured outcome. Use population,</text>
<text x="402" y="440" font-family="Georgia,serif" font-size="12" fill="#333">phenomenon of interest, and context instead.</text>
</svg>