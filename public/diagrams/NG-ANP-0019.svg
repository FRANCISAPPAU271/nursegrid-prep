<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 480" font-family="sans-serif">
<rect x="0" y="0" width="460" height="480" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#111827">Shock: four types + the early-to-late ladder</text>
<g font-size="9" fill="#111827">
<rect x="20" y="40" width="100" height="96" rx="8" fill="#fef2f2" stroke="#7f1d1d" stroke-width="1.5"/>
<text x="70" y="58" text-anchor="middle" font-weight="bold" font-size="10">Hypovolaemic</text>
<text x="70" y="72" text-anchor="middle">TANK EMPTY</text>
<text x="70" y="86" text-anchor="middle" font-size="8" fill="#6b7280">bleed, burns,</text>
<text x="70" y="97" text-anchor="middle" font-size="8" fill="#6b7280">vomit/diarrhoea,</text>
<text x="70" y="108" text-anchor="middle" font-size="8" fill="#6b7280">DKA, 3rd-spacing</text>
<text x="70" y="124" text-anchor="middle" font-weight="bold">→ fluids + blood,</text>
<text x="70" y="134" text-anchor="middle" font-weight="bold">stop the loss</text>
<rect x="126" y="40" width="100" height="96" rx="8" fill="#fff7ed" stroke="#7c2d12" stroke-width="1.5"/>
<text x="176" y="58" text-anchor="middle" font-weight="bold" font-size="10">Cardiogenic</text>
<text x="176" y="72" text-anchor="middle">PUMP FAILED</text>
<text x="176" y="86" text-anchor="middle" font-size="8" fill="#6b7280">MI, arrhythmia,</text>
<text x="176" y="97" text-anchor="middle" font-size="8" fill="#6b7280">valve rupture,</text>
<text x="176" y="108" text-anchor="middle" font-size="8" fill="#6b7280">myocarditis</text>
<text x="176" y="124" text-anchor="middle" font-weight="bold">→ sit up, O₂,</text>
<text x="176" y="134" text-anchor="middle" font-weight="bold">no blind fluids</text>
<rect x="232" y="40" width="100" height="96" rx="8" fill="#fef9c3" stroke="#713f12" stroke-width="1.5"/>
<text x="282" y="58" text-anchor="middle" font-weight="bold" font-size="10">Distributive</text>
<text x="282" y="72" text-anchor="middle">PIPES DILATED</text>
<text x="282" y="86" text-anchor="middle" font-size="8" fill="#6b7280">sepsis, anaphylaxis,</text>
<text x="282" y="97" text-anchor="middle" font-size="8" fill="#6b7280">neurogenic, adrenal</text>
<text x="282" y="108" text-anchor="middle" font-size="8" fill="#6b7280">crisis</text>
<text x="282" y="124" text-anchor="middle" font-weight="bold">→ cause Rx:</text>
<text x="282" y="134" text-anchor="middle" font-weight="bold">abx / adrenaline</text>
<rect x="338" y="40" width="102" height="96" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="389" y="58" text-anchor="middle" font-weight="bold" font-size="10">Obstructive</text>
<text x="389" y="72" text-anchor="middle">FLOW BLOCKED</text>
<text x="389" y="86" text-anchor="middle" font-size="8" fill="#6b7280">tamponade, massive</text>
<text x="389" y="97" text-anchor="middle" font-size="8" fill="#6b7280">PE, tension pneumo-</text>
<text x="389" y="108" text-anchor="middle" font-size="8" fill="#6b7280">thorax</text>
<text x="389" y="124" text-anchor="middle" font-weight="bold">→ relieve it:</text>
<text x="389" y="134" text-anchor="middle" font-weight="bold">drain / lyse / needle</text>
</g>
<text x="20" y="162" font-size="12" font-weight="bold" fill="#111827">The ladder: compensated → decompensated (hypotension is LATE)</text>
<g font-size="10" fill="#111827">
<rect x="20" y="170" width="205" height="110" rx="8" fill="#ecfdf5" stroke="#065f46" stroke-width="1.5"/>
<text x="122" y="188" text-anchor="middle" font-weight="bold">EARLY (compensated)</text>
<text x="30" y="204">• tachycardia, tachypnoea</text>
<text x="30" y="218">• anxious, restless</text>
<text x="30" y="232">• cool peripheries, slow refill</text>
<text x="30" y="246">• narrow pulse pressure</text>
<text x="30" y="260">• urine falling (&lt;30 mL/h)</text>
<text x="30" y="274" font-size="9" fill="#065f46" font-weight="bold">BP STILL NORMAL — act here</text>
<rect x="235" y="170" width="205" height="110" rx="8" fill="#fef2f2" stroke="#7f1d1d" stroke-width="1.5"/>
<text x="337" y="188" text-anchor="middle" font-weight="bold">LATE (decompensated)</text>
<text x="245" y="204">• HYPOTENSION</text>
<text x="245" y="218">• confused → unresponsive</text>
<text x="245" y="232">• cold, clammy, mottled</text>
<text x="245" y="246">• anuric, acidotic</text>
<text x="245" y="260">• arrhythmias, arrest</text>
<text x="245" y="274" font-size="9" fill="#7f1d1d" font-weight="bold">irreversible is next — resuscitate</text>
</g>
<rect x="0" y="292" width="460" height="188" fill="#f1f5f9"/>
<text x="20" y="314" font-size="10" fill="#111827">Shock is cells starving for oxygen — defined by PERFUSION, not pressure. The nurse's</text>
<text x="20" y="328" font-size="10" fill="#111827">early-warning set: heart rate, respiratory rate, refill time, mental state, urine output,</text>
<text x="20" y="342" font-size="10" fill="#111827">pulse pressure, lactate. Sepsis bundle: blood cultures, broad-spectrum antibiotics</text>
<text x="20" y="356" font-size="10" fill="#111827">within the hour, fluids, lactate, urine output, source control — every hour of antibiotic</text>
<text x="20" y="370" font-size="10" fill="#111827">delay raises mortality. Anaphylaxis: IM adrenaline into the thigh STAT (never IV bolus</text>
<text x="20" y="384" font-size="10" fill="#111827">outside resus), airway, high-flow O₂, fluids, lie flat legs up — then watch for the</text>
<text x="20" y="398" font-size="10" fill="#111827">biphasic rebound hours later. Neurogenic shock is warm + bradycardic (lost tone,</text>
<text x="20" y="412" font-size="10" fill="#111827">lost sympathetic drive) — the only shock that doesn't tachycard. Document the type</text>
<text x="20" y="426" font-size="10" fill="#111827">you suspect and why: the treatment of one shock drowns or starves another.</text>
<text x="20" y="448" font-size="10" fill="#111827" font-weight="bold">If the BP has fallen, you are already late. Escalate on the early signs.</text>
</svg>