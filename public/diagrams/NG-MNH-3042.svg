<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" role="img">
<rect width="460" height="260" fill="#ffffff"/>
<text x="230" y="24" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Postpartum haemorrhage: the four Ts</text>
<text x="230" y="42" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">Feel the uterus first &#8212; it separates tone from everything else</text>
<rect x="25" y="54" width="200" height="82" fill="#fee2e2" stroke="#b91c1c"/>
<text x="125" y="74" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7f1d1d">TONE &#8212; 70%</text>
<text x="125" y="94" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f1d1d">uterus soft and boggy</text>
<text x="125" y="110" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#7f1d1d">rub up a contraction,</text>
<text x="125" y="124" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#7f1d1d">empty the bladder, uterotonic</text>
<rect x="235" y="54" width="200" height="82" fill="#fef3c7" stroke="#b45309"/>
<text x="335" y="74" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#78350f">TRAUMA</text>
<text x="335" y="94" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">uterus FIRM but still bleeding</text>
<text x="335" y="110" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#78350f">inspect for tears:</text>
<text x="335" y="124" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#78350f">cervix, vagina, perineum</text>
<rect x="25" y="142" width="200" height="76" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="125" y="162" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">TISSUE</text>
<text x="125" y="182" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">retained placenta or fragments</text>
<text x="125" y="200" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">check the placenta is complete</text>
<rect x="235" y="142" width="200" height="76" fill="#ede9fe" stroke="#6d28d9"/>
<text x="335" y="162" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4c1d95">THROMBIN</text>
<text x="335" y="182" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4c1d95">clotting failure; blood does</text>
<text x="335" y="196" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4c1d95">not clot in the kidney dish</text>
<text x="335" y="212" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4c1d95">least common, most feared</text>
<rect x="25" y="226" width="410" height="26" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="230" y="243" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">A firm uterus that keeps bleeding is a tear until you have looked.</text>
</svg>