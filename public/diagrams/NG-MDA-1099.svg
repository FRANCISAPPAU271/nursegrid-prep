<svg viewBox="0 0 640 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="450" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">CHOOSING AN INTRAVENOUS FLUID</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">The question is always the same: what has the patient lost, and where do you want the fluid to go?</text>

<rect x="24" y="60" width="190" height="98" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.7"/>
<text x="119" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5c3a">ISOTONIC</text>
<text x="119" y="97" text-anchor="middle" font-size="9.5" font-style="italic" fill="#1a5c3a">stays in the vessels</text>
<g font-size="9.5" fill="#222">
<text x="36" y="116">Normal saline 0.9%</text>
<text x="36" y="131">Ringer's lactate</text>
<text x="36" y="150">Use for shock, bleeding,</text>
</g>
<text x="36" y="152" font-size="9.5" fill="#222"> </text>

<rect x="226" y="60" width="190" height="98" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.7"/>
<text x="321" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">HYPOTONIC</text>
<text x="321" y="97" text-anchor="middle" font-size="9.5" font-style="italic" fill="#1a3a5c">moves into the cells</text>
<g font-size="9.5" fill="#222">
<text x="238" y="116">Half-strength saline</text>
<text x="238" y="131">5% dextrose once used</text>
<text x="238" y="150">Never in head injury —</text>
</g>

<rect x="428" y="60" width="188" height="98" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.7"/>
<text x="522" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1e">HYPERTONIC</text>
<text x="522" y="97" text-anchor="middle" font-size="9.5" font-style="italic" fill="#8a6d1e">pulls water out of cells</text>
<g font-size="9.5" fill="#222">
<text x="440" y="116">3% saline, 50% dextrose</text>
<text x="440" y="131">Specialist use, slow rate</text>
<text x="440" y="150">Watch the vein closely</text>
</g>

<text x="36" y="172" font-size="9.5" fill="#222">severe dehydration and burns</text>
<text x="238" y="172" font-size="9.5" fill="#222">it worsens brain swelling</text>

<rect x="24" y="186" width="592" height="66" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.8"/>
<text x="320" y="206" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8b2f2f">WHY 5% DEXTROSE IS NOT A RESUSCITATION FLUID</text>
<g font-size="10.5" fill="#222">
<text x="38" y="228">The cells consume the sugar within minutes and what remains is plain water, which spreads through every</text>
<text x="38" y="244">compartment. Very little stays in the circulation, so it will not restore a blood pressure. Use saline or Ringer's.</text>
</g>

<rect x="24" y="268" width="285" height="102" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.6"/>
<text x="166" y="288" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">SIGNS YOU HAVE GIVEN TOO MUCH</text>
<g font-size="9.5" fill="#222">
<text x="36" y="308">New breathlessness and a cough</text>
<text x="36" y="324">Crackles at both lung bases</text>
<text x="36" y="340">Neck veins full, puffy face and ankles</text>
<text x="36" y="358">Weight rising day by day</text>
</g>

<rect x="331" y="268" width="285" height="102" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.6"/>
<text x="473" y="288" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a5c3a">THE MOST HONEST MEASURES</text>
<g font-size="9.5" fill="#222">
<text x="345" y="308">Daily weight on the same scale</text>
<text x="345" y="324">A truthful intake and output chart</text>
<text x="345" y="340">Urine output, hour by hour if unwell</text>
<text x="345" y="358">One litre of water weighs one kilogram</text>
</g>

<text x="320" y="394" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8b2f2f">Oral rehydration is the first choice whenever the patient can drink and is not vomiting everything.</text>
<text x="320" y="416" text-anchor="middle" font-size="11" fill="#222">It is safer, cheaper, and needs no cannula. A drip is not a sign of better care.</text>
<text x="320" y="438" text-anchor="middle" font-size="10.5" font-style="italic" fill="#1a3a5c">Elderly patients, small children and those with heart or kidney disease flood most easily. Slow down and reassess.</text>
</svg>