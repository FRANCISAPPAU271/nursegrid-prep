<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%" role="img">
<rect x="0" y="0" width="760" height="470" fill="#fdfcfa"/>
<text x="20" y="30" font-family="Georgia,serif" font-size="19" font-weight="bold" fill="#7a2020">Three endocrine collapses and the one clue that separates them</text>

<rect x="20" y="46" width="232" height="212" rx="6" fill="#fff3f0" stroke="#c0392b"/>
<text x="34" y="68" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#7a2020">Too little steroid</text>
<text x="34" y="92" font-family="Georgia,serif" font-size="12" fill="#333">Shock that does not respond</text>
<text x="34" y="110" font-family="Georgia,serif" font-size="12" fill="#333">to fluids alone.</text>
<text x="34" y="132" font-family="Georgia,serif" font-size="12" fill="#333">Low sodium, high potassium,</text>
<text x="34" y="150" font-family="Georgia,serif" font-size="12" fill="#333">low glucose, vomiting.</text>
<text x="34" y="172" font-family="Georgia,serif" font-size="12" fill="#333">Often triggered by infection,</text>
<text x="34" y="190" font-family="Georgia,serif" font-size="12" fill="#333">or by steroids stopped</text>
<text x="34" y="208" font-family="Georgia,serif" font-size="12" fill="#333">suddenly.</text>
<text x="34" y="234" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#7a2020">Give hydrocortisone before</text>
<text x="34" y="250" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#7a2020">the result comes back.</text>

<rect x="264" y="46" width="232" height="212" rx="6" fill="#eef4f8" stroke="#2b6b8a"/>
<text x="278" y="68" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#1d4e63">Too little thyroid</text>
<text x="278" y="92" font-family="Georgia,serif" font-size="12" fill="#333">Everything slows: drowsy,</text>
<text x="278" y="110" font-family="Georgia,serif" font-size="12" fill="#333">cold, slow pulse, puffy face.</text>
<text x="278" y="132" font-family="Georgia,serif" font-size="12" fill="#333">Temperature may be below</text>
<text x="278" y="150" font-family="Georgia,serif" font-size="12" fill="#333">the range of a standard</text>
<text x="278" y="168" font-family="Georgia,serif" font-size="12" fill="#333">thermometer.</text>
<text x="278" y="190" font-family="Georgia,serif" font-size="12" fill="#333">Often an older woman who</text>
<text x="278" y="208" font-family="Georgia,serif" font-size="12" fill="#333">stopped her tablets.</text>
<text x="278" y="234" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#1d4e63">Rewarm slowly. Rapid</text>
<text x="278" y="250" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#1d4e63">warming drops the pressure.</text>

<rect x="508" y="46" width="232" height="212" rx="6" fill="#fff8e8" stroke="#b8860b"/>
<text x="522" y="68" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#8a6508">Too much water held</text>
<text x="522" y="92" font-family="Georgia,serif" font-size="12" fill="#333">Confusion, headache, fits,</text>
<text x="522" y="110" font-family="Georgia,serif" font-size="12" fill="#333">with a very low sodium.</text>
<text x="522" y="132" font-family="Georgia,serif" font-size="12" fill="#333">The patient is not dry and</text>
<text x="522" y="150" font-family="Georgia,serif" font-size="12" fill="#333">not oedematous — the water</text>
<text x="522" y="168" font-family="Georgia,serif" font-size="12" fill="#333">is inside the cells.</text>
<text x="522" y="190" font-family="Georgia,serif" font-size="12" fill="#333">Seen with chest disease,</text>
<text x="522" y="208" font-family="Georgia,serif" font-size="12" fill="#333">brain injury, some drugs.</text>
<text x="522" y="234" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#8a6508">Restrict fluid. Correcting</text>
<text x="522" y="250" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#8a6508">too fast injures the brain.</text>

<rect x="20" y="274" width="720" height="88" rx="6" fill="#f2f7f2" stroke="#2e7d5b"/>
<text x="34" y="296" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#1d5c42">The clue that separates them: what the sodium and the temperature are doing</text>
<text x="34" y="318" font-family="Georgia,serif" font-size="12" fill="#333">Low sodium with high potassium and shock points to absent steroid. Low temperature with a slow pulse and</text>
<text x="34" y="336" font-family="Georgia,serif" font-size="12" fill="#333">drowsiness points to absent thyroid hormone. Low sodium in a warm, well-perfused, confused patient who is</text>
<text x="34" y="354" font-family="Georgia,serif" font-size="12" fill="#333">neither dry nor swollen points to water retention rather than salt loss.</text>

<rect x="20" y="376" width="720" height="80" rx="6" fill="#f4f4fb" stroke="#4a4a8a"/>
<text x="34" y="398" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#33336b">The recurring rule for hormone emergencies</text>
<text x="34" y="420" font-family="Georgia,serif" font-size="12" fill="#333">Replace what is missing, and replace it slowly. The harm in these three conditions comes as often from</text>
<text x="34" y="438" font-family="Georgia,serif" font-size="12" fill="#333">correcting too quickly as from the deficiency itself, because cells adapted to the abnormal state.</text>
</svg>