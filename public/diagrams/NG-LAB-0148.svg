<svg viewBox="0 0 470 250" role="img" xmlns="http://www.w3.org/2000/svg"><title>Interpreting blood gases</title>
<rect width="470" height="250" fill="#f6f8fc"/>
<text x="235" y="20" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">Three steps, in this order</text>
<rect x="16" y="32" width="438" height="34" rx="8" fill="#0a1628"/>
<text x="30" y="53" font-size="11" fill="#fff" font-family="system-ui" font-weight="700">1 · pH</text>
<text x="90" y="47" font-size="10" fill="#fff" font-family="system-ui">below 7.35 = ACIDOSIS</text>
<text x="90" y="60" font-size="10" fill="#fff" font-family="system-ui">above 7.45 = ALKALOSIS</text>
<text x="300" y="53" font-size="10" fill="#8aa0bf" font-family="system-ui">normal 7.35–7.45</text>
<rect x="16" y="74" width="216" height="80" rx="8" fill="#fff" stroke="#2b6fa8" stroke-width="2.5"/>
<text x="124" y="94" font-size="11.5" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#2b6fa8">2 · CO₂  (RESPIRATORY)</text>
<text x="124" y="114" font-size="10" text-anchor="middle" font-family="system-ui">high CO₂ + low pH = resp acidosis</text>
<text x="124" y="130" font-size="10" text-anchor="middle" font-family="system-ui">low CO₂ + high pH = resp alkalosis</text>
<text x="124" y="146" font-size="9" text-anchor="middle" font-family="system-ui" fill="#5a6b85">normal 4.7–6.0 kPa</text>
<rect x="240" y="74" width="214" height="80" rx="8" fill="#fff" stroke="#0f9d76" stroke-width="2.5"/>
<text x="347" y="94" font-size="11.5" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#0f9d76">3 · HCO₃  (METABOLIC)</text>
<text x="347" y="114" font-size="10" text-anchor="middle" font-family="system-ui">low HCO₃ + low pH = metab acidosis</text>
<text x="347" y="130" font-size="10" text-anchor="middle" font-family="system-ui">high HCO₃ + high pH = metab alkalosis</text>
<text x="347" y="146" font-size="9" text-anchor="middle" font-family="system-ui" fill="#5a6b85">normal 22–26 mmol/L</text>
<rect x="16" y="164" width="438" height="40" rx="8" fill="#fff" stroke="#f2b705" stroke-width="2"/>
<text x="235" y="181" font-size="10.5" text-anchor="middle" font-family="system-ui" font-weight="700">Which one moved the SAME way as the pH? That system is the cause.</text>
<text x="235" y="196" font-size="9.5" text-anchor="middle" font-family="system-ui" fill="#5a6b85">The other one moving oppositely is compensation</text>
<text x="235" y="222" font-size="10" text-anchor="middle" font-family="system-ui" fill="#5a6b85">CO₂ is an ACID gas — more CO₂ means more acid, so pH falls</text>
<text x="235" y="238" font-size="10" text-anchor="middle" font-family="system-ui" fill="#5a6b85">HCO₃ is a BASE — less bicarbonate means more acid, so pH falls</text>
</svg>