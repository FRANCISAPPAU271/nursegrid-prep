<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 480" font-family="sans-serif">
<rect x="0" y="0" width="460" height="480" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#111827">K⁺ + Ca²⁺ emergencies: ECG + ladder</text>
<!-- potassium -->
<text x="20" y="52" font-size="12" font-weight="bold" fill="#111827">POTASSIUM 3.5–5.0 (heart stops at both ends)</text>
<rect x="20" y="60" width="205" height="110" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<g font-size="10" fill="#111827">
<text x="122" y="78" text-anchor="middle" font-weight="bold">HYPO &lt;3.5</text>
<text x="30" y="94">• U waves, flat T, long QT</text>
<text x="30" y="108">• cramps, weakness, ileus</text>
<text x="30" y="122">• digoxin toxicity risk ↑</text>
<text x="30" y="136">• → arrest (asystole/PEA)</text>
<text x="30" y="152" font-weight="bold">Rx: replace (oral/IV slow),</text>
<text x="30" y="164" font-weight="bold">fix Mg²⁺ too — or K⁺ won't stay</text>
</g>
<rect x="235" y="60" width="205" height="110" rx="8" fill="#fef2f2" stroke="#7f1d1d" stroke-width="2"/>
<g font-size="10" fill="#111827">
<text x="337" y="78" text-anchor="middle" font-weight="bold">HYPER &gt;5.5 = EMERGENCY</text>
<text x="245" y="94">• peaked T → wide QRS → sine</text>
<text x="245" y="108">• bradycardia → arrest (PEA)</text>
<text x="245" y="122" font-weight="bold">Rx ladder: 1. calcium STAT</text>
<text x="245" y="136" font-weight="bold">(protect heart) 2. shift in</text>
<text x="245" y="150" font-weight="bold">(insulin+glucose, bicarb,</text>
<text x="245" y="164" font-weight="bold">salbutamol) 3. remove (resins,</text>
<text x="245" y="176" font-size="9" fill="#7f1d1d">dialysis) — recheck, never IV K⁺ push</text>
</g>
<!-- calcium -->
<text x="20" y="200" font-size="12" font-weight="bold" fill="#111827">CALCIUM 2.1–2.6 (correct for albumin)</text>
<rect x="20" y="208" width="205" height="100" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<g font-size="10" fill="#111827">
<text x="122" y="226" text-anchor="middle" font-weight="bold">HYPO &lt;2.1 (twitchy)</text>
<text x="30" y="242">• tingling fingers/lips</text>
<text x="30" y="256">• Chvostek + Trousseau</text>
<text x="30" y="270">• tetany, seizures, long QT</text>
<text x="30" y="284">• → laryngospasm</text>
<text x="30" y="298" font-weight="bold">Rx: IV calcium slow, vit D,</text>
</g>
<rect x="235" y="208" width="205" height="100" rx="8" fill="#fef9c3" stroke="#713f12" stroke-width="1.5"/>
<g font-size="10" fill="#111827">
<text x="337" y="226" text-anchor="middle" font-weight="bold">HYPER &gt;2.6 (sleepy)</text>
<text x="245" y="242">• stones, bones, groans,</text>
<text x="245" y="256">moans (+ thrones: polyuria)</text>
<text x="245" y="270">• short QT, bradycardia</text>
<text x="245" y="284">• confusion → coma</text>
<text x="245" y="298" font-weight="bold">Rx: fluids + furosemide,</text>
</g>
<rect x="0" y="320" width="460" height="160" fill="#f1f5f9"/>
<text x="20" y="342" font-size="10" fill="#111827">Sodium 135–145: hypo = confused → seizures (correct SLOWLY — central pontine</text>
<text x="20" y="356" font-size="10" fill="#111827">myelinolysis kills the rushed); hyper = thirsty, febrile, irritable (diabetes insipidus,</text>
<text x="20" y="370" font-size="10" fill="#111827">dehydration — replace water, find the loss). Magnesium 0.7–1.0: low mimics low</text>
<text x="20" y="384" font-size="10" fill="#111827">K⁺ AND low Ca²⁺ plus torsades — replete Mg²⁺ before K⁺ will hold; high (renal</text>
<text x="20" y="398" font-size="10" fill="#111827">failure, excess infusion) flattens reflexes then breathing — calcium antagonizes.</text>
<text x="20" y="412" font-size="10" fill="#111827">Phosphate runs inverse to calcium: refeeding crashes it (cardiac + respiratory</text>
<text x="20" y="426" font-size="10" fill="#111827">failure — feed the starved slowly). IV potassium NEVER pushed, NEVER fast:</text>
<text x="20" y="440" font-size="10" fill="#111827">20 mmol/h peripheral max with ECG monitoring, concentrated bags labelled.</text>
</svg>