<svg viewBox="0 0 470 230" role="img" xmlns="http://www.w3.org/2000/svg"><title>Micronutrient programmes in Ghana</title>
<rect width="470" height="230" fill="#f6f8fc"/>
<text x="235" y="20" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">Four ways to close a micronutrient gap</text>
<g font-family="system-ui">
<rect x="14" y="32" width="220" height="88" rx="8" fill="#fff" stroke="#2b6fa8" stroke-width="2"/>
<rect x="240" y="32" width="216" height="88" rx="8" fill="#fff" stroke="#2b6fa8" stroke-width="2"/>
<rect x="14" y="128" width="220" height="88" rx="8" fill="#fff" stroke="#2b6fa8" stroke-width="2"/>
<rect x="240" y="128" width="216" height="88" rx="8" fill="#fff" stroke="#2b6fa8" stroke-width="2"/>
<text x="26" y="52" font-size="11.5" font-weight="700" fill="#2b6fa8">1. Fortification</text>
<text x="252" y="52" font-size="11.5" font-weight="700" fill="#2b6fa8">2. Supplementation</text>
<text x="26" y="148" font-size="11.5" font-weight="700" fill="#2b6fa8">3. Dietary diversification</text>
<text x="252" y="148" font-size="11.5" font-weight="700" fill="#2b6fa8">4. Disease control</text>
<g font-size="10">
<text x="26" y="70">Iodised salt — goitre, cretinism</text>
<text x="26" y="86">Vitamin A in cooking oil</text>
<text x="26" y="102">Iron and folate in wheat flour</text>
<text x="252" y="70">Vitamin A every 6 months, 6–59 mo</text>
<text x="252" y="86">Iron and folic acid in pregnancy</text>
<text x="252" y="102">Micronutrient powders for home use</text>
<text x="26" y="166">Kontomire, palm oil, liver, egg</text>
<text x="26" y="182">Small dried fish eaten whole</text>
<text x="26" y="198">Backyard garden, orange sweet potato</text>
<text x="252" y="166">Deworming twice yearly</text>
<text x="252" y="182">Malaria prevention and treatment</text>
<text x="252" y="198">Clean water, sanitation, handwashing</text>
</g>
</g>
</svg>