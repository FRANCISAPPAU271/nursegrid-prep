<svg viewBox="0 0 460 200" role="img" aria-labelledby="t3" xmlns="http://www.w3.org/2000/svg">
<title id="t3">Classifying dehydration by circulatory signs</title>
<rect width="460" height="200" fill="#f6f8fc"/>
<rect x="20" y="50" width="130" height="120" rx="8" fill="#fff" stroke="#0f9d76" stroke-width="2"/>
<rect x="165" y="50" width="130" height="120" rx="8" fill="#fff" stroke="#f2b705" stroke-width="2"/>
<rect x="310" y="50" width="130" height="120" rx="8" fill="#fff" stroke="#e2574c" stroke-width="3"/>
<text x="85" y="74" font-size="13" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#0f9d76">NONE / MILD</text>
<text x="230" y="74" font-size="13" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#b58900">MODERATE</text>
<text x="375" y="74" font-size="13" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#e2574c">SEVERE</text>
<text x="85" y="98" font-size="10" text-anchor="middle" font-family="system-ui">alert, drinks normally</text>
<text x="85" y="114" font-size="10" text-anchor="middle" font-family="system-ui">pulse normal</text>
<text x="230" y="98" font-size="10" text-anchor="middle" font-family="system-ui">restless, thirsty</text>
<text x="230" y="114" font-size="10" text-anchor="middle" font-family="system-ui">eyes sunken</text>
<text x="375" y="98" font-size="10" text-anchor="middle" font-family="system-ui" font-weight="600">weak / absent pulse</text>
<text x="375" y="114" font-size="10" text-anchor="middle" font-family="system-ui" font-weight="600">lethargic, cap refill &gt;3s</text>
<rect x="30" y="130" width="110" height="26" rx="5" fill="#0f9d76" opacity=".2"/>
<rect x="175" y="130" width="110" height="26" rx="5" fill="#f2b705" opacity=".3"/>
<rect x="320" y="130" width="110" height="26" rx="5" fill="#e2574c" opacity=".25"/>
<text x="85" y="147" font-size="11" text-anchor="middle" font-family="system-ui" font-weight="600">ORS at home</text>
<text x="230" y="147" font-size="11" text-anchor="middle" font-family="system-ui" font-weight="600">ORS, supervised</text>
<text x="375" y="147" font-size="11" text-anchor="middle" font-family="system-ui" font-weight="600">IV Ringer&#39;s NOW</text>
<text x="230" y="188" font-size="11" text-anchor="middle" font-family="system-ui" fill="#5a6b85">A circulatory sign overrides &quot;but the patient can still drink&quot;</text>
<text x="230" y="30" font-size="12" text-anchor="middle" font-family="system-ui" font-weight="600">Classify FIRST, then choose the route</text>
</svg>