<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 536" role="img">
<rect width="460" height="536" fill="#ffffff"/>
<text x="230" y="26" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">Fast: narrow or wide?</text><text x="40" y="58" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">SVT — narrow, regular, about 180/min</text><path d="M40 120 L51 120 L58 80 L65 120 L101 120 L108 80 L115 120 L151 120 L158 80 L165 120 L201 120 L208 80 L215 120 L251 120 L258 80 L265 120 L301 120 L308 80 L315 120 L351 120 L358 80 L365 120 L401 120 L408 80 L415 120 L420 120" fill="none" stroke="#1d4ed8" stroke-width="2"/><text x="40" y="150" font-family="sans-serif" font-size="10" fill="#1e3a8a">No visible P — vagal first, then adenosine if regular and narrow.</text><text x="40" y="204" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">VT — wide, regular, about 160/min</text><path d="M40 266 L58 266 L70 224 L82 274 L88 266 L120 266 L132 224 L144 274 L150 266 L182 266 L194 224 L206 274 L212 266 L244 266 L256 224 L268 274 L274 266 L306 266 L318 224 L330 274 L336 266 L368 266 L380 224 L392 274 L398 266 L420 266" fill="none" stroke="#b91c1c" stroke-width="2"/><text x="40" y="300" font-family="sans-serif" font-size="10" fill="#7f1d1d">Wide + regular + fast = VT until proven otherwise — shock if no pulse.</text><text x="40" y="354" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">VF — chaotic, no complexes</text><path d="M40 416 L58 398 L74 428 L90 386 L106 422 L122 372 L140 434 L156 404 L172 380 L188 426 L204 364 L222 410 L238 388 L254 430 L270 376 L288 408 L304 382 L320 424 L336 368 L354 412 L370 390 L386 426 L402 396 L420 410" fill="none" stroke="#b91c1c" stroke-width="2"/><text x="40" y="448" font-family="sans-serif" font-size="10" fill="#7f1d1d">No complexes, no pulse — defibrillate NOW; minimise interruptions in CPR.</text><rect x="30" y="468" width="400" height="50" fill="#f1f5f9" stroke="#94a3b8"/><text x="230" y="486" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0f172a">Only VF and pulseless VT are shocked.</text><text x="230" y="501" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#475569">Asystole and PEA get CPR plus adrenaline — never a shock.</text>
</svg>
