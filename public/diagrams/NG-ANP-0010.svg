<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 500" font-family="sans-serif">
<rect x="0" y="0" width="460" height="500" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#111827">The skin in section</text>
<!-- epidermis -->
<rect x="90" y="60" width="190" height="10" fill="#d4a373" stroke="#7c2d12" stroke-width="1"/>
<rect x="90" y="70" width="190" height="8" fill="#e9c46a" stroke="#7c2d12" stroke-width="0.5"/>
<rect x="90" y="78" width="190" height="10" fill="#f4d58d" stroke="#7c2d12" stroke-width="0.5"/>
<rect x="90" y="88" width="190" height="10" fill="#faedcd" stroke="#7c2d12" stroke-width="0.5"/>
<!-- wavy dermo-epidermal junction -->
<path d="M90,98 q9,-8 18,0 q9,8 18,0 q9,-8 18,0 q9,8 18,0 q9,-8 18,0 q9,8 18,0 q9,-8 18,0 q9,8 18,0 q9,-8 18,0 q9,8 10,0" fill="none" stroke="#7c2d12" stroke-width="1.5"/>
<!-- dermis -->
<rect x="90" y="98" width="190" height="200" fill="#ffe5d9" stroke="#9d0208" stroke-width="1.5"/>
<!-- hypodermis -->
<rect x="90" y="298" width="190" height="64" fill="#fef9c3" stroke="#713f12" stroke-width="1.5"/>
<g fill="#fde68a" stroke="#d97706" stroke-width="1">
<circle cx="130" cy="322" r="14"/><circle cx="164" cy="330" r="14"/><circle cx="198" cy="322" r="14"/><circle cx="232" cy="330" r="14"/>
</g>
<!-- hair -->
<line x1="150" y1="60" x2="162" y2="20" stroke="#3f3f46" stroke-width="3"/>
<path d="M144,100 L168,100 L160,220 Q150,232 140,220 Z" fill="#e7e5e4" stroke="#57534e" stroke-width="1.5"/>
<circle cx="150" cy="222" r="10" fill="#d6d3d1" stroke="#57534e" stroke-width="1.5"/>
<!-- sebaceous gland -->
<g fill="#fef3c7" stroke="#92400e" stroke-width="1">
<circle cx="196" cy="150" r="9"/><circle cx="208" cy="142" r="7"/><circle cx="208" cy="156" r="7"/>
</g>
<line x1="188" y1="152" x2="172" y2="150" stroke="#92400e" stroke-width="1"/>
<!-- sweat gland + duct -->
<g fill="none" stroke="#0d9488" stroke-width="2">
<circle cx="240" cy="250" r="14"/><circle cx="240" cy="250" r="7"/>
<path d="M240,236 L232,200 L248,170 L238,130 L246,98 L244,62"/>
</g>
<!-- Meissner -->
<ellipse cx="228" cy="112" rx="6" ry="10" fill="#c4b5fd" stroke="#6d28d9" stroke-width="1"/>
<!-- Pacinian -->
<ellipse cx="120" cy="270" rx="10" ry="16" fill="none" stroke="#6d28d9" stroke-width="1.5"/>
<ellipse cx="120" cy="270" rx="5" ry="9" fill="none" stroke="#6d28d9" stroke-width="1"/>
<!-- vessels + nerve -->
<path d="M90,285 Q140,275 190,285 Q240,295 280,285" fill="none" stroke="#b91c1c" stroke-width="2.5"/>
<path d="M90,292 Q140,282 190,292 Q240,302 280,292" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
<line x1="90" y1="312" x2="280" y2="312" stroke="#ca8a04" stroke-width="2"/>
<!-- labels right -->
<g font-size="10" fill="#111827">
<line x1="280" y1="66" x2="316" y2="60" stroke="#6b7280" stroke-width="1"/>
<text x="318" y="56" font-weight="bold">Epidermis</text>
<text x="318" y="68" font-size="9" fill="#6b7280">corneum → basale;</text>
<text x="318" y="80" font-size="9" fill="#6b7280">no vessels</text>
<line x1="280" y1="112" x2="312" y2="118" stroke="#6b7280" stroke-width="1"/>
<text x="314" y="122" font-weight="bold">Meissner: light touch</text>
<line x1="256" y1="150" x2="312" y2="160" stroke="#6b7280" stroke-width="1"/>
<text x="314" y="164" font-weight="bold">Sebaceous: oil</text>
<line x1="252" y1="200" x2="312" y2="206" stroke="#6b7280" stroke-width="1"/>
<text x="314" y="210" font-weight="bold">Sweat duct → gland:</text>
<text x="314" y="222" font-weight="bold">cooling</text>
<line x1="280" y1="262" x2="312" y2="258" stroke="#6b7280" stroke-width="1"/>
<text x="314" y="254" font-weight="bold">Dermis: strength,</text>
<text x="314" y="266" font-weight="bold">vessels, nerves</text>
<line x1="280" y1="312" x2="312" y2="312" stroke="#6b7280" stroke-width="1"/>
<text x="314" y="316" font-weight="bold">Nerve + vessels</text>
<line x1="280" y1="330" x2="312" y2="344" stroke="#6b7280" stroke-width="1"/>
<text x="314" y="348" font-weight="bold">Hypodermis: fat —</text>
<text x="314" y="360" font-weight="bold">insulate, cushion</text>
</g>
<!-- labels left -->
<g font-size="10" fill="#111827">
<line x1="150" y1="160" x2="104" y2="170" stroke="#6b7280" stroke-width="1"/>
<text x="12" y="166" font-weight="bold">Hair follicle</text>
<text x="12" y="178" font-size="9" fill="#6b7280">bulb = growth</text>
<line x1="112" y1="270" x2="70" y2="278" stroke="#6b7280" stroke-width="1"/>
<text x="12" y="274" font-weight="bold">Pacinian:</text>
<text x="12" y="286" font-weight="bold">pressure</text>
</g>
<rect x="0" y="428" width="460" height="72" fill="#f1f5f9"/>
<text x="20" y="450" font-size="10" fill="#111827">The epidermis has no vessels — it feeds from the dermis below. A blister splits the</text>
<text x="20" y="464" font-size="10" fill="#111827">layers apart; an ulcer breaches the dermis; a full-thickness burn destroys the</text>
<text x="20" y="478" font-size="10" fill="#111827">regenerating basale — which is why depth decides everything in wound care.</text>
</svg>