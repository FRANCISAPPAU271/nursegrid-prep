<svg viewBox="0 0 640 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="450" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">INSTRUMENTS — FIVE JOBS, NOT FIFTY NAMES</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">Every instrument on the trolley does one of five things. Learn the job and the name follows.</text>

<rect x="24" y="60" width="180" height="96" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.7"/>
<text x="114" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">1. CUTTING</text>
<g font-size="9.5" fill="#222">
<text x="36" y="100">Scalpel, scissors</text>
<text x="36" y="118">Sharp edge, sharp tip.</text>
<text x="36" y="136">Passed in a kidney dish,</text>
<text x="36" y="150">never hand to hand.</text>
</g>

<rect x="216" y="60" width="180" height="96" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.7"/>
<text x="306" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5c3a">2. GRASPING</text>
<g font-size="9.5" fill="#222">
<text x="228" y="100">Dissecting forceps,</text>
<text x="228" y="118">tissue forceps, sponge</text>
<text x="228" y="136">holding forceps. Toothed</text>
<text x="228" y="150">for skin, plain for bowel.</text>
</g>

<rect x="408" y="60" width="208" height="96" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.7"/>
<text x="512" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1e">3. CLAMPING</text>
<g font-size="9.5" fill="#222">
<text x="420" y="100">Artery forceps, the</text>
<text x="420" y="118">commonest instrument</text>
<text x="420" y="136">on any tray. It stops</text>
<text x="420" y="150">bleeding by crushing.</text>
</g>

<rect x="24" y="170" width="285" height="96" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.7"/>
<text x="166" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b3a6b">4. RETRACTING</text>
<g font-size="9.5" fill="#222">
<text x="36" y="210">Holds the wound open so the surgeon</text>
<text x="36" y="228">can see. Self-retaining ones stay open</text>
<text x="36" y="246">alone; handheld ones need an assistant</text>
<text x="36" y="260">who must not lean or drift.</text>
</g>

<rect x="331" y="170" width="285" height="96" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.7"/>
<text x="473" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b2f2f">5. SUTURING</text>
<g font-size="9.5" fill="#222">
<text x="345" y="210">Needle holder grips the needle. Its</text>
<text x="345" y="228">jaws are short and cross-hatched, and</text>
<text x="345" y="246">unlike artery forceps it never touches</text>
<text x="345" y="260">tissue or a blood vessel.</text>
</g>

<rect x="24" y="282" width="592" height="76" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.8"/>
<text x="320" y="302" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a5c3a">THE COUNT IS A NURSING RESPONSIBILITY, NOT A FORMALITY</text>
<g font-size="10.5" fill="#222">
<text x="38" y="324">Swabs, needles and instruments are counted before the operation starts, before the cavity is closed, and</text>
<text x="38" y="342">again at the end. Two people count aloud together, and every count is recorded and signed.</text>
</g>

<rect x="24" y="370" width="592" height="56" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.7"/>
<text x="320" y="390" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b2f2f">IF THE COUNT IS WRONG, SAY SO IMMEDIATELY</text>
<g font-size="10.5" fill="#222">
<text x="38" y="412">The wound is not closed until the count is correct or a radiograph has cleared it. Seniority does not</text>
</g>
<text x="38" y="422" font-size="10.5" fill="#222">override an incorrect count, and no one is thanked later for having stayed quiet.</text>

<text x="320" y="444" text-anchor="middle" font-size="10.5" font-style="italic" fill="#1a3a5c">Hand instruments firmly, handle first, ready to use, so the surgeon never looks away from the wound.</text>
</svg>