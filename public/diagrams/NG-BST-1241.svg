<svg viewBox="0 0 640 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="450" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">WHEN THE MEAN LIES</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">A few extreme values drag the mean towards them. The median stays where the people are.</text>

<rect x="24" y="60" width="285" height="150" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.7"/>
<text x="166" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">SYMMETRICAL</text>
<path d="M44 180 Q60 178 80 168 Q110 148 140 108 Q166 96 192 108 Q222 148 252 168 Q272 178 288 180" fill="none" stroke="#1a3a5c" stroke-width="2.2"/>
<line x1="166" y1="100" x2="166" y2="182" stroke="#8b2f2f" stroke-width="1.8" stroke-dasharray="4,3"/>
<text x="166" y="198" text-anchor="middle" font-size="10" fill="#8b2f2f">mean = median = mode</text>

<rect x="331" y="60" width="285" height="150" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.7"/>
<text x="473" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b2f2f">SKEWED BY A LONG TAIL</text>
<path d="M348 180 Q356 176 366 160 Q380 116 400 104 Q422 100 444 130 Q474 164 520 176 Q560 181 598 182" fill="none" stroke="#8b2f2f" stroke-width="2.2"/>
<line x1="408" y1="104" x2="408" y2="182" stroke="#1a5c3a" stroke-width="1.8" stroke-dasharray="4,3"/>
<text x="404" y="198" text-anchor="middle" font-size="10" fill="#1a5c3a">median</text>
<line x1="460" y1="130" x2="460" y2="182" stroke="#6b3a6b" stroke-width="1.8" stroke-dasharray="4,3"/>
<text x="500" y="198" text-anchor="middle" font-size="10" fill="#6b3a6b">mean pulled this way</text>

<rect x="24" y="224" width="592" height="76" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.8"/>
<text x="320" y="244" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1e">A WARD EXAMPLE YOU WILL RECOGNISE</text>
<g font-size="10.5" fill="#222">
<text x="38" y="266">Nine patients stay 3 days each and one stays 60. The mean stay is 8.7 days; the median is 3 days.</text>
<text x="38" y="286">The mean describes nobody in that ward. Quote the median whenever a few extreme values exist.</text>
</g>

<rect x="24" y="314" width="285" height="106" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.7"/>
<text x="166" y="334" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a5c3a">USE THE MEDIAN FOR</text>
<g font-size="10" fill="#222">
<text x="38" y="356">Length of stay, income, waiting time,</text>
<text x="38" y="374">number of visits, cost of care</text>
<text x="38" y="396" font-style="italic">Anything with a long tail of large values</text>
<text x="38" y="412" font-style="italic">and a floor it cannot go below.</text>
</g>

<rect x="331" y="314" width="285" height="106" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.7"/>
<text x="473" y="334" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6b3a6b">SPREAD GOES WITH THE CENTRE</text>
<g font-size="10" fill="#222">
<text x="345" y="356">Mean travels with standard deviation.</text>
<text x="345" y="376">Median travels with the interquartile</text>
<text x="345" y="392">range, the middle half of the data.</text>
<text x="345" y="412" font-style="italic">Never quote a centre without a spread.</text>
</g>

<text x="320" y="442" text-anchor="middle" font-size="10.5" font-style="italic" fill="#1a3a5c">Before choosing a summary, look at the shape. A single number cannot describe data you have not looked at.</text>
</svg>