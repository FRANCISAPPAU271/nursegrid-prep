<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 270" role="img">
<rect width="460" height="270" fill="#ffffff"/>
<text x="230" y="26" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Assessing suicide risk: ask in this order</text>
<rect x="40" y="46" width="380" height="34" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="230" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">1. Thoughts &#8212; are you thinking of ending your life?</text>
<path d="M230 80 L230 94" stroke="#0f172a" stroke-width="2" marker-end="url(#a2)"/>
<rect x="40" y="94" width="380" height="34" fill="#e0f2fe" stroke="#0369a1"/>
<text x="230" y="116" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0c4a6e">2. Plan &#8212; have you thought about how?</text>
<path d="M230 128 L230 142" stroke="#0f172a" stroke-width="2" marker-end="url(#a2)"/>
<rect x="40" y="142" width="380" height="34" fill="#fef3c7" stroke="#b45309"/>
<text x="230" y="164" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350f">3. Means &#8212; do you have access to what you would use?</text>
<path d="M230 176 L230 190" stroke="#0f172a" stroke-width="2" marker-end="url(#a2)"/>
<rect x="40" y="190" width="380" height="34" fill="#fee2e2" stroke="#b91c1c"/>
<text x="230" y="212" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7f1d1d">4. Intent and timing &#8212; when? what has stopped you so far?</text>
<defs><marker id="a2" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto"><path d="M0 0 L4 6 L8 0 z" fill="#0f172a"/></marker></defs>
<text x="230" y="244" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">A plan with available means and a set time is the highest risk.</text>
<text x="230" y="260" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">Asking directly does not plant the idea. Removing the means saves lives.</text>
</svg>