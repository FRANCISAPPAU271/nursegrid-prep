<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="400" fill="#fbfaf7"/>
<text x="320" y="27" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">DETERMINANTS OF HEALTH — THE LAYERS AROUND A PERSON</text>
<text x="320" y="46" text-anchor="middle" font-size="12" fill="#555">Health care is only one layer, and not the widest one</text>

<ellipse cx="320" cy="215" rx="300" ry="150" fill="#e8eef4" stroke="#1a3a5c" stroke-width="1.5"/>
<ellipse cx="320" cy="215" rx="238" ry="122" fill="#dbe6f0" stroke="#1a3a5c" stroke-width="1.5"/>
<ellipse cx="320" cy="215" rx="172" ry="92" fill="#cfdcea" stroke="#1a3a5c" stroke-width="1.5"/>
<ellipse cx="320" cy="215" rx="104" ry="60" fill="#eadfd0" stroke="#8b6a2f" stroke-width="1.5"/>
<ellipse cx="320" cy="215" rx="48" ry="30" fill="#f7e9e9" stroke="#8b2f2f" stroke-width="2"/>

<text x="320" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b2f2f">AGE, SEX,</text>
<text x="320" y="226" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b2f2f">GENES</text>

<text x="320" y="186" text-anchor="middle" font-size="10" font-weight="bold" fill="#8b6a2f">LIFESTYLE — diet, exercise,</text>
<text x="320" y="256" text-anchor="middle" font-size="10" font-weight="bold" fill="#8b6a2f">alcohol, smoking, sleep</text>

<text x="320" y="158" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a3a5c">SOCIAL AND COMMUNITY — family, neighbours, church</text>
<text x="320" y="285" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a3a5c">networks, social support, stigma</text>

<text x="320" y="130" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a3a5c">LIVING AND WORKING — water, sanitation, housing, food,</text>
<text x="320" y="311" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a3a5c">education, work, health services, transport</text>

<text x="320" y="98" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a3a5c">GENERAL CONDITIONS — economy, culture, environment, policy, law</text>

<rect x="24" y="368" width="592" height="26" fill="#fff3cd" stroke="#e0c86a"/>
<text x="320" y="385" text-anchor="middle" font-size="11" font-style="italic" fill="#6b5410">Telling a person to change behaviour while ignoring the outer layers is why health education so often fails.</text>
</svg>