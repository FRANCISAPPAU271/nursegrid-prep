<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="420" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">INVESTIGATING AN OUTBREAK — THE ORDER MATTERS</text>

<g font-size="10.5">
<rect x="20" y="44" width="88" height="52" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.4"/>
<text x="64" y="64" text-anchor="middle" font-weight="bold" fill="#1a3a5c">1</text>
<text x="64" y="80" text-anchor="middle" fill="#222">Confirm the</text><text x="64" y="92" text-anchor="middle" fill="#222">outbreak</text>
<rect x="116" y="44" width="88" height="52" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.4"/>
<text x="160" y="64" text-anchor="middle" font-weight="bold" fill="#1a3a5c">2</text>
<text x="160" y="80" text-anchor="middle" fill="#222">Write a case</text><text x="160" y="92" text-anchor="middle" fill="#222">definition</text>
<rect x="212" y="44" width="88" height="52" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.4"/>
<text x="256" y="64" text-anchor="middle" font-weight="bold" fill="#1a3a5c">3</text>
<text x="256" y="80" text-anchor="middle" fill="#222">Find cases,</text><text x="256" y="92" text-anchor="middle" fill="#222">line list them</text>
<rect x="308" y="44" width="88" height="52" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.4"/>
<text x="352" y="64" text-anchor="middle" font-weight="bold" fill="#1a3a5c">4</text>
<text x="352" y="80" text-anchor="middle" fill="#222">Describe by</text><text x="352" y="92" text-anchor="middle" fill="#222">person place time</text>
<rect x="404" y="44" width="88" height="52" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.4"/>
<text x="448" y="64" text-anchor="middle" font-weight="bold" fill="#1a3a5c">5</text>
<text x="448" y="80" text-anchor="middle" fill="#222">Form and test</text><text x="448" y="92" text-anchor="middle" fill="#222">a hypothesis</text>
<rect x="500" y="44" width="120" height="52" fill="#eaf3ea" stroke="#8fb98f" stroke-width="1.4"/>
<text x="560" y="64" text-anchor="middle" font-weight="bold" fill="#1a5c3a">6</text>
<text x="560" y="80" text-anchor="middle" fill="#222">Control, then report</text><text x="560" y="92" text-anchor="middle" fill="#222">and keep watching</text>
</g>
<text x="320" y="112" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8b2f2f">Control measures that are obvious start on day one. You never wait for the investigation to finish.</text>

<text x="320" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3a5c">THE EPIDEMIC CURVE TELLS YOU THE SOURCE</text>

<line x1="60" y1="330" x2="300" y2="330" stroke="#333" stroke-width="1.6"/>
<line x1="60" y1="330" x2="60" y2="164" stroke="#333" stroke-width="1.6"/>
<g fill="#5a86a8">
<rect x="76" y="310" width="14" height="20"/><rect x="92" y="286" width="14" height="44"/>
<rect x="108" y="240" width="14" height="90"/><rect x="124" y="212" width="14" height="118"/>
<rect x="140" y="252" width="14" height="78"/><rect x="156" y="290" width="14" height="40"/>
<rect x="172" y="316" width="14" height="14"/>
</g>
<text x="180" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">SINGLE SHARP PEAK</text>
<text x="180" y="364" text-anchor="middle" font-size="10.5" fill="#222">One common source — a well, a</text>
<text x="180" y="378" text-anchor="middle" font-size="10.5" fill="#222">funeral meal, one tank of water.</text>
<text x="180" y="394" text-anchor="middle" font-size="10.5" fill="#222">Everyone exposed at the same time.</text>
<text x="180" y="410" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8b2f2f">Find and remove the source.</text>

<line x1="340" y1="330" x2="600" y2="330" stroke="#333" stroke-width="1.6"/>
<line x1="340" y1="330" x2="340" y2="164" stroke="#333" stroke-width="1.6"/>
<g fill="#8b2f2f">
<rect x="356" y="312" width="14" height="18"/><rect x="372" y="300" width="14" height="30"/>
<rect x="396" y="286" width="14" height="44"/><rect x="412" y="276" width="14" height="54"/>
<rect x="436" y="258" width="14" height="72"/><rect x="452" y="248" width="14" height="82"/>
<rect x="476" y="230" width="14" height="100"/><rect x="492" y="222" width="14" height="108"/>
</g>
<text x="470" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b2f2f">SUCCESSIVE RISING WAVES</text>
<text x="470" y="364" text-anchor="middle" font-size="10.5" fill="#222">Person to person spread, each wave</text>
<text x="470" y="378" text-anchor="middle" font-size="10.5" fill="#222">one incubation period after the last.</text>
<text x="470" y="394" text-anchor="middle" font-size="10.5" fill="#222">The cases are now the source.</text>
<text x="470" y="410" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8b2f2f">Isolate, trace contacts, break the chain.</text>

<text x="52" y="170" text-anchor="end" font-size="10" fill="#555" transform="rotate(-90 52 250)">cases</text>
</svg>