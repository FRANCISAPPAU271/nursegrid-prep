<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 480" font-family="sans-serif">
<rect x="0" y="0" width="460" height="480" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#111827">Endocrine glands + the feedback loop</text>
<!-- body outline -->
<circle cx="130" cy="70" r="26" fill="none" stroke="#334155" stroke-width="2"/>
<path d="M104,96 L104,220 C104,260 156,260 156,220 L156,96" fill="none" stroke="#334155" stroke-width="2"/>
<line x1="104" y1="120" x2="70" y2="170" stroke="#334155" stroke-width="2"/>
<line x1="156" y1="120" x2="190" y2="170" stroke="#334155" stroke-width="2"/>
<!-- glands -->
<g font-size="9" fill="#111827">
<circle cx="130" cy="62" r="5" fill="#b91c1c"/>
<text x="142" y="58">hypothalamus +</text>
<text x="142" y="69">pituitary (master)</text>
<circle cx="130" cy="86" r="4" fill="#b91c1c"/>
<text x="142" y="89">pineal (melatonin)</text>
<ellipse cx="130" cy="106" rx="12" ry="7" fill="#b91c1c"/>
<text x="148" y="102">thyroid (T4/T3) +</text>
<text x="148" y="113">parathyroids (PTH)</text>
<circle cx="130" cy="140" r="5" fill="#b91c1c"/>
<text x="142" y="143">thymus (T-cells)</text>
<circle cx="112" cy="168" r="5" fill="#b91c1c"/><circle cx="148" cy="168" r="5" fill="#b91c1c"/>
<text x="160" y="171">adrenals (cortisol,</text>
<text x="160" y="182">aldosterone, adrenaline)</text>
<ellipse cx="130" cy="196" rx="14" ry="7" fill="#b91c1c"/>
<text x="150" y="199">pancreas (insulin,</text>
<text x="150" y="210">glucagon)</text>
<circle cx="130" cy="230" r="5" fill="#b91c1c"/>
<text x="142" y="233">ovaries / testes</text>
<text x="142" y="244">(oestrogen, progesterone,</text>
<text x="142" y="255">testosterone)</text>
</g>
<!-- feedback loop -->
<rect x="20" y="272" width="420" height="92" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
<text x="230" y="292" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">Negative feedback: the thermostat pattern</text>
<g font-size="9" fill="#111827" text-anchor="middle">
<rect x="40" y="300" width="100" height="28" rx="6" fill="#fef9c3" stroke="#713f12" stroke-width="1"/>
<text x="90" y="312">hypothalamus</text>
<text x="90" y="323" font-size="8" fill="#6b7280">releasing hormone</text>
<rect x="160" y="300" width="100" height="28" rx="6" fill="#ffedd5" stroke="#7c2d12" stroke-width="1"/>
<text x="210" y="312">pituitary</text>
<text x="210" y="323" font-size="8" fill="#6b7280">tropic hormone</text>
<rect x="280" y="300" width="100" height="28" rx="6" fill="#dcfce7" stroke="#065f46" stroke-width="1"/>
<text x="330" y="312">target gland</text>
<text x="330" y="323" font-size="8" fill="#6b7280">e.g. cortisol, T4</text>
<g stroke="#334155" stroke-width="1.5">
<line x1="140" y1="314" x2="160" y2="314"/><path d="M160,314 l-7,-3.5 l0,7 Z" fill="#334155"/>
<line x1="260" y1="314" x2="280" y2="314"/><path d="M280,314 l-7,-3.5 l0,7 Z" fill="#334155"/>
</g>
<path d="M330,328 C330,352 90,352 90,328" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5 3"/>
<path d="M90,328 l-4,8 l8,-2 Z" fill="#b91c1c"/>
<text x="210" y="350" font-size="9" fill="#b91c1c">rising hormone switches the top OFF ⊣</text>
</g>
<rect x="0" y="376" width="460" height="104" fill="#f1f5f9"/>
<text x="20" y="398" font-size="10" fill="#111827">Primary failure = gland dead (low hormone, HIGH tropic — the pituitary shouting).</text>
<text x="20" y="412" font-size="10" fill="#111827">Secondary failure = pituitary quiet (low hormone, LOW tropic — nobody shouting).</text>
<text x="20" y="426" font-size="10" fill="#111827">Steroids suppress the axis — stop abruptly and Addisonian crisis follows: taper,</text>
<text x="20" y="440" font-size="10" fill="#111827">stress-dose, steroid card, never omit in intercurrent illness without a plan.</text>
<text x="20" y="454" font-size="10" fill="#111827">Positive feedback is rare: oxytocin in labour, LH surge at ovulation — both end in an event.</text>
</svg>