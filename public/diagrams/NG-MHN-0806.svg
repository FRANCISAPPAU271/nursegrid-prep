<svg viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="430" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">RESPONDING TO A DELUSION OR HALLUCINATION</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">Do not agree. Do not argue. Acknowledge the feeling and state your own reality gently.</text>

<rect x="40" y="62" width="176" height="130" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.6"/>
<text x="128" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8b2f2f">DO NOT AGREE</text>
<g font-size="10.5" fill="#222">
<text x="52" y="106">Yes, I hear them too</text>
<text x="52" y="126">Reinforces the belief and</text>
<text x="52" y="140">destroys your credibility</text>
<text x="52" y="160">The patient will later know</text>
<text x="52" y="174">you were lying to them</text>
</g>

<rect x="232" y="62" width="176" height="130" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.6"/>
<text x="320" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1e">DO NOT ARGUE</text>
<g font-size="10.5" fill="#222">
<text x="244" y="106">There is nobody there</text>
<text x="244" y="126">Delusions are not held by</text>
<text x="244" y="140">reasoning, so they cannot</text>
<text x="244" y="154">be removed by reasoning</text>
<text x="244" y="174">You become one of them</text>
</g>

<rect x="424" y="62" width="176" height="130" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.6"/>
<text x="512" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a5c3a">DO THIS</text>
<g font-size="10.5" fill="#222">
<text x="436" y="106">I do not hear a voice,</text>
<text x="436" y="120">but I can see it frightens you</text>
<text x="436" y="144">Names your reality without</text>
<text x="436" y="158">calling them a liar, and</text>
<text x="436" y="172">responds to the fear, which</text>
<text x="436" y="186">is the part that is real</text>
</g>

<rect x="40" y="212" width="560" height="86" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.5"/>
<text x="320" y="232" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a3a5c">THE QUESTION YOU MUST ALWAYS ASK</text>
<g font-size="10.5" fill="#222">
<text x="52" y="254">What are the voices saying to you?</text>
<text x="52" y="274">COMMAND hallucinations telling the patient to harm themselves or someone else change everything.</text>
<text x="52" y="290">That is a safety emergency, not a symptom to be observed. Ask, and ask whether they intend to obey.</text>
</g>

<rect x="40" y="314" width="560" height="72" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.5"/>
<text x="320" y="334" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b3a6b">CULTURE MATTERS BEFORE YOU CALL IT A SYMPTOM</text>
<g font-size="10.5" fill="#222">
<text x="52" y="354">A shared religious or cultural belief held by the patient's whole community is not a delusion.</text>
<text x="52" y="372">Ask whether the family and neighbours share it. A belief held alone, and resistant to all evidence, is different.</text>
</g>

<text x="320" y="412" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8b2f2f">Respond to the emotion, not the content. The fear is always real, whatever caused it.</text>
</svg>