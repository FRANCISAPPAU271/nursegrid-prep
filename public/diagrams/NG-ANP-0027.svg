<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 480" font-family="sans-serif">
<rect x="0" y="0" width="460" height="480" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#111827">Four failures: recognize + first three actions</text>
<g font-size="9" fill="#111827">
<rect x="20" y="40" width="205" height="130" rx="8" fill="#fef2f2" stroke="#7f1d1d" stroke-width="1.5"/>
<text x="122" y="58" text-anchor="middle" font-weight="bold" font-size="10">SHOCK (cells starving)</text>
<text x="30" y="74">tachycardia + tachypnoea + cool/</text>
<text x="30" y="86">mottled + ↓urine — BP lies early</text>
<text x="30" y="102" font-weight="bold">1. ABCs + high-flow O₂ + access</text>
<text x="30" y="114" font-weight="bold">2. fluids 500 + REASSESS lungs/</text>
<text x="30" y="126" font-weight="bold">JVP/BP/urine (blood if bleeding)</text>
<text x="30" y="138" font-weight="bold">3. type-specific Rx (abx/adrenaline/</text>
<text x="30" y="150" font-weight="bold">sit-up/relieve) + lactate + SBAR</text>
<rect x="235" y="40" width="205" height="130" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="337" y="58" text-anchor="middle" font-weight="bold" font-size="10">RESP. FAILURE (gases failing)</text>
<text x="245" y="74">T1: low O₂, normal/low CO₂</text>
<text x="245" y="86">(pneumonia, PE, ARDS, oedema)</text>
<text x="245" y="102" font-weight="bold">1. sit up + O₂ to target + listen</text>
<text x="245" y="114" font-weight="bold">2. ABG/VBG + CXR + ECG</text>
<text x="245" y="126" font-weight="bold">3. cause Rx (abx/diuretics/NIV);</text>
<text x="245" y="138" font-weight="bold">T2 (↑CO₂, drowsy): controlled</text>
<text x="245" y="150" font-weight="bold">O₂ 88–92% + NIV, senior help</text>
<rect x="20" y="178" width="205" height="130" rx="8" fill="#fef9c3" stroke="#713f12" stroke-width="1.5"/>
<text x="122" y="196" text-anchor="middle" font-weight="bold" font-size="10">AKI / OLIGURIA (output failing)</text>
<text x="30" y="212">&lt;0.5 mL/kg/h × 2 h + rising</text>
<text x="30" y="224">creatinine ± hyperK ± overload</text>
<text x="30" y="240" font-weight="bold">1. ABCs + bladder scan (± cath)</text>
<text x="30" y="252" font-weight="bold">2. fluids IF dry + lung checks;</text>
<text x="30" y="264" font-weight="bold">stop nephrotoxins (NSAIDs,</text>
<text x="30" y="276" font-weight="bold">aminoglycosides, contrast)</text>
<text x="30" y="288" font-weight="bold">3. K⁺/acid/gases + weights +</text>
<text x="30" y="300" font-weight="bold">strict balance + SBAR</text>
<rect x="235" y="178" width="205" height="130" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text x="337" y="196" text-anchor="middle" font-weight="bold" font-size="10">COMA (brain failing)</text>
<text x="245" y="212">GCS falling / ≤8, blown pupil,</text>
<text x="245" y="224">posturing, seizures, Cushing's</text>
<text x="245" y="240" font-weight="bold">1. ABCs + glucose NOW + sats</text>
<text x="245" y="252" font-weight="bold">2. NBM + recovery/head-up +</text>
<text x="245" y="264" font-weight="bold">naloxone/thiamine if indicated</text>
<text x="245" y="276" font-weight="bold">3. CT + neuro obs + seizure</text>
<text x="245" y="288" font-weight="bold">protocol + neurosurgical SBAR</text>
</g>
<rect x="0" y="320" width="460" height="160" fill="#f1f5f9"/>
<text x="20" y="342" font-size="10" fill="#111827">Sepsis overlaps ALL FOUR — fever/rigors + any failure = cultures + antibiotics</text>
<text x="20" y="356" font-size="10" fill="#111827">within the hour + fluids + lactate + SBAR. ARREST: compress 100–120/min,</text>
<text x="20" y="370" font-size="10" fill="#111827">5–6 cm, shock VF/pulseless VT, adrenaline + amiodarone per algorithm, hunt</text>
<text x="20" y="384" font-size="10" fill="#111827">the 4 Hs + 4 Ts (hypoxia, hypo/hyper-K, hypo-volaemia, hypo-thermia; tamponade,</text>
<text x="20" y="398" font-size="10" fill="#111827">tension, toxins, thrombosis). DNAR ≠ do-not-treat — ceilings of care (TEP/</text>
<text x="20" y="412" font-size="10" fill="#111827">ReSPECT) guide, dignity governs: document times, rhythms, drugs, witnesses;</text>
<text x="20" y="426" font-size="10" fill="#111827">debrief the team, support the family, look after yourself. The nurse who calls</text>
<text x="20" y="440" font-size="10" fill="#111827">early, acts in order and writes it down saves the most lives.</text>
</svg>