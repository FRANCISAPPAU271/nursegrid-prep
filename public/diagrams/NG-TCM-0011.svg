<svg xmlns="http://www.w3.org/2000/svg" width="460" height="340" font-family="sans-serif">
<rect width="460" height="340" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="230" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">The Two-Way Referral Bridge</text>
<text x="230" y="42" text-anchor="middle" font-size="10" fill="#64748b">Hospital ↔ healer — patients cross daily, build the bridge (NG-TCM-0011)</text>
<g font-size="10" fill="#0f172a">
<rect x="14" y="52" width="216" height="150" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
<text x="24" y="70" font-size="12" font-weight="bold" fill="#1d4ed8">HOSPITAL → HEALER</text>
<text x="24" y="88">Chronic pain needing massage,</text>
<text x="24" y="104">grief/spiritual distress, stable</text>
<text x="24" y="120">patients wanting blessed rites</text>
<text x="24" y="136">HOW: name a TRUSTED healer,</text>
<text x="24" y="152">written note, drugs CONTINUE,</text>
<text x="24" y="168">review date FIXED — never a</text>
<text x="24" y="184">vague "go and see someone"</text>
<rect x="236" y="52" width="210" height="150" fill="#fef2f2" stroke="#b91c1c" stroke-width="2" rx="6"/>
<text x="246" y="70" font-size="12" font-weight="bold" fill="#b91c1c">HEALER → HOSPITAL</text>
<text x="246" y="88">Bleeding, breathing trouble,</text>
<text x="246" y="104">fits, labour delay, high fever,</text>
<text x="246" y="120">no better in 3 days, babies</text>
<text x="246" y="136">HOW: thank the healer, treat</text>
<text x="246" y="152">FAST, send FEEDBACK ("she is</text>
<text x="246" y="168">stable — your quick referral</text>
<text x="246" y="184">saved her"), invite dialogue</text>
</g>
<rect x="14" y="210" width="432" height="82" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
<text x="24" y="230" font-size="12" font-weight="bold" fill="#1d4ed8">BRIDGE RULES — RESPECT FLOWS BOTH WAYS</text>
<g font-size="10" fill="#0f172a">
<text x="24" y="248">Know your local healers BY NAME — visit, greet, exchange numbers</text>
<text x="24" y="264">Never mock a healer to a patient — you lose the patient, not the healer</text>
<text x="24" y="280">Joint wins: TBA + midwife deliveries, pastor + ARV adherence, mallam + ITNs</text>
</g>
<rect x="14" y="300" width="432" height="28" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="4"/>
<text x="230" y="318" text-anchor="middle" font-size="10" fill="#475569">Patients already combine both worlds — the nurse's job is safe traffic, not roadblocks. Original NurseGrid content.</text>
</svg>
