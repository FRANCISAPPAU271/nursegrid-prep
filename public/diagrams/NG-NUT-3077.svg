<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 240" role="img" aria-label="Signs of unsafe swallowing and the positioning that reduces aspiration risk">
<rect width="460" height="240" fill="#ffffff"/>
<text x="230" y="22" text-anchor="middle" font-family="Georgia,serif" font-size="15" font-weight="bold" fill="#14532d">Feeding after stroke: spotting an unsafe swallow</text>
<rect x="28" y="40" width="196" height="120" fill="#fef2f2" stroke="#991b1b"/>
<text x="126" y="58" text-anchor="middle" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#991b1b">Stop feeding — refer</text>
<text x="38" y="78" font-family="Georgia,serif" font-size="10.5">• coughing or choking on fluids</text>
<text x="38" y="95" font-family="Georgia,serif" font-size="10.5">• wet, gurgly voice after a sip</text>
<text x="38" y="112" font-family="Georgia,serif" font-size="10.5">• food pocketing in the cheek</text>
<text x="38" y="129" font-family="Georgia,serif" font-size="10.5">• drooling, delayed swallow</text>
<text x="38" y="146" font-family="Georgia,serif" font-size="10.5">• recurrent chest infection</text>
<rect x="236" y="40" width="196" height="120" fill="#f0fdf4" stroke="#14532d"/>
<text x="334" y="58" text-anchor="middle" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#14532d">Safer feeding</text>
<text x="246" y="78" font-family="Georgia,serif" font-size="10.5">• fully upright, chin slightly down</text>
<text x="246" y="95" font-family="Georgia,serif" font-size="10.5">• thickened fluids, soft moist food</text>
<text x="246" y="112" font-family="Georgia,serif" font-size="10.5">• small spoonfuls, unhurried</text>
<text x="246" y="129" font-family="Georgia,serif" font-size="10.5">• no straws, no head tilted back</text>
<text x="246" y="146" font-family="Georgia,serif" font-size="10.5">• mouth care before and after</text>
<text x="230" y="184" text-anchor="middle" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#7c2d12">Thin fluids are the hardest to control, not the easiest.</text>
<text x="230" y="208" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#334155">Water moves fastest and reaches the airway before the swallow triggers.</text>
<text x="230" y="230" text-anchor="middle" font-family="Georgia,serif" font-size="10.5" font-style="italic" fill="#334155">Silent aspiration causes no cough at all — the chest signs come days later.</text>
</svg>