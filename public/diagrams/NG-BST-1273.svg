<svg viewBox="0 0 640 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="450" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">CHOOSING A TEST — THREE QUESTIONS</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">What kind of data, how many groups, and are the groups the same people twice?</text>

<rect x="24" y="60" width="190" height="88" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.7"/>
<text x="119" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">1. WHAT DATA?</text>
<g font-size="9.5" fill="#222">
<text x="36" y="100">Numbers you can average,</text>
<text x="36" y="116">or categories you can</text>
<text x="36" y="132">only count.</text>
</g>

<rect x="226" y="60" width="190" height="88" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.7"/>
<text x="321" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a5c3a">2. HOW MANY GROUPS?</text>
<g font-size="9.5" fill="#222">
<text x="238" y="100">One, two, or more than two.</text>
<text x="238" y="120">More than two means</text>
<text x="238" y="136">analysis of variance.</text>
</g>

<rect x="428" y="60" width="188" height="88" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.7"/>
<text x="522" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1e">3. SAME PEOPLE TWICE?</text>
<g font-size="9.5" fill="#222">
<text x="440" y="100">Before and after in one</text>
<text x="440" y="116">group is PAIRED. Two</text>
<text x="440" y="132">separate groups is not.</text>
</g>

<rect x="24" y="164" width="285" height="112" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.7"/>
<text x="166" y="184" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a5c3a">COMPARING AVERAGES</text>
<g font-size="9.5" fill="#222">
<text x="36" y="206">Two separate groups — unpaired t-test</text>
<text x="36" y="224">Same group before and after — paired</text>
<text x="36" y="242">Three or more groups — ANOVA</text>
<text x="36" y="262">Skewed or ordinal data — the</text>
</g>
<text x="36" y="270" font-size="9.5" fill="#222">non-parametric equivalent</text>

<rect x="331" y="164" width="285" height="112" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.7"/>
<text x="473" y="184" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">COMPARING PROPORTIONS</text>
<g font-size="9.5" fill="#222">
<text x="345" y="206">Counts in categories — chi-square</text>
<text x="345" y="226">For example: did more nurses on the</text>
<text x="345" y="242">night shift report a needlestick than</text>
<text x="345" y="258">those on the day shift?</text>
</g>

<rect x="24" y="290" width="592" height="70" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.8"/>
<text x="320" y="310" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6b3a6b">CORRELATION MEASURES, REGRESSION PREDICTS</text>
<g font-size="10.5" fill="#222">
<text x="38" y="332">Correlation gives one number from minus one to plus one: how tightly two things move together.</text>
<text x="38" y="350">Regression goes further and lets you estimate one value from another.</text>
</g>

<rect x="24" y="372" width="592" height="52" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.7"/>
<text x="320" y="392" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8b2f2f">The question rules the method. Never choose a test because the software offers it.</text>
<text x="320" y="412" text-anchor="middle" font-size="10.5" fill="#222">Write the question in a sentence first, and the test that fits it becomes obvious.</text>

<text x="320" y="442" text-anchor="middle" font-size="10.5" font-style="italic" fill="#1a3a5c">A statistician can rescue a badly analysed study. Nobody can rescue a badly designed one.</text>
</svg>