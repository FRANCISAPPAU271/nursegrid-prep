<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="420" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">PSYCHOTROPIC DRUGS — THE FOUR EMERGENCIES</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">Each one is recognised by a different combination. Learn what makes each unique.</text>

<rect x="34" y="62" width="276" height="150" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.6"/>
<text x="172" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">LITHIUM TOXICITY</text>
<g font-size="10.5" fill="#222">
<text x="46" y="106">Narrow margin: therapeutic range is</text>
<text x="46" y="120">only about 0.6 to 1.0 mmol per litre</text>
<text x="46" y="140">Coarse tremor, vomiting, diarrhoea,</text>
<text x="46" y="154">slurred speech, unsteadiness, then fits</text>
<text x="46" y="176" fill="#8b2f2f">Triggered by dehydration, vomiting,</text>
<text x="46" y="190" fill="#8b2f2f">low salt intake, and NSAIDs</text>
<text x="46" y="206">Withhold the dose and take a level</text>
</g>

<rect x="330" y="62" width="276" height="150" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.6"/>
<text x="468" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#8b2f2f">NEUROLEPTIC MALIGNANT</text>
<g font-size="10.5" fill="#222">
<text x="342" y="106">From antipsychotics, days into treatment</text>
<text x="342" y="126">HIGH FEVER, above 39 degrees Celsius</text>
<text x="342" y="140">LEAD-PIPE muscle rigidity</text>
<text x="342" y="154">Confusion, unstable pulse and pressure</text>
<text x="342" y="176" fill="#8b2f2f">STOP the drug. This is a medical</text>
<text x="342" y="190" fill="#8b2f2f">emergency with real mortality</text>
<text x="342" y="206">Rigidity plus fever is the pair to spot</text>
</g>

<rect x="34" y="228" width="276" height="140" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.6"/>
<text x="172" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1e">ACUTE DYSTONIA</text>
<g font-size="10.5" fill="#222">
<text x="46" y="272">Hours to days after starting or</text>
<text x="46" y="286">increasing an antipsychotic</text>
<text x="46" y="306">Neck twisted, jaw locked, tongue</text>
<text x="46" y="320">protruding, eyes rolled upward</text>
<text x="46" y="342" fill="#1a5c3a">Frightening but treatable — give the</text>
<text x="46" y="356" fill="#1a5c3a">prescribed anticholinergic. NO fever.</text>
</g>

<rect x="330" y="228" width="276" height="140" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.6"/>
<text x="468" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a5c3a">TARDIVE DYSKINESIA</text>
<g font-size="10.5" fill="#222">
<text x="342" y="272">After months or years of treatment</text>
<text x="342" y="292">Repetitive lip smacking, chewing,</text>
<text x="342" y="306">tongue rolling, grimacing</text>
<text x="342" y="326">Painless, and often unnoticed by</text>
<text x="342" y="340">the patient themselves</text>
<text x="342" y="360" fill="#8b2f2f">May be permanent — report early</text>
</g>

<text x="320" y="392" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">Sort by two questions: how long have they been on it, and is there a fever?</text>
<text x="320" y="412" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8b2f2f">Fever with rigidity is the emergency. No fever, early, and twisted is dystonia. Late and writhing is tardive.</text>
</svg>