<svg xmlns="http://www.w3.org/2000/svg" width="460" height="340" font-family="sans-serif">
<rect width="460" height="340" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="230" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Law, Policy and the Ward</text>
<text x="230" y="42" text-anchor="middle" font-size="10" fill="#64748b">Ghana's TCAM frame + ward integration checklist (NG-TCM-0012)</text>
<g font-size="10" fill="#0f172a">
<rect x="14" y="52" width="216" height="150" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
<text x="24" y="70" font-size="12" font-weight="bold" fill="#1d4ed8">GHANA'S FRAME</text>
<text x="24" y="88">Traditional Medicine Practice</text>
<text x="24" y="100">Act 2000 (Act 595): licences</text>
<text x="24" y="112">practitioners via the Council</text>
<text x="24" y="128">FDA Ghana: registers herbal</text>
<text x="24" y="140">products — check numbers!</text>
<text x="24" y="156">WHO strategy: integrate safe,</text>
<text x="24" y="168">effective TCAM into health</text>
<text x="24" y="180">systems — Ghana leads Africa</text>
<rect x="236" y="52" width="210" height="150" fill="#fef2f2" stroke="#b91c1c" stroke-width="2" rx="6"/>
<text x="246" y="70" font-size="12" font-weight="bold" fill="#b91c1c">KNOW THE LINE</text>
<text x="246" y="88">Licensed healer ≠ anything</text>
<text x="246" y="100">goes: harm is harm, whoever</text>
<text x="246" y="112">causes it — report it</text>
<text x="246" y="128">Unlicensed + harmful practice</text>
<text x="246" y="140">→ Council, FDA, police via</text>
<text x="246" y="152">facility channels</text>
<text x="246" y="168">Nurse scope: support + refer,</text>
<text x="246" y="180">never prescribe herbs/rites</text>
</g>
<rect x="14" y="210" width="432" height="82" fill="#f8fafc" stroke="#b91c1c" stroke-width="2" rx="6"/>
<text x="24" y="230" font-size="12" font-weight="bold" fill="#b91c1c">WARD CHECKLIST — EVERY SHIFT</text>
<g font-size="10" fill="#0f172a">
<text x="24" y="248">Admit: ask TM use · Plan: remedies in care plan · Drug round: interaction check</text>
<text x="24" y="264">Visitors: clergy/healer welcome rules · Discharge: herb-drug counsel + review</text>
<text x="24" y="280">Incident: adverse events reported — FDA forms, facility book, handover</text>
</g>
<rect x="14" y="300" width="432" height="28" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="4"/>
<text x="230" y="318" text-anchor="middle" font-size="10" fill="#475569">Integration = policy on paper AND questions at the bedside. Original NurseGrid content.</text>
</svg>
