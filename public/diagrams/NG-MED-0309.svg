<svg viewBox="0 0 470 250" role="img" xmlns="http://www.w3.org/2000/svg"><title>Intravenous fluid tonicity</title>
<rect width="470" height="250" fill="#f6f8fc"/>
<text x="235" y="20" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">Where each intravenous fluid sends the water</text>
<g font-family="system-ui">
<rect x="14" y="32" width="145" height="196" rx="8" fill="#fff" stroke="#0f9d76" stroke-width="2.5"/>
<rect x="163" y="32" width="145" height="196" rx="8" fill="#fff" stroke="#2b6fa8" stroke-width="2.5"/>
<rect x="312" y="32" width="144" height="196" rx="8" fill="#fff" stroke="#e2574c" stroke-width="2.5"/>
<text x="86" y="52" font-size="11.5" text-anchor="middle" font-weight="700" fill="#0b7a5c">ISOTONIC</text>
<text x="235" y="52" font-size="11.5" text-anchor="middle" font-weight="700" fill="#2b6fa8">HYPOTONIC</text>
<text x="384" y="52" font-size="11.5" text-anchor="middle" font-weight="700" fill="#a8352c">HYPERTONIC</text>
<circle cx="86" cy="86" r="22" fill="#dff3ec" stroke="#0f9d76" stroke-width="2"/>
<circle cx="235" cy="86" r="28" fill="#e8f1f8" stroke="#2b6fa8" stroke-width="2"/>
<circle cx="384" cy="86" r="15" fill="#fde8e6" stroke="#e2574c" stroke-width="2"/>
<text x="86" y="90" font-size="9" text-anchor="middle" font-weight="700">cell same</text>
<text x="235" y="90" font-size="9" text-anchor="middle" font-weight="700">cell swells</text>
<text x="384" y="90" font-size="9" text-anchor="middle" font-weight="700">shrinks</text>
<g font-size="9.5">
<text x="26" y="130" font-weight="700">Normal saline 0.9%</text>
<text x="26" y="144" font-weight="700">Ringer's lactate</text>
<text x="26" y="162">Stays in the compartment</text>
<text x="26" y="176">it is given into</text>
<text x="26" y="196" fill="#0b7a5c" font-weight="700">Use: shock, dehydration,</text>
<text x="26" y="210" fill="#0b7a5c" font-weight="700">blood loss, resuscitation</text>
<text x="176" y="130" font-weight="700">0.45% saline</text>
<text x="176" y="144" font-weight="700">5% dextrose (once used)</text>
<text x="176" y="162">Water moves INTO cells</text>
<text x="176" y="176">and rehydrates them</text>
<text x="176" y="196" fill="#2b6fa8" font-weight="700">Danger: cerebral oedema</text>
<text x="176" y="210" fill="#2b6fa8" font-weight="700">Never in head injury</text>
<text x="326" y="130" font-weight="700">3% saline</text>
<text x="326" y="144" font-weight="700">50% dextrose, mannitol</text>
<text x="326" y="162">Pulls water OUT of</text>
<text x="326" y="176">cells into the vessels</text>
<text x="326" y="196" fill="#a8352c" font-weight="700">Use: raised intracranial</text>
<text x="326" y="210" fill="#a8352c" font-weight="700">pressure, severe hyponatraemia</text>
</g>
</g>
<text x="235" y="244" font-size="9.5" text-anchor="middle" font-family="system-ui" fill="#5a6b85" font-weight="700">Water always moves towards the saltier side. Decide which side you want it on, then pick the bag.</text>
</svg>