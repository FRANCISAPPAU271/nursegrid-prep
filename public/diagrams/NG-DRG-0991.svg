<svg viewBox="0 0 640 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="450" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">CARDIOVASCULAR DRUGS — WHAT TO WATCH IN EACH CLASS</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">The monitoring is not a ritual. Each observation catches one specific, predictable harm.</text>

<rect x="30" y="60" width="285" height="104" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.7"/>
<text x="172" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">ACE INHIBITORS — names end in -pril</text>
<g font-size="10" fill="#222">
<text x="44" y="100">Dry persistent cough — very common,</text>
<text x="44" y="114">not an infection, switch the drug</text>
<text x="44" y="132">Watch potassium and creatinine</text>
<text x="44" y="150">Never in pregnancy</text>
</g>

<rect x="325" y="60" width="285" height="104" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.7"/>
<text x="467" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5c3a">BETA-BLOCKERS — names end in -olol</text>
<g font-size="10" fill="#222">
<text x="339" y="100">Count the pulse before every dose</text>
<text x="339" y="118">Caution in asthma — airways narrow</text>
<text x="339" y="136">Masks hypoglycaemia in diabetes</text>
<text x="339" y="154">Never stop abruptly — rebound</text>
</g>

<rect x="30" y="176" width="285" height="104" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.7"/>
<text x="172" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1e">DIURETICS</text>
<g font-size="10" fill="#222">
<text x="44" y="216">Loop, such as furosemide — potassium</text>
<text x="44" y="230">falls; give in the morning, not at night</text>
<text x="44" y="250">Spironolactone — potassium RISES</text>
<text x="44" y="268">Weigh daily; the scale is the fluid chart</text>
</g>

<rect x="325" y="176" width="285" height="104" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.7"/>
<text x="467" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b3a6b">CALCIUM CHANNEL BLOCKERS</text>
<g font-size="10" fill="#222">
<text x="339" y="216">Ankle swelling and flushing are</text>
<text x="339" y="230">expected, not heart failure</text>
<text x="339" y="250">Headache early, settles</text>
<text x="339" y="268">Avoid grapefruit juice</text>
</g>

<rect x="30" y="292" width="580" height="96" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.7"/>
<text x="320" y="312" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8b2f2f">ANTIPLATELET IS NOT ANTICOAGULANT — THEY STOP DIFFERENT THINGS</text>
<g font-size="10.5" fill="#222">
<text x="44" y="334">ASPIRIN and CLOPIDOGREL stop platelets sticking. Used where the clot forms in a fast artery:</text>
<text x="44" y="350">after a heart attack, after a stroke. No routine blood test is needed.</text>
<text x="44" y="370">HEPARIN and WARFARIN stop the clotting cascade. Used where blood is slow or pooling: deep vein</text>
<text x="44" y="386">thrombosis, atrial fibrillation, after some surgery. These need monitoring, and they have antidotes.</text>
</g>

<text x="320" y="414" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">Any bleeding gum, black stool or new bruise in a patient on these drugs is reported, not noted.</text>
<text x="320" y="436" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8b2f2f">Before giving: pulse for the beta-blocker, potassium for the ACE inhibitor, weight for the diuretic.</text>
</svg>