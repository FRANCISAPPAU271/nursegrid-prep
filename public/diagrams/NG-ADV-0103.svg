<svg viewBox="0 0 470 210" role="img" xmlns="http://www.w3.org/2000/svg"><title>IV fluid tonicity</title>
<rect width="470" height="210" fill="#f6f8fc"/>
<text x="235" y="20" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">Tonicity decides which way water moves</text>
<g font-family="system-ui" text-anchor="middle">
<rect x="18" y="38" width="140" height="130" rx="9" fill="#fff" stroke="#0f9d76" stroke-width="2.5"/>
<text x="88" y="60" font-size="12" font-weight="700" fill="#0f9d76">ISOTONIC</text>
<circle cx="88" cy="96" r="22" fill="#e2574c" opacity=".35" stroke="#0a1628" stroke-width="1.5"/>
<text x="88" y="100" font-size="9">no change</text>
<text x="88" y="134" font-size="9.5">0.9% saline</text><text x="88" y="147" font-size="9.5">Ringer&#39;s lactate</text>
<text x="88" y="161" font-size="9" fill="#5a6b85">expands circulation</text>
<rect x="166" y="38" width="140" height="130" rx="9" fill="#fff" stroke="#2b6fa8" stroke-width="2.5"/>
<text x="236" y="60" font-size="12" font-weight="700" fill="#2b6fa8">HYPOTONIC</text>
<circle cx="236" cy="96" r="27" fill="#2b6fa8" opacity=".3" stroke="#0a1628" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="236" y="100" font-size="9">cell SWELLS</text>
<text x="236" y="134" font-size="9.5">0.45% saline</text>
<text x="236" y="150" font-size="9" fill="#a8352c">danger: cerebral oedema</text>
<rect x="314" y="38" width="140" height="130" rx="9" fill="#fff" stroke="#f2b705" stroke-width="2.5"/>
<text x="384" y="60" font-size="12" font-weight="700" fill="#b58900">HYPERTONIC</text>
<circle cx="384" cy="96" r="15" fill="#f2b705" opacity=".45" stroke="#0a1628" stroke-width="1.5"/>
<text x="384" y="100" font-size="8.5">SHRINKS</text>
<text x="384" y="134" font-size="9.5">3% saline, 50% dextrose</text>
<text x="384" y="150" font-size="9" fill="#5a6b85">pulls water OUT of cells</text>
</g>
<text x="235" y="192" font-size="10.5" text-anchor="middle" font-family="system-ui" fill="#5a6b85">Water always moves TOWARD the more concentrated solution</text>
<text x="235" y="205" font-size="10" text-anchor="middle" font-family="system-ui" fill="#5a6b85">For hypovolaemia use isotonic — it stays in the circulation</text>
</svg>