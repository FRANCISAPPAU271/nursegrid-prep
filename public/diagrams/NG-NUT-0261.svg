<svg viewBox="0 0 470 230" role="img" xmlns="http://www.w3.org/2000/svg"><title>Body mass index bands</title>
<rect width="470" height="230" fill="#f6f8fc"/>
<text x="235" y="20" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">Body mass index — adults only</text>
<rect x="20" y="34" width="430" height="34" rx="6" fill="#fff" stroke="#2b6fa8" stroke-width="2"/>
<text x="235" y="56" font-size="13" text-anchor="middle" font-family="system-ui" font-weight="700">BMI = weight in kg ÷ (height in metres × height in metres)</text>
<g font-family="system-ui">
<rect x="20" y="84" width="86" height="40" fill="#4a90c2"/>
<rect x="106" y="84" width="120" height="40" fill="#0f9d76"/>
<rect x="226" y="84" width="104" height="40" fill="#f2b705"/>
<rect x="330" y="84" width="120" height="40" fill="#e2574c"/>
<text x="63" y="102" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="700">under 18.5</text>
<text x="63" y="117" font-size="10" text-anchor="middle" fill="#fff">Underweight</text>
<text x="166" y="102" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="700">18.5 – 24.9</text>
<text x="166" y="117" font-size="10" text-anchor="middle" fill="#fff">Normal</text>
<text x="278" y="102" font-size="10.5" text-anchor="middle" fill="#4a3a00" font-weight="700">25.0 – 29.9</text>
<text x="278" y="117" font-size="10" text-anchor="middle" fill="#4a3a00">Overweight</text>
<text x="390" y="102" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="700">30.0 and above</text>
<text x="390" y="117" font-size="10" text-anchor="middle" fill="#fff">Obese</text>
</g>
<rect x="20" y="136" width="430" height="40" rx="6" fill="#eef3f9"/>
<text x="34" y="152" font-size="10.5" font-family="system-ui" font-weight="700">Worked example</text>
<text x="34" y="168" font-size="10.5" font-family="system-ui">72 kg, 1.6 m  →  1.6 × 1.6 = 2.56  →  72 ÷ 2.56 = 28.1  →  overweight</text>
<rect x="20" y="184" width="430" height="34" rx="6" fill="#fff" stroke="#e2574c" stroke-width="2"/>
<text x="235" y="198" font-size="10" text-anchor="middle" font-family="system-ui" font-weight="700">BMI misleads in pregnancy, oedema, ascites, athletes and children</text>
<text x="235" y="211" font-size="9.5" text-anchor="middle" font-family="system-ui" fill="#5a6b85">Children are assessed on growth charts and MUAC, never on adult BMI bands</text>
</svg>