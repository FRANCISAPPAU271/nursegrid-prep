<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 268" role="img" aria-label="How persistent vomiting in pyloric stenosis produces a hypochloraemic hypokalaemic metabolic alkalosis">
<rect width="470" height="268" fill="#ffffff"/>
<text x="235" y="22" text-anchor="middle" font-family="Georgia,serif" font-size="15" font-weight="bold" fill="#14532d">Why vomiting the stomach alkalinises the blood</text>
<rect x="24" y="38" width="200" height="42" rx="4" fill="#fee2e2" stroke="#991b1b"/>
<text x="124" y="57" text-anchor="middle" font-family="Georgia,serif" font-size="11.5" font-weight="bold">Projectile vomiting</text>
<text x="124" y="73" text-anchor="middle" font-family="Georgia,serif" font-size="10">gastric contents only, no bile</text>
<path d="M124 82 L124 100" stroke="#334155" stroke-width="2" marker-end="url(#p77)"/>
<defs><marker id="p77" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#334155"/></marker></defs>
<rect x="24" y="102" width="200" height="42" rx="4" fill="#fef3c7" stroke="#92400e"/>
<text x="124" y="121" text-anchor="middle" font-family="Georgia,serif" font-size="11" font-weight="bold">Loses H⁺ and Cl⁻</text>
<text x="124" y="137" text-anchor="middle" font-family="Georgia,serif" font-size="10">the acid leaves the body</text>
<path d="M124 146 L124 164" stroke="#334155" stroke-width="2" marker-end="url(#p77)"/>
<rect x="24" y="166" width="200" height="42" rx="4" fill="#e0f2fe" stroke="#1e3a8a"/>
<text x="124" y="185" text-anchor="middle" font-family="Georgia,serif" font-size="11" font-weight="bold">Metabolic ALKALOSIS</text>
<text x="124" y="201" text-anchor="middle" font-family="Georgia,serif" font-size="10">low chloride, low potassium</text>
<rect x="246" y="38" width="200" height="170" rx="4" fill="#f8fafc" stroke="#334155"/>
<text x="346" y="58" text-anchor="middle" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#7c2d12">The classic picture</text>
<text x="256" y="80" font-family="Georgia,serif" font-size="10.5">• 3–6 weeks old, hungry after vomiting</text>
<text x="256" y="99" font-family="Georgia,serif" font-size="10.5">• vomit is never bile-stained</text>
<text x="256" y="118" font-family="Georgia,serif" font-size="10.5">• olive-shaped mass, visible waves</text>
<text x="256" y="137" font-family="Georgia,serif" font-size="10.5">• pH high, chloride low, potassium low</text>
<text x="256" y="156" font-family="Georgia,serif" font-size="10.5">• paradoxical aciduria late on</text>
<text x="256" y="180" font-family="Georgia,serif" font-size="10.5" font-weight="bold" fill="#991b1b">Correct fluid and chloride FIRST.</text>
<text x="256" y="197" font-family="Georgia,serif" font-size="10.5">This is never a surgical emergency.</text>
<text x="235" y="232" text-anchor="middle" font-family="Georgia,serif" font-size="11.5" font-weight="bold" fill="#14532d">The site of the loss predicts the chemistry.</text>
<text x="235" y="254" text-anchor="middle" font-family="Georgia,serif" font-size="10.8" font-style="italic" fill="#334155">Lose acid from above the pylorus, the blood turns alkaline. Lose alkali below, it turns acid.</text>
</svg>