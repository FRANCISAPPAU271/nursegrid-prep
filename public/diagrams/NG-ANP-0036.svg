<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 490" font-family="sans-serif">
<rect x="0" y="0" width="460" height="490" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#111827">Labour stages + PPH 4 Ts + golden minute</text>
<!-- stages -->
<g font-size="9" fill="#111827" text-anchor="middle">
<rect x="20" y="40" width="130" height="96" rx="8" fill="#fef9c3" stroke="#713f12" stroke-width="1.5"/>
<text x="85" y="58" font-weight="bold" font-size="10">1ST STAGE</text>
<text x="85" y="72">latent 0–4 cm (slow,</text>
<text x="85" y="84">mobile, eat/drink)</text>
<text x="85" y="98">active 4–10 cm (~1 cm/h;</text>
<text x="85" y="110">partograph alert → action)</text>
<text x="85" y="124">FHR q15–30 min;</text>
<text x="85" y="134" font-size="8" fill="#6b7280">ARM + oxytocin per protocol</text>
<rect x="156" y="40" width="130" height="96" rx="8" fill="#ffedd5" stroke="#7c2d12" stroke-width="1.5"/>
<text x="221" y="58" font-weight="bold" font-size="10">2ND STAGE</text>
<text x="221" y="72">10 cm → birth</text>
<text x="221" y="84">(passive + active push;</text>
<text x="221" y="98">positions upright;</text>
<text x="221" y="110">perineum guarded;</text>
<text x="221" y="124">FHR q5 min / after</text>
<text x="221" y="134" font-size="8" fill="#6b7280">each contraction + push</text>
<rect x="292" y="40" width="148" height="96" rx="8" fill="#dcfce7" stroke="#065f46" stroke-width="1.5"/>
<text x="366" y="58" font-weight="bold" font-size="10">3RD STAGE</text>
<text x="366" y="72">birth → placenta</text>
<text x="366" y="84">ACTIVE: oxytocin IM</text>
<text x="366" y="98">+ controlled cord</text>
<text x="366" y="110">traction + massage</text>
<text x="366" y="124">INSPECT placenta +</text>
<text x="366" y="134" font-size="8" fill="#6b7280">membranes complete?</text>
</g>
<!-- PPH -->
<text x="20" y="162" font-size="12" font-weight="bold" fill="#111827">PPH (≥500 vaginal / ≥1000 CS): the 4 Ts</text>
<g font-size="9" fill="#111827" text-anchor="middle">
<rect x="20" y="170" width="100" height="86" rx="8" fill="#fef2f2" stroke="#7f1d1d" stroke-width="2"/>
<text x="70" y="188" font-weight="bold" font-size="10">TONE (70%)</text>
<text x="70" y="202">atony: massage +</text>
<text x="70" y="214">oxytocin → ergot →</text>
<text x="70" y="226">misoprostol → balloon</text>
<text x="70" y="238">→ theatre</text>
<text x="70" y="250" font-size="8" fill="#6b7280">empty bladder first</text>
<rect x="126" y="170" width="100" height="86" rx="8" fill="#fef2f2" stroke="#7f1d1d" stroke-width="1"/>
<text x="176" y="188" font-weight="bold" font-size="10">TRAUMA</text>
<text x="176" y="202">tears, episiotomy,</text>
<text x="176" y="214">rupture, inversion —</text>
<text x="176" y="226">good tone + still</text>
<text x="176" y="238">bleeding = LOOK</text>
<text x="176" y="250" font-size="8" fill="#6b7280">repair + pack</text>
<rect x="232" y="170" width="100" height="86" rx="8" fill="#fef2f2" stroke="#7f1d1d" stroke-width="1"/>
<text x="282" y="188" font-weight="bold" font-size="10">TISSUE</text>
<text x="282" y="202">retained placenta/</text>
<text x="282" y="214">membranes/clots —</text>
<text x="282" y="226">explore + evacuate;</text>
<text x="282" y="238">accreta = theatre</text>
<text x="282" y="250" font-size="8" fill="#6b7280">inspect every placenta</text>
<rect x="338" y="170" width="102" height="86" rx="8" fill="#fef2f2" stroke="#7f1d1d" stroke-width="1"/>
<text x="389" y="188" font-weight="bold" font-size="10">THROMBIN</text>
<text x="389" y="202">coagulopathy: abruption,</text>
<text x="389" y="214">PE, sepsis, HELLP —</text>
<text x="389" y="226">blood products +</text>
<text x="389" y="238">TXA &lt;3 h + labs</text>
<text x="389" y="250" font-size="8" fill="#6b7280">warm + calcium</text>
</g>
<!-- golden minute -->
<rect x="20" y="266" width="420" height="52" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="230" y="284" font-size="10" font-weight="bold" fill="#111827" text-anchor="middle">GOLDEN MINUTE: dry + stimulate + warm → breathing? → delayed clamping 1–3 min →</text>
<text x="230" y="298" font-size="10" font-weight="bold" fill="#111827" text-anchor="middle">skin-to-skin + breast within 1 h → APGAR 1/5/10 → vitamin K + eyes + BCG/OPV</text>
<text x="230" y="311" font-size="9" fill="#374151" text-anchor="middle">not breathing: airway + bag-mask (MR SOPA) — ventilation before compressions, always</text>
<rect x="0" y="328" width="460" height="162" fill="#f1f5f9"/>
<text x="20" y="350" font-size="10" fill="#111827">Quantify EVERY loss: calibrated drape + weigh pads (1 g ≈ 1 mL) — visual estimates</text>
<text x="20" y="364" font-size="10" fill="#111827">halve reality. Resuscitate in parallel: 2× large-bore, O₂, left tilt, warm, blood + TXA</text>
<text x="20" y="378" font-size="10" fill="#111827">within 3 h, bimanual compression, escalate early (PPH protocol + theatre + ICU).</text>
<text x="20" y="392" font-size="10" fill="#111827">Cord prolapse (cord below presenting part + FHR crash): knee-chest/elbow, gloved</text>
<text x="20" y="406" font-size="10" fill="#111827">hand lifts presenting part OFF the cord, bladder fill, emergency CS — never push</text>
<text x="20" y="420" font-size="10" fill="#111827">the cord back. Shoulder dystocia (turtle sign): McRoberts + suprapubic pressure +</text>
<text x="20" y="434" font-size="10" fill="#111827">internal manoeuvres + episiotomy consideration — HELPERR, no fundal pressure,</text>
<text x="20" y="448" font-size="10" fill="#111827">document head-to-body time. Breech: skilled hands or section — never pull.</text>
</svg>