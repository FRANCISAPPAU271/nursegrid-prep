<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="460" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">INFLAMMATION AND THE WOUND</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">The five signs are not the enemy. They are the repair process arriving at the scene.</text>

<rect x="24" y="60" width="592" height="84" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.8"/>
<text x="320" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8b2f2f">FIVE SIGNS, ONE MECHANISM — MORE BLOOD ARRIVING</text>
<g font-size="10.5" fill="#222">
<text x="38" y="102">REDNESS and HEAT — vessels widen, so more warm blood flows through the area.</text>
<text x="38" y="120">SWELLING — vessel walls become leaky, so fluid and white cells enter the tissue.</text>
<text x="38" y="138">PAIN and LOSS OF FUNCTION — chemicals irritate nerve endings; the part is rested and protected.</text>
</g>

<rect x="24" y="158" width="190" height="94" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.7"/>
<text x="119" y="178" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">PRIMARY INTENTION</text>
<g font-size="9.5" fill="#222">
<text x="36" y="198">Clean edges brought</text>
<text x="36" y="214">together. Heals fast,</text>
<text x="36" y="230">thin scar. A sutured</text>
<text x="36" y="244">surgical incision.</text>
</g>

<rect x="226" y="158" width="190" height="94" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.7"/>
<text x="321" y="178" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a5c3a">SECONDARY INTENTION</text>
<g font-size="9.5" fill="#222">
<text x="238" y="198">Left open to fill from</text>
<text x="238" y="214">the base upward. Slow,</text>
<text x="238" y="230">bigger scar. Used when</text>
<text x="238" y="244">the wound is infected.</text>
</g>

<rect x="428" y="158" width="188" height="94" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.7"/>
<text x="522" y="178" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1e">TERTIARY INTENTION</text>
<g font-size="9.5" fill="#222">
<text x="440" y="198">Deliberately left open</text>
<text x="440" y="214">a few days, cleaned,</text>
<text x="440" y="230">then closed. Best of</text>
<text x="440" y="244">both for dirty wounds.</text>
</g>

<rect x="24" y="266" width="285" height="104" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.7"/>
<text x="166" y="286" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6b3a6b">WHAT SLOWS HEALING</text>
<g font-size="9.5" fill="#222">
<text x="36" y="306">Poor protein and vitamin C intake</text>
<text x="36" y="322">Diabetes, anaemia, poor blood supply</text>
<text x="36" y="338">Infection, foreign body, dead tissue</text>
<text x="36" y="354">Steroids, smoking, age, movement</text>
</g>

<rect x="331" y="266" width="285" height="104" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.7"/>
<text x="473" y="286" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a5c3a">SIGNS THE WOUND IS INFECTED</text>
<g font-size="9.5" fill="#222">
<text x="345" y="306">Increasing rather than settling pain</text>
<text x="345" y="322">Spreading redness, heat, swelling</text>
<text x="345" y="338">Pus, offensive smell, wound breakdown</text>
<text x="345" y="354">Fever and a rising pulse rate</text>
</g>

<rect x="24" y="384" width="592" height="58" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.7"/>
<text x="320" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">KELOID — COMMON, HARMLESS, AND DISTRESSING</text>
<g font-size="10.5" fill="#222">
<text x="38" y="426">Scar tissue that grows beyond the original wound edge. Far more frequent in dark skin, so it matters in</text>
</g>
<text x="38" y="436" font-size="10.5" fill="#222">Ghana. Warn before ear piercing or elective surgery; it recurs after excision, so prevention beats removal.</text>

<text x="320" y="454" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8b2f2f">Pain that increases after day two is the earliest reliable sign that a wound is going wrong.</text>
</svg>