<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="440" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">AUTONOMIC DRUGS — LEARN THE SYSTEM, NOT THE LIST</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">Every side effect of these drugs is the intended action appearing where it was not wanted.</text>

<rect x="30" y="60" width="285" height="176" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.8"/>
<text x="172" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#8b2f2f">SYMPATHETIC — FIGHT OR FLIGHT</text>
<g font-size="10.5" fill="#222">
<text x="44" y="106">Heart faster and harder</text>
<text x="44" y="126">Airways open</text>
<text x="44" y="146">Pupils wide</text>
<text x="44" y="166">Gut and bladder slow down</text>
<text x="44" y="186">Skin vessels tighten, sweating</text>
<text x="44" y="206">Glucose released</text>
</g>
<text x="172" y="228" text-anchor="middle" font-size="10" font-style="italic" fill="#8b2f2f">Blocked by beta-blockers, opposed by alpha-blockers</text>

<rect x="325" y="60" width="285" height="176" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.8"/>
<text x="467" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a5c3a">PARASYMPATHETIC — REST AND DIGEST</text>
<g font-size="10.5" fill="#222">
<text x="339" y="106">Heart slower</text>
<text x="339" y="126">Airways narrow, secretions rise</text>
<text x="339" y="146">Pupils small</text>
<text x="339" y="166">Gut moves, bladder empties</text>
<text x="339" y="186">Saliva and tears flow</text>
<text x="339" y="206">Blocked by atropine and</text>
<text x="339" y="220">every anticholinergic drug</text>
</g>

<rect x="30" y="252" width="580" height="90" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.6"/>
<text x="320" y="272" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1e">THE ANTICHOLINERGIC PATTERN — SIX SIGNS THAT ALWAYS TRAVEL TOGETHER</text>
<g font-size="10.5" fill="#222">
<text x="44" y="294">Dry mouth · blurred vision · constipation · urinary retention · fast pulse · confusion in the elderly</text>
<text x="44" y="314">Many drugs have this effect without being called anticholinergic: some antihistamines, some</text>
<text x="44" y="330">antipsychotics, tricyclic antidepressants, hyoscine. Given together the effects add up and tip a patient over.</text>
</g>

<rect x="30" y="356" width="580" height="52" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.6"/>
<text x="320" y="376" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">WHY A BETA-BLOCKER IS RISKY IN ASTHMA AND IN DIABETES</text>
<text x="44" y="396" font-size="10.5" fill="#222">It narrows airways as well as slowing the heart, and it hides the tremor and fast pulse that warn of hypoglycaemia.</text>

<text x="320" y="430" text-anchor="middle" font-size="11" font-style="italic" fill="#8b2f2f">If you can say what the system does, you can predict the drug's effects and its side effects without memorising them.</text>
</svg>