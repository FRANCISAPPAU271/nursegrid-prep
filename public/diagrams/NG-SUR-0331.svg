<svg viewBox="0 0 470 260" role="img" xmlns="http://www.w3.org/2000/svg"><title>Theatre zones and traffic flow</title>
<rect width="470" height="260" fill="#f6f8fc"/>
<text x="235" y="20" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">Theatre zones — cleanliness rises as you move inward</text>
<rect x="20" y="32" width="430" height="180" rx="10" fill="#fde8e6" stroke="#e2574c" stroke-width="2"/>
<rect x="66" y="52" width="338" height="140" rx="10" fill="#fff8e8" stroke="#f2b705" stroke-width="2"/>
<rect x="112" y="72" width="246" height="100" rx="10" fill="#e8f1f8" stroke="#2b6fa8" stroke-width="2"/>
<rect x="158" y="92" width="154" height="60" rx="8" fill="#dff3ec" stroke="#0f9d76" stroke-width="2.5"/>
<g font-family="system-ui" text-anchor="middle">
<text x="235" y="46" font-size="10" font-weight="700" fill="#a8352c">UNRESTRICTED — street clothes allowed</text>
<text x="235" y="66" font-size="10" font-weight="700" fill="#8a6d00">SEMI-RESTRICTED — scrubs and cap</text>
<text x="235" y="86" font-size="10" font-weight="700" fill="#2b6fa8">RESTRICTED — scrubs, cap and mask</text>
<text x="235" y="112" font-size="11" font-weight="700" fill="#0b7a5c">STERILE FIELD</text>
<text x="235" y="128" font-size="9.5">gowned and gloved staff only</text>
<text x="235" y="143" font-size="9.5">table top to table edge</text>
</g>
<g font-family="system-ui" font-size="9" fill="#5a6b85">
<text x="30" y="200">reception, offices, changing rooms</text>
<text x="76" y="186">corridors, sterile store, scrub area</text>
<text x="122" y="166">operating room, anaesthetic room</text>
</g>
<rect x="20" y="220" width="430" height="32" rx="8" fill="#fff" stroke="#0f9d76" stroke-width="2"/>
<text x="235" y="234" font-size="10" text-anchor="middle" font-family="system-ui" font-weight="700">Traffic moves clean to dirty, never the reverse. Doors stay shut.</text>
<text x="235" y="246" font-size="9.5" text-anchor="middle" font-family="system-ui" fill="#5a6b85">Every door opening stirs air and carries skin scales towards the wound</text>
</svg>