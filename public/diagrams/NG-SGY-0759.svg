<svg viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="430" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">POST-OPERATIVE FEVER — LET THE DAY NARROW THE CAUSE</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">A temperature on day 1 and the same temperature on day 7 mean different things.</text>

<line x1="70" y1="92" x2="596" y2="92" stroke="#1a3a5c" stroke-width="2"/>
<g font-size="10" fill="#333" text-anchor="middle">
<text x="120" y="82">day 1 to 2</text><text x="250" y="82">day 3 to 5</text>
<text x="380" y="82">day 5 to 7</text><text x="510" y="82">day 7 onwards</text>
</g>
<circle cx="120" cy="92" r="5" fill="#5a86a8"/><circle cx="250" cy="92" r="5" fill="#c8a54b"/>
<circle cx="380" cy="92" r="5" fill="#8b2f2f"/><circle cx="510" cy="92" r="5" fill="#6b3a6b"/>

<rect x="46" y="108" width="250" height="96" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.5"/>
<text x="171" y="128" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a3a5c">WIND — the chest</text>
<g font-size="10.5" fill="#222">
<text x="58" y="150">Atelectasis and early chest infection</text>
<text x="58" y="168">Shallow breathing because it hurts</text>
<text x="58" y="186" fill="#1a5c3a">Prevent: analgesia, sit up, deep breaths</text>
</g>

<rect x="344" y="108" width="250" height="96" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.5"/>
<text x="469" y="128" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1e">WATER — the urine</text>
<g font-size="10.5" fill="#222">
<text x="356" y="150">Urinary infection, often catheter related</text>
<text x="356" y="168">Burning, cloudy urine, low output</text>
<text x="356" y="186" fill="#1a5c3a">Prevent: remove the catheter early</text>
</g>

<rect x="46" y="216" width="250" height="96" fill="#f7ecec" stroke="#c08a8a" stroke-width="1.5"/>
<text x="171" y="236" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8b2f2f">WOUND — the incision</text>
<g font-size="10.5" fill="#222">
<text x="58" y="258">Surgical site infection, then abscess</text>
<text x="58" y="276">Redness, heat, discharge, gaping</text>
<text x="58" y="294" fill="#1a5c3a">Prevent: asepsis, glucose control</text>
</g>

<rect x="344" y="216" width="250" height="96" fill="#eaf3ea" stroke="#8fb98f" stroke-width="1.5"/>
<text x="469" y="236" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a5c3a">WALKING — the legs</text>
<g font-size="10.5" fill="#222">
<text x="356" y="258">Deep vein thrombosis, then embolism</text>
<text x="356" y="276">Calf pain and swelling, one side only</text>
<text x="356" y="294" fill="#1a5c3a">Prevent: mobilise on the first day</text>
</g>

<rect x="46" y="324" width="548" height="60" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.5"/>
<text x="320" y="344" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6b3a6b">WONDER DRUGS AND WHAT WE PUT IN — any day at all</text>
<text x="320" y="366" text-anchor="middle" font-size="10.5" fill="#222">Drug reaction, transfusion reaction, infected cannula or central line. Always look at every line and site.</text>

<text x="320" y="410" text-anchor="middle" font-size="11" font-style="italic" fill="#8b2f2f">Fever in the first hours is usually the body's response to surgery; fever that begins after day 3 is usually infection.</text>
<text x="320" y="426" text-anchor="middle" font-size="10.5" fill="#1a3a5c">Examine the patient before ordering anything: chest, urine, wound, calves, and every line.</text>
</svg>