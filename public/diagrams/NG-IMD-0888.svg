<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="440" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">HIV CARE IN GHANA — TEST AND TREAT</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">Nobody waits for a CD4 count any more. A positive test leads straight to treatment.</text>

<rect x="34" y="62" width="176" height="86" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.8"/>
<text x="122" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a3a5c">TEST</text>
<text x="122" y="104" text-anchor="middle" font-size="10" fill="#222">Consent, with counselling</text>
<text x="122" y="120" text-anchor="middle" font-size="10" fill="#222">Result given in person,</text>
<text x="122" y="136" text-anchor="middle" font-size="10" fill="#222">in private, never by phone</text>

<rect x="232" y="62" width="176" height="86" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.8"/>
<text x="320" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a5c3a">TREAT</text>
<text x="320" y="104" text-anchor="middle" font-size="10" fill="#222">Start ART the same day</text>
<text x="320" y="120" text-anchor="middle" font-size="10" fill="#222">where the patient is ready</text>
<text x="320" y="136" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a5c3a">TLD: one tablet, once daily</text>

<rect x="430" y="62" width="176" height="86" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.8"/>
<text x="518" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1e">MONITOR</text>
<text x="518" y="104" text-anchor="middle" font-size="10" fill="#222">Viral load at 6 months,</text>
<text x="518" y="120" text-anchor="middle" font-size="10" fill="#222">then as scheduled</text>
<text x="518" y="136" text-anchor="middle" font-size="10" fill="#222">Above 1,000 copies/mL</text>

<rect x="34" y="168" width="572" height="74" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.6"/>
<text x="320" y="188" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6b3a6b">WHEN THE VIRAL LOAD IS HIGH, ASK ABOUT ADHERENCE BEFORE RESISTANCE</text>
<g font-size="10.5" fill="#222">
<text x="48" y="210">Most unsuppressed viral load is missed doses, not a resistant virus. Ask without blame: what makes it hard?</text>
<text x="48" y="228">Transport cost, stigma, work hours, hunger, side effects, a healer advising them to stop, or simply forgetting.</text>
</g>

<rect x="34" y="262" width="278" height="118" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.6"/>
<text x="173" y="284" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8b2f2f">WATCH FOR THESE</text>
<g font-size="10.5" fill="#222">
<text x="46" y="306">Cough over 2 weeks — screen for TB</text>
<text x="46" y="324">Headache and neck stiffness —</text>
<text x="46" y="338">cryptococcal meningitis</text>
<text x="46" y="356">White plaques in mouth — thrush</text>
<text x="46" y="372">Weight loss, night sweats, diarrhoea</text>
</g>

<rect x="330" y="262" width="276" height="118" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.6"/>
<text x="468" y="284" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a5c3a">WHAT THE NURSE PROTECTS</text>
<g font-size="10.5" fill="#222">
<text x="342" y="306">Confidentiality — including from</text>
<text x="342" y="320">family who ask on the ward</text>
<text x="342" y="340">The right to decide who is told</text>
<text x="342" y="360">Continuity — a missed appointment</text>
<text x="342" y="374">is followed up, not written off</text>
</g>

<text x="320" y="406" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">Undetectable equals untransmittable — a suppressed viral load does not pass HIV on sexually.</text>
<text x="320" y="430" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8b2f2f">Standard precautions apply to every patient. Nothing extra is done because a patient has HIV.</text>
</svg>