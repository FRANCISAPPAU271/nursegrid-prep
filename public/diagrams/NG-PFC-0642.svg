<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="380" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">WRITING A GOAL YOU CAN ACTUALLY EVALUATE</text>

<rect x="20" y="44" width="600" height="52" fill="#f7ecec" stroke="#c08a8a" stroke-width="1.5"/>
<text x="34" y="64" font-size="11" font-weight="bold" fill="#8b2f2f">A GOAL YOU CANNOT EVALUATE</text>
<text x="34" y="84" font-size="11.5" font-style="italic" fill="#222">"Patient will be comfortable."   Comfortable by when? Measured how? Comfortable to whom?</text>

<rect x="20" y="106" width="600" height="52" fill="#eaf3ea" stroke="#8fb98f" stroke-width="1.5"/>
<text x="34" y="126" font-size="11" font-weight="bold" fill="#1a5c3a">A GOAL YOU CAN EVALUATE</text>
<text x="34" y="146" font-size="11.5" font-style="italic" fill="#222">"Patient will report pain of 3 or less out of 10 within 1 hour of analgesia, by 14:00 today."</text>

<rect x="20" y="172" width="600" height="24" fill="#1a3a5c"/>
<text x="320" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">S · M · A · R · T</text>

<g font-size="10.5">
<rect x="20" y="196" width="600" height="30" fill="#eef4f8"/>
<text x="36" y="215" font-weight="bold" fill="#1a3a5c">SPECIFIC</text>
<text x="150" y="215" fill="#222">Exactly what will change, and in whom — not "improve" or "better"</text>
<rect x="20" y="226" width="600" height="30" fill="#fff"/>
<text x="36" y="245" font-weight="bold" fill="#1a3a5c">MEASURABLE</text>
<text x="150" y="245" fill="#222">A number, a scale or an observable action you could photograph</text>
<rect x="20" y="256" width="600" height="30" fill="#eef4f8"/>
<text x="36" y="275" font-weight="bold" fill="#1a3a5c">ACHIEVABLE</text>
<text x="150" y="275" fill="#222">Possible for THIS patient with the resources this ward actually has</text>
<rect x="20" y="286" width="600" height="30" fill="#fff"/>
<text x="36" y="305" font-weight="bold" fill="#1a3a5c">RELEVANT</text>
<text x="150" y="305" fill="#222">Matters to the patient — agreed with them, not decided about them</text>
<rect x="20" y="316" width="600" height="30" fill="#eef4f8"/>
<text x="36" y="335" font-weight="bold" fill="#1a3a5c">TIME-BOUND</text>
<text x="150" y="335" fill="#222">A deadline, so evaluation has a date and cannot drift indefinitely</text>
</g>
<rect x="20" y="196" width="600" height="150" fill="none" stroke="#1a3a5c" stroke-width="1.5"/>
<line x1="140" y1="196" x2="140" y2="346" stroke="#9bb4c8"/>

<text x="320" y="368" text-anchor="middle" font-size="11" font-style="italic" fill="#8b2f2f">The goal belongs to the patient, so it is written as what the PATIENT will do, never what the nurse will do.</text>
</svg>