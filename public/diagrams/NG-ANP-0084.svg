<svg viewBox="0 0 470 230" role="img" xmlns="http://www.w3.org/2000/svg"><title>Gas exchange at the alveolus</title>
<rect width="470" height="230" fill="#f6f8fc"/>
<text x="235" y="20" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">Gases move by DIFFUSION — high to low pressure</text>
<circle cx="150" cy="118" r="62" fill="#fff" stroke="#0a1628" stroke-width="2.5"/>
<text x="150" y="108" font-size="12" text-anchor="middle" font-family="system-ui" font-weight="700">ALVEOLUS</text>
<text x="150" y="126" font-size="9.5" text-anchor="middle" font-family="system-ui">air sac</text>
<text x="150" y="144" font-size="9" text-anchor="middle" font-family="system-ui" fill="#5a6b85">one cell thick</text>
<path d="M212 90 Q260 118 212 146" fill="none" stroke="#e2574c" stroke-width="16" opacity=".3"/>
<path d="M212 90 Q260 118 212 146" fill="none" stroke="#e2574c" stroke-width="2"/>
<text x="268" y="112" font-size="11" font-family="system-ui" font-weight="700" fill="#e2574c">capillary</text>
<text x="268" y="128" font-size="9.5" font-family="system-ui">one cell thick</text>
<path d="M205 100 L172 100" stroke="#2b6fa8" stroke-width="3" marker-end="url(#g1)"/>
<path d="M172 136 L205 136" stroke="#0f9d76" stroke-width="3" marker-end="url(#g1)"/>
<defs><marker id="g1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#5a6b85"/></marker></defs>
<text x="188" y="94" font-size="10" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#2b6fa8">CO₂ out</text>
<text x="188" y="152" font-size="10" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#0f9d76">O₂ in</text>
<rect x="30" y="188" width="410" height="34" rx="8" fill="#fff" stroke="#f2b705" stroke-width="2"/>
<text x="235" y="203" font-size="10.5" text-anchor="middle" font-family="system-ui" font-weight="700">Anything that THICKENS this barrier impairs exchange</text>
<text x="235" y="216" font-size="9.5" text-anchor="middle" font-family="system-ui" fill="#5a6b85">pulmonary oedema · pneumonia · fibrosis</text>
</svg>