<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" role="img" aria-label="Assessing the safety of food from a street vendor">
<rect width="460" height="250" fill="#ffffff"/>
<text x="230" y="22" text-anchor="middle" font-family="Georgia,serif" font-size="15" font-weight="bold" fill="#14532d">Judging a food vendor in sixty seconds</text>
<rect x="26" y="38" width="196" height="150" fill="#f0fdf4" stroke="#14532d"/>
<text x="124" y="57" text-anchor="middle" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#14532d">Reassuring</text>
<text x="36" y="77" font-family="Georgia,serif" font-size="10.5">• food cooked in front of you</text>
<text x="36" y="94" font-family="Georgia,serif" font-size="10.5">• served piping hot, steaming</text>
<text x="36" y="111" font-family="Georgia,serif" font-size="10.5">• covered from flies and dust</text>
<text x="36" y="128" font-family="Georgia,serif" font-size="10.5">• clean water for washing</text>
<text x="36" y="145" font-family="Georgia,serif" font-size="10.5">• money handled separately</text>
<text x="36" y="162" font-family="Georgia,serif" font-size="10.5">• high turnover, nothing stands</text>
<text x="36" y="179" font-family="Georgia,serif" font-size="10.5">• vendor has a health screening</text>
<rect x="238" y="38" width="196" height="150" fill="#fef2f2" stroke="#991b1b"/>
<text x="336" y="57" text-anchor="middle" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#991b1b">Warning signs</text>
<text x="248" y="77" font-family="Georgia,serif" font-size="10.5">• food lukewarm, sitting out</text>
<text x="248" y="94" font-family="Georgia,serif" font-size="10.5">• reheated once already</text>
<text x="248" y="111" font-family="Georgia,serif" font-size="10.5">• uncovered, flies settling</text>
<text x="248" y="128" font-family="Georgia,serif" font-size="10.5">• same hands take cash and food</text>
<text x="248" y="145" font-family="Georgia,serif" font-size="10.5">• one bowl of water reused</text>
<text x="248" y="162" font-family="Georgia,serif" font-size="10.5">• raw salad rinsed in that water</text>
<text x="248" y="179" font-family="Georgia,serif" font-size="10.5">• cooked food beside raw meat</text>
<text x="230" y="212" text-anchor="middle" font-family="Georgia,serif" font-size="12.5" font-weight="bold" fill="#7c2d12">The danger zone is 5 °C to 60 °C.</text>
<text x="230" y="234" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#334155">Cook it, cover it, keep it hot — or leave it. Time at warm is the risk.</text>
</svg>