<svg viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="430" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">UNDERWATER SEAL CHEST DRAINAGE</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">The water is a one-way valve: air leaves the chest, nothing gets back in.</text>

<path d="M120 80 q60 -18 120 0 l14 150 q-74 22 -148 0 z" fill="#f4eaea" stroke="#8b2f2f" stroke-width="2"/>
<text x="180" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b2f2f">PLEURAL SPACE</text>
<text x="180" y="136" text-anchor="middle" font-size="10" fill="#444">air or blood collecting</text>
<text x="180" y="154" text-anchor="middle" font-size="10" fill="#444">lung pressed down</text>
<path d="M150 170 q30 -14 60 0 q-4 40 -30 46 q-26 -6 -30 -46 z" fill="#dfe9f2" stroke="#5a86a8" stroke-width="1.5"/>
<text x="180" y="200" text-anchor="middle" font-size="10" fill="#1a3a5c">lung</text>

<path d="M254 214 L254 300 L360 300 L360 336" fill="none" stroke="#333" stroke-width="3"/>
<text x="300" y="292" text-anchor="middle" font-size="10" fill="#333">drainage tube — kept free of loops and kinks</text>

<rect x="316" y="330" width="120" height="86" fill="#eef4f8" stroke="#1a3a5c" stroke-width="2"/>
<rect x="316" y="368" width="120" height="48" fill="#cfe0ee" stroke="#1a3a5c" stroke-width="1"/>
<path d="M360 336 L360 392" fill="none" stroke="#333" stroke-width="3"/>
<text x="376" y="392" font-size="9.5" fill="#8b2f2f">tip 2 cm under water</text>
<text x="376" y="360" font-size="9.5" fill="#333">air escapes here</text>
<text x="376" y="412" font-size="9.5" fill="#1a3a5c">sterile water seal</text>

<text x="470" y="86" font-size="12.5" font-weight="bold" fill="#1a3a5c">WHAT YOU CHECK</text>
<g font-size="10.5" fill="#222">
<text x="470" y="108">Swinging with breathing</text>
<text x="482" y="124" fill="#1a5c3a">= tube is patent. GOOD.</text>
<text x="470" y="146">Swinging has stopped</text>
<text x="482" y="162" fill="#8b2f2f">= blocked, kinked, or lung</text>
<text x="482" y="176" fill="#8b2f2f">has fully re-expanded</text>
<text x="470" y="198">Bubbling on coughing only</text>
<text x="482" y="214" fill="#1a5c3a">= expected early</text>
<text x="470" y="236">Continuous bubbling</text>
<text x="482" y="252" fill="#8b2f2f">= air leak in the system</text>
<text x="470" y="274">Sudden heavy fresh blood</text>
<text x="482" y="290" fill="#8b2f2f">= report at once</text>
</g>

<rect x="44" y="252" width="216" height="140" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.5"/>
<text x="152" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1e">NEVER</text>
<g font-size="10.5" fill="#222">
<text x="56" y="296">Raise the bottle above the chest</text>
<text x="56" y="316">Clamp for transfer or for a walk</text>
<text x="56" y="336">Empty or change it casually</text>
<text x="56" y="356">Leave it on its side or knocked over</text>
</g>
<text x="152" y="380" text-anchor="middle" font-size="10" font-style="italic" fill="#8b2f2f">Clamping a bubbling drain can cause</text>
<text x="152" y="392" text-anchor="middle" font-size="10" font-style="italic" fill="#8b2f2f">tension pneumothorax.</text>

<text x="320" y="426" text-anchor="middle" font-size="10.5" font-style="italic" fill="#1a3a5c">If the tube pulls out: cover with a dressing taped on three sides, not four, and call for help.</text>
</svg>