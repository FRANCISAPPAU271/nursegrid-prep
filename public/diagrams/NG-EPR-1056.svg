<svg viewBox="0 0 640 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="450" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">THE FEMALE CYCLE — ONE MONTH, TWO ORGANS</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">The ovary runs a cycle and the uterus runs a cycle. They are driven by the same hormones.</text>

<line x1="60" y1="150" x2="600" y2="150" stroke="#999" stroke-width="1"/>
<text x="60" y="168" font-size="9.5" fill="#666">Day 1</text>
<text x="200" y="168" font-size="9.5" fill="#666">Day 7</text>
<text x="330" y="168" font-size="9.5" font-weight="bold" fill="#8b2f2f">Day 14</text>
<text x="470" y="168" font-size="9.5" fill="#666">Day 21</text>
<text x="565" y="168" font-size="9.5" fill="#666">Day 28</text>
<line x1="336" y1="70" x2="336" y2="150" stroke="#8b2f2f" stroke-width="1.6" stroke-dasharray="4,3"/>
<text x="336" y="64" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8b2f2f">OVULATION</text>

<rect x="60" y="80" width="276" height="30" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.4"/>
<text x="198" y="100" text-anchor="middle" font-size="10.5" fill="#1a3a5c">OVARY: follicular phase — a follicle ripens</text>
<rect x="336" y="80" width="264" height="30" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.4"/>
<text x="468" y="100" text-anchor="middle" font-size="10.5" fill="#1a5c3a">OVARY: luteal phase — corpus luteum</text>

<rect x="60" y="114" width="90" height="30" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.4"/>
<text x="105" y="134" text-anchor="middle" font-size="10" fill="#8b2f2f">menstrual</text>
<rect x="150" y="114" width="186" height="30" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.4"/>
<text x="243" y="134" text-anchor="middle" font-size="10" fill="#8a6d1e">UTERUS: proliferative — lining rebuilds</text>
<rect x="336" y="114" width="264" height="30" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.4"/>
<text x="468" y="134" text-anchor="middle" font-size="10" fill="#6b3a6b">UTERUS: secretory — lining prepares to receive</text>

<rect x="30" y="186" width="285" height="112" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.7"/>
<text x="172" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">THE SECOND HALF IS FIXED</text>
<g font-size="10" fill="#222">
<text x="44" y="228">From ovulation to the next period is</text>
<text x="44" y="244">almost always about 14 days.</text>
<text x="44" y="266">It is the FIRST half that varies. So in a</text>
<text x="44" y="282">35-day cycle, ovulation is near day 21.</text>
</g>

<rect x="325" y="186" width="285" height="112" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.7"/>
<text x="467" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5c3a">SIGNS THAT OVULATION IS NEAR</text>
<g font-size="10" fill="#222">
<text x="339" y="228">Cervical mucus becomes clear, slippery</text>
<text x="339" y="244">and stretchy, like raw egg white</text>
<text x="339" y="266">Basal temperature rises slightly AFTER</text>
<text x="339" y="282">ovulation — it confirms, it cannot predict</text>
</g>

<rect x="30" y="314" width="580" height="76" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.7"/>
<text x="320" y="334" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8b2f2f">NO CORPUS LUTEUM, NO PREGNANCY</text>
<g font-size="10.5" fill="#222">
<text x="44" y="356">If the egg is not fertilised the corpus luteum dies, progesterone falls, and the lining is shed. That is a period.</text>
<text x="44" y="376">If it is fertilised, the embryo makes hCG, which keeps the corpus luteum alive until the placenta takes over.</text>
</g>

<text x="320" y="414" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">A woman is born with every egg she will ever have. A man makes new sperm every day of his adult life.</text>
<text x="320" y="436" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8b2f2f">This single difference explains why maternal age raises the risk of chromosomal error.</text>
</svg>