<svg viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect x="0" y="0" width="720" height="480" fill="#f9f7f4"/>
<text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#5b4a2e">Investigating an outbreak: the order that finds the source</text>
<text x="360" y="50" text-anchor="middle" font-size="12.5" fill="#7a6a58">Control does not wait for the laboratory</text>

<rect x="30" y="66" width="325" height="176" rx="7" fill="#f2ece2" stroke="#c9b79c"/>
<text x="45" y="87" font-size="13.5" font-weight="bold" fill="#5b4a2e">The steps, in working order</text>
<text x="45" y="108" font-size="11.5" fill="#3f3428">1. Confirm the diagnosis and confirm it is an outbreak</text>
<text x="45" y="127" font-size="11.5" fill="#3f3428">2. Write a case definition and use it for everyone</text>
<text x="45" y="146" font-size="11.5" fill="#3f3428">3. Find cases actively; do not wait for them</text>
<text x="45" y="165" font-size="11.5" fill="#3f3428">4. Describe by person, place and time</text>
<text x="45" y="184" font-size="11.5" fill="#3f3428">5. Form a hypothesis about the source</text>
<text x="45" y="203" font-size="11.5" fill="#3f3428">6. Test it, and write it up</text>
<text x="45" y="226" font-size="11.5" font-weight="bold" fill="#8a3018">Control measures run alongside from day one</text>

<rect x="365" y="66" width="325" height="176" rx="7" fill="#eaf1f7" stroke="#9fb9cd"/>
<text x="380" y="87" font-size="13.5" font-weight="bold" fill="#1d3f5e">The case definition does the work</text>
<text x="380" y="108" font-size="11.5" fill="#26333d">It states person, place, time and clinical features</text>
<text x="380" y="127" font-size="11.5" fill="#26333d">Wide at the start, so that no case is missed</text>
<text x="380" y="146" font-size="11.5" fill="#26333d">Narrower later, when you are testing a cause</text>
<text x="380" y="167" font-size="11.5" font-weight="bold" fill="#1d3f5e">The same definition in every facility</text>
<text x="380" y="188" font-size="11.5" font-style="italic" fill="#7a5a2a">Otherwise the rise in cases is only a change</text>
<text x="380" y="205" font-size="11.5" font-style="italic" fill="#7a5a2a">in who was counted</text>
<text x="380" y="228" font-size="11.5" fill="#26333d">Suspected, probable and confirmed are all counted</text>

<rect x="30" y="258" width="325" height="196" rx="7" fill="#f6e9e6" stroke="#c98f80"/>
<text x="45" y="279" font-size="13.5" font-weight="bold" fill="#8a3018">Reading the epidemic curve</text>
<line x1="55" y1="400" x2="330" y2="400" stroke="#8a3018" stroke-width="1.5"/>
<line x1="55" y1="300" x2="55" y2="400" stroke="#8a3018" stroke-width="1.5"/>
<rect x="66" y="384" width="14" height="16" fill="#c98f80"/>
<rect x="84" y="360" width="14" height="40" fill="#c98f80"/>
<rect x="102" y="330" width="14" height="70" fill="#c98f80"/>
<rect x="120" y="342" width="14" height="58" fill="#c98f80"/>
<rect x="138" y="372" width="14" height="28" fill="#c98f80"/>
<text x="106" y="416" text-anchor="middle" font-size="10.5" fill="#3f2b26">One sharp peak</text>
<text x="106" y="430" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a3018">A single common source</text>
<rect x="196" y="386" width="12" height="14" fill="#a9633f"/>
<rect x="212" y="378" width="12" height="22" fill="#a9633f"/>
<rect x="228" y="366" width="12" height="34" fill="#a9633f"/>
<rect x="244" y="356" width="12" height="44" fill="#a9633f"/>
<rect x="260" y="346" width="12" height="54" fill="#a9633f"/>
<rect x="276" y="338" width="12" height="62" fill="#a9633f"/>
<text x="248" y="416" text-anchor="middle" font-size="10.5" fill="#3f2b26">A steady climb</text>
<text x="248" y="430" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a3018">Spread person to person</text>
<text x="45" y="448" font-size="11" font-style="italic" fill="#7a5a2a">The shape of the curve names the kind of outbreak</text>

<rect x="365" y="258" width="325" height="196" rx="7" fill="#e9f2ec" stroke="#8fb59d"/>
<text x="380" y="279" font-size="13.5" font-weight="bold" fill="#1d5236">Ghana IDSR: report before you are certain</text>
<text x="380" y="300" font-size="11.5" fill="#26333d">Immediately notifiable: cholera, meningitis,</text>
<text x="380" y="317" font-size="11.5" fill="#26333d">yellow fever, measles, viral haemorrhagic fever,</text>
<text x="380" y="334" font-size="11.5" fill="#26333d">acute flaccid paralysis, neonatal tetanus,</text>
<text x="380" y="351" font-size="11.5" fill="#26333d">guinea worm, any unusual cluster of illness</text>
<text x="380" y="374" font-size="11.5" font-weight="bold" fill="#1d5236">One suspected case is a reportable event</text>
<text x="380" y="395" font-size="11.5" fill="#26333d">Zero reporting: send the form even with no cases,</text>
<text x="380" y="412" font-size="11.5" fill="#26333d">so that silence means checked, not forgotten</text>
<text x="380" y="435" font-size="11" font-style="italic" fill="#7a5a2a">A confirmed case is a late case. Report the suspicion.</text>
</svg>