<svg viewBox="0 0 470 250" role="img" xmlns="http://www.w3.org/2000/svg"><title>Negative feedback in the thyroid axis</title>
<rect width="470" height="250" fill="#f6f8fc"/>
<text x="235" y="20" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">Negative feedback — the thyroid axis</text>
<rect x="165" y="34" width="140" height="38" rx="8" fill="#fde8e6" stroke="#e2574c" stroke-width="2"/>
<text x="235" y="50" font-size="10.5" text-anchor="middle" font-family="system-ui" font-weight="700">HYPOTHALAMUS</text>
<text x="235" y="64" font-size="9.5" text-anchor="middle" font-family="system-ui">releases TRH</text>
<rect x="165" y="98" width="140" height="38" rx="8" fill="#fff3e0" stroke="#f2b705" stroke-width="2"/>
<text x="235" y="114" font-size="10.5" text-anchor="middle" font-family="system-ui" font-weight="700">ANTERIOR PITUITARY</text>
<text x="235" y="128" font-size="9.5" text-anchor="middle" font-family="system-ui">releases TSH</text>
<rect x="165" y="162" width="140" height="38" rx="8" fill="#e8f1f8" stroke="#2b6fa8" stroke-width="2"/>
<text x="235" y="178" font-size="10.5" text-anchor="middle" font-family="system-ui" font-weight="700">THYROID GLAND</text>
<text x="235" y="192" font-size="9.5" text-anchor="middle" font-family="system-ui">releases T3 and T4</text>
<line x1="235" y1="72" x2="235" y2="94" stroke="#5a6b85" stroke-width="2" marker-end="url(#a)"/>
<line x1="235" y1="136" x2="235" y2="158" stroke="#5a6b85" stroke-width="2" marker-end="url(#a)"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#5a6b85"/></marker>
<marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e2574c"/></marker></defs>
<path d="M165,181 L120,181 L120,53 L161,53" fill="none" stroke="#e2574c" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#b)"/>
<path d="M305,181 L350,181 L350,117 L309,117" fill="none" stroke="#e2574c" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#b)"/>
<text x="66" y="112" font-size="9.5" font-family="system-ui" fill="#a8352c" font-weight="700">rising T3/T4</text>
<text x="66" y="126" font-size="9.5" font-family="system-ui" fill="#a8352c">switches the</text>
<text x="66" y="140" font-size="9.5" font-family="system-ui" fill="#a8352c">axis OFF</text>
<text x="360" y="146" font-size="9.5" font-family="system-ui" fill="#a8352c" font-weight="700">falling T3/T4</text>
<text x="360" y="160" font-size="9.5" font-family="system-ui" fill="#a8352c">switches it ON</text>
<rect x="20" y="212" width="430" height="30" rx="8" fill="#fff" stroke="#0f9d76" stroke-width="2"/>
<text x="235" y="225" font-size="10" text-anchor="middle" font-family="system-ui" font-weight="700">Reading the pair tells you where the fault lies</text>
<text x="235" y="237" font-size="9.5" text-anchor="middle" font-family="system-ui" fill="#5a6b85">High TSH with low T4 = the gland has failed. Low TSH with high T4 = the gland is overacting.</text>
</svg>