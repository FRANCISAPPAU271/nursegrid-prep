<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 474" width="100%" role="img">
<rect x="0" y="0" width="760" height="474" fill="#fdfcfa"/>
<text x="20" y="30" font-family="Georgia,serif" font-size="19" font-weight="bold" fill="#1d4e63">Stroke: recognise it, then protect what the brain can no longer protect</text>
<text x="20" y="52" font-family="Georgia,serif" font-size="13" fill="#555">Most stroke deaths on a ward are not from the stroke itself. They are from what the stroke let happen.</text>

<rect x="20" y="68" width="352" height="164" rx="6" fill="#fff3f0" stroke="#c0392b"/>
<text x="34" y="90" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#7a2020">Sudden is the word that matters</text>
<text x="34" y="114" font-family="Georgia,serif" font-size="12" fill="#333">Face drooping on one side</text>
<text x="34" y="134" font-family="Georgia,serif" font-size="12" fill="#333">Arm or leg weakness on one side</text>
<text x="34" y="154" font-family="Georgia,serif" font-size="12" fill="#333">Speech slurred, lost, or not understood</text>
<text x="34" y="174" font-family="Georgia,serif" font-size="12" fill="#333">Sudden severe headache, or loss of vision</text>
<text x="34" y="200" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#7a2020">Note the time she was last seen well.</text>
<text x="34" y="220" font-family="Georgia,serif" font-size="11" font-style="italic" fill="#7a2020">That single time decides which treatments remain possible.</text>

<rect x="388" y="68" width="352" height="164" rx="6" fill="#fff8e8" stroke="#b8860b"/>
<text x="402" y="90" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#8a6508">Why swallowing is checked before anything</text>
<text x="402" y="114" font-family="Georgia,serif" font-size="12" fill="#333">A stroke can paralyse the swallow silently.</text>
<text x="402" y="134" font-family="Georgia,serif" font-size="12" fill="#333">Food and fluid then enter the lung instead</text>
<text x="402" y="152" font-family="Georgia,serif" font-size="12" fill="#333">of the stomach, often without a cough.</text>
<text x="402" y="178" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#8a6508">Nil by mouth, including her tablets and</text>
<text x="402" y="196" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#8a6508">her water, until the swallow is screened.</text>
<text x="402" y="218" font-family="Georgia,serif" font-size="11" font-style="italic" fill="#8a6508">Aspiration pneumonia is the commonest killer after stroke.</text>

<rect x="20" y="248" width="232" height="128" rx="6" fill="#eef4f8" stroke="#2b6b8a"/>
<text x="34" y="270" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#1d4e63">The skin</text>
<text x="34" y="292" font-family="Georgia,serif" font-size="11" fill="#333">She cannot feel pressure and</text>
<text x="34" y="308" font-family="Georgia,serif" font-size="11" fill="#333">cannot shift her own weight.</text>
<text x="34" y="330" font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#1d4e63">Reposition on a schedule, not</text>
<text x="34" y="346" font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#1d4e63">when she asks to be moved.</text>
<text x="34" y="366" font-family="Georgia,serif" font-size="10" font-style="italic" fill="#1d4e63">She will never ask.</text>

<rect x="264" y="248" width="232" height="128" rx="6" fill="#f2f7f2" stroke="#2e7d5b"/>
<text x="278" y="270" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#1d5c42">The weak limb</text>
<text x="278" y="292" font-family="Georgia,serif" font-size="11" fill="#333">A flaccid shoulder dislocates</text>
<text x="278" y="308" font-family="Georgia,serif" font-size="11" fill="#333">if it is pulled or left hanging.</text>
<text x="278" y="330" font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#1d5c42">Support it, never lift her by</text>
<text x="278" y="346" font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#1d5c42">the affected arm.</text>
<text x="278" y="366" font-family="Georgia,serif" font-size="10" font-style="italic" fill="#1d5c42">Position against contracture from day one.</text>

<rect x="508" y="248" width="232" height="128" rx="6" fill="#f6f2fa" stroke="#6b4c93"/>
<text x="522" y="270" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#4a326b">The speech</text>
<text x="522" y="292" font-family="Georgia,serif" font-size="11" fill="#333">Aphasia is a language problem,</text>
<text x="522" y="308" font-family="Georgia,serif" font-size="11" fill="#333">not deafness and not stupidity.</text>
<text x="522" y="330" font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#4a326b">Short sentences, one idea, time</text>
<text x="522" y="346" font-family="Georgia,serif" font-size="11" font-weight="bold" fill="#4a326b">to answer. Do not shout.</text>
<text x="522" y="366" font-family="Georgia,serif" font-size="10" font-style="italic" fill="#4a326b">Speak to her, never over her to the relative.</text>

<rect x="20" y="392" width="720" height="66" rx="6" fill="#fff8e8" stroke="#b8860b"/>
<text x="34" y="414" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#8a6508">Preventing the next one starts on the ward</text>
<text x="34" y="436" font-family="Georgia,serif" font-size="12" fill="#333">The strongest thing anyone can do to prevent a second stroke is control the blood pressure — which means the tablets</text>
<text x="34" y="452" font-family="Georgia,serif" font-size="12" fill="#333">continue for life, not until the readings look normal.</text>
</svg>