<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 500" font-family="sans-serif">
<rect x="0" y="0" width="460" height="500" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#111827">The heart: chambers, valves, one-way flow</text>
<text x="60" y="52" font-size="12" font-weight="bold" fill="#1d4ed8">RIGHT — to lungs</text>
<text x="290" y="52" font-size="12" font-weight="bold" fill="#b91c1c">LEFT — to body</text>
<!-- vessels top -->
<g stroke-width="6" fill="none">
<line x1="120" y1="60" x2="120" y2="110" stroke="#1d4ed8"/>
<line x1="340" y1="60" x2="340" y2="105" stroke="#b91c1c"/>
<path d="M195,60 C195,110 250,110 265,150" stroke="#7c3aed"/>
<path d="M265,60 C265,110 210,110 195,150" stroke="#b91c1c"/>
</g>
<g font-size="9" fill="#111827" text-anchor="middle">
<text x="120" y="72">SVC</text>
<text x="340" y="72">aorta</text>
<text x="195" y="72">pulmonary</text>
<text x="265" y="72">pulmonary</text>
<text x="195" y="82">trunk</text>
<text x="265" y="82">veins</text>
</g>
<!-- heart body -->
<path d="M80,120 L380,120 C380,260 320,330 230,380 C140,330 80,260 80,120 Z" fill="#fef2f2" stroke="#7f1d1d" stroke-width="2"/>
<!-- septum + valve plane -->
<line x1="230" y1="120" x2="230" y2="372" stroke="#7f1d1d" stroke-width="2"/>
<line x1="84" y1="205" x2="376" y2="205" stroke="#7f1d1d" stroke-width="1.5"/>
<!-- chamber washes -->
<rect x="88" y="128" width="134" height="69" fill="#dbeafe" opacity="0.7"/>
<rect x="88" y="213" width="134" height="120" fill="#dbeafe" opacity="0.45"/>
<rect x="238" y="128" width="134" height="69" fill="#fecaca" opacity="0.7"/>
<rect x="238" y="213" width="134" height="120" fill="#fecaca" opacity="0.45"/>
<!-- chamber labels -->
<g font-size="11" font-weight="bold" text-anchor="middle">
<text x="155" y="155" fill="#1e40af">RA</text>
<text x="155" y="270" fill="#1e40af">RV</text>
<text x="305" y="155" fill="#991b1b">LA</text>
<text x="305" y="270" fill="#991b1b">LV</text>
</g>
<g font-size="8" fill="#374151" text-anchor="middle">
<text x="155" y="168">right atrium</text>
<text x="155" y="283">right ventricle</text>
<text x="305" y="168">left atrium</text>
<text x="305" y="283">left ventricle (thickest)</text>
</g>
<!-- valves -->
<g font-size="9" font-weight="bold" text-anchor="middle" fill="#111827">
<line x1="130" y1="205" x2="180" y2="205" stroke="#111827" stroke-width="3"/>
<text x="155" y="199">tricuspid</text>
<line x1="280" y1="205" x2="330" y2="205" stroke="#111827" stroke-width="3"/>
<text x="305" y="199">mitral</text>
<text x="200" y="132" font-size="8">pulmonary</text>
<text x="262" y="250" font-size="8">aortic</text>
<circle cx="200" cy="142" r="4" fill="none" stroke="#111827" stroke-width="2"/>
<circle cx="262" cy="260" r="4" fill="none" stroke="#111827" stroke-width="2"/>
</g>
<!-- flow arrows numbered -->
<g font-size="10" font-weight="bold">
<g fill="#1d4ed8">
<text x="100" y="140">➊</text><text x="120" y="240">➋</text><text x="185" y="170">➌</text>
</g>
<g fill="#b91c1c">
<text x="278" y="150">➍</text><text x="340" y="240">➎</text><text x="300" y="330">➏</text>
</g>
</g>
<text x="90" y="352" font-size="9" fill="#374151">IVC ↑ (from below)</text>
<rect x="0" y="368" width="460" height="132" fill="#f1f5f9"/>
<text x="20" y="390" font-size="10" fill="#111827">Flow: body → RA ➊ → RV ➋ → lungs ➌ → LA ➍ → LV ➎ → body ➏. Right is the low-</text>
<text x="20" y="404" font-size="10" fill="#111827">pressure lung pump; left is the high-pressure body pump — LV wall 3× thicker.</text>
<text x="20" y="418" font-size="10" fill="#111827">S1 = AV valves shut (lub); S2 = semilunars shut (dub). Coronaries branch first off</text>
<text x="20" y="432" font-size="10" fill="#111827">the aorta and fill in DIASTOLE — a racing heart starves itself. LAD: the widowmaker.</text>
<text x="20" y="446" font-size="10" fill="#111827">Stenosis = stiff, won't open. Regurgitation = leaky, won't shut. Murmur = turbulence.</text>
<text x="20" y="460" font-size="10" fill="#111827">Apex (PMI): 5th ICS, midclavicular — where the apical pulse lives.</text>
</svg>