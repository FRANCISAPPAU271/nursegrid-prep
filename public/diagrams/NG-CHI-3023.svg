<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 250" role="img">
<rect width="470" height="250" fill="#ffffff"/>
<text x="235" y="24" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Classifying dehydration in a child with diarrhoea</text>
<rect x="25" y="38" width="140" height="150" fill="#dcfce7" stroke="#15803d"/>
<text x="95" y="58" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#14532d">NO dehydration</text>
<text x="95" y="80" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">alert</text>
<text x="95" y="96" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">drinks normally</text>
<text x="95" y="112" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">eyes normal</text>
<text x="95" y="128" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">skin pinch goes</text>
<text x="95" y="142" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">back at once</text>
<text x="95" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#15803d">Plan A: home</text>
<text x="95" y="182" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#15803d">ORS + zinc</text>
<rect x="167" y="38" width="140" height="150" fill="#fef3c7" stroke="#b45309"/>
<text x="237" y="58" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350f">SOME dehydration</text>
<text x="237" y="80" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">restless, irritable</text>
<text x="237" y="96" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">thirsty, drinks eagerly</text>
<text x="237" y="112" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">sunken eyes</text>
<text x="237" y="128" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">skin pinch goes back</text>
<text x="237" y="142" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">slowly</text>
<text x="237" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b45309">Plan B: ORS at</text>
<text x="237" y="182" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#b45309">the facility, 4 hours</text>
<rect x="309" y="38" width="140" height="150" fill="#fee2e2" stroke="#b91c1c"/>
<text x="379" y="58" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7f1d1d">SEVERE dehydration</text>
<text x="379" y="80" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f1d1d">lethargic or</text>
<text x="379" y="94" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f1d1d">unconscious</text>
<text x="379" y="110" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f1d1d">drinks poorly or</text>
<text x="379" y="124" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f1d1d">not at all</text>
<text x="379" y="140" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f1d1d">pinch: very slow</text>
<text x="379" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">Plan C: IV fluids</text>
<text x="379" y="182" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#b91c1c">immediately</text>
<rect x="25" y="200" width="424" height="40" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="237" y="217" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Two signs from a column classify the child in that column.</text>
<text x="237" y="233" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">Always classify to the MOST severe column for which two signs are present.</text>
</svg>