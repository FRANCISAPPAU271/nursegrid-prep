<svg viewBox="0 0 640 390" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="390" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">THE NEWBORN — APGAR AND JAUNDICE</text>

<rect x="24" y="42" width="592" height="26" fill="#1a3a5c"/>
<text x="34" y="60" font-size="12" font-weight="bold" fill="#fff">APGAR — scored at 1 and 5 minutes</text>
<text x="330" y="60" font-size="11" fill="#fff">0</text>
<text x="420" y="60" font-size="11" fill="#fff">1</text>
<text x="520" y="60" font-size="11" fill="#fff">2</text>

<rect x="24" y="68" width="592" height="24" fill="#fff" stroke="#d8d2c4"/>
<text x="34" y="85" font-size="11" fill="#333">A — Appearance (colour)</text>
<text x="330" y="85" font-size="10" fill="#555">blue/pale</text>
<text x="420" y="85" font-size="10" fill="#555">body pink, limbs blue</text>
<text x="520" y="85" font-size="10" fill="#555">all pink</text>
<rect x="24" y="92" width="592" height="24" fill="#f6f3ec" stroke="#d8d2c4"/>
<text x="34" y="109" font-size="11" fill="#333">P — Pulse</text>
<text x="330" y="109" font-size="10" fill="#555">absent</text>
<text x="420" y="109" font-size="10" fill="#555">under 100</text>
<text x="520" y="109" font-size="10" fill="#555">100 or more</text>
<rect x="24" y="116" width="592" height="24" fill="#fff" stroke="#d8d2c4"/>
<text x="34" y="133" font-size="11" fill="#333">G — Grimace (reflex)</text>
<text x="330" y="133" font-size="10" fill="#555">none</text>
<text x="420" y="133" font-size="10" fill="#555">grimace only</text>
<text x="520" y="133" font-size="10" fill="#555">cry, cough, sneeze</text>
<rect x="24" y="140" width="592" height="24" fill="#f6f3ec" stroke="#d8d2c4"/>
<text x="34" y="157" font-size="11" fill="#333">A — Activity (tone)</text>
<text x="330" y="157" font-size="10" fill="#555">limp</text>
<text x="420" y="157" font-size="10" fill="#555">some flexion</text>
<text x="520" y="157" font-size="10" fill="#555">active movement</text>
<rect x="24" y="164" width="592" height="24" fill="#fff" stroke="#d8d2c4"/>
<text x="34" y="181" font-size="11" fill="#333">R — Respiration</text>
<text x="330" y="181" font-size="10" fill="#555">absent</text>
<text x="420" y="181" font-size="10" fill="#555">slow, irregular, weak cry</text>
<text x="520" y="181" font-size="10" fill="#555">good strong cry</text>

<rect x="24" y="192" width="592" height="26" fill="#fff3cd" stroke="#e0c86a"/>
<text x="320" y="209" text-anchor="middle" font-size="11" font-style="italic" fill="#6b5410">Apgar MONITORS the response to resuscitation. It never decides whether to start it — a flat baby is resuscitated at once.</text>

<text x="320" y="242" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3a5c">NEONATAL JAUNDICE — WHEN IT APPEARS TELLS YOU WHAT IT IS</text>

<rect x="24" y="252" width="192" height="128" fill="#f7d9d9" stroke="#8b2f2f" stroke-width="2"/>
<text x="120" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b2f2f">UNDER 24 HOURS</text>
<text x="120" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b2f2f">ALWAYS PATHOLOGICAL</text>
<text x="34" y="310" font-size="10" fill="#333">Haemolysis until proved</text>
<text x="34" y="324" font-size="10" fill="#333">otherwise — rhesus or ABO</text>
<text x="34" y="338" font-size="10" fill="#333">incompatibility, G6PD</text>
<text x="34" y="352" font-size="10" fill="#333">deficiency, sepsis.</text>
<text x="34" y="370" font-size="10" font-weight="bold" fill="#8b2f2f">Refer immediately.</text>

<rect x="224" y="252" width="192" height="128" fill="#e2f0e2" stroke="#1a5c3a" stroke-width="2"/>
<text x="320" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5c3a">DAY 2 TO DAY 5</text>
<text x="320" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a5c3a">USUALLY PHYSIOLOGICAL</text>
<text x="234" y="310" font-size="10" fill="#333">Immature liver enzymes and</text>
<text x="234" y="324" font-size="10" fill="#333">a short red cell lifespan.</text>
<text x="234" y="344" font-size="10" fill="#333">Peaks about day 3 to 4,</text>
<text x="234" y="358" font-size="10" fill="#333">settles by day 10. Feed</text>
<text x="234" y="372" font-size="10" fill="#333">frequently, monitor level.</text>

<rect x="424" y="252" width="192" height="128" fill="#f7d9d9" stroke="#8b2f2f" stroke-width="2"/>
<text x="520" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b2f2f">AFTER DAY 14</text>
<text x="520" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b2f2f">PROLONGED — INVESTIGATE</text>
<text x="434" y="310" font-size="10" fill="#333">Check the STOOL and URINE.</text>
<text x="434" y="330" font-size="10" fill="#333">Pale stool with dark urine</text>
<text x="434" y="344" font-size="10" fill="#333">means biliary atresia —</text>
<text x="434" y="358" font-size="10" fill="#333">surgery is time critical.</text>
<text x="434" y="374" font-size="10" fill="#333">Also hypothyroidism.</text>
</svg>