<svg viewBox="0 0 470 260" role="img" xmlns="http://www.w3.org/2000/svg"><title>Mitosis compared with meiosis</title>
<rect width="470" height="260" fill="#f6f8fc"/>
<text x="235" y="20" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">Mitosis and meiosis — two different jobs</text>
<rect x="14" y="30" width="216" height="200" rx="8" fill="#fff" stroke="#2b6fa8" stroke-width="2.5"/>
<rect x="240" y="30" width="216" height="200" rx="8" fill="#fff" stroke="#0f9d76" stroke-width="2.5"/>
<text x="122" y="50" font-size="12" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#2b6fa8">MITOSIS</text>
<text x="348" y="50" font-size="12" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#0b7a5c">MEIOSIS</text>
<text x="122" y="64" font-size="9" text-anchor="middle" font-family="system-ui" fill="#5a6b85">growth and repair</text>
<text x="348" y="64" font-size="9" text-anchor="middle" font-family="system-ui" fill="#5a6b85">making gametes only</text>
<circle cx="122" cy="90" r="15" fill="#e8f1f8" stroke="#2b6fa8" stroke-width="1.5"/>
<text x="122" y="94" font-size="9" text-anchor="middle" font-family="system-ui" font-weight="700">46</text>
<circle cx="348" cy="90" r="15" fill="#dff3ec" stroke="#0f9d76" stroke-width="1.5"/>
<text x="348" y="94" font-size="9" text-anchor="middle" font-family="system-ui" font-weight="700">46</text>
<line x1="122" y1="106" x2="122" y2="124" stroke="#5a6b85" stroke-width="1.5" marker-end="url(#c)"/>
<line x1="348" y1="106" x2="348" y2="124" stroke="#5a6b85" stroke-width="1.5" marker-end="url(#c)"/>
<defs><marker id="c" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#5a6b85"/></marker></defs>
<circle cx="98" cy="142" r="14" fill="#e8f1f8" stroke="#2b6fa8" stroke-width="1.5"/>
<circle cx="146" cy="142" r="14" fill="#e8f1f8" stroke="#2b6fa8" stroke-width="1.5"/>
<text x="98" y="146" font-size="9" text-anchor="middle" font-family="system-ui" font-weight="700">46</text>
<text x="146" y="146" font-size="9" text-anchor="middle" font-family="system-ui" font-weight="700">46</text>
<circle cx="300" cy="142" r="12" fill="#dff3ec" stroke="#0f9d76" stroke-width="1.5"/>
<circle cx="332" cy="142" r="12" fill="#dff3ec" stroke="#0f9d76" stroke-width="1.5"/>
<circle cx="364" cy="142" r="12" fill="#dff3ec" stroke="#0f9d76" stroke-width="1.5"/>
<circle cx="396" cy="142" r="12" fill="#dff3ec" stroke="#0f9d76" stroke-width="1.5"/>
<g font-size="8.5" text-anchor="middle" font-family="system-ui" font-weight="700">
<text x="300" y="146">23</text><text x="332" y="146">23</text><text x="364" y="146">23</text><text x="396" y="146">23</text></g>
<g font-family="system-ui" font-size="9.5">
<text x="26" y="180" font-weight="700">2 daughter cells</text>
<text x="26" y="196">Diploid, 46 chromosomes</text>
<text x="26" y="212">Genetically identical to parent</text>
<text x="252" y="180" font-weight="700">4 daughter cells</text>
<text x="252" y="196">Haploid, 23 chromosomes</text>
<text x="252" y="212">All genetically different</text>
</g>
<text x="235" y="250" font-size="9.5" text-anchor="middle" font-family="system-ui" fill="#5a6b85" font-weight="700">Halving is why 23 + 23 restores 46 at fertilisation. Crossing over in meiosis creates the variation.</text>
</svg>