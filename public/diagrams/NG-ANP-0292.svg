<svg viewBox="0 0 470 280" role="img" xmlns="http://www.w3.org/2000/svg"><title>The menstrual cycle</title>
<rect width="470" height="280" fill="#f6f8fc"/>
<text x="235" y="18" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">The 28-day menstrual cycle</text>
<line x1="40" y1="250" x2="450" y2="250" stroke="#5a6b85" stroke-width="1.5"/>
<g font-family="system-ui" font-size="9" fill="#5a6b85" text-anchor="middle">
<text x="40" y="264">Day 1</text><text x="145" y="264">Day 7</text><text x="250" y="264">Day 14</text><text x="355" y="264">Day 21</text><text x="450" y="264">Day 28</text>
</g>
<line x1="250" y1="40" x2="250" y2="250" stroke="#e2574c" stroke-width="2" stroke-dasharray="4,3"/>
<text x="250" y="36" font-size="10" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#e2574c">OVULATION</text>
<rect x="40" y="44" width="105" height="22" fill="#e2574c" opacity="0.85"/>
<text x="92" y="59" font-size="9.5" text-anchor="middle" font-family="system-ui" fill="#fff" font-weight="700">Menstruation</text>
<rect x="40" y="70" width="210" height="22" fill="#4a90c2" opacity="0.85"/>
<text x="145" y="85" font-size="9.5" text-anchor="middle" font-family="system-ui" fill="#fff" font-weight="700">FOLLICULAR / proliferative — oestrogen rising</text>
<rect x="250" y="70" width="200" height="22" fill="#0f9d76" opacity="0.85"/>
<text x="350" y="85" font-size="9.5" text-anchor="middle" font-family="system-ui" fill="#fff" font-weight="700">LUTEAL / secretory — progesterone</text>
<path d="M40,190 Q145,186 200,150 Q235,128 250,120 Q290,140 320,158 Q380,178 450,192" fill="none" stroke="#2b6fa8" stroke-width="2.5"/>
<text x="150" y="146" font-size="9" font-family="system-ui" fill="#2b6fa8" font-weight="700">Oestrogen</text>
<path d="M40,238 L240,238 Q290,150 340,142 Q400,150 450,232" fill="none" stroke="#0f9d76" stroke-width="2.5"/>
<text x="352" y="134" font-size="9" font-family="system-ui" fill="#0b7a5c" font-weight="700">Progesterone</text>
<path d="M40,232 L215,230 L240,104 L262,222 L450,228" fill="none" stroke="#f2b705" stroke-width="2.5"/>
<text x="268" y="106" font-size="9" font-family="system-ui" fill="#8a6d00" font-weight="700">LH surge</text>
<rect x="40" y="104" width="410" height="26" rx="6" fill="#fff" stroke="#dde5ef"/>
<text x="245" y="121" font-size="9.5" text-anchor="middle" font-family="system-ui">Endometrium: shed  →  rebuilt and thickened  →  glandular and ready for implantation</text>
<text x="235" y="212" font-size="9.5" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#a8352c">The luteal phase is fixed at 14 days; cycles vary because the follicular phase varies</text>
</svg>