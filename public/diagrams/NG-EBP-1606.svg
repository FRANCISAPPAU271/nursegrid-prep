<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%" role="img">
<rect x="0" y="0" width="760" height="470" fill="#fdfcfa"/>
<text x="20" y="30" font-family="Georgia,serif" font-size="19" font-weight="bold" fill="#1d4e63">What randomisation actually buys you</text>

<rect x="20" y="48" width="720" height="118" rx="6" fill="#f2f7f2" stroke="#2e7d5b"/>
<rect x="46" y="70" width="120" height="34" rx="4" fill="#fff" stroke="#2e7d5b"/>
<text x="60" y="92" font-family="Georgia,serif" font-size="12" fill="#333">Eligible people</text>
<line x1="166" y1="87" x2="222" y2="87" stroke="#2e7d5b" stroke-width="2"/>
<rect x="222" y="70" width="118" height="34" rx="4" fill="#fff8e8" stroke="#b8860b"/>
<text x="238" y="92" font-family="Georgia,serif" font-size="12" fill="#333">Randomise</text>
<line x1="340" y1="87" x2="392" y2="76" stroke="#2e7d5b" stroke-width="2"/>
<line x1="340" y1="87" x2="392" y2="120" stroke="#2e7d5b" stroke-width="2"/>
<rect x="392" y="58" width="150" height="32" rx="4" fill="#eef4f8" stroke="#2b6b8a"/>
<text x="406" y="79" font-family="Georgia,serif" font-size="12" fill="#333">New treatment</text>
<rect x="392" y="104" width="150" height="32" rx="4" fill="#f4f4fb" stroke="#4a4a8a"/>
<text x="406" y="125" font-family="Georgia,serif" font-size="12" fill="#333">Usual care</text>
<text x="562" y="79" font-family="Georgia,serif" font-size="12" fill="#333">Compare the</text>
<text x="562" y="97" font-family="Georgia,serif" font-size="12" fill="#333">same outcome,</text>
<text x="562" y="115" font-family="Georgia,serif" font-size="12" fill="#333">measured the</text>
<text x="562" y="133" font-family="Georgia,serif" font-size="12" fill="#333">same way.</text>
<text x="46" y="132" font-family="Georgia,serif" font-size="12" font-style="italic" fill="#1d5c42">Because who goes where is decided by chance, the two groups start alike in every factor —</text>
<text x="46" y="152" font-family="Georgia,serif" font-size="12" font-style="italic" fill="#1d5c42">including the ones nobody thought of, and the ones nobody can measure.</text>

<rect x="20" y="182" width="352" height="126" rx="6" fill="#fff8e8" stroke="#b8860b"/>
<text x="34" y="204" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#8a6508">Allocation concealment is not blinding</text>
<text x="34" y="226" font-family="Georgia,serif" font-size="12" fill="#333">Concealment: the person recruiting cannot</text>
<text x="34" y="244" font-family="Georgia,serif" font-size="12" fill="#333">know which group comes next, so she cannot</text>
<text x="34" y="262" font-family="Georgia,serif" font-size="12" fill="#333">steer the sicker patients one way.</text>
<text x="34" y="284" font-family="Georgia,serif" font-size="12" fill="#333">Blinding: after allocation, people do not know</text>
<text x="34" y="302" font-family="Georgia,serif" font-size="12" fill="#333">which group a patient is in.</text>

<rect x="388" y="182" width="352" height="126" rx="6" fill="#f4f4fb" stroke="#4a4a8a"/>
<text x="402" y="204" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#33336b">Analyse people where you put them</text>
<text x="402" y="226" font-family="Georgia,serif" font-size="12" fill="#333">If those who stopped the treatment are moved</text>
<text x="402" y="244" font-family="Georgia,serif" font-size="12" fill="#333">into the other group, or dropped, the groups are</text>
<text x="402" y="262" font-family="Georgia,serif" font-size="12" fill="#333">no longer random and the whole advantage is</text>
<text x="402" y="280" font-family="Georgia,serif" font-size="12" fill="#333">thrown away. Keep everyone in the arm they</text>
<text x="402" y="298" font-family="Georgia,serif" font-size="12" fill="#333">were assigned to.</text>

<rect x="20" y="324" width="720" height="72" rx="6" fill="#eef4f8" stroke="#2b6b8a"/>
<text x="34" y="346" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#1d4e63">When you cannot randomise individuals</text>
<text x="34" y="368" font-family="Georgia,serif" font-size="12" fill="#333">Randomise whole wards, clinics or districts instead, when the intervention is a way of working that would</text>
<text x="34" y="386" font-family="Georgia,serif" font-size="12" fill="#333">leak between patients. Or roll it out to every site in a random order, so each acts as its own control.</text>

<rect x="20" y="410" width="720" height="50" rx="6" fill="#fff3f0" stroke="#c0392b"/>
<text x="34" y="432" font-family="Georgia,serif" font-size="12" fill="#333">And when randomising would be unethical or impossible — you cannot randomise people to smoke, or to be</text>
<text x="34" y="450" font-family="Georgia,serif" font-size="12" fill="#333">poor — observation is the honest choice, and confounding must then be handled in the analysis.</text>
</svg>