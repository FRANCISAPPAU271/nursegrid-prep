<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 480" font-family="sans-serif">
<rect x="0" y="0" width="460" height="480" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#111827">Inheritance: three patterns + recurrence risks</text>
<!-- AD -->
<rect x="20" y="40" width="420" height="100" rx="8" fill="#fef2f2" stroke="#7f1d1d" stroke-width="1.5"/>
<text x="32" y="60" font-size="11" font-weight="bold" fill="#111827">AUTOSOMAL DOMINANT — one copy enough (vertical: every generation)</text>
<g font-size="9" fill="#111827">
<circle cx="60" cy="92" r="10" fill="none" stroke="#111827" stroke-width="1.5"/>
<rect x="96" y="82" width="20" height="20" fill="#7f1d1d"/>
<line x1="70" y1="92" x2="96" y2="92" stroke="#111827" stroke-width="1"/>
<line x1="93" y1="92" x2="93" y2="112" stroke="#111827" stroke-width="1"/>
<line x1="50" y1="112" x2="140" y2="112" stroke="#111827" stroke-width="1"/>
<line x1="50" y1="112" x2="50" y2="124" stroke="#111827" stroke-width="1"/>
<line x1="140" y1="112" x2="140" y2="124" stroke="#111827" stroke-width="1"/>
<circle cx="50" cy="130" r="7" fill="#7f1d1d"/>
<rect x="133" y="123" width="14" height="14" fill="none" stroke="#111827" stroke-width="1.5"/>
<text x="170" y="96" font-weight="bold">affected parent (Aa) × unaffected (aa):</text>
<text x="170" y="110" font-weight="bold">50% affected EACH child, both sexes</text>
<text x="170" y="124" font-size="8.5" fill="#6b7280">e.g. Huntington's, achondroplasia, Marfan, neurofibromatosis</text>
<text x="170" y="136" font-size="8.5" fill="#6b7280">new mutations common — unaffected parents don't rule it out</text>
</g>
<!-- AR -->
<rect x="20" y="148" width="420" height="100" rx="8" fill="#fef9c3" stroke="#713f12" stroke-width="1.5"/>
<text x="32" y="168" font-size="11" font-weight="bold" fill="#111827">AUTOSOMAL RECESSIVE — two copies (skips generations; consanguinity ↑)</text>
<g font-size="9" fill="#111827">
<circle cx="60" cy="200" r="10" fill="none" stroke="#111827" stroke-width="1.5"/>
<path d="M60,190 A10,10 0 0 1 70,200 L60,200 Z" fill="#111827"/>
<rect x="96" y="190" width="20" height="20" fill="none" stroke="#111827" stroke-width="1.5"/>
<path d="M106,190 L106,210 L116,210 L116,190 Z" fill="#111827"/>
<line x1="70" y1="200" x2="96" y2="200" stroke="#111827" stroke-width="1"/>
<line x1="70" y1="200" x2="96" y2="200" stroke="#111827" stroke-width="1"/>
<line x1="93" y1="200" x2="93" y2="218" stroke="#111827" stroke-width="1"/>
<text x="170" y="200" font-weight="bold">carrier (Aa) × carrier (Aa):</text>
<text x="170" y="214" font-weight="bold">25% affected (aa) • 50% carrier • 25% clear</text>
<text x="170" y="228" font-size="8.5" fill="#6b7280">e.g. SICKLE CELL, cystic fibrosis, Tay-Sachs, thalassaemia</text>
<text x="170" y="240" font-size="8.5" fill="#6b7280">both AS parents: 1 in 4 SS EVERY pregnancy — screen newborns, never blame</text>
</g>
<!-- XLR -->
<rect x="20" y="256" width="420" height="100" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="32" y="276" font-size="11" font-weight="bold" fill="#111827">X-LINKED RECESSIVE — mothers carry, sons show (no male-to-male)</text>
<g font-size="9" fill="#111827">
<circle cx="60" cy="308" r="10" fill="none" stroke="#111827" stroke-width="1.5"/>
<path d="M60,298 A10,10 0 0 1 70,308 L60,308 Z" fill="#111827"/>
<rect x="96" y="298" width="20" height="20" fill="none" stroke="#111827" stroke-width="1.5"/>
<line x1="70" y1="308" x2="96" y2="308" stroke="#111827" stroke-width="1"/>
<text x="170" y="304" font-weight="bold">carrier mother (XAXa) × normal father:</text>
<text x="170" y="318" font-weight="bold">50% sons AFFECTED • 50% daughters carriers</text>
<text x="170" y="332" font-size="8.5" fill="#6b7280">e.g. haemophilia A/B, Duchenne, colour blindness, G6PD</text>
<text x="170" y="344" font-size="8.5" fill="#6b7280">affected father → ALL daughters carriers, NO sons affected</text>
</g>
<rect x="0" y="368" width="460" height="112" fill="#f1f5f9"/>
<text x="20" y="390" font-size="10" fill="#111827">Pedigree: squares male, circles female, shaded affected, half-shaded carrier,</text>
<text x="20" y="404" font-size="10" fill="#111827">double line consanguineous. Trisomies (21/18/13) are usually nondisjunction —</text>
<text x="20" y="418" font-size="10" fill="#111827">risk rises with maternal age (1:1500 at 20 → 1:100 at 40 for Down) — but most</text>
<text x="20" y="432" font-size="10" fill="#111827">affected babies are born to younger mothers (more births). Screen: combined</text>
<text x="20" y="446" font-size="10" fill="#111827">(nuchal + bloods 11–14 w) → NIPT (cell-free DNA) → amnio/CVS (0.5–1% loss).</text>
<text x="20" y="460" font-size="10" fill="#111827">Counsel non-directively, 3-generation pedigree, refer clinical genetics.</text>
</svg>