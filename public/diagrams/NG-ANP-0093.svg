<svg viewBox="0 0 470 210" role="img" xmlns="http://www.w3.org/2000/svg"><title>Neurone structure and impulse direction</title>
<rect width="470" height="210" fill="#f6f8fc"/>
<text x="235" y="20" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">Impulse always travels ONE way</text>
<g stroke="#0a1628" stroke-width="2" fill="none">
<path d="M28 60 L62 92"/><path d="M28 128 L62 100"/><path d="M22 96 L58 96"/>
</g>
<circle cx="86" cy="96" r="27" fill="#f2b705" opacity=".4" stroke="#0a1628" stroke-width="2"/>
<circle cx="86" cy="96" r="10" fill="#0a1628" opacity=".5"/>
<line x1="113" y1="96" x2="330" y2="96" stroke="#0a1628" stroke-width="5"/>
<g fill="#0f9d76" opacity=".7" stroke="#0a1628" stroke-width="1.5">
<ellipse cx="150" cy="96" rx="22" ry="13"/><ellipse cx="205" cy="96" rx="22" ry="13"/>
<ellipse cx="260" cy="96" rx="22" ry="13"/><ellipse cx="315" cy="96" rx="16" ry="13"/>
</g>
<g stroke="#0a1628" stroke-width="2" fill="none">
<path d="M336 96 L372 74"/><path d="M336 96 L372 118"/><path d="M336 96 L376 96"/>
</g>
<circle cx="378" cy="74" r="4" fill="#e2574c"/><circle cx="380" cy="96" r="4" fill="#e2574c"/><circle cx="378" cy="118" r="4" fill="#e2574c"/>
<g font-family="system-ui" font-size="10" text-anchor="middle">
<text x="34" y="150" font-weight="700">DENDRITES</text><text x="34" y="163" font-size="9">receive</text>
<text x="86" y="150" font-weight="700">CELL BODY</text><text x="86" y="163" font-size="9">nucleus</text>
<text x="205" y="132" font-weight="700">AXON + myelin sheath</text><text x="205" y="145" font-size="9">speeds conduction</text>
<text x="180" y="76" font-size="8.5" fill="#5a6b85">node of Ranvier</text>
<text x="380" y="150" font-weight="700">TERMINALS</text><text x="380" y="163" font-size="9">release transmitter</text>
</g>
<path d="M150 178 h180" stroke="#e2574c" stroke-width="2.5" marker-end="url(#nr)"/>
<defs><marker id="nr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 z" fill="#e2574c"/></marker></defs>
<text x="240" y="200" font-size="10.5" text-anchor="middle" font-family="system-ui" fill="#e2574c" font-weight="600">dendrite → cell body → axon → terminal</text>
</svg>