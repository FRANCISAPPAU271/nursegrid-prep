<svg viewBox="0 0 460 200" role="img" xmlns="http://www.w3.org/2000/svg"><title>TB treatment phases</title>
<rect width="460" height="200" fill="#f6f8fc"/>
<text x="230" y="24" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">Standard new-case TB regimen</text>
<rect x="30" y="46" width="180" height="72" rx="8" fill="#e2574c" opacity=".18" stroke="#e2574c" stroke-width="2"/>
<rect x="240" y="46" width="190" height="72" rx="8" fill="#0f9d76" opacity=".18" stroke="#0f9d76" stroke-width="2"/>
<text x="120" y="68" font-size="12" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#a8352c">INTENSIVE · 2 months</text>
<text x="120" y="90" font-size="14" text-anchor="middle" font-family="system-ui" font-weight="700">R H Z E</text>
<text x="120" y="108" font-size="9.5" text-anchor="middle" font-family="system-ui">4 drugs — kills rapidly</text>
<text x="335" y="68" font-size="12" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#0b7a5c">CONTINUATION · 4 months</text>
<text x="335" y="90" font-size="14" text-anchor="middle" font-family="system-ui" font-weight="700">R H</text>
<text x="335" y="108" font-size="9.5" text-anchor="middle" font-family="system-ui">2 drugs — clears persisters</text>
<path d="M212 82 h24" stroke="#0a1628" stroke-width="2" marker-end="url(#t5)"/>
<defs><marker id="t5" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#0a1628"/></marker></defs>
<g font-family="system-ui" font-size="10">
<text x="40" y="142" font-weight="700">R</text><text x="56" y="142">Rifampicin — orange urine, warn the patient</text>
<text x="40" y="158" font-weight="700">H</text><text x="56" y="158">Isoniazid — peripheral neuropathy, give pyridoxine</text>
<text x="40" y="174" font-weight="700">Z</text><text x="56" y="174">Pyrazinamide — hepatitis, joint pain</text>
<text x="250" y="174" font-weight="700">E</text><text x="266" y="174">Ethambutol — optic neuritis, check vision</text>
</g>
<text x="230" y="194" font-size="10" text-anchor="middle" font-family="system-ui" fill="#5a6b85">Stopping early is what creates drug resistance</text>
</svg>