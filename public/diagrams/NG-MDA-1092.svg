<svg viewBox="0 0 640 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="450" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">ACID-BASE IN THREE STEPS</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">Never guess. Read the pH, then the carbon dioxide, then the bicarbonate, in that order.</text>

<rect x="24" y="60" width="190" height="86" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.7"/>
<text x="119" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">STEP 1 — THE pH</text>
<g font-size="10" fill="#222">
<text x="36" y="102">Below 7.35 = acidosis</text>
<text x="36" y="120">Above 7.45 = alkalosis</text>
<text x="36" y="138" font-style="italic">This names the problem.</text>
</g>

<rect x="226" y="60" width="190" height="86" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.7"/>
<text x="321" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5c3a">STEP 2 — THE LUNGS</text>
<g font-size="10" fill="#222">
<text x="238" y="102">Carbon dioxide is an ACID.</text>
<text x="238" y="120">High CO2 with low pH means</text>
<text x="238" y="138">the lungs are the cause.</text>
</g>

<rect x="428" y="60" width="188" height="86" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.7"/>
<text x="522" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1e">STEP 3 — THE KIDNEY</text>
<g font-size="10" fill="#222">
<text x="440" y="102">Bicarbonate is a BASE.</text>
<text x="440" y="120">Low bicarbonate with low pH</text>
<text x="440" y="138">means a metabolic cause.</text>
</g>

<rect x="24" y="162" width="592" height="74" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.8"/>
<text x="320" y="182" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8b2f2f">THE TRICK THAT DECIDES IT — DO pH AND CO2 MOVE TOGETHER OR APART?</text>
<g font-size="10.5" fill="#222">
<text x="38" y="204">OPPOSITE directions — pH down while CO2 up, or pH up while CO2 down — the problem is RESPIRATORY.</text>
<text x="38" y="224">SAME direction — pH down with bicarbonate also down, or both up — the problem is METABOLIC.</text>
</g>

<rect x="24" y="252" width="285" height="96" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.6"/>
<text x="166" y="272" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">COMMON CAUSES IN GHANA</text>
<g font-size="9.5" fill="#222">
<text x="36" y="292">Metabolic acidosis — diarrhoea, shock,</text>
<text x="36" y="307">diabetic ketoacidosis, kidney failure</text>
<text x="36" y="325">Metabolic alkalosis — prolonged vomiting,</text>
<text x="36" y="340">nasogastric losses, excess antacid</text>
</g>

<rect x="331" y="252" width="285" height="96" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.6"/>
<text x="473" y="272" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a5c3a">AND FROM THE LUNGS</text>
<g font-size="9.5" fill="#222">
<text x="345" y="292">Respiratory acidosis — anything that stops</text>
<text x="345" y="307">air moving: asthma, COPD, opioids, coma</text>
<text x="345" y="325">Respiratory alkalosis — anything that speeds</text>
<text x="345" y="340">breathing: pain, fever, anxiety, early sepsis</text>
</g>

<rect x="24" y="364" width="592" height="60" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.7"/>
<text x="320" y="384" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b3a6b">COMPENSATION NEVER OVERSHOOTS</text>
<g font-size="10.5" fill="#222">
<text x="38" y="406">The body pulls the pH back toward normal but never past it. So whichever side of 7.40 the pH sits on still</text>
</g>
<text x="38" y="418" font-size="10.5" fill="#222">tells you the original problem, however hard the other system has worked to hide it.</text>

<text x="320" y="442" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8b2f2f">Treat the patient and the cause, not the number. A normal pH does not mean a well patient.</text>
</svg>