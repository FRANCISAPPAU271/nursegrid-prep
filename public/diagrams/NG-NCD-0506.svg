<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="380" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">ASTHMA — HOW SEVERITY IS JUDGED</text>
<text x="320" y="45" text-anchor="middle" font-size="12" fill="#555">The dangerous patient is often the quiet one</text>

<rect x="24" y="58" width="592" height="26" fill="#1a3a5c"/>
<text x="90" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">SEVERITY</text>
<text x="250" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">SPEECH</text>
<text x="400" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">WHEEZE</text>
<text x="540" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">ACTION</text>

<rect x="24" y="84" width="592" height="46" fill="#e2f0e2" stroke="#8fb98f"/>
<text x="90" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5c3a">MODERATE</text>
<text x="250" y="112" text-anchor="middle" font-size="11" fill="#333">full sentences</text>
<text x="400" y="112" text-anchor="middle" font-size="11" fill="#333">audible wheeze</text>
<text x="540" y="112" text-anchor="middle" font-size="11" fill="#333">bronchodilator</text>

<rect x="24" y="130" width="592" height="46" fill="#faf0d6" stroke="#c9a227"/>
<text x="90" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b6a2f">SEVERE</text>
<text x="250" y="152" text-anchor="middle" font-size="11" fill="#333">cannot complete a</text>
<text x="250" y="166" text-anchor="middle" font-size="11" fill="#333">sentence in one breath</text>
<text x="400" y="158" text-anchor="middle" font-size="11" fill="#333">loud wheeze</text>
<text x="540" y="152" text-anchor="middle" font-size="11" fill="#333">oxygen, nebuliser,</text>
<text x="540" y="166" text-anchor="middle" font-size="11" fill="#333">steroid, urgent</text>

<rect x="24" y="176" width="592" height="56" fill="#f7d9d9" stroke="#8b2f2f" stroke-width="2"/>
<text x="90" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b2f2f">LIFE</text>
<text x="90" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b2f2f">THREATENING</text>
<text x="250" y="198" text-anchor="middle" font-size="11" fill="#333">cannot speak at all,</text>
<text x="250" y="214" text-anchor="middle" font-size="11" fill="#333">exhausted, confused</text>
<text x="400" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b2f2f">SILENT CHEST</text>
<text x="400" y="214" text-anchor="middle" font-size="10" fill="#8b2f2f">no air moving</text>
<text x="540" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b2f2f">EMERGENCY —</text>
<text x="540" y="214" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b2f2f">call for help now</text>

<rect x="24" y="242" width="592" height="52" fill="#fff3cd" stroke="#e0c86a"/>
<text x="320" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b5410">THE TRAP THAT KILLS</text>
<text x="34" y="280" font-size="11" fill="#6b5410">A chest that goes quiet is not improving. Wheeze requires moving air; when the airways close completely there is</text>
<text x="34" y="292" font-size="11" font-weight="bold" fill="#6b5410">nothing left to make a sound. A silent chest with a struggling patient is a pre-arrest sign.</text>

<rect x="24" y="302" width="288" height="70" fill="#eef4f8" stroke="#5a86a8"/>
<text x="168" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">PREVENTER vs RELIEVER</text>
<text x="34" y="338" font-size="10" fill="#333">Reliever (salbutamol) — opens airways in minutes,</text>
<text x="34" y="351" font-size="10" fill="#333">used when symptomatic. Blue.</text>
<text x="34" y="366" font-size="10" fill="#333">Preventer (steroid) — reduces inflammation, taken</text>
<text x="34" y="377" font-size="1" fill="#fff">.</text>

<rect x="328" y="302" width="288" height="70" fill="#eaf3ea" stroke="#8fb98f"/>
<text x="472" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a5c3a">COMMON TRIGGERS IN GHANA</text>
<text x="338" y="338" font-size="10" fill="#333">Harmattan dust · cooking smoke and charcoal</text>
<text x="338" y="352" font-size="10" fill="#333">Mosquito coils · perfume and incense</text>
<text x="338" y="366" font-size="10" fill="#333">Respiratory infection · exercise · cold air</text>
</svg>