<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" role="img">
<rect x="0" y="0" width="760" height="480" fill="#fdfcfa"/>
<text x="20" y="30" font-family="Georgia,serif" font-size="19" font-weight="bold" fill="#33336b">Weakness: the pattern names the disease</text>
<text x="20" y="52" font-family="Georgia,serif" font-size="13" fill="#555">Three neurological causes of weakness. Ask where it started, how fast, and whether rest makes it better.</text>

<rect x="20" y="66" width="232" height="216" rx="6" fill="#f2f7f2" stroke="#2e7d5b"/>
<text x="34" y="88" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#1d5c42">Ascending, both sides</text>
<text x="34" y="110" font-family="Georgia,serif" font-size="12" fill="#333">Starts in the feet, climbs</text>
<text x="34" y="128" font-family="Georgia,serif" font-size="12" fill="#333">upwards over days.</text>
<text x="34" y="150" font-family="Georgia,serif" font-size="12" fill="#333">Often after a diarrhoeal or</text>
<text x="34" y="168" font-family="Georgia,serif" font-size="12" fill="#333">respiratory illness.</text>
<text x="34" y="190" font-family="Georgia,serif" font-size="12" fill="#333">Reflexes disappear.</text>
<text x="34" y="216" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#7a2020">The danger is the diaphragm.</text>
<text x="34" y="236" font-family="Georgia,serif" font-size="12" fill="#333">Watch breathing, not legs.</text>
<text x="34" y="262" font-family="Georgia,serif" font-size="12" font-style="italic" fill="#1d5c42">Guillain-Barre syndrome</text>

<rect x="264" y="66" width="232" height="216" rx="6" fill="#f4f4fb" stroke="#4a4a8a"/>
<text x="278" y="88" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#33336b">Worse with use</text>
<text x="278" y="110" font-family="Georgia,serif" font-size="12" fill="#333">Normal on waking, weak by</text>
<text x="278" y="128" font-family="Georgia,serif" font-size="12" fill="#333">evening. Rest restores it.</text>
<text x="278" y="150" font-family="Georgia,serif" font-size="12" fill="#333">Drooping eyelids, double</text>
<text x="278" y="168" font-family="Georgia,serif" font-size="12" fill="#333">vision, difficulty chewing.</text>
<text x="278" y="190" font-family="Georgia,serif" font-size="12" fill="#333">Voice fades while talking.</text>
<text x="278" y="216" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#7a2020">The danger is swallowing</text>
<text x="278" y="236" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#7a2020">and breathing.</text>
<text x="278" y="262" font-family="Georgia,serif" font-size="12" font-style="italic" fill="#33336b">Myasthenia gravis</text>

<rect x="508" y="66" width="232" height="216" rx="6" fill="#fff3f0" stroke="#c0392b"/>
<text x="522" y="88" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#7a2020">Sudden, one side</text>
<text x="522" y="110" font-family="Georgia,serif" font-size="12" fill="#333">Face, arm and leg on the</text>
<text x="522" y="128" font-family="Georgia,serif" font-size="12" fill="#333">same side, within minutes.</text>
<text x="522" y="150" font-family="Georgia,serif" font-size="12" fill="#333">Speech may be lost.</text>
<text x="522" y="172" font-family="Georgia,serif" font-size="12" fill="#333">The onset is the diagnosis:</text>
<text x="522" y="190" font-family="Georgia,serif" font-size="12" fill="#333">nothing else is this abrupt.</text>
<text x="522" y="216" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#7a2020">The danger is delay.</text>
<text x="522" y="236" font-family="Georgia,serif" font-size="12" fill="#333">Note the time it started.</text>
<text x="522" y="262" font-family="Georgia,serif" font-size="12" font-style="italic" fill="#7a2020">Stroke</text>

<rect x="20" y="298" width="720" height="80" rx="6" fill="#fff8e8" stroke="#b8860b"/>
<text x="34" y="320" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#8a6508">The observation that matters in neuromuscular weakness is not the limbs</text>
<text x="34" y="342" font-family="Georgia,serif" font-size="12" fill="#333">When the muscles that fail are the ones used for breathing and swallowing, the patient can be talking calmly</text>
<text x="34" y="360" font-family="Georgia,serif" font-size="12" fill="#333">with a normal oxygen saturation and still be minutes from respiratory arrest. Saturation falls last.</text>

<rect x="20" y="392" width="720" height="72" rx="6" fill="#eef4f8" stroke="#2b6b8a"/>
<text x="34" y="414" font-family="Georgia,serif" font-size="13" fill="#333">Watch instead: can the patient count aloud to twenty in one breath? Is the voice getting quieter? Is she</text>
<text x="34" y="432" font-family="Georgia,serif" font-size="13" fill="#333">using neck muscles, sitting forward, unable to lie flat, coughing on her own saliva?</text>
<text x="34" y="454" font-family="Georgia,serif" font-size="13" font-style="italic" fill="#1d4e63">A weak cough and a wet voice come before the oxygen saturation moves.</text>
</svg>