<svg viewBox="0 0 470 230" role="img" xmlns="http://www.w3.org/2000/svg"><title>Wound healing and dressing choice</title>
<rect width="470" height="230" fill="#f6f8fc"/>
<text x="235" y="20" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">Read the wound bed — it tells you what the wound needs</text>
<g font-family="system-ui">
<rect x="16" y="36" width="106" height="128" rx="9" fill="#fff" stroke="#e2574c" stroke-width="2.5"/>
<rect x="30" y="52" width="78" height="26" rx="5" fill="#2b3547"/>
<text x="69" y="69" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="700">BLACK</text>
<text x="69" y="94" font-size="10" text-anchor="middle" font-weight="700">necrotic eschar</text>
<text x="69" y="116" font-size="9.5" text-anchor="middle">needs DEBRIDEMENT</text>
<text x="69" y="140" font-size="9" text-anchor="middle" fill="#5a6b85">dead tissue blocks</text>
<text x="69" y="152" font-size="9" text-anchor="middle" fill="#5a6b85">all healing</text>
<rect x="132" y="36" width="106" height="128" rx="9" fill="#fff" stroke="#f2b705" stroke-width="2.5"/>
<rect x="146" y="52" width="78" height="26" rx="5" fill="#d4c96a"/>
<text x="185" y="69" font-size="10.5" text-anchor="middle" fill="#4a3a00" font-weight="700">YELLOW</text>
<text x="185" y="94" font-size="10" text-anchor="middle" font-weight="700">sloughy</text>
<text x="185" y="116" font-size="9.5" text-anchor="middle">needs CLEANSING</text>
<text x="185" y="140" font-size="9" text-anchor="middle" fill="#5a6b85">hydrogel or</text>
<text x="185" y="152" font-size="9" text-anchor="middle" fill="#5a6b85">hydrocolloid</text>
<rect x="248" y="36" width="106" height="128" rx="9" fill="#fff" stroke="#0f9d76" stroke-width="3"/>
<rect x="262" y="52" width="78" height="26" rx="5" fill="#e2574c" opacity=".55"/>
<text x="301" y="69" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="700">RED</text>
<text x="301" y="94" font-size="10" text-anchor="middle" font-weight="700">granulating</text>
<text x="301" y="116" font-size="9.5" text-anchor="middle">PROTECT it</text>
<text x="301" y="140" font-size="9" text-anchor="middle" fill="#5a6b85">this is healthy —</text>
<text x="301" y="152" font-size="9" text-anchor="middle" fill="#5a6b85">do not disturb</text>
<rect x="364" y="36" width="90" height="128" rx="9" fill="#fff" stroke="#e59ac0" stroke-width="2.5"/>
<rect x="376" y="52" width="66" height="26" rx="5" fill="#f0b8d4"/>
<text x="409" y="69" font-size="10.5" text-anchor="middle" fill="#7a3355" font-weight="700">PINK</text>
<text x="409" y="94" font-size="10" text-anchor="middle" font-weight="700">epithelialising</text>
<text x="409" y="116" font-size="9.5" text-anchor="middle">almost healed</text>
<text x="409" y="140" font-size="9" text-anchor="middle" fill="#5a6b85">minimal handling</text>
</g>
<rect x="16" y="176" width="438" height="44" rx="8" fill="#fff" stroke="#0f9d76" stroke-width="2"/>
<text x="235" y="194" font-size="10.5" text-anchor="middle" font-family="system-ui" font-weight="700">A MOIST wound bed heals faster than a dry one</text>
<text x="235" y="210" font-size="9.5" text-anchor="middle" font-family="system-ui" fill="#5a6b85">Moist supports cell migration · dry forms a scab that cells must burrow under</text>
</svg>