<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 480" font-family="sans-serif">
<rect x="0" y="0" width="460" height="480" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#111827">Conduction + what the ECG waves mean</text>
<!-- conduction path -->
<g font-size="10" text-anchor="middle" fill="#111827">
<rect x="30" y="44" width="120" height="40" rx="8" fill="#fef9c3" stroke="#713f12" stroke-width="2"/>
<text x="90" y="60" font-weight="bold">SA node</text>
<text x="90" y="73" font-size="9">pacemaker 60–100</text>
<rect x="170" y="44" width="120" height="40" rx="8" fill="#ffedd5" stroke="#7c2d12" stroke-width="1.5"/>
<text x="230" y="60" font-weight="bold">AV node</text>
<text x="230" y="73" font-size="9">delay ~0.1 s; 40–60</text>
<rect x="310" y="44" width="120" height="40" rx="8" fill="#fce7f3" stroke="#831843" stroke-width="1.5"/>
<text x="370" y="60" font-weight="bold">His → Purkinje</text>
<text x="370" y="73" font-size="9">escape 20–40</text>
<g stroke="#334155" stroke-width="1.5">
<line x1="150" y1="64" x2="170" y2="64"/><path d="M170,64 l-8,-4 l0,8 Z" fill="#334155"/>
<line x1="290" y1="64" x2="310" y2="64"/><path d="M310,64 l-8,-4 l0,8 Z" fill="#334155"/>
</g>
</g>
<!-- ECG strip -->
<rect x="20" y="100" width="420" height="150" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
<g stroke="#fecaca" stroke-width="0.5">
<line x1="20" y1="130" x2="440" y2="130"/><line x1="20" y1="160" x2="440" y2="160"/>
<line x1="20" y1="190" x2="440" y2="190"/><line x1="20" y1="220" x2="440" y2="220"/>
<line x1="80" y1="100" x2="80" y2="250"/><line x1="140" y1="100" x2="140" y2="250"/>
<line x1="200" y1="100" x2="200" y2="250"/><line x1="260" y1="100" x2="260" y2="250"/>
<line x1="320" y1="100" x2="320" y2="250"/><line x1="380" y1="100" x2="380" y2="250"/>
</g>
<path d="M20,190 L90,190 Q105,190 110,175 Q115,160 130,160 Q145,160 150,175 Q155,190 170,190 L200,190 L210,205 L225,130 L240,205 L250,190 L320,190 Q340,190 350,175 Q360,160 380,160 Q400,160 410,175 Q415,190 440,190" fill="none" stroke="#111827" stroke-width="2"/>
<g font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="middle">
<text x="130" y="148">P</text>
<text x="214" y="222">Q</text>
<text x="225" y="118">R</text>
<text x="242" y="222">S</text>
<text x="380" y="148">T</text>
</g>
<g font-size="9" fill="#374151" text-anchor="middle">
<text x="130" y="240">atria depolarize</text>
<text x="228" y="240">ventricles depolarize</text>
<text x="380" y="240">ventricles repolarize</text>
</g>
<line x1="150" y1="262" x2="210" y2="262" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="180" y="276" font-size="9" fill="#1d4ed8" text-anchor="middle">PR: AV delay</text>
<line x1="250" y1="262" x2="340" y2="262" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="295" y="276" font-size="9" fill="#1d4ed8" text-anchor="middle">ST: injury shows here (elevation = MI)</text>
<rect x="0" y="288" width="460" height="192" fill="#f1f5f9"/>
<text x="20" y="310" font-size="10" fill="#111827">Rate rules: SA 60–100 runs the show; if it fails, AV 40–60 takes over; if that fails,</text>
<text x="20" y="324" font-size="10" fill="#111827">ventricles escape at 20–40 — too slow to live on for long. Sympathetic speeds,</text>
<text x="20" y="338" font-size="10" fill="#111827">parasympathetic (vagus) slows — bearing down, vomiting and suctioning vagal it.</text>
<text x="20" y="352" font-size="10" fill="#111827">No-output rhythms: VF (chaotic, shock it), pulseless VT (shock it), asystole (flat —</text>
<text x="20" y="366" font-size="10" fill="#111827">adrenaline + CPR, never shock), PEA (organized, no pulse — find the cause: the Hs</text>
<text x="20" y="380" font-size="10" fill="#111827">and Ts). Narrow + fast + regular with no P waves: think SVT. Wide + bizarre:</text>
<text x="20" y="394" font-size="10" fill="#111827">think ventricular — call for help before theorizing. ST elevation = blocked coronary</text>
<text x="20" y="408" font-size="10" fill="#111827">until proven otherwise — 12-lead ECG within 10 minutes of chest pain, aspirin</text>
<text x="20" y="422" font-size="10" fill="#111827">chewed unless allergic, and time-is-muscle escalation. The monitor shows rhythm;</text>
<text x="20" y="436" font-size="10" fill="#111827">only the pulse and pressure show output. Treat the patient, not the trace.</text>
</svg>