<svg viewBox="0 0 470 250" role="img" xmlns="http://www.w3.org/2000/svg"><title>Fat soluble and water soluble vitamins</title>
<rect width="470" height="250" fill="#f6f8fc"/>
<text x="235" y="20" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">Two families of vitamins behave differently</text>
<g font-family="system-ui">
<rect x="14" y="30" width="216" height="204" rx="8" fill="#fff8e8" stroke="#f2b705" stroke-width="2.5"/>
<rect x="240" y="30" width="216" height="204" rx="8" fill="#eef3f9" stroke="#2b6fa8" stroke-width="2.5"/>
<text x="122" y="52" font-size="12.5" text-anchor="middle" font-weight="700" fill="#8a6d00">FAT SOLUBLE — A D E K</text>
<text x="348" y="52" font-size="12.5" text-anchor="middle" font-weight="700" fill="#2b6fa8">WATER SOLUBLE — B and C</text>
<g font-size="10">
<text x="26" y="76" font-weight="700">Stored in liver and fat</text>
<text x="26" y="92">Deficiency takes months to appear</text>
<text x="26" y="108" font-weight="700" fill="#a8352c">Overdose is possible and harmful</text>
<text x="26" y="124">Need dietary fat to be absorbed</text>
<text x="26" y="140">Lost in fat malabsorption and</text>
<text x="26" y="154">in biliary obstruction</text>
<text x="252" y="76" font-weight="700">Not stored, except B12</text>
<text x="252" y="92">Deficiency appears within weeks</text>
<text x="252" y="108" font-weight="700" fill="#0b7a5c">Excess passed out in urine</text>
<text x="252" y="124">Destroyed by heat and long boiling</text>
<text x="252" y="140">Leached into cooking water, so</text>
<text x="252" y="154">use the water in the soup</text>
</g>
<rect x="26" y="166" width="192" height="56" rx="6" fill="#fff" stroke="#f2b705"/>
<rect x="252" y="166" width="192" height="56" rx="6" fill="#fff" stroke="#2b6fa8"/>
<text x="122" y="182" font-size="10" text-anchor="middle" font-weight="700">A: night blindness, xerophthalmia</text>
<text x="122" y="197" font-size="10" text-anchor="middle" font-weight="700">D: rickets, osteomalacia</text>
<text x="122" y="212" font-size="10" text-anchor="middle" font-weight="700">K: bleeding of the newborn</text>
<text x="348" y="182" font-size="10" text-anchor="middle" font-weight="700">B1: beriberi   B3: pellagra</text>
<text x="348" y="197" font-size="10" text-anchor="middle" font-weight="700">B9: neural tube defects</text>
<text x="348" y="212" font-size="10" text-anchor="middle" font-weight="700">B12: megaloblastic anaemia   C: scurvy</text>
</g>
<text x="235" y="246" font-size="9.5" text-anchor="middle" font-family="system-ui" fill="#5a6b85">Cook vegetables briefly in little water, cover the pot, and serve the liquid with the meal</text>
</svg>