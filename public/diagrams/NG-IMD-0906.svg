<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="420" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">ANAEMIA — THE SIZE OF THE CELL TELLS YOU THE CAUSE</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">Anaemia is never a diagnosis. It is a finding that demands a reason.</text>

<rect x="30" y="62" width="188" height="176" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.6"/>
<text x="124" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8b2f2f">SMALL — MICROCYTIC</text>
<circle cx="124" cy="112" r="11" fill="#e8b4b4" stroke="#8b2f2f" stroke-width="1.5"/>
<g font-size="10.5" fill="#222">
<text x="42" y="146">Iron deficiency</text>
<text x="42" y="166">Ask WHY the iron is low:</text>
<text x="42" y="184">hookworm, heavy periods,</text>
<text x="42" y="202">bleeding ulcer, poor diet,</text>
<text x="42" y="220">repeated pregnancy</text>
</g>

<rect x="226" y="62" width="188" height="176" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.6"/>
<text x="320" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a3a5c">NORMAL — NORMOCYTIC</text>
<circle cx="320" cy="112" r="16" fill="#c2d8ea" stroke="#1a3a5c" stroke-width="1.5"/>
<g font-size="10.5" fill="#222">
<text x="238" y="146">Acute blood loss</text>
<text x="238" y="164">Chronic disease, HIV,</text>
<text x="238" y="182">kidney failure</text>
<text x="238" y="202">Haemolysis, including</text>
<text x="238" y="220">sickle cell and malaria</text>
</g>

<rect x="422" y="62" width="188" height="176" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.6"/>
<text x="516" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a5c3a">LARGE — MACROCYTIC</text>
<circle cx="516" cy="112" r="21" fill="#c3ddc3" stroke="#1a5c3a" stroke-width="1.5"/>
<g font-size="10.5" fill="#222">
<text x="434" y="152">Vitamin B12 deficiency</text>
<text x="434" y="172">Folate deficiency</text>
<text x="434" y="192">Alcohol</text>
<text x="434" y="212">Some medicines</text>
</g>

<rect x="30" y="256" width="580" height="62" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.5"/>
<text x="320" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1e">TRANSFUSION IS NOT THE TREATMENT FOR ANAEMIA</text>
<text x="320" y="298" text-anchor="middle" font-size="10.5" fill="#222">It buys time in an emergency. Treating the cause is what stops the anaemia coming back next month.</text>

<rect x="30" y="332" width="580" height="52" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.5"/>
<text x="320" y="352" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6b3a6b">A CHRONICALLY ANAEMIC PATIENT HAS ADAPTED</text>
<text x="320" y="372" text-anchor="middle" font-size="10.5" fill="#222">Transfuse slowly, watch for overload. The heart is already working hard and is easily tipped into failure.</text>

<text x="320" y="410" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8b2f2f">In Ghana, always consider hookworm, malaria and sickle cell before assuming diet alone.</text>
</svg>