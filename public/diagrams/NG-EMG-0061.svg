<svg viewBox="0 0 460 240" role="img" xmlns="http://www.w3.org/2000/svg"><title>DRSABC first aid sequence</title>
<rect width="460" height="240" fill="#f6f8fc"/>
<text x="230" y="24" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">The order never changes</text>
<g font-family="system-ui">
<rect x="30" y="38" width="400" height="30" rx="7" fill="#e2574c" opacity=".9"/>
<text x="46" y="58" font-size="12" fill="#fff" font-weight="700">D</text>
<text x="70" y="58" font-size="11" fill="#fff">DANGER — is it safe for YOU? Never become the second casualty</text>
<rect x="30" y="72" width="400" height="30" rx="7" fill="#f2874c" opacity=".9"/>
<text x="46" y="92" font-size="12" fill="#fff" font-weight="700">R</text>
<text x="70" y="92" font-size="11" fill="#fff">RESPONSE — shout, gently shake the shoulders</text>
<rect x="30" y="106" width="400" height="30" rx="7" fill="#f2b705" opacity=".95"/>
<text x="46" y="126" font-size="12" fill="#4a3a00" font-weight="700">S</text>
<text x="70" y="126" font-size="11" fill="#4a3a00">SHOUT for help — send someone specific to call for an ambulance</text>
<rect x="30" y="140" width="400" height="30" rx="7" fill="#0f9d76" opacity=".85"/>
<text x="46" y="160" font-size="12" fill="#fff" font-weight="700">A</text>
<text x="70" y="160" font-size="11" fill="#fff">AIRWAY — head tilt, chin lift (jaw thrust if spinal injury suspected)</text>
<rect x="30" y="174" width="400" height="30" rx="7" fill="#0b7a5c" opacity=".9"/>
<text x="46" y="194" font-size="12" fill="#fff" font-weight="700">B</text>
<text x="70" y="194" font-size="11" fill="#fff">BREATHING — look, listen, feel for up to 10 seconds</text>
<rect x="30" y="208" width="400" height="26" rx="7" fill="#2b4a6f"/>
<text x="46" y="226" font-size="12" fill="#fff" font-weight="700">C</text>
<text x="70" y="226" font-size="11" fill="#fff">CIRCULATION / CPR — 30 compressions to 2 breaths</text>
</g>
</svg>