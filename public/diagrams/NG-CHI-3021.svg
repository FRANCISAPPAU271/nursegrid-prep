<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" role="img">
<rect width="460" height="300" fill="#ffffff"/>
<text x="230" y="24" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Sickle cell disease: the crises that kill children</text>
<rect x="25" y="40" width="200" height="112" fill="#fee2e2" stroke="#b91c1c"/>
<text x="125" y="60" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7f1d1d">Splenic sequestration</text>
<text x="125" y="80" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f1d1d">blood trapped in the spleen</text>
<text x="125" y="96" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#7f1d1d">rapidly ENLARGING spleen</text>
<text x="125" y="112" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f1d1d">+ pallor + shock</text>
<text x="125" y="132" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#b91c1c">minutes matter: fluids,</text>
<text x="125" y="146" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#b91c1c">urgent transfusion</text>
<rect x="235" y="40" width="200" height="112" fill="#fef3c7" stroke="#b45309"/>
<text x="335" y="60" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350f">Acute chest syndrome</text>
<text x="335" y="80" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">fever + chest pain +</text>
<text x="335" y="96" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">new infiltrate on X-ray</text>
<text x="335" y="112" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">hypoxia, fast breathing</text>
<text x="335" y="132" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#b45309">leading cause of death;</text>
<text x="335" y="146" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#b45309">oxygen, antibiotics</text>
<rect x="25" y="162" width="410" height="56" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="230" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">FEVER in a child with sickle cell disease is an emergency</text>
<text x="230" y="198" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">The spleen stops working early, so the child is functionally asplenic and cannot</text>
<text x="230" y="212" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">contain encapsulated bacteria. Culture and give antibiotics without waiting.</text>
<rect x="25" y="228" width="410" height="60" fill="#dcfce7" stroke="#15803d"/>
<text x="230" y="246" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">Prevention that changes survival</text>
<text x="230" y="264" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">penicillin V from 3 months to 5 years &#183; pneumococcal + Hib vaccines</text>
<text x="230" y="280" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">malaria prevention &#183; folic acid &#183; hydration &#183; teach parents to feel the spleen</text>
</svg>