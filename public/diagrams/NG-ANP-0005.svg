<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 440" font-family="sans-serif">
<rect x="0" y="0" width="460" height="440" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#111827">The synovial joint</text>
<!-- upper bone -->
<path d="M150,60 L260,60 Q260,140 230,160 L180,160 Q150,140 150,60 Z" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
<!-- lower bone -->
<path d="M180,240 L230,240 Q260,260 260,340 L150,340 Q150,260 180,240 Z" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
<!-- cartilage caps -->
<path d="M180,158 L230,158 Q228,176 205,176 Q182,176 180,158 Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>
<path d="M182,242 L228,242 Q226,226 205,226 Q184,226 182,242 Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>
<!-- cavity -->
<ellipse cx="205" cy="201" rx="24" ry="22" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="4 3"/>
<!-- capsule -->
<path d="M150,90 Q120,200 150,310" fill="none" stroke="#be123c" stroke-width="2.5"/>
<path d="M260,90 Q290,200 260,310" fill="none" stroke="#be123c" stroke-width="2.5"/>
<!-- ligaments -->
<rect x="128" y="150" width="14" height="100" rx="6" fill="#fecdd3" stroke="#be123c" stroke-width="1.5"/>
<rect x="268" y="150" width="14" height="100" rx="6" fill="#fecdd3" stroke="#be123c" stroke-width="1.5"/>
<!-- labels -->
<g font-size="10" fill="#111827">
<line x1="205" y1="110" x2="300" y2="90" stroke="#6b7280" stroke-width="1"/>
<text x="302" y="86" font-weight="bold">Bone</text>
<line x1="228" y1="168" x2="300" y2="160" stroke="#6b7280" stroke-width="1"/>
<text x="302" y="156" font-weight="bold">Articular cartilage</text>
<text x="302" y="168" font-size="9" fill="#6b7280">friction-free, no vessels</text>
<line x1="228" y1="201" x2="300" y2="210" stroke="#6b7280" stroke-width="1"/>
<text x="302" y="206" font-weight="bold">Joint cavity +</text>
<text x="302" y="218" font-weight="bold">synovial fluid</text>
<text x="302" y="230" font-size="9" fill="#6b7280">oil + cartilage food</text>
<line x1="275" y1="200" x2="300" y2="262" stroke="#6b7280" stroke-width="1"/>
<text x="302" y="266" font-weight="bold">Ligament</text>
<text x="302" y="278" font-size="9" fill="#6b7280">bone to bone</text>
<line x1="150" y1="120" x2="100" y2="140" stroke="#6b7280" stroke-width="1"/>
<text x="12" y="136" font-weight="bold">Fibrous capsule</text>
<text x="12" y="148" font-size="9" fill="#6b7280">seals the cavity</text>
<line x1="135" y1="230" x2="100" y2="252" stroke="#6b7280" stroke-width="1"/>
<text x="12" y="256" font-weight="bold">Synovial membrane</text>
<text x="12" y="268" font-size="9" fill="#6b7280">lines capsule, makes fluid</text>
<text x="12" y="310" font-weight="bold">Tendon = muscle to bone.</text>
<text x="12" y="324" font-weight="bold">Ligament = bone to bone.</text>
<text x="12" y="338" font-size="9" fill="#6b7280">Examiners swap them to catch you.</text>
</g>
<rect x="0" y="372" width="460" height="68" fill="#f1f5f9"/>
<text x="20" y="394" font-size="10" fill="#111827">Cartilage has no blood supply — it feeds on synovial fluid squeezed in by movement.</text>
<text x="20" y="408" font-size="10" fill="#111827">Prolonged rest starves it; early gentle motion after injury feeds it. That is why</text>
<text x="20" y="422" font-size="10" fill="#111827">physiotherapy starts with movement, and why the joint kept still stiffens.</text>
</svg>