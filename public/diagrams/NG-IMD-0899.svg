<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="420" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">SEPSIS — THE FIRST HOUR DECIDES THE OUTCOME</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">Infection plus organ dysfunction. Every hour of delay costs survival.</text>

<rect x="34" y="62" width="572" height="52" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.8"/>
<text x="320" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8b2f2f">SUSPECT IT WHEN AN INFECTED PATIENT SHOWS</text>
<text x="320" y="102" text-anchor="middle" font-size="10.5" fill="#222">New confusion · Fast breathing · Low blood pressure · Falling urine output · Mottled cold skin</text>

<text x="320" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">THREE OUT, THREE IN — WITHIN THE FIRST HOUR</text>

<rect x="34" y="152" width="278" height="140" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.6"/>
<text x="173" y="174" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a3a5c">TAKE THREE OUT</text>
<g font-size="11" fill="#222">
<text x="48" y="200">Blood cultures — BEFORE antibiotics</text>
<text x="48" y="226">Lactate, if it can be measured</text>
<text x="48" y="252">Urine output — catheter and chart it</text>
</g>
<text x="48" y="278" font-size="10" font-style="italic" fill="#8b2f2f">Cultures after antibiotics may grow nothing</text>

<rect x="330" y="152" width="276" height="140" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.6"/>
<text x="468" y="174" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a5c3a">PUT THREE IN</text>
<g font-size="11" fill="#222">
<text x="344" y="200">Oxygen, to keep saturation up</text>
<text x="344" y="226">Intravenous fluids, given fast</text>
<text x="344" y="252">Antibiotics — within the hour</text>
</g>
<text x="344" y="278" font-size="10" font-style="italic" fill="#1a5c3a">Do not wait for the culture result</text>

<rect x="34" y="310" width="572" height="58" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.5"/>
<text x="320" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1e">IN GHANA, ALWAYS ASK: COULD THIS BE SEVERE MALARIA?</text>
<text x="320" y="352" text-anchor="middle" font-size="10.5" fill="#222">Fever with confusion has more than one cause here. Test for malaria and treat sepsis — do not choose.</text>

<text x="320" y="396" text-anchor="middle" font-size="11" font-style="italic" fill="#8b2f2f">A patient who is confused, breathing fast and passing little urine is septic until proved otherwise.</text>
<text x="320" y="414" text-anchor="middle" font-size="10.5" fill="#1a3a5c">Blood pressure falls late. Waiting for it to fall is waiting too long.</text>
</svg>