<svg viewBox="0 0 460 220" role="img" xmlns="http://www.w3.org/2000/svg"><title>Five moments for hand hygiene</title>
<rect width="460" height="220" fill="#f6f8fc"/>
<circle cx="230" cy="118" r="46" fill="#fff" stroke="#0a1628" stroke-width="2"/>
<text x="230" y="114" font-size="12" text-anchor="middle" font-family="system-ui" font-weight="700">PATIENT</text>
<text x="230" y="132" font-size="10" text-anchor="middle" font-family="system-ui" fill="#5a6b85">zone</text>
<g font-family="system-ui" text-anchor="middle">
<circle cx="90" cy="70" r="19" fill="#0f9d76"/><text x="90" y="76" font-size="15" fill="#fff" font-weight="700">1</text>
<text x="90" y="105" font-size="10">BEFORE touching</text><text x="90" y="118" font-size="10">a patient</text>
<circle cx="230" cy="42" r="19" fill="#0f9d76"/><text x="230" y="48" font-size="15" fill="#fff" font-weight="700">2</text>
<text x="230" y="20" font-size="10">BEFORE clean /</text><text x="230" y="8" font-size="10">aseptic procedure</text>
<circle cx="372" cy="70" r="19" fill="#e2574c"/><text x="372" y="76" font-size="15" fill="#fff" font-weight="700">3</text>
<text x="372" y="105" font-size="10">AFTER body fluid</text><text x="372" y="118" font-size="10">exposure risk</text>
<circle cx="340" cy="176" r="19" fill="#e2574c"/><text x="340" y="182" font-size="15" fill="#fff" font-weight="700">4</text>
<text x="345" y="208" font-size="10">AFTER touching patient</text>
<circle cx="118" cy="176" r="19" fill="#e2574c"/><text x="118" y="182" font-size="15" fill="#fff" font-weight="700">5</text>
<text x="112" y="208" font-size="10">AFTER touching surroundings</text>
</g>
<text x="230" y="160" font-size="9.5" text-anchor="middle" font-family="system-ui" fill="#5a6b85">green = protect the patient · red = protect yourself</text>
</svg>