<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="400" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">DELIRIUM OR DEMENTIA? THE MOST COSTLY CONFUSION IN OLD AGE</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">One is an emergency and reversible. The other is chronic. Mistaking the first for the second kills people.</text>

<rect x="20" y="58" width="290" height="188" fill="#f7ecec" stroke="#c08a8a" stroke-width="1.5"/>
<text x="165" y="79" text-anchor="middle" font-size="14" font-weight="bold" fill="#8b2f2f">DELIRIUM</text>
<text x="165" y="96" text-anchor="middle" font-size="10" font-style="italic" fill="#8b2f2f">acute confusional state — an EMERGENCY</text>
<g font-size="10.5" fill="#222">
<text x="32" y="118">Onset: sudden, over hours or days</text>
<text x="32" y="136">Course: fluctuates; worse at night</text>
<text x="32" y="154">Attention: markedly impaired</text>
<text x="32" y="172">Consciousness: clouded, drowsy or agitated</text>
<text x="32" y="190">Hallucinations: common, often frightening</text>
<text x="32" y="208">Reversible: yes, if the cause is found</text>
<text x="32" y="226">The family says: "he was fine last week"</text>
</g>

<rect x="330" y="58" width="290" height="188" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.5"/>
<text x="475" y="79" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3a5c">DEMENTIA</text>
<text x="475" y="96" text-anchor="middle" font-size="10" font-style="italic" fill="#1a3a5c">chronic progressive decline</text>
<g font-size="10.5" fill="#222">
<text x="342" y="118">Onset: gradual, over months or years</text>
<text x="342" y="136">Course: slowly progressive, stable by the day</text>
<text x="342" y="154">Attention: preserved until late</text>
<text x="342" y="172">Consciousness: clear</text>
<text x="342" y="190">Hallucinations: less common early on</text>
<text x="342" y="208">Reversible: no, but much can be supported</text>
<text x="342" y="226">The family says: "it has been coming for a year"</text>
</g>

<rect x="20" y="258" width="600" height="26" fill="#8b2f2f"/>
<text x="320" y="277" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">SUDDEN CONFUSION IN AN OLDER PERSON IS A PHYSICAL ILLNESS UNTIL PROVED OTHERWISE</text>

<rect x="20" y="292" width="600" height="94" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.5"/>
<text x="320" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1e">SEARCH FOR THE CAUSE — THE COMMON CULPRITS</text>
<g font-size="10.5" fill="#222">
<text x="34" y="332">Infection: urine, chest, skin, malaria</text>
<text x="34" y="350">Drugs: newly started, or a dose too high</text>
<text x="34" y="368">Dehydration and electrolyte disturbance</text>
<text x="330" y="332">Retention of urine  ·  severe constipation</text>
<text x="330" y="350">Pain that nobody has treated</text>
<text x="330" y="368">Hypoxia  ·  low blood sugar  ·  head injury after a fall</text>
</g>
</svg>