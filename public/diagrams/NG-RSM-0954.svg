<svg viewBox="0 0 640 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="450" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">CHOOSING A DESIGN — THE QUESTION TELLS YOU WHICH</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">There is no best design. There is only the design that fits the question being asked.</text>

<rect x="30" y="60" width="285" height="150" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.8"/>
<text x="172" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">QUANTITATIVE — HOW MANY, HOW MUCH</text>
<g font-size="10.5" fill="#222">
<text x="44" y="106">Descriptive — what is happening now</text>
<text x="44" y="126">Cross-sectional — a snapshot, one point in time</text>
<text x="44" y="146">Case-control — starts with the outcome, looks back</text>
<text x="44" y="166">Cohort — starts with the exposure, follows forward</text>
<text x="44" y="186">Experimental — the researcher allocates, then compares</text>
</g>
<text x="172" y="204" text-anchor="middle" font-size="10" font-style="italic" fill="#1a3a5c">Numbers, statistics, a sample big enough to generalise</text>

<rect x="325" y="60" width="285" height="150" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.8"/>
<text x="467" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a5c3a">QUALITATIVE — WHY, AND WHAT IT IS LIKE</text>
<g font-size="10.5" fill="#222">
<text x="339" y="106">Phenomenology — the lived experience of it</text>
<text x="339" y="126">Grounded theory — building an explanation</text>
<text x="339" y="146">Ethnography — a culture, watched from within</text>
<text x="339" y="166">Case study — one situation, in depth</text>
<text x="339" y="186">Interviews and focus groups, until saturation</text>
</g>
<text x="467" y="204" text-anchor="middle" font-size="10" font-style="italic" fill="#1a5c3a">Words, meaning, a small purposive sample</text>

<rect x="30" y="226" width="580" height="76" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.6"/>
<text x="320" y="246" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1e">ONLY AN EXPERIMENT CAN SHOW CAUSE</text>
<g font-size="10.5" fill="#222">
<text x="44" y="268">Randomisation spreads the unknown differences evenly, so the groups differ only in the treatment.</text>
<text x="44" y="288">Without it you have an association. Something else may explain it, and usually something else does.</text>
</g>

<rect x="30" y="316" width="285" height="96" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.6"/>
<text x="172" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b3a6b">WORDS THAT GIVE THE DESIGN AWAY</text>
<g font-size="10" fill="#222">
<text x="44" y="356">"Prevalence of" — cross-sectional</text>
<text x="44" y="374">"Risk of developing" — cohort</text>
<text x="44" y="392">"Effect of X on Y" — experimental</text>
</g>

<rect x="325" y="316" width="285" height="96" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.6"/>
<text x="467" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b2f2f">AND FOR THE OTHER SIDE</text>
<g font-size="10" fill="#222">
<text x="339" y="356">"Experiences of" — phenomenology</text>
<text x="339" y="374">"Perceptions and meaning" — qualitative</text>
<text x="339" y="392">"How do nurses decide" — grounded theory</text>
</g>

<text x="320" y="436" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">Read the verb in the research question. It names the design more reliably than the title does.</text>
</svg>