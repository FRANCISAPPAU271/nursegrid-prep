<svg viewBox="0 0 640 350" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="350" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">THE NORMAL CURVE AND THE 68 – 95 – 99.7 RULE</text>

<path d="M70 240 Q110 238 150 215 Q200 175 250 95 Q320 25 390 95 Q440 175 490 215 Q530 238 570 240 Z" fill="#dbe6f0" stroke="#1a3a5c" stroke-width="2"/>
<line x1="60" y1="240" x2="590" y2="240" stroke="#333" stroke-width="1.5"/>

<line x1="320" y1="240" x2="320" y2="52" stroke="#8b2f2f" stroke-width="2"/>
<text x="320" y="46" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b2f2f">mean</text>
<line x1="250" y1="240" x2="250" y2="100" stroke="#1a5c3a" stroke-width="1" stroke-dasharray="3,2"/>
<line x1="390" y1="240" x2="390" y2="100" stroke="#1a5c3a" stroke-width="1" stroke-dasharray="3,2"/>
<line x1="180" y1="240" x2="180" y2="185" stroke="#1a5c3a" stroke-width="1" stroke-dasharray="3,2"/>
<line x1="460" y1="240" x2="460" y2="185" stroke="#1a5c3a" stroke-width="1" stroke-dasharray="3,2"/>
<line x1="110" y1="240" x2="110" y2="230" stroke="#1a5c3a" stroke-width="1" stroke-dasharray="3,2"/>
<line x1="530" y1="240" x2="530" y2="230" stroke="#1a5c3a" stroke-width="1" stroke-dasharray="3,2"/>

<text x="110" y="256" text-anchor="middle" font-size="11" fill="#444">-3 SD</text>
<text x="180" y="256" text-anchor="middle" font-size="11" fill="#444">-2 SD</text>
<text x="250" y="256" text-anchor="middle" font-size="11" fill="#444">-1 SD</text>
<text x="320" y="256" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b2f2f">mean</text>
<text x="390" y="256" text-anchor="middle" font-size="11" fill="#444">+1 SD</text>
<text x="460" y="256" text-anchor="middle" font-size="11" fill="#444">+2 SD</text>
<text x="530" y="256" text-anchor="middle" font-size="11" fill="#444">+3 SD</text>

<line x1="250" y1="278" x2="390" y2="278" stroke="#1a3a5c" stroke-width="1.5"/>
<text x="320" y="274" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">68%</text>
<line x1="180" y1="298" x2="460" y2="298" stroke="#1a3a5c" stroke-width="1.5"/>
<text x="320" y="294" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">95%</text>
<line x1="110" y1="318" x2="530" y2="318" stroke="#1a3a5c" stroke-width="1.5"/>
<text x="320" y="314" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">99.7%</text>

<rect x="30" y="60" width="150" height="110" fill="#fff" stroke="#d8d2c4"/>
<text x="105" y="78" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">WORKED EXAMPLE</text>
<text x="40" y="97" font-size="10" fill="#333">Systolic BP in a clinic:</text>
<text x="40" y="113" font-size="10" fill="#333">mean 120 mmHg, SD 10.</text>
<text x="40" y="132" font-size="10" fill="#333">68% lie 110 – 130</text>
<text x="40" y="148" font-size="10" fill="#333">95% lie 100 – 140</text>
<text x="40" y="164" font-size="10" fill="#333">99.7% lie 90 – 150</text>

<rect x="460" y="60" width="155" height="110" fill="#fff" stroke="#d8d2c4"/>
<text x="537" y="78" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">WHAT SD MEANS</text>
<text x="470" y="97" font-size="10" fill="#333">SD measures SPREAD, not</text>
<text x="470" y="112" font-size="10" fill="#333">average and not error.</text>
<text x="470" y="131" font-size="10" fill="#333">Small SD = values clustered</text>
<text x="470" y="146" font-size="10" fill="#333">tightly, curve is narrow.</text>
<text x="470" y="164" font-size="10" fill="#333">Large SD = wide, flat curve.</text>

<text x="320" y="340" text-anchor="middle" font-size="11" font-style="italic" fill="#6b5410">Two data sets can share the same mean and be completely different. Always ask for the SD as well.</text>
</svg>