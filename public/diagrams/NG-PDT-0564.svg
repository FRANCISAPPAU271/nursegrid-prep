<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="420" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">GHANA ROUTINE IMMUNISATION SCHEDULE</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">Expanded Programme on Immunisation — birth to nine years</text>

<rect x="24" y="58" width="592" height="24" fill="#1a3a5c"/>
<text x="40" y="75" font-size="12" font-weight="bold" fill="#fff">AGE</text>
<text x="150" y="75" font-size="12" font-weight="bold" fill="#fff">VACCINES GIVEN AT THIS CONTACT</text>

<g font-size="11" fill="#222">
<rect x="24" y="82" width="592" height="24" fill="#eef4f8"/>
<text x="40" y="98" font-weight="bold">Birth</text><text x="150" y="98">BCG (intradermal, right upper arm) · OPV 0 · Hepatitis B birth dose</text>
<rect x="24" y="106" width="592" height="24" fill="#fff"/>
<text x="40" y="122" font-weight="bold">6 weeks</text><text x="150" y="122">Penta 1 (DPT-HepB-Hib) · OPV 1 · PCV 1 · Rota 1</text>
<rect x="24" y="130" width="592" height="24" fill="#eef4f8"/>
<text x="40" y="146" font-weight="bold">10 weeks</text><text x="150" y="146">Penta 2 · OPV 2 · PCV 2 · Rota 2</text>
<rect x="24" y="154" width="592" height="24" fill="#fff"/>
<text x="40" y="170" font-weight="bold">14 weeks</text><text x="150" y="170">Penta 3 · OPV 3 · PCV 3 · Rota 3 · IPV 1</text>
<rect x="24" y="178" width="592" height="24" fill="#eef4f8"/>
<text x="40" y="194" font-weight="bold">6 months</text><text x="150" y="194">Malaria vaccine 1 · Vitamin A 100,000 IU</text>
<rect x="24" y="202" width="592" height="24" fill="#fff"/>
<text x="40" y="218" font-weight="bold">7 months</text><text x="150" y="218">Malaria vaccine 2 · IPV 2</text>
<rect x="24" y="226" width="592" height="24" fill="#eef4f8"/>
<text x="40" y="242" font-weight="bold">9 months</text><text x="150" y="242">Measles-Rubella 1 · Yellow fever · Malaria vaccine 3</text>
<rect x="24" y="250" width="592" height="24" fill="#fff"/>
<text x="40" y="266" font-weight="bold">18 months</text><text x="150" y="266">Measles-Rubella 2 · Men A · Malaria vaccine 4 · Vitamin A</text>
<rect x="24" y="274" width="592" height="24" fill="#eef4f8"/>
<text x="40" y="290" font-weight="bold">9 years</text><text x="150" y="290">HPV (girls)</text>
</g>
<rect x="24" y="58" width="592" height="240" fill="none" stroke="#1a3a5c" stroke-width="1.5"/>
<line x1="140" y1="58" x2="140" y2="298" stroke="#9bb4c8"/>

<rect x="24" y="310" width="288" height="96" fill="#eaf3ea" stroke="#8fb98f" stroke-width="1.5"/>
<text x="168" y="329" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5c3a">THINGS THAT ARE NOT CONTRAINDICATIONS</text>
<text x="34" y="348" font-size="10">Mild fever, cough or runny nose</text>
<text x="34" y="364" font-size="10">Mild diarrhoea  ·  malnutrition  ·  being breastfed</text>
<text x="34" y="380" font-size="10">A missed appointment — never restart the course</text>
<text x="34" y="396" font-size="10">Give the missed dose and continue from there</text>

<rect x="328" y="310" width="288" height="96" fill="#f7ecec" stroke="#c08a8a" stroke-width="1.5"/>
<text x="472" y="329" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b2f2f">COLD CHAIN — 2 °C to 8 °C</text>
<text x="338" y="348" font-size="10">Read the vaccine vial monitor before every dose</text>
<text x="338" y="364" font-size="10">Inner square lighter than the ring — use the vaccine</text>
<text x="338" y="380" font-size="10">Inner square as dark as or darker than ring — discard</text>
<text x="338" y="396" font-size="10">Never freeze Penta, PCV or Hep B; freezing destroys them</text>
</svg>