<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="360" fill="#fbfaf7"/>
<text x="320" y="27" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">THE F DIAGRAM — HOW FAECES REACHES A NEW MOUTH</text>
<text x="320" y="46" text-anchor="middle" font-size="12" fill="#555">Every barrier you can place, and the one that blocks the most routes</text>

<rect x="26" y="145" width="86" height="56" rx="4" fill="#e0d3c3" stroke="#8b6a2f" stroke-width="2"/>
<text x="69" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b4f18">FAECES</text>
<text x="69" y="188" text-anchor="middle" font-size="10" fill="#6b4f18">open defecation</text>

<rect x="250" y="66" width="96" height="38" rx="4" fill="#dbe6f0" stroke="#1a3a5c"/>
<text x="298" y="90" text-anchor="middle" font-size="11" fill="#1a3a5c">FLUIDS  water</text>
<rect x="250" y="120" width="96" height="38" rx="4" fill="#dbe6f0" stroke="#1a3a5c"/>
<text x="298" y="144" text-anchor="middle" font-size="11" fill="#1a3a5c">FIELDS  soil</text>
<rect x="250" y="174" width="96" height="38" rx="4" fill="#dbe6f0" stroke="#1a3a5c"/>
<text x="298" y="198" text-anchor="middle" font-size="11" fill="#1a3a5c">FLIES</text>
<rect x="250" y="228" width="96" height="38" rx="4" fill="#dbe6f0" stroke="#1a3a5c"/>
<text x="298" y="252" text-anchor="middle" font-size="11" fill="#1a3a5c">FINGERS</text>

<line x1="112" y1="160" x2="248" y2="85" stroke="#8b6a2f" stroke-width="1.5"/>
<line x1="112" y1="168" x2="248" y2="139" stroke="#8b6a2f" stroke-width="1.5"/>
<line x1="112" y1="180" x2="248" y2="193" stroke="#8b6a2f" stroke-width="1.5"/>
<line x1="112" y1="190" x2="248" y2="247" stroke="#8b6a2f" stroke-width="1.5"/>

<rect x="404" y="147" width="86" height="52" rx="4" fill="#f6f3ec" stroke="#8b6a2f"/>
<text x="447" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b4f18">FOOD</text>
<text x="447" y="188" text-anchor="middle" font-size="10" fill="#6b4f18">uncovered</text>
<line x1="346" y1="85" x2="402" y2="160" stroke="#8b6a2f" stroke-width="1.2"/>
<line x1="346" y1="139" x2="402" y2="166" stroke="#8b6a2f" stroke-width="1.2"/>
<line x1="346" y1="193" x2="402" y2="180" stroke="#8b6a2f" stroke-width="1.2"/>
<line x1="346" y1="247" x2="402" y2="188" stroke="#8b6a2f" stroke-width="1.2"/>

<rect x="530" y="147" width="86" height="52" rx="4" fill="#f7e9e9" stroke="#8b2f2f" stroke-width="2"/>
<text x="573" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b2f2f">NEW HOST</text>
<text x="573" y="188" text-anchor="middle" font-size="10" fill="#8b2f2f">mouth</text>
<line x1="490" y1="173" x2="528" y2="173" stroke="#8b2f2f" stroke-width="2"/>
<polygon points="528,173 520,169 520,177" fill="#8b2f2f"/>

<line x1="180" y1="290" x2="180" y2="205" stroke="#1a5c3a" stroke-width="2.5" stroke-dasharray="6,3"/>
<text x="180" y="306" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a5c3a">LATRINE</text>
<text x="180" y="320" text-anchor="middle" font-size="9" fill="#1a5c3a">blocks all four</text>
<text x="180" y="332" text-anchor="middle" font-size="9" fill="#1a5c3a">routes at source</text>

<line x1="380" y1="290" x2="380" y2="215" stroke="#1a5c3a" stroke-width="2" stroke-dasharray="4,3"/>
<text x="380" y="306" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a5c3a">HANDWASHING</text>
<text x="380" y="320" text-anchor="middle" font-size="9" fill="#1a5c3a">with soap blocks</text>
<text x="380" y="332" text-anchor="middle" font-size="9" fill="#1a5c3a">fingers and food</text>

<line x1="540" y1="290" x2="560" y2="205" stroke="#1a5c3a" stroke-width="2" stroke-dasharray="4,3"/>
<text x="552" y="306" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a5c3a">SAFE WATER</text>
<text x="552" y="320" text-anchor="middle" font-size="9" fill="#1a5c3a">and covering food,</text>
<text x="552" y="332" text-anchor="middle" font-size="9" fill="#1a5c3a">boiling, chlorination</text>

<rect x="26" y="212" width="180" height="60" fill="#eaf3ea" stroke="#8fb98f"/>
<text x="116" y="230" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a5c3a">THE PRINCIPLE</text>
<text x="34" y="247" font-size="9" fill="#333">A barrier at the SOURCE stops</text>
<text x="34" y="260" font-size="9" fill="#333">every route at once. Barriers</text>
<text x="34" y="271" font-size="9" fill="#333">further along stop only one.</text>
</svg>