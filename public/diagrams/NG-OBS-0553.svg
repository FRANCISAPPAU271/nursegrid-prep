<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="400" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">THE PARTOGRAPH — TWO LINES THAT DECIDE THE OUTCOME</text>

<line x1="80" y1="290" x2="600" y2="290" stroke="#333" stroke-width="2"/>
<line x1="80" y1="60" x2="80" y2="290" stroke="#333" stroke-width="2"/>
<text x="60" y="70" font-size="10" fill="#555">10</text>
<text x="60" y="128" font-size="10" fill="#555">8</text>
<text x="60" y="186" font-size="10" fill="#555">6</text>
<text x="60" y="244" font-size="10" fill="#555">4</text>
<text x="30" y="180" font-size="10" fill="#555" transform="rotate(-90 30 180)">cervix cm</text>
<text x="340" y="310" text-anchor="middle" font-size="10" fill="#555">hours of labour</text>

<line x1="138" y1="290" x2="370" y2="60" stroke="#1a5c3a" stroke-width="2.5"/>
<text x="196" y="150" font-size="11" font-weight="bold" fill="#1a5c3a" transform="rotate(-45 196 150)">ALERT LINE</text>
<line x1="254" y1="290" x2="486" y2="60" stroke="#8b2f2f" stroke-width="2.5" stroke-dasharray="6,3"/>
<text x="326" y="160" font-size="11" font-weight="bold" fill="#8b2f2f" transform="rotate(-45 326 160)">ACTION LINE</text>

<circle cx="138" cy="290" r="4" fill="#1a3a5c"/>
<circle cx="196" cy="252" r="4" fill="#1a3a5c"/>
<circle cx="254" cy="228" r="4" fill="#1a3a5c"/>
<circle cx="312" cy="216" r="4" fill="#1a3a5c"/>
<polyline points="138,290 196,252 254,228 312,216" fill="none" stroke="#1a3a5c" stroke-width="2"/>
<text x="330" y="212" font-size="10" fill="#1a3a5c">this labour</text>
<text x="330" y="224" font-size="10" fill="#1a3a5c">is slowing</text>

<rect x="396" y="66" width="220" height="72" fill="#eaf3ea" stroke="#8fb98f"/>
<text x="506" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a5c3a">CROSSING THE ALERT LINE</text>
<text x="404" y="104" font-size="10" fill="#333">Progress is slower than expected.</text>
<text x="404" y="120" font-size="10" fill="#333">At a health centre: this is when you</text>
<text x="404" y="132" font-size="10" fill="#333">TRANSFER, while there is still time.</text>

<rect x="396" y="146" width="220" height="72" fill="#f7e9e9" stroke="#c78f8f"/>
<text x="506" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b2f2f">CROSSING THE ACTION LINE</text>
<text x="404" y="184" font-size="10" fill="#333">Obstructed labour must be excluded.</text>
<text x="404" y="200" font-size="10" fill="#333">Requires a decision now: augment,</text>
<text x="404" y="212" font-size="10" fill="#333">or caesarean section.</text>

<rect x="396" y="226" width="220" height="60" fill="#fff" stroke="#d8d2c4"/>
<text x="506" y="244" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">ALSO PLOTTED</text>
<text x="404" y="260" font-size="9" fill="#333">Foetal heart · liquor · moulding · contractions</text>
<text x="404" y="274" font-size="9" fill="#333">Maternal pulse, BP, temperature · urine · drugs</text>

<rect x="24" y="320" width="592" height="70" fill="#fff3cd" stroke="#e0c86a"/>
<text x="320" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b5410">WHY IT SAVES LIVES</text>
<text x="34" y="358" font-size="11" fill="#6b5410">The partograph turns a slow deterioration that is invisible hour to hour into a line moving the wrong way. It is</text>
<text x="34" y="374" font-size="11" fill="#6b5410">started in ACTIVE labour, from about 4 cm. Obstructed labour is the road to ruptured uterus, fistula and death —</text>
<text x="34" y="388" font-size="11" font-weight="bold" fill="#6b5410">and every one of those is preventable by acting when the line is crossed.</text>
</svg>