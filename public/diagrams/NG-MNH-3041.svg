<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 290" role="img">
<rect width="470" height="290" fill="#ffffff"/>
<text x="235" y="24" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Choosing a uterotonic</text>
<rect x="25" y="38" width="420" height="26" fill="#e2e8f0" stroke="#64748b"/>
<text x="95" y="56" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Drug</text>
<text x="215" y="56" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Dose</text>
<text x="360" y="56" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Watch for</text>
<rect x="25" y="64" width="420" height="40" fill="#dcfce7" stroke="#15803d"/>
<text x="95" y="80" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">Oxytocin</text>
<text x="95" y="96" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#14532d">FIRST LINE</text>
<text x="215" y="88" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">10 IU IM within 1 min</text>
<text x="360" y="80" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">needs cold chain 2&#8211;8 &#176;C</text>
<text x="360" y="94" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#14532d">heat destroys it silently</text>
<rect x="25" y="104" width="420" height="46" fill="#fee2e2" stroke="#b91c1c"/>
<text x="95" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7f1d1d">Ergometrine</text>
<text x="215" y="130" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7f1d1d">0.2 mg IM</text>
<text x="360" y="120" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#7f1d1d">CONTRAINDICATED in</text>
<text x="360" y="134" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#7f1d1d">hypertension, pre-eclampsia,</text>
<text x="360" y="146" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#7f1d1d">cardiac disease</text>
<rect x="25" y="150" width="420" height="40" fill="#fef3c7" stroke="#b45309"/>
<text x="95" y="166" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78350f">Misoprostol</text>
<text x="215" y="174" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">800 &#181;g SL (treatment)</text>
<text x="360" y="166" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">shivering, fever</text>
<text x="360" y="180" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#78350f">heat stable, no fridge</text>
<rect x="25" y="190" width="420" height="42" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="95" y="206" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">Carbetocin</text>
<text x="95" y="220" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#1e3a8a">heat stable</text>
<text x="215" y="214" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1e3a8a">100 &#181;g IM or IV</text>
<text x="360" y="206" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1e3a8a">PREVENTION ONLY &#8212;</text>
<text x="360" y="222" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1e3a8a">not for treating a PPH</text>
<rect x="25" y="240" width="420" height="44" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="235" y="258" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">AMTSL: oxytocin 10 IU IM within 1 minute + controlled cord traction + uterine massage</text>
<text x="235" y="276" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">Add tranexamic acid 1 g IV within 3 hours once a PPH is diagnosed.</text>
</svg>