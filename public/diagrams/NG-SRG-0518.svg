<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="400" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">BURNS — THE RULE OF NINES AND THE FLUID FORMULA</text>

<text x="118" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">ADULT — each region is 9% or a multiple</text>
<circle cx="118" cy="86" r="20" fill="#f0e2d0" stroke="#8b6a2f" stroke-width="1.5"/>
<text x="118" y="90" text-anchor="middle" font-size="10" fill="#6b4f18">9%</text>
<text x="152" y="90" font-size="9" fill="#555">head and neck</text>
<rect x="96" y="108" width="44" height="66" fill="#f7d9d9" stroke="#8b2f2f" stroke-width="1.5"/>
<text x="118" y="136" text-anchor="middle" font-size="10" fill="#8b2f2f">18%</text>
<text x="118" y="152" text-anchor="middle" font-size="8" fill="#8b2f2f">front</text>
<text x="152" y="130" font-size="9" fill="#555">trunk front 18%</text>
<text x="152" y="144" font-size="9" fill="#555">trunk back 18%</text>
<rect x="70" y="108" width="22" height="58" fill="#dbe6f0" stroke="#1a3a5c" stroke-width="1.5"/>
<text x="81" y="140" text-anchor="middle" font-size="9" fill="#1a3a5c">9%</text>
<rect x="144" y="108" width="22" height="58" fill="#dbe6f0" stroke="#1a3a5c" stroke-width="1.5"/>
<text x="155" y="140" text-anchor="middle" font-size="9" fill="#1a3a5c">9%</text>
<text x="40" y="182" font-size="9" fill="#555">arm 9% each</text>
<rect x="98" y="178" width="18" height="72" fill="#eadfd0" stroke="#8b6a2f" stroke-width="1.5"/>
<text x="107" y="218" text-anchor="middle" font-size="9" fill="#6b4f18">18%</text>
<rect x="120" y="178" width="18" height="72" fill="#eadfd0" stroke="#8b6a2f" stroke-width="1.5"/>
<text x="129" y="218" text-anchor="middle" font-size="9" fill="#6b4f18">18%</text>
<text x="152" y="220" font-size="9" fill="#555">leg 18% each</text>
<text x="118" y="266" text-anchor="middle" font-size="9" fill="#555">perineum 1%</text>

<rect x="248" y="42" width="176" height="234" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.5"/>
<text x="336" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">CHILD IS DIFFERENT</text>
<text x="258" y="84" font-size="10" fill="#333">A child's head is proportionally</text>
<text x="258" y="98" font-size="10" fill="#333">much larger and the legs smaller.</text>
<text x="258" y="120" font-size="10" font-weight="bold" fill="#8b2f2f">Head 18%   ·   Each leg 14%</text>
<text x="258" y="142" font-size="10" fill="#333">Using the adult chart on a child</text>
<text x="258" y="156" font-size="10" fill="#333">badly UNDER-estimates the burn</text>
<text x="258" y="170" font-size="10" fill="#333">and under-resuscitates the child.</text>
<text x="258" y="196" font-size="10" font-weight="bold" fill="#1a5c3a">FOR SMALL SCATTERED BURNS</text>
<text x="258" y="212" font-size="10" fill="#333">The patient's own PALM including</text>
<text x="258" y="226" font-size="10" fill="#333">the fingers is about 1% of their</text>
<text x="258" y="240" font-size="10" fill="#333">body surface. Use their hand,</text>
<text x="258" y="254" font-size="10" fill="#333">never yours.</text>

<rect x="432" y="42" width="184" height="234" fill="#f7e9e9" stroke="#8b2f2f" stroke-width="1.5"/>
<text x="524" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b2f2f">PARKLAND FORMULA</text>
<text x="524" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">4 mL × kg × %TBSA</text>
<text x="524" y="100" text-anchor="middle" font-size="9" font-style="italic" fill="#555">Ringer's lactate, first 24 hours</text>
<text x="442" y="124" font-size="10" font-weight="bold" fill="#8b2f2f">HALF in the first 8 hours</text>
<text x="442" y="140" font-size="10" fill="#333">counted from the TIME OF BURN,</text>
<text x="442" y="154" font-size="10" fill="#333">not from arrival at hospital.</text>
<text x="442" y="170" font-size="10" fill="#333">The other half over 16 hours.</text>
<rect x="442" y="182" width="164" height="86" fill="#fff" stroke="#c78f8f"/>
<text x="524" y="199" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a3a5c">WORKED EXAMPLE</text>
<text x="450" y="216" font-size="9" fill="#333">70 kg adult, 30% burn</text>
<text x="450" y="231" font-size="9" fill="#333">4 × 70 × 30 = 8,400 mL</text>
<text x="450" y="246" font-size="9" fill="#333">First 8 h: 4,200 mL</text>
<text x="450" y="261" font-size="9" fill="#333">Next 16 h: 4,200 mL</text>

<rect x="24" y="284" width="592" height="30" fill="#1a3a5c"/>
<text x="320" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">THE FORMULA IS A STARTING POINT — URINE OUTPUT IS THE REAL GUIDE</text>

<rect x="24" y="314" width="592" height="80" fill="#fff" stroke="#d8d2c4"/>
<text x="34" y="334" font-size="10" fill="#333">Target urine output: adult 0.5 mL/kg/hour  ·  child 1 mL/kg/hour. Titrate the drip up or down against it.</text>
<text x="34" y="354" font-size="10" fill="#333">First aid: cool running water 20 minutes, remove jewellery before swelling, cover with clean cloth or cling film.</text>
<text x="34" y="374" font-size="10" font-weight="bold" fill="#8b2f2f">NEVER apply ice, butter, oil, toothpaste, egg or herbs. Ice deepens the burn; the rest trap heat and infect it.</text>
<text x="34" y="390" font-size="10" font-weight="bold" fill="#8b2f2f">Circumferential burns and facial or airway burns are emergencies in their own right.</text>
</svg>