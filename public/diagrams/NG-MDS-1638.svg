<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 474" width="100%" role="img">
<rect x="0" y="0" width="760" height="474" fill="#fdfcfa"/>
<text x="20" y="30" font-family="Georgia,serif" font-size="19" font-weight="bold" fill="#1d4e63">Changing the form of a tablet can change the dose</text>
<text x="20" y="52" font-family="Georgia,serif" font-size="13" fill="#555">A tablet is a delivery device, not just a container. Crushing one may hand the patient the whole day at once.</text>

<rect x="20" y="68" width="232" height="176" rx="6" fill="#fff3f0" stroke="#c0392b"/>
<text x="34" y="90" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#7a2020">Modified release</text>
<text x="34" y="112" font-family="Georgia,serif" font-size="12" fill="#333">Designed to release slowly</text>
<text x="34" y="130" font-family="Georgia,serif" font-size="12" fill="#333">over twelve or twenty-four</text>
<text x="34" y="148" font-family="Georgia,serif" font-size="12" fill="#333">hours.</text>
<text x="34" y="174" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#7a2020">Crush it and the entire</text>
<text x="34" y="192" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#7a2020">day's dose is absorbed</text>
<text x="34" y="210" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#7a2020">in minutes.</text>
<text x="34" y="234" font-family="Georgia,serif" font-size="11" fill="#555">Names often end in SR, MR, XL, LA.</text>

<rect x="264" y="68" width="232" height="176" rx="6" fill="#fff8e8" stroke="#b8860b"/>
<text x="278" y="90" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#8a6508">Enteric coated</text>
<text x="278" y="112" font-family="Georgia,serif" font-size="12" fill="#333">The coating survives acid so</text>
<text x="278" y="130" font-family="Georgia,serif" font-size="12" fill="#333">the drug is released in the</text>
<text x="278" y="148" font-family="Georgia,serif" font-size="12" fill="#333">intestine instead.</text>
<text x="278" y="174" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#8a6508">Crush it and you either</text>
<text x="278" y="192" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#8a6508">destroy the drug or</text>
<text x="278" y="210" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#8a6508">damage the stomach.</text>
<text x="278" y="234" font-family="Georgia,serif" font-size="11" fill="#555">Names often carry EC or e/c.</text>

<rect x="508" y="68" width="232" height="176" rx="6" fill="#f2f7f2" stroke="#2e7d5b"/>
<text x="522" y="90" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#1d5c42">Sublingual</text>
<text x="522" y="112" font-family="Georgia,serif" font-size="12" fill="#333">Absorbed straight into the</text>
<text x="522" y="130" font-family="Georgia,serif" font-size="12" fill="#333">blood under the tongue,</text>
<text x="522" y="148" font-family="Georgia,serif" font-size="12" fill="#333">bypassing the liver.</text>
<text x="522" y="174" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#1d5c42">Swallow it and the liver</text>
<text x="522" y="192" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#1d5c42">destroys most of it before</text>
<text x="522" y="210" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#1d5c42">it reaches the heart.</text>
<text x="522" y="234" font-family="Georgia,serif" font-size="11" fill="#555">Teach the patient not to swallow.</text>

<rect x="20" y="262" width="720" height="92" rx="6" fill="#eef4f8" stroke="#2b6b8a"/>
<text x="34" y="284" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#1d4e63">Giving medicines down a feeding tube</text>
<text x="34" y="306" font-family="Georgia,serif" font-size="12" fill="#333">Use a liquid form if one exists. Never crush modified release or enteric coated tablets — ask for a change of</text>
<text x="34" y="324" font-family="Georgia,serif" font-size="12" fill="#333">drug or form instead. Give each medicine separately, flushing before, between and after, so the tube does not</text>
<text x="34" y="342" font-family="Georgia,serif" font-size="12" fill="#333">block and the drugs do not react in the syringe. Stop the feed where the drug requires an empty stomach.</text>

<rect x="20" y="372" width="720" height="88" rx="6" fill="#f4f4fb" stroke="#4a4a8a"/>
<text x="34" y="394" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#33336b">The question to ask before you alter any preparation</text>
<text x="34" y="416" font-family="Georgia,serif" font-size="12" fill="#333">Why was it made in this form? If the answer is to control where or how fast it is released, changing the form</text>
<text x="34" y="434" font-family="Georgia,serif" font-size="12" fill="#333">changes the dose the patient actually receives. If you cannot answer, ask the pharmacist before you act —</text>
<text x="34" y="452" font-family="Georgia,serif" font-size="12" fill="#333">this is one of the commonest and most avoidable causes of harm on a busy ward.</text>
</svg>