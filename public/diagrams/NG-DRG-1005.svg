<svg viewBox="0 0 640 445" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="445" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">PSYCHOTROPIC DRUGS — THE MOVEMENT SIDE EFFECTS</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">Four different problems, four different timescales, and only one of them is an emergency.</text>

<rect x="30" y="60" width="285" height="92" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.7"/>
<text x="172" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">HOURS TO DAYS — DYSTONIA</text>
<g font-size="10" fill="#222">
<text x="44" y="100">Neck twists, jaw locks, eyes roll up</text>
<text x="44" y="118">Frightening, and often mistaken</text>
<text x="44" y="132">for hysteria or attention-seeking</text>
<text x="44" y="146">Treat now with anticholinergic</text>
</g>

<rect x="325" y="60" width="285" height="92" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.7"/>
<text x="467" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5c3a">DAYS TO WEEKS — AKATHISIA</text>
<g font-size="10" fill="#222">
<text x="339" y="100">Cannot sit still, must keep moving</text>
<text x="339" y="118">An inner restlessness, deeply</text>
<text x="339" y="132">distressing, linked to self-harm</text>
<text x="339" y="146">Not agitation — do not raise the dose</text>
</g>

<rect x="30" y="164" width="285" height="92" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.7"/>
<text x="172" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1e">WEEKS — PARKINSONISM</text>
<g font-size="10" fill="#222">
<text x="44" y="204">Tremor, stiffness, slow movement,</text>
<text x="44" y="218">expressionless face, shuffling walk</text>
<text x="44" y="238">Frequently mistaken for the</text>
<text x="44" y="252">illness itself getting worse</text>
</g>

<rect x="325" y="164" width="285" height="92" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.7"/>
<text x="467" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b3a6b">MONTHS TO YEARS — TARDIVE</text>
<g font-size="10" fill="#222">
<text x="339" y="204">Lip smacking, tongue movements,</text>
<text x="339" y="218">grimacing, writhing fingers</text>
<text x="339" y="238">May be permanent — which is why</text>
<text x="339" y="252">it must be spotted early</text>
</g>

<rect x="30" y="268" width="580" height="88" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.8"/>
<text x="320" y="288" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8b2f2f">THE EMERGENCY — NEUROLEPTIC MALIGNANT SYNDROME</text>
<g font-size="10.5" fill="#222">
<text x="44" y="310">High fever · lead-pipe muscle rigidity · confusion · unstable pulse and blood pressure · sweating</text>
<text x="44" y="330">Stop the drug, cool the patient, give fluids and call for help. It can kill within a day.</text>
<text x="44" y="348">Do not assume the fever is malaria and treat only that. Look at the muscles as well as the temperature.</text>
</g>

<rect x="30" y="370" width="580" height="46" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.6"/>
<text x="320" y="390" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">LITHIUM — A NARROW MARGIN BETWEEN TREATMENT AND POISONING</text>
<text x="44" y="408" font-size="10" fill="#222">Vomiting, diarrhoea, coarse tremor, slurred speech and drowsiness mean toxicity. Dehydration and diuretics raise the level.</text>

<text x="320" y="438" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8b2f2f">A new movement in a patient on these drugs is caused by the drug until proved otherwise.</text>
</svg>