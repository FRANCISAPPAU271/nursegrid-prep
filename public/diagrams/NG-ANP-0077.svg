<svg viewBox="0 0 470 260" role="img" xmlns="http://www.w3.org/2000/svg"><title>Blood flow through the heart</title>
<rect width="470" height="260" fill="#f6f8fc"/>
<text x="235" y="20" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">Right side = deoxygenated · Left side = oxygenated</text>
<rect x="95" y="40" width="130" height="70" rx="8" fill="#2b6fa8" opacity=".25" stroke="#2b6fa8" stroke-width="2"/>
<rect x="95" y="126" width="130" height="96" rx="8" fill="#2b6fa8" opacity=".35" stroke="#2b6fa8" stroke-width="2.5"/>
<rect x="245" y="40" width="130" height="70" rx="8" fill="#e2574c" opacity=".22" stroke="#e2574c" stroke-width="2"/>
<rect x="245" y="126" width="130" height="96" rx="8" fill="#e2574c" opacity=".35" stroke="#e2574c" stroke-width="3"/>
<g font-family="system-ui" text-anchor="middle">
<text x="160" y="70" font-size="12" font-weight="700">RIGHT ATRIUM</text><text x="160" y="88" font-size="9.5">from vena cavae</text>
<text x="160" y="160" font-size="12" font-weight="700">RIGHT VENTRICLE</text><text x="160" y="178" font-size="9.5">to lungs via</text><text x="160" y="191" font-size="9.5">pulmonary ARTERY</text>
<text x="310" y="70" font-size="12" font-weight="700">LEFT ATRIUM</text><text x="310" y="88" font-size="9.5">from pulmonary VEINS</text>
<text x="310" y="158" font-size="12" font-weight="700">LEFT VENTRICLE</text><text x="310" y="176" font-size="9.5">to body via aorta</text>
<text x="310" y="196" font-size="9.5" font-weight="700">thickest wall</text>
</g>
<path d="M160 110 v14" stroke="#2b6fa8" stroke-width="2.5" marker-end="url(#h1)"/>
<path d="M310 110 v14" stroke="#e2574c" stroke-width="2.5" marker-end="url(#h1)"/>
<defs><marker id="h1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#5a6b85"/></marker></defs>
<text x="160" y="122" font-size="8.5" text-anchor="middle" font-family="system-ui" fill="#2b6fa8">tricuspid</text>
<text x="310" y="122" font-size="8.5" text-anchor="middle" font-family="system-ui" fill="#e2574c">mitral (bicuspid)</text>
<text x="235" y="240" font-size="10.5" text-anchor="middle" font-family="system-ui" fill="#5a6b85">ARTERIES carry blood AWAY from the heart — even the deoxygenated pulmonary artery</text>
<text x="235" y="254" font-size="10.5" text-anchor="middle" font-family="system-ui" fill="#5a6b85">LEFT ventricle is thickest because it pumps to the whole body</text>
</svg>