<svg viewBox="0 0 470 280" role="img" xmlns="http://www.w3.org/2000/svg"><title>Syndromic management of sexually transmitted infections</title>
<rect width="470" height="280" fill="#f6f8fc"/>
<text x="235" y="20" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">Syndromic management — treat the syndrome, not the guess</text>
<g font-family="system-ui">
<rect x="14" y="30" width="442" height="24" rx="6" fill="#2b6fa8"/>
<text x="90" y="46" font-size="10" fill="#fff" font-weight="700" text-anchor="middle">SYNDROME</text>
<text x="250" y="46" font-size="10" fill="#fff" font-weight="700" text-anchor="middle">LIKELY ORGANISMS</text>
<text x="400" y="46" font-size="10" fill="#fff" font-weight="700" text-anchor="middle">COVER BOTH</text>
<g font-size="9.5">
<rect x="14" y="54" width="442" height="34" fill="#fff" stroke="#dde5ef"/>
<text x="24" y="68" font-weight="700">Urethral discharge</text>
<text x="24" y="82" fill="#5a6b85">man with discharge and dysuria</text>
<text x="180" y="75">Gonorrhoea + chlamydia</text>
<text x="330" y="68" fill="#0b7a5c" font-weight="700">One injection plus</text>
<text x="330" y="82" fill="#0b7a5c" font-weight="700">an oral course</text>
<rect x="14" y="88" width="442" height="34" fill="#f6f8fc" stroke="#dde5ef"/>
<text x="24" y="102" font-weight="700">Vaginal discharge</text>
<text x="24" y="116" fill="#5a6b85">assess risk, examine</text>
<text x="180" y="109">Candida, trichomonas, BV,</text>
<text x="180" y="120" fill="#5a6b85">gonorrhoea and chlamydia if at risk</text>
<text x="330" y="109" fill="#0b7a5c" font-weight="700">Treat by risk</text>
<rect x="14" y="122" width="442" height="34" fill="#fff" stroke="#dde5ef"/>
<text x="24" y="136" font-weight="700">Genital ulcer</text>
<text x="24" y="150" fill="#5a6b85">painless vs painful matters</text>
<text x="180" y="143">Syphilis, chancroid, herpes</text>
<text x="330" y="136" fill="#0b7a5c" font-weight="700">Cover syphilis and</text>
<text x="330" y="150" fill="#0b7a5c" font-weight="700">chancroid together</text>
<rect x="14" y="156" width="442" height="34" fill="#f6f8fc" stroke="#dde5ef"/>
<text x="24" y="170" font-weight="700">Lower abdominal pain</text>
<text x="24" y="184" fill="#5a6b85">in a sexually active woman</text>
<text x="180" y="177">Pelvic inflammatory disease</text>
<text x="330" y="170" fill="#a8352c" font-weight="700">Exclude pregnancy</text>
<text x="330" y="184" fill="#a8352c" font-weight="700">and ectopic FIRST</text>
<rect x="14" y="190" width="442" height="34" fill="#fff" stroke="#dde5ef"/>
<text x="24" y="204" font-weight="700">Neonatal conjunctivitis</text>
<text x="24" y="218" fill="#5a6b85">ophthalmia neonatorum</text>
<text x="180" y="211">Gonorrhoea, chlamydia</text>
<text x="330" y="204" fill="#a8352c" font-weight="700">Treat baby AND</text>
<text x="330" y="218" fill="#a8352c" font-weight="700">both parents</text>
</g>
</g>
<rect x="14" y="232" width="442" height="40" rx="8" fill="#fff" stroke="#0f9d76" stroke-width="2"/>
<text x="235" y="248" font-size="10.5" text-anchor="middle" font-family="system-ui" font-weight="700">Every STI consultation also needs: partner notification and treatment,</text>
<text x="235" y="264" font-size="10.5" text-anchor="middle" font-family="system-ui" font-weight="700">condoms, HIV and syphilis testing, and a private, non-judgemental manner</text>
</svg>