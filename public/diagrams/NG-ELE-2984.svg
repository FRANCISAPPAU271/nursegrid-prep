<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" role="img">
<rect width="460" height="260" fill="#ffffff"/>
<text x="230" y="26" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Tonicity: which way does water move?</text>
<circle cx="90" cy="110" r="38" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="90" y="115" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1e3a8a">normal</text>
<text x="90" y="168" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">ISOTONIC</text>
<text x="90" y="184" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">0.9% saline</text>
<text x="90" y="198" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">Ringer&#8217;s lactate</text>
<text x="90" y="214" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">no net shift</text>
<circle cx="230" cy="110" r="46" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="230" y="115" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14532d">swells</text>
<path d="M188 84 L204 96" stroke="#15803d" stroke-width="2" marker-end="url(#ah)"/>
<text x="230" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">HYPOTONIC</text>
<text x="230" y="192" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">0.45% saline</text>
<text x="230" y="206" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">water enters cell</text>
<text x="230" y="222" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#b91c1c">risk: cerebral oedema</text>
<circle cx="370" cy="110" r="28" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="370" y="115" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7f1d1d">shrinks</text>
<text x="370" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">HYPERTONIC</text>
<text x="370" y="192" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">3% saline, mannitol</text>
<text x="370" y="206" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">water leaves cell</text>
<text x="370" y="222" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#b91c1c">risk: fluid overload</text>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#15803d"/></marker></defs>
<text x="230" y="248" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Water always moves toward the higher solute concentration.</text>
</svg>