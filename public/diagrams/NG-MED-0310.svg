<svg viewBox="0 0 470 250" role="img" xmlns="http://www.w3.org/2000/svg"><title>Serum potassium danger scale</title>
<rect width="470" height="250" fill="#f6f8fc"/>
<text x="235" y="20" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">Serum potassium — both ends stop the heart</text>
<rect x="60" y="34" width="350" height="26" rx="5" fill="#a8352c"/>
<rect x="60" y="60" width="350" height="26" fill="#f2b705"/>
<rect x="60" y="86" width="350" height="34" fill="#0f9d76"/>
<rect x="60" y="120" width="350" height="26" fill="#f2b705"/>
<rect x="60" y="146" width="350" height="26" rx="5" fill="#a8352c"/>
<g font-family="system-ui" font-size="10.5" fill="#fff" font-weight="700">
<text x="70" y="52">above 6.5 mmol/L — EMERGENCY</text>
<text x="70" y="167">below 2.5 mmol/L — EMERGENCY</text>
</g>
<g font-family="system-ui" font-size="10.5" font-weight="700">
<text x="70" y="78" fill="#4a3a00">5.5 – 6.5  hyperkalaemia</text>
<text x="70" y="107" fill="#fff">3.5 – 5.0 mmol/L   NORMAL</text>
<text x="70" y="138" fill="#4a3a00">2.5 – 3.5  hypokalaemia</text>
</g>
<g font-family="system-ui" font-size="9.5" fill="#1b2a3d">
<text x="60" y="192" font-weight="700">HIGH potassium</text>
<text x="60" y="207">Tall peaked T waves, wide QRS</text>
<text x="60" y="221">Muscle weakness, cardiac arrest</text>
<text x="60" y="235" fill="#a8352c" font-weight="700">Causes: renal failure, crush injury, ACE inhibitor</text>
<text x="260" y="192" font-weight="700">LOW potassium</text>
<text x="260" y="207">Flat T waves, U waves appear</text>
<text x="260" y="221">Weakness, ileus, arrhythmia</text>
<text x="260" y="235" fill="#a8352c" font-weight="700">Causes: diarrhoea, vomiting, frusemide</text>
</g>
</svg>