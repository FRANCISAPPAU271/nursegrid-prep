<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="460" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">RUNNING A STORE: THE FOUR NUMBERS THAT PREVENT A STOCK-OUT</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">A stock-out is almost never a supply problem. It is an arithmetic problem nobody did in time.</text>

<line x1="70" y1="230" x2="600" y2="230" stroke="#333" stroke-width="2"/>
<line x1="70" y1="80" x2="70" y2="230" stroke="#333" stroke-width="2"/>
<text x="46" y="86" font-size="9" fill="#333">stock</text>
<text x="600" y="248" font-size="9" fill="#333" text-anchor="end">time</text>
<polyline points="70,96 170,150 170,96 270,150 270,96 370,150 370,96 470,168 470,96 560,196" fill="none" stroke="#1a3a5c" stroke-width="2.4"/>
<line x1="70" y1="150" x2="600" y2="150" stroke="#c8a54b" stroke-width="1.8" stroke-dasharray="6,4"/>
<text x="606" y="154" font-size="9" fill="#8a6d1e" text-anchor="end"> </text>
<text x="480" y="144" font-size="9.5" fill="#8a6d1e">REORDER LEVEL — order here, not when empty</text>
<line x1="70" y1="204" x2="600" y2="204" stroke="#8b2f2f" stroke-width="1.8" stroke-dasharray="4,4"/>
<text x="480" y="220" font-size="9.5" fill="#8b2f2f">BUFFER STOCK — the cushion for a late delivery</text>

<rect x="24" y="262" width="290" height="106" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.7"/>
<text x="169" y="282" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">THE FOUR NUMBERS</text>
<g font-size="9.5" fill="#222">
<text x="34" y="302">1  Average monthly consumption</text>
<text x="34" y="320">2  Lead time: order to delivery</text>
<text x="34" y="338">3  Buffer stock for delay and demand spikes</text>
<text x="34" y="356">4  Reorder level = consumption in the lead</text>
</g>
<text x="46" y="366" font-size="9.5" fill="#222"> </text>

<rect x="326" y="262" width="290" height="106" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.7"/>
<text x="471" y="282" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a5c3a">FIRST EXPIRY, FIRST OUT</text>
<g font-size="9.5" fill="#222">
<text x="336" y="302">Issue by expiry date, not by arrival date.</text>
<text x="336" y="320">Put the shortest-dated stock at the front.</text>
<text x="336" y="342" font-style="italic">A newly delivered batch may expire before</text>
<text x="336" y="358" font-style="italic">one that has been on the shelf for months.</text>
</g>

<rect x="24" y="382" width="290" height="66" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.7"/>
<text x="169" y="402" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8b2f2f">WHEN THE COUNT AND THE CARD DISAGREE</text>
<g font-size="9.5" fill="#222">
<text x="34" y="422">Do not adjust the card to match the shelf.</text>
<text x="34" y="438">Investigate, then correct with a signed entry.</text>
</g>

<rect x="326" y="382" width="290" height="66" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.7"/>
<text x="471" y="402" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6b3a6b">SEPARATE THE THREE ROLES</text>
<g font-size="9.5" fill="#222">
<text x="336" y="422">The person who orders, the person who</text>
<text x="336" y="438">receives and the person who counts differ.</text>
</g>
</svg>