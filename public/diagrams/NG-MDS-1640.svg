<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 462" width="100%" role="img">
<rect x="0" y="0" width="760" height="462" fill="#fdfcfa"/>
<text x="20" y="30" font-family="Georgia,serif" font-size="19" font-weight="bold" fill="#33336b">Preparing an injection: four questions before the needle</text>

<rect x="20" y="48" width="352" height="140" rx="6" fill="#eef4f8" stroke="#2b6b8a"/>
<text x="34" y="70" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#1d4e63">1. What do I reconstitute it with?</text>
<text x="34" y="92" font-family="Georgia,serif" font-size="12" fill="#333">The diluent is specified, and it is not always</text>
<text x="34" y="110" font-family="Georgia,serif" font-size="12" fill="#333">interchangeable. Using the wrong one can</text>
<text x="34" y="128" font-family="Georgia,serif" font-size="12" fill="#333">precipitate the drug or inactivate it.</text>
<text x="34" y="152" font-family="Georgia,serif" font-size="12" fill="#333">The powder also occupies volume, so the</text>
<text x="34" y="170" font-family="Georgia,serif" font-size="12" fill="#333">final volume exceeds the diluent added.</text>

<rect x="388" y="48" width="352" height="140" rx="6" fill="#fff8e8" stroke="#b8860b"/>
<text x="402" y="70" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#8a6508">2. Can it share a line?</text>
<text x="402" y="92" font-family="Georgia,serif" font-size="12" fill="#333">Two compatible drugs may be given through</text>
<text x="402" y="110" font-family="Georgia,serif" font-size="12" fill="#333">one line. Incompatible ones form a</text>
<text x="402" y="128" font-family="Georgia,serif" font-size="12" fill="#333">precipitate you may not see.</text>
<text x="402" y="152" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#8a6508">If in doubt, flush between them.</text>
<text x="402" y="172" font-family="Georgia,serif" font-size="12" fill="#333">Never assume; check the chart.</text>

<rect x="20" y="204" width="352" height="140" rx="6" fill="#f2f7f2" stroke="#2e7d5b"/>
<text x="34" y="226" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#1d5c42">3. How fast may it go in?</text>
<text x="34" y="248" font-family="Georgia,serif" font-size="12" fill="#333">Rate is part of the prescription, not a</text>
<text x="34" y="266" font-family="Georgia,serif" font-size="12" fill="#333">detail. Some drugs cause collapse, flushing</text>
<text x="34" y="284" font-family="Georgia,serif" font-size="12" fill="#333">or arrhythmia if pushed quickly.</text>
<text x="34" y="308" font-family="Georgia,serif" font-size="12" fill="#333">Potassium is the one that kills: never as a</text>
<text x="34" y="326" font-family="Georgia,serif" font-size="12" fill="#333">bolus, always diluted and controlled.</text>

<rect x="388" y="204" width="352" height="140" rx="6" fill="#fff3f0" stroke="#c0392b"/>
<text x="402" y="226" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#7a2020">4. What if it leaks out of the vein?</text>
<text x="402" y="248" font-family="Georgia,serif" font-size="12" fill="#333">Swelling, pain, coolness, no blood return,</text>
<text x="402" y="266" font-family="Georgia,serif" font-size="12" fill="#333">or an infusion that suddenly slows.</text>
<text x="402" y="290" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#7a2020">Stop at once. Do not flush the line to</text>
<text x="402" y="308" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#7a2020">test it — that pushes more drug into</text>
<text x="402" y="326" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#7a2020">the tissue. Aspirate, then follow policy.</text>

<rect x="20" y="360" width="720" height="88" rx="6" fill="#f4f4fb" stroke="#4a4a8a"/>
<text x="34" y="382" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#33336b">The arithmetic that must be done twice</text>
<text x="34" y="404" font-family="Georgia,serif" font-size="12" fill="#333">Volume required equals the dose you want, divided by the strength you hold, multiplied by the volume that</text>
<text x="34" y="422" font-family="Georgia,serif" font-size="12" fill="#333">strength is in. Drops per minute equals the volume in millilitres times the giving set drop factor, divided</text>
<text x="34" y="440" font-family="Georgia,serif" font-size="12" fill="#333">by the time in minutes. Write the working down. An answer carried in your head cannot be checked.</text>
</svg>