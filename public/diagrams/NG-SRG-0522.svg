<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="400" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">THE ACUTE ABDOMEN — WHERE THE PAIN POINTS</text>

<rect x="200" y="46" width="240" height="240" fill="#fdf8f0" stroke="#8b6a2f" stroke-width="2"/>
<line x1="280" y1="46" x2="280" y2="286" stroke="#c9b98f" stroke-width="1"/>
<line x1="360" y1="46" x2="360" y2="286" stroke="#c9b98f" stroke-width="1"/>
<line x1="200" y1="126" x2="440" y2="126" stroke="#c9b98f" stroke-width="1"/>
<line x1="200" y1="206" x2="440" y2="206" stroke="#c9b98f" stroke-width="1"/>

<text x="240" y="82" text-anchor="middle" font-size="9" fill="#333">right upper</text>
<text x="240" y="96" text-anchor="middle" font-size="10" font-weight="bold" fill="#8b2f2f">gallbladder</text>
<text x="240" y="110" text-anchor="middle" font-size="9" fill="#555">liver</text>
<text x="320" y="82" text-anchor="middle" font-size="9" fill="#333">epigastric</text>
<text x="320" y="96" text-anchor="middle" font-size="10" font-weight="bold" fill="#8b2f2f">peptic ulcer</text>
<text x="320" y="110" text-anchor="middle" font-size="9" fill="#555">pancreas</text>
<text x="400" y="82" text-anchor="middle" font-size="9" fill="#333">left upper</text>
<text x="400" y="96" text-anchor="middle" font-size="10" font-weight="bold" fill="#8b2f2f">spleen</text>

<text x="240" y="158" text-anchor="middle" font-size="9" fill="#333">right flank</text>
<text x="240" y="172" text-anchor="middle" font-size="10" font-weight="bold" fill="#8b2f2f">kidney, ureter</text>
<text x="320" y="158" text-anchor="middle" font-size="9" fill="#333">umbilical</text>
<text x="320" y="172" text-anchor="middle" font-size="10" font-weight="bold" fill="#8b2f2f">early appendix</text>
<text x="320" y="186" text-anchor="middle" font-size="9" fill="#555">small bowel</text>
<text x="400" y="158" text-anchor="middle" font-size="9" fill="#333">left flank</text>
<text x="400" y="172" text-anchor="middle" font-size="10" font-weight="bold" fill="#8b2f2f">kidney, ureter</text>

<text x="240" y="238" text-anchor="middle" font-size="9" fill="#333">right iliac</text>
<text x="240" y="252" text-anchor="middle" font-size="10" font-weight="bold" fill="#8b2f2f">APPENDIX</text>
<text x="240" y="266" text-anchor="middle" font-size="9" fill="#555">ectopic, ovary</text>
<text x="320" y="238" text-anchor="middle" font-size="9" fill="#333">suprapubic</text>
<text x="320" y="252" text-anchor="middle" font-size="10" font-weight="bold" fill="#8b2f2f">bladder, uterus</text>
<text x="400" y="238" text-anchor="middle" font-size="9" fill="#333">left iliac</text>
<text x="400" y="252" text-anchor="middle" font-size="10" font-weight="bold" fill="#8b2f2f">sigmoid colon</text>
<text x="400" y="266" text-anchor="middle" font-size="9" fill="#555">ectopic, ovary</text>

<rect x="24" y="46" width="164" height="110" fill="#eaf3ea" stroke="#8fb98f"/>
<text x="106" y="66" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a5c3a">APPENDICITIS MOVES</text>
<text x="34" y="86" font-size="10" fill="#333">Starts vague, central,</text>
<text x="34" y="100" font-size="10" fill="#333">around the umbilicus.</text>
<text x="34" y="120" font-size="10" fill="#333">Then SHIFTS to the right</text>
<text x="34" y="134" font-size="10" fill="#333">iliac fossa and becomes</text>
<text x="34" y="148" font-size="10" fill="#333">sharp and localised.</text>

<rect x="24" y="166" width="164" height="120" fill="#f7e9e9" stroke="#c78f8f"/>
<text x="106" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b2f2f">SUDDEN RELIEF</text>
<text x="34" y="206" font-size="10" fill="#333">Severe pain that suddenly</text>
<text x="34" y="220" font-size="10" fill="#333">eases is NOT recovery.</text>
<text x="34" y="240" font-size="10" fill="#333">The appendix has burst.</text>
<text x="34" y="260" font-size="10" fill="#333">Pain returns worse and</text>
<text x="34" y="274" font-size="10" fill="#333">everywhere: peritonitis.</text>

<rect x="452" y="46" width="164" height="240" fill="#fff" stroke="#d8d2c4"/>
<text x="534" y="66" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">FOUR RULES</text>
<text x="462" y="88" font-size="10" font-weight="bold" fill="#8b2f2f">1. Nil by mouth</text>
<text x="462" y="102" font-size="9" fill="#555">surgery may be needed</text>
<text x="462" y="124" font-size="10" font-weight="bold" fill="#8b2f2f">2. No analgesia until</text>
<text x="462" y="138" font-size="10" font-weight="bold" fill="#8b2f2f">reviewed by the surgeon</text>
<text x="462" y="152" font-size="9" fill="#555">it masks the signs</text>
<text x="462" y="174" font-size="10" font-weight="bold" fill="#8b2f2f">3. No laxative, no enema</text>
<text x="462" y="188" font-size="9" fill="#555">may rupture the bowel</text>
<text x="462" y="210" font-size="10" font-weight="bold" fill="#8b2f2f">4. No heat to the abdomen</text>
<text x="462" y="224" font-size="9" fill="#555">speeds rupture</text>
<text x="462" y="248" font-size="10" fill="#333">Observe, chart vital signs,</text>
<text x="462" y="262" font-size="10" fill="#333">IV fluids, and prepare</text>
<text x="462" y="276" font-size="10" fill="#333">for theatre.</text>

<rect x="24" y="296" width="592" height="30" fill="#8b2f2f"/>
<text x="320" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">INTESTINAL OBSTRUCTION — THE FOUR CARDINAL FEATURES</text>

<rect x="24" y="326" width="146" height="66" fill="#fff" stroke="#d8d2c4"/>
<text x="97" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">PAIN</text>
<text x="97" y="366" text-anchor="middle" font-size="10" fill="#555">colicky, comes</text>
<text x="97" y="380" text-anchor="middle" font-size="10" fill="#555">in waves</text>
<rect x="172" y="326" width="146" height="66" fill="#f6f3ec" stroke="#d8d2c4"/>
<text x="245" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">VOMITING</text>
<text x="245" y="366" text-anchor="middle" font-size="10" fill="#555">early if high,</text>
<text x="245" y="380" text-anchor="middle" font-size="10" fill="#555">faeculent if low</text>
<rect x="320" y="326" width="146" height="66" fill="#fff" stroke="#d8d2c4"/>
<text x="393" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">DISTENSION</text>
<text x="393" y="366" text-anchor="middle" font-size="10" fill="#555">greater the lower</text>
<text x="393" y="380" text-anchor="middle" font-size="10" fill="#555">the obstruction</text>
<rect x="468" y="326" width="148" height="66" fill="#f6f3ec" stroke="#d8d2c4"/>
<text x="542" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">ABSOLUTE</text>
<text x="542" y="364" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">CONSTIPATION</text>
<text x="542" y="380" text-anchor="middle" font-size="10" fill="#555">no faeces, no flatus</text>
</svg>