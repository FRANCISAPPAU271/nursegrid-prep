<svg viewBox="0 0 470 230" role="img" xmlns="http://www.w3.org/2000/svg"><title>Stunting wasting underweight</title>
<rect width="470" height="230" fill="#f6f8fc"/>
<text x="235" y="20" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">Three measurements, three different meanings</text>
<g font-family="system-ui">
<rect x="14" y="34" width="142" height="150" rx="10" fill="#fff" stroke="#f2b705" stroke-width="2.5"/>
<text x="85" y="56" font-size="12" text-anchor="middle" font-weight="700" fill="#b58900">STUNTING</text>
<text x="85" y="78" font-size="11" text-anchor="middle" font-weight="700">height for AGE</text>
<text x="85" y="100" font-size="10" text-anchor="middle">too short for age</text>
<text x="85" y="124" font-size="10" text-anchor="middle" font-weight="700">CHRONIC</text>
<text x="85" y="142" font-size="9.5" text-anchor="middle">months to years</text>
<text x="85" y="164" font-size="9" text-anchor="middle" fill="#5a6b85">long-term deprivation</text>
<rect x="164" y="34" width="142" height="150" rx="10" fill="#fff" stroke="#e2574c" stroke-width="3"/>
<text x="235" y="56" font-size="12" text-anchor="middle" font-weight="700" fill="#e2574c">WASTING</text>
<text x="235" y="78" font-size="11" text-anchor="middle" font-weight="700">weight for HEIGHT</text>
<text x="235" y="100" font-size="10" text-anchor="middle">too thin for height</text>
<text x="235" y="124" font-size="10" text-anchor="middle" font-weight="700">ACUTE</text>
<text x="235" y="142" font-size="9.5" text-anchor="middle">recent, weeks</text>
<text x="235" y="164" font-size="9" text-anchor="middle" fill="#a8352c">needs urgent care</text>
<rect x="314" y="34" width="142" height="150" rx="10" fill="#fff" stroke="#2b6fa8" stroke-width="2.5"/>
<text x="385" y="56" font-size="12" text-anchor="middle" font-weight="700" fill="#2b6fa8">UNDERWEIGHT</text>
<text x="385" y="78" font-size="11" text-anchor="middle" font-weight="700">weight for AGE</text>
<text x="385" y="100" font-size="10" text-anchor="middle">too light for age</text>
<text x="385" y="124" font-size="10" text-anchor="middle" font-weight="700">MIXED</text>
<text x="385" y="142" font-size="9.5" text-anchor="middle">acute or chronic</text>
<text x="385" y="164" font-size="9" text-anchor="middle" fill="#5a6b85">the growth chart measure</text>
</g>
<text x="235" y="206" font-size="10.5" text-anchor="middle" font-family="system-ui" fill="#5a6b85">For AGE compares to time · for HEIGHT compares body to frame</text>
<text x="235" y="222" font-size="10" text-anchor="middle" font-family="system-ui" fill="#5a6b85">A stunted child may not be thin · a wasted child needs feeding now</text>
</svg>