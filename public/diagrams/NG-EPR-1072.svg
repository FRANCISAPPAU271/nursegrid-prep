<svg viewBox="0 0 640 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="450" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">WHEN THE CHROMOSOME COUNT GOES WRONG</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">46 chromosomes: 44 autosomes and 2 sex chromosomes. Written 46,XX or 46,XY.</text>

<rect x="30" y="60" width="580" height="62" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.7"/>
<text x="320" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a3a5c">ONE MECHANISM CAUSES MOST OF THEM — NON-DISJUNCTION</text>
<g font-size="10.5" fill="#222">
<text x="44" y="100">A pair fails to separate when the egg or sperm is made. One gamete gets both, the other gets none.</text>
<text x="44" y="116">Nobody caused it. It is not a punishment, not a curse, and not the mother's behaviour in pregnancy.</text>
</g>

<rect x="30" y="136" width="186" height="92" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.6"/>
<text x="123" y="156" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a5c3a">TRISOMY 21 — 47,XX+21</text>
<g font-size="9.5" fill="#222">
<text x="42" y="176">An extra chromosome 21</text>
<text x="42" y="192">Down syndrome</text>
<text x="42" y="212">Risk rises with maternal age</text>
</g>

<rect x="226" y="136" width="186" height="92" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.6"/>
<text x="319" y="156" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1e">45,X — TURNER</text>
<g font-size="9.5" fill="#222">
<text x="238" y="176">One X only. Female.</text>
<text x="238" y="192">Short, ovaries do not develop,</text>
<text x="238" y="212">no puberty without treatment</text>
</g>

<rect x="422" y="136" width="188" height="92" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.6"/>
<text x="516" y="156" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6b3a6b">47,XXY — KLINEFELTER</text>
<g font-size="9.5" fill="#222">
<text x="434" y="176">An extra X. Male.</text>
<text x="434" y="192">Tall, small firm testes,</text>
<text x="434" y="212">infertility, often found late</text>
</g>

<rect x="30" y="240" width="186" height="86" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.6"/>
<text x="123" y="260" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">47,XXX and 47,XYY</text>
<g font-size="9.5" fill="#222">
<text x="42" y="280">Often no obvious features</text>
<text x="42" y="296">at all. Many are never</text>
<text x="42" y="312">diagnosed in a lifetime.</text>
</g>

<rect x="226" y="240" width="186" height="86" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.6"/>
<text x="319" y="260" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">MOSAICISM</text>
<g font-size="9.5" fill="#222">
<text x="238" y="280">Two cell lines in one person.</text>
<text x="238" y="296">The error happened AFTER</text>
<text x="238" y="312">fertilisation. Features milder.</text>
</g>

<rect x="422" y="240" width="188" height="86" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.6"/>
<text x="516" y="260" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">WILLIAMS SYNDROME</text>
<g font-size="9.5" fill="#222">
<text x="434" y="280">A small DELETION on 7 —</text>
<text x="434" y="296">not an extra chromosome.</text>
<text x="434" y="312">Very sociable, heart defects.</text>
</g>

<rect x="30" y="344" width="580" height="66" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.7"/>
<text x="320" y="364" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8b2f2f">WHAT THE NURSE ACTUALLY DOES</text>
<g font-size="10.5" fill="#222">
<text x="44" y="386">Say the child's name before the diagnosis. Explain the mechanism, because parents assume they are to blame.</text>
<text x="44" y="402">Refer early for hearing, vision, heart and development. The condition is fixed; the outcome is not.</text>
</g>

<text x="320" y="436" text-anchor="middle" font-size="10.5" font-style="italic" fill="#1a3a5c">A karyotype counts and pictures the chromosomes. It finds missing, extra and broken ones — not single-gene faults.</text>
</svg>