<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" role="img" aria-label="Safe preparation of infant formula and the dangers of over-dilution and under-dilution">
<rect width="460" height="250" fill="#ffffff"/>
<text x="230" y="22" text-anchor="middle" font-family="Georgia,serif" font-size="15" font-weight="bold" fill="#14532d">Infant formula: the scoop must match the water</text>
<rect x="24" y="40" width="132" height="104" fill="#fee2e2" stroke="#991b1b"/>
<text x="90" y="59" text-anchor="middle" font-family="Georgia,serif" font-size="11.5" font-weight="bold" fill="#991b1b">Too much water</text>
<text x="90" y="77" text-anchor="middle" font-family="Georgia,serif" font-size="10">"making it last"</text>
<text x="34" y="96" font-family="Georgia,serif" font-size="10">• dilute energy</text>
<text x="34" y="112" font-family="Georgia,serif" font-size="10">• poor weight gain</text>
<text x="34" y="128" font-family="Georgia,serif" font-size="10">• water intoxication,</text>
<text x="34" y="140" font-family="Georgia,serif" font-size="10">  low sodium, fits</text>
<rect x="164" y="40" width="132" height="104" fill="#dcfce7" stroke="#14532d" stroke-width="1.8"/>
<text x="230" y="59" text-anchor="middle" font-family="Georgia,serif" font-size="11.5" font-weight="bold" fill="#14532d">Exactly as printed</text>
<text x="174" y="79" font-family="Georgia,serif" font-size="10">• level scoop, not heaped</text>
<text x="174" y="95" font-family="Georgia,serif" font-size="10">• water boiled, then</text>
<text x="174" y="107" font-family="Georgia,serif" font-size="10">  cooled to about 70 °C</text>
<text x="174" y="123" font-family="Georgia,serif" font-size="10">• feed within 2 hours</text>
<text x="174" y="139" font-family="Georgia,serif" font-size="10">• discard what is left</text>
<rect x="304" y="40" width="132" height="104" fill="#fee2e2" stroke="#991b1b"/>
<text x="370" y="59" text-anchor="middle" font-family="Georgia,serif" font-size="11.5" font-weight="bold" fill="#991b1b">Too little water</text>
<text x="370" y="77" text-anchor="middle" font-family="Georgia,serif" font-size="10">"making it strong"</text>
<text x="314" y="96" font-family="Georgia,serif" font-size="10">• high solute load</text>
<text x="314" y="112" font-family="Georgia,serif" font-size="10">• thirst, dehydration</text>
<text x="314" y="128" font-family="Georgia,serif" font-size="10">• strain on immature</text>
<text x="314" y="140" font-family="Georgia,serif" font-size="10">  kidneys</text>
<line x1="24" y1="160" x2="436" y2="160" stroke="#cbd5e1"/>
<text x="230" y="182" text-anchor="middle" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#7c2d12">Water at about 70 °C kills Cronobacter in the powder.</text>
<text x="230" y="204" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#334155">Formula powder is not sterile. Cooler water leaves the organism alive.</text>
<text x="230" y="228" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#334155">A feed left standing warm is a culture medium — never reheat and reuse.</text>
<text x="230" y="245" text-anchor="middle" font-family="Georgia,serif" font-size="10.5" font-style="italic" fill="#334155">Cup feeding is safer than bottle feeding where sterilising is difficult.</text>
</svg>