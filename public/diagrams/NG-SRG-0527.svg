<svg viewBox="0 0 640 390" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="390" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">FRACTURES — TYPES, AND THE COMPLICATION THAT COSTS A LIMB</text>

<g stroke="#8b6a2f" stroke-width="8" stroke-linecap="round">
<line x1="50" y1="52" x2="50" y2="118"/>
<line x1="130" y1="52" x2="130" y2="118"/>
<line x1="210" y1="52" x2="210" y2="118"/>
<line x1="290" y1="52" x2="290" y2="118"/>
<line x1="370" y1="52" x2="370" y2="118"/>
<line x1="450" y1="52" x2="450" y2="118"/>
</g>
<line x1="42" y1="85" x2="58" y2="85" stroke="#fbfaf7" stroke-width="3"/>
<line x1="120" y1="78" x2="140" y2="92" stroke="#fbfaf7" stroke-width="3"/>
<line x1="202" y1="80" x2="218" y2="80" stroke="#fbfaf7" stroke-width="3"/>
<line x1="202" y1="92" x2="218" y2="92" stroke="#fbfaf7" stroke-width="3"/>
<path d="M282 78 L290 86 L298 78" fill="none" stroke="#fbfaf7" stroke-width="3"/>
<line x1="362" y1="85" x2="378" y2="85" stroke="#fbfaf7" stroke-width="2"/>
<path d="M444 84 Q450 76 456 84" fill="none" stroke="#fbfaf7" stroke-width="3"/>
<line x1="450" y1="84" x2="470" y2="70" stroke="#8b2f2f" stroke-width="3"/>

<text x="50" y="136" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a3a5c">TRANSVERSE</text>
<text x="50" y="150" text-anchor="middle" font-size="9" fill="#555">straight across</text>
<text x="130" y="136" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a3a5c">OBLIQUE</text>
<text x="130" y="150" text-anchor="middle" font-size="9" fill="#555">angled</text>
<text x="210" y="136" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a3a5c">COMMINUTED</text>
<text x="210" y="150" text-anchor="middle" font-size="9" fill="#555">many fragments</text>
<text x="290" y="136" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a3a5c">GREENSTICK</text>
<text x="290" y="150" text-anchor="middle" font-size="9" fill="#555">child, bends</text>
<text x="370" y="136" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a3a5c">IMPACTED</text>
<text x="370" y="150" text-anchor="middle" font-size="9" fill="#555">driven together</text>
<text x="452" y="136" text-anchor="middle" font-size="10" font-weight="bold" fill="#8b2f2f">OPEN</text>
<text x="452" y="150" text-anchor="middle" font-size="9" fill="#8b2f2f">through the skin</text>

<rect x="500" y="46" width="116" height="106" fill="#f7e9e9" stroke="#8b2f2f" stroke-width="1.5"/>
<text x="558" y="66" text-anchor="middle" font-size="10" font-weight="bold" fill="#8b2f2f">OPEN = URGENT</text>
<text x="508" y="84" font-size="9" fill="#333">The skin is broken, so</text>
<text x="508" y="97" font-size="9" fill="#333">bone is contaminated.</text>
<text x="508" y="115" font-size="9" fill="#333">Cover with sterile</text>
<text x="508" y="128" font-size="9" fill="#333">dressing, antibiotics,</text>
<text x="508" y="141" font-size="9" fill="#333">tetanus cover, theatre.</text>

<rect x="24" y="164" width="592" height="28" fill="#8b2f2f"/>
<text x="320" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">COMPARTMENT SYNDROME — THE SIX P's, AND WHICH ONE COMES FIRST</text>

<rect x="24" y="192" width="98" height="82" fill="#f7d9d9" stroke="#8b2f2f" stroke-width="2"/>
<text x="73" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b2f2f">PAIN</text>
<text x="73" y="230" text-anchor="middle" font-size="9" fill="#333">out of all</text>
<text x="73" y="243" text-anchor="middle" font-size="9" fill="#333">proportion,</text>
<text x="73" y="256" text-anchor="middle" font-size="9" fill="#333">worse on passive</text>
<text x="73" y="268" text-anchor="middle" font-size="9" font-weight="bold" fill="#8b2f2f">stretch — FIRST</text>

<rect x="126" y="192" width="98" height="82" fill="#fff" stroke="#d8d2c4"/>
<text x="175" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">PARAESTHESIA</text>
<text x="175" y="234" text-anchor="middle" font-size="9" fill="#555">pins and needles,</text>
<text x="175" y="248" text-anchor="middle" font-size="9" fill="#555">then numbness</text>

<rect x="228" y="192" width="98" height="82" fill="#f6f3ec" stroke="#d8d2c4"/>
<text x="277" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">PALLOR</text>
<text x="277" y="234" text-anchor="middle" font-size="9" fill="#555">pale, cool skin</text>

<rect x="330" y="192" width="98" height="82" fill="#fff" stroke="#d8d2c4"/>
<text x="379" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">PARALYSIS</text>
<text x="379" y="234" text-anchor="middle" font-size="9" fill="#555">cannot move it</text>
<text x="379" y="248" text-anchor="middle" font-size="9" fill="#8b2f2f">already late</text>

<rect x="432" y="192" width="98" height="82" fill="#f6f3ec" stroke="#d8d2c4"/>
<text x="481" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">PULSELESS</text>
<text x="481" y="234" text-anchor="middle" font-size="9" fill="#8b2f2f">VERY late — the</text>
<text x="481" y="248" text-anchor="middle" font-size="9" fill="#8b2f2f">limb may already</text>
<text x="481" y="261" text-anchor="middle" font-size="9" fill="#8b2f2f">be lost</text>

<rect x="534" y="192" width="82" height="82" fill="#fff" stroke="#d8d2c4"/>
<text x="575" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">PERISHING</text>
<text x="575" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">COLD</text>
<text x="575" y="248" text-anchor="middle" font-size="9" fill="#555">final sign</text>

<rect x="24" y="284" width="592" height="98" fill="#fff3cd" stroke="#e0c86a"/>
<text x="320" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b5410">WAITING FOR A PULSE TO DISAPPEAR IS WAITING TOO LONG</text>
<text x="34" y="324" font-size="11" fill="#6b5410">Pressure inside the compartment closes the small vessels feeding muscle and nerve long before it can close a</text>
<text x="34" y="340" font-size="11" fill="#6b5410">major artery. A present pulse gives false reassurance. Muscle dies within 4 to 6 hours and the damage is permanent.</text>
<text x="34" y="360" font-size="11" font-weight="bold" fill="#8b2f2f">ACT ON PAIN. Elevate no higher than the heart, split the cast and all padding down to skin, report immediately.</text>
<text x="34" y="376" font-size="11" fill="#6b5410">Definitive treatment is surgical fasciotomy. Other fracture complications: fat embolism, infection, non-union, DVT.</text>
</svg>