<svg viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="430" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">TUBERCULOSIS — FINDING IT AND FINISHING IT</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">Cough for two weeks or more is the trigger. GeneXpert is the first test, not microscopy.</text>

<rect x="34" y="62" width="572" height="58" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.6"/>
<text x="320" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a3a5c">SCREEN EVERY PATIENT FOR FOUR SYMPTOMS</text>
<text x="320" y="104" text-anchor="middle" font-size="11" fill="#222">Cough · Fever · Night sweats · Weight loss — and screen every person living with HIV, every visit</text>

<rect x="34" y="136" width="278" height="96" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.6"/>
<text x="173" y="158" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1e">INTENSIVE PHASE — 2 MONTHS</text>
<g font-size="10.5" fill="#222">
<text x="46" y="180">Four drugs together</text>
<text x="46" y="198">Kills the rapidly dividing bacilli</text>
<text x="46" y="216" fill="#8b2f2f">Patient stops being infectious,</text>
</g>
<text x="46" y="228" font-size="10.5" fill="#8b2f2f">and starts feeling well — the danger</text>

<rect x="330" y="136" width="276" height="96" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.6"/>
<text x="468" y="158" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a5c3a">CONTINUATION — 4 MONTHS</text>
<g font-size="10.5" fill="#222">
<text x="342" y="180">Fewer drugs, longer time</text>
<text x="342" y="198">Kills the slow, dormant bacilli</text>
<text x="342" y="216">This is the phase that prevents</text>
<text x="342" y="228">relapse and resistance</text>
</g>

<rect x="34" y="248" width="572" height="64" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.8"/>
<text x="320" y="268" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8b2f2f">WHY DIRECTLY OBSERVED TREATMENT EXISTS</text>
<g font-size="10.5" fill="#222">
<text x="48" y="288">By week 3 the patient feels cured and the tablets feel unnecessary. Stopping now does not restore the illness</text>
<text x="48" y="304">as it was — it selects for resistant bacilli, and the next treatment is longer, harsher and less certain.</text>
</g>

<rect x="34" y="330" width="278" height="66" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.5"/>
<text x="173" y="350" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">TELL THE PATIENT TO EXPECT</text>
<text x="46" y="370" font-size="10.5" fill="#222">Orange urine and tears — harmless</text>
<text x="46" y="388" font-size="10.5" fill="#222">Pyridoxine given to protect the nerves</text>

<rect x="330" y="330" width="276" height="66" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.5"/>
<text x="468" y="350" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6b3a6b">REPORT IMMEDIATELY</text>
<text x="342" y="370" font-size="10.5" fill="#222">Yellow eyes, vomiting — hepatitis</text>
<text x="342" y="388" font-size="10.5" fill="#222">Visual change — ethambutol effect</text>

<text x="320" y="420" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8b2f2f">Screen the household. Every person who shares that room has already been exposed.</text>
</svg>