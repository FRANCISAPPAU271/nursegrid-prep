<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="460" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">SUBSTANCE USE IN GHANA: WHAT THE NURSE ACTUALLY SEES</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">Dependence is a health condition with a physiology, not a verdict on a person's character.</text>

<rect x="24" y="58" width="190" height="126" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.6"/>
<text x="119" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b2f2f">ALCOHOL</text>
<g font-size="9.5" fill="#222">
<text x="34" y="100">Akpeteshie and bitters are</text>
<text x="34" y="116">cheap and strong.</text>
<text x="34" y="138" font-style="italic">Withdrawal is the one that</text>
<text x="34" y="152" font-style="italic">kills: tremor, then seizures,</text>
<text x="34" y="166" font-style="italic">then delirium tremens.</text>
</g>

<rect x="226" y="58" width="190" height="126" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.6"/>
<text x="321" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1e">TRAMADOL</text>
<g font-size="9.5" fill="#222">
<text x="236" y="100">Taken for energy and to</text>
<text x="236" y="116">work through pain and heat.</text>
<text x="236" y="138" font-style="italic">Seizures at high dose.</text>
<text x="236" y="152" font-style="italic">Prescription only since</text>
<text x="236" y="166" font-style="italic">E.I. 168 of 2018.</text>
</g>

<rect x="428" y="58" width="188" height="126" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.6"/>
<text x="522" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5c3a">CANNABIS</text>
<g font-size="9.5" fill="#222">
<text x="438" y="100">Widely used and widely</text>
<text x="438" y="116">believed to be harmless.</text>
<text x="438" y="138" font-style="italic">Can precipitate psychosis</text>
<text x="438" y="152" font-style="italic">in the vulnerable and drives</text>
<text x="438" y="166" font-style="italic">relapse in schizophrenia.</text>
</g>

<rect x="24" y="198" width="290" height="122" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.7"/>
<text x="169" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">THE FOUR FEATURES OF DEPENDENCE</text>
<g font-size="9.5" fill="#222">
<text x="36" y="240">A strong compulsion to use.</text>
<text x="36" y="258">Loss of control over how much.</text>
<text x="36" y="276">Tolerance: the dose keeps rising.</text>
<text x="36" y="294">Withdrawal when it stops, relieved</text>
<text x="36" y="310">by taking more of the same thing.</text>
</g>

<rect x="326" y="198" width="290" height="122" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.7"/>
<text x="471" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b3a6b">HOW TO ASK</text>
<g font-size="9.5" fill="#222">
<text x="338" y="240">Ask everyone, in the same neutral</text>
<text x="338" y="258">tone you use for smoking.</text>
<text x="338" y="278">What, how much, how often, when</text>
<text x="338" y="294">was the last dose, and what happens</text>
<text x="338" y="310">on the days you cannot get it.</text>
</g>

<rect x="24" y="334" width="592" height="56" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.8"/>
<text x="320" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b2f2f">THE LAST DOSE IS THE MOST IMPORTANT ANSWER</text>
<text x="40" y="378" font-size="10" fill="#222">A surgical or medical patient who stops drinking on admission withdraws on day two or three, on your ward, unplanned.</text>

<rect x="24" y="404" width="592" height="48" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.7"/>
<g font-size="10" fill="#222">
<text x="40" y="424" font-weight="bold" fill="#1a5c3a">Lecturing and shaming end the conversation and the treatment with it.</text>
<text x="40" y="442">Ask what the substance does for her before telling her what it does to her.</text>
</g>
</svg>