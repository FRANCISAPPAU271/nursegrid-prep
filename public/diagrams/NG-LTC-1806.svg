<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" width="100%" role="img">
<rect x="0" y="0" width="760" height="490" fill="#fdfcfa"/>
<text x="20" y="30" font-family="Georgia,serif" font-size="19" font-weight="bold" fill="#1d4e63">Diabetes: the numbers that matter and the ones that mislead</text>
<text x="20" y="52" font-family="Georgia,serif" font-size="13" fill="#555">A single glucose reading answers one question. Three months of control answers a different one.</text>

<rect x="20" y="68" width="352" height="150" rx="6" fill="#eef4f8" stroke="#2b6b8a"/>
<text x="34" y="90" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#1d4e63">A finger-prick glucose</text>
<text x="34" y="112" font-family="Georgia,serif" font-size="12" fill="#333">Tells you this moment only.</text>
<text x="34" y="132" font-family="Georgia,serif" font-size="12" fill="#333">It is what you need in an emergency,</text>
<text x="34" y="150" font-family="Georgia,serif" font-size="12" fill="#333">before insulin, or when she feels odd.</text>
<text x="34" y="176" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#1d4e63">A good reading today proves nothing</text>
<text x="34" y="194" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#1d4e63">about the last three months.</text>

<rect x="388" y="68" width="352" height="150" rx="6" fill="#f2f7f2" stroke="#2e7d5b"/>
<text x="402" y="90" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#1d5c42">Glycated haemoglobin</text>
<text x="402" y="112" font-family="Georgia,serif" font-size="12" fill="#333">Glucose sticks to red cells, and red cells</text>
<text x="402" y="130" font-family="Georgia,serif" font-size="12" fill="#333">live about three months. So the result</text>
<text x="402" y="148" font-family="Georgia,serif" font-size="12" fill="#333">is an average of that whole period.</text>
<text x="402" y="174" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#1d5c42">It cannot be improved by being careful</text>
<text x="402" y="192" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#1d5c42">for the three days before clinic.</text>

<rect x="20" y="234" width="352" height="132" rx="6" fill="#fff3f0" stroke="#c0392b"/>
<text x="34" y="256" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#7a2020">Hypoglycaemia unawareness</text>
<text x="34" y="278" font-family="Georgia,serif" font-size="12" fill="#333">Repeated low episodes blunt the warning</text>
<text x="34" y="296" font-family="Georgia,serif" font-size="12" fill="#333">signs, so sweating and tremor stop coming.</text>
<text x="34" y="318" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#7a2020">The first sign then becomes confusion</text>
<text x="34" y="336" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#7a2020">or collapse, with no warning at all.</text>
<text x="34" y="358" font-family="Georgia,serif" font-size="11" font-style="italic" fill="#7a2020">A patient who no longer feels them is in more danger, not less.</text>

<rect x="388" y="234" width="352" height="132" rx="6" fill="#fff8e8" stroke="#b8860b"/>
<text x="402" y="256" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#8a6508">The complications you can prevent</text>
<text x="402" y="278" font-family="Georgia,serif" font-size="12" fill="#333">Eyes — dilated retinal check every year</text>
<text x="402" y="298" font-family="Georgia,serif" font-size="12" fill="#333">Kidneys — urine protein and creatinine</text>
<text x="402" y="318" font-family="Georgia,serif" font-size="12" fill="#333">Feet — look, and feel for sensation</text>
<text x="402" y="340" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#8a6508">All three are silent until they are severe.</text>
<text x="402" y="358" font-family="Georgia,serif" font-size="11" font-style="italic" fill="#8a6508">She will not complain. You have to check.</text>

<rect x="20" y="382" width="720" height="84" rx="6" fill="#f6f2fa" stroke="#6b4c93"/>
<text x="34" y="404" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#4a326b">The foot that has lost sensation</text>
<text x="34" y="426" font-family="Georgia,serif" font-size="12" fill="#333">Neuropathy removes pain, so the injury is never felt: a stone in the sandal, a burn from hot water, a blister from new</text>
<text x="34" y="444" font-family="Georgia,serif" font-size="12" fill="#333">shoes. Poor circulation then stops it healing, and infection finishes what the injury started.</text>
<text x="34" y="462" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#4a326b">Teach her to look at her feet daily, because she can no longer rely on feeling them.</text>
</svg>