<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 490" font-family="sans-serif">
<rect x="0" y="0" width="460" height="490" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#111827">Endocrine emergencies: recognize + first actions</text>
<g font-size="9" fill="#111827" text-anchor="middle">
<rect x="20" y="40" width="130" height="120" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="85" y="58" font-weight="bold" font-size="10">HYPO &lt;4</text>
<text x="85" y="72" font-size="8">sweaty, shaky, confused</text>
<text x="85" y="84" font-size="8">→ coma, fits</text>
<text x="85" y="100" font-weight="bold">conscious: 15 g + 15 min</text>
<text x="85" y="112" font-weight="bold">unconscious: NEVER oral</text>
<text x="85" y="124" font-weight="bold">IM glucagon / IV dextrose</text>
<text x="85" y="136" font-weight="bold">find cause + adjust Rx</text>
<text x="85" y="150" font-size="8" fill="#6b7280">sulfonylurea = 24-h watch</text>
<rect x="156" y="40" width="144" height="120" rx="8" fill="#fef2f2" stroke="#7f1d1d" stroke-width="1.5"/>
<text x="228" y="58" font-weight="bold" font-size="10">DKA</text>
<text x="228" y="72" font-size="8">sugar + ketones + acid +</text>
<text x="228" y="84" font-size="8">Kussmaul + fruity + dry</text>
<text x="228" y="100" font-weight="bold">FLUIDS first, fixed-rate</text>
<text x="228" y="112" font-weight="bold">insulin, K⁺ as it falls,</text>
<text x="228" y="124" font-weight="bold">hourly gases/ketones,</text>
<text x="228" y="136" font-weight="bold">find trigger (infection?)</text>
<text x="228" y="150" font-size="8" fill="#6b7280">cerebral oedema watch kids</text>
<rect x="306" y="40" width="134" height="120" rx="8" fill="#fff7ed" stroke="#7c2d12" stroke-width="1.5"/>
<text x="373" y="58" font-weight="bold" font-size="10">HHS</text>
<text x="373" y="72" font-size="8">sugar 30+, profoundly</text>
<text x="373" y="84" font-size="8">dry, confused, NO ketones</text>
<text x="373" y="100" font-weight="bold">SLOW fluids (brain</text>
<text x="373" y="112" font-weight="bold">swells if rushed),</text>
<text x="373" y="124" font-weight="bold">low-dose insulin,</text>
<text x="373" y="136" font-weight="bold">VTE prophylaxis</text>
<text x="373" y="150" font-size="8" fill="#6b7280">elder + infection common</text>
<rect x="20" y="168" width="130" height="120" rx="8" fill="#fef2f2" stroke="#7f1d1d" stroke-width="1.5"/>
<text x="85" y="186" font-weight="bold" font-size="10">THYROID STORM</text>
<text x="85" y="200" font-size="8">febrile + tachycardic +</text>
<text x="85" y="212" font-size="8">agitated + vomit/diarrhoea</text>
<text x="85" y="228" font-weight="bold">cool + fluids + beta-block</text>
<text x="85" y="240" font-weight="bold">+ carbimazole + iodine</text>
<text x="85" y="252" font-weight="bold">+ steroids → ICU</text>
<text x="85" y="264" font-size="8" fill="#6b7280">trigger: infection/surgery</text>
<text x="85" y="276" font-size="8" fill="#6b7280">stopped drugs</text>
<rect x="156" y="168" width="144" height="120" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="228" y="186" font-weight="bold" font-size="10">MYXOEDEMA COMA</text>
<text x="228" y="200" font-size="8">cold + drowsy + brady +</text>
<text x="228" y="212" font-size="8">hypoNa + hypo + coma</text>
<text x="228" y="228" font-weight="bold">warm SLOWLY + IV T4 +</text>
<text x="228" y="240" font-weight="bold">hydrocortisone + ventilate</text>
<text x="228" y="252" font-weight="bold">+ glucose + ICU</text>
<text x="228" y="264" font-size="8" fill="#6b7280">trigger: cold/infection/</text>
<text x="228" y="276" font-size="8" fill="#6b7280">sedatives</text>
<rect x="306" y="168" width="134" height="120" rx="8" fill="#fef9c3" stroke="#713f12" stroke-width="2"/>
<text x="373" y="186" font-weight="bold" font-size="10">ADDISONIAN</text>
<text x="373" y="200" font-size="8">shock + confusion + abdo</text>
<text x="373" y="212" font-size="8">pain + vomit (bronze?)</text>
<text x="373" y="228" font-weight="bold">hydrocortisone STAT +</text>
<text x="373" y="240" font-weight="bold">AGGRESSIVE fluids +</text>
<text x="373" y="252" font-weight="bold">glucose + find trigger</text>
<text x="373" y="264" font-size="8" fill="#6b7280">never stop steroids</text>
<text x="373" y="276" font-size="8" fill="#6b7280">abruptly — taper + card</text>
</g>
<rect x="0" y="298" width="460" height="192" fill="#f1f5f9"/>
<text x="20" y="320" font-size="10" fill="#111827">Hypercalcaemia crisis (stones/bones/groans + short QT + coma): aggressive fluids +</text>
<text x="20" y="334" font-size="10" fill="#111827">furosemide + bisphosphonate + treat cause (malignancy, hyperpara). Hyponatraemic</text>
<text x="20" y="348" font-size="10" fill="#111827">seizures: hypertonic per protocol + SLOW correction (pontine myelinolysis).</text>
<text x="20" y="362" font-size="10" fill="#111827">Monitoring set: glucose + ketones q1h, ABG/VBG + lactate, U&amp;E + Mg/Phos, ECG,</text>
<text x="20" y="376" font-size="10" fill="#111827">strict fluids + weights, neuro obs, temperature. Insulin safety: 5 rights + TYPE +</text>
<text x="20" y="390" font-size="10" fill="#111827">DOSE + TIME double-checked, never abbreviate units, no sliding-scale-alone,</text>
<text x="20" y="404" font-size="10" fill="#111827">overlap basal when stopping infusions, hypo kit wherever insulin lives. Phaeo</text>
<text x="20" y="418" font-size="10" fill="#111827">paroxysm (headache + sweat + palpitations + severe HTN): alpha-blockade FIRST,</text>
<text x="20" y="432" font-size="10" fill="#111827">never beta-alone (unopposed alpha crisis). Every emergency: trigger hunt +</text>
<text x="20" y="446" font-size="10" fill="#111827">SBAR + times documented — hormones crash fast and recover on protocol.</text>
</svg>