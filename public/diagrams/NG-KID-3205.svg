<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 268" role="img" aria-label="Steps for safely calculating and checking a paediatric medicine dose by weight">
<rect width="470" height="268" fill="#ffffff"/>
<text x="235" y="22" text-anchor="middle" font-family="Georgia,serif" font-size="15" font-weight="bold" fill="#14532d">Every paediatric dose starts with a fresh weight</text>
<rect x="30" y="36" width="410" height="30" rx="4" fill="#dcfce7" stroke="#14532d"/>
<text x="42" y="56" font-family="Georgia,serif" font-size="11.5" font-weight="bold">1.</text>
<text x="66" y="56" font-family="Georgia,serif" font-size="11.5">Weigh the child today — never use a weight from a previous visit</text>
<path d="M235 66 L235 78" stroke="#334155" stroke-width="2" marker-end="url(#d80)"/>
<defs><marker id="d80" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#334155"/></marker></defs>
<rect x="30" y="80" width="410" height="30" rx="4" fill="#e0f2fe" stroke="#1e3a8a"/>
<text x="42" y="100" font-family="Georgia,serif" font-size="11.5" font-weight="bold">2.</text>
<text x="66" y="100" font-family="Georgia,serif" font-size="11.5">dose = mg/kg × weight (kg)</text>
<path d="M235 110 L235 122" stroke="#334155" stroke-width="2" marker-end="url(#d80)"/>
<rect x="30" y="124" width="410" height="30" rx="4" fill="#e0f2fe" stroke="#1e3a8a"/>
<text x="42" y="144" font-family="Georgia,serif" font-size="11.5" font-weight="bold">3.</text>
<text x="66" y="144" font-family="Georgia,serif" font-size="11.5">volume = dose ÷ concentration, checking the strength on THIS bottle</text>
<path d="M235 154 L235 166" stroke="#334155" stroke-width="2" marker-end="url(#d80)"/>
<rect x="30" y="168" width="410" height="30" rx="4" fill="#fef3c7" stroke="#92400e"/>
<text x="42" y="188" font-family="Georgia,serif" font-size="11.5" font-weight="bold">4.</text>
<text x="66" y="188" font-family="Georgia,serif" font-size="11.5">Sense-check: does this volume look reasonable for this child?</text>
<path d="M235 198 L235 210" stroke="#334155" stroke-width="2" marker-end="url(#d80)"/>
<rect x="30" y="212" width="410" height="30" rx="4" fill="#fee2e2" stroke="#991b1b" stroke-width="1.6"/>
<text x="42" y="232" font-family="Georgia,serif" font-size="11.5" font-weight="bold">5.</text>
<text x="66" y="232" font-family="Georgia,serif" font-size="11.5" font-weight="bold">Independent second check against the maximum dose</text>
<text x="235" y="259" text-anchor="middle" font-family="Georgia,serif" font-size="10.8" font-style="italic" fill="#334155">A tenfold error in a small child is far likelier to be fatal than in an adult.</text>
</svg>