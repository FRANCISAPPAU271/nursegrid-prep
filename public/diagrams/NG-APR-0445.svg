<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="400" fill="#fbfaf7"/>
<text x="320" y="27" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">URINARY CATHETERISATION — WHAT DIFFERS BY SEX</text>

<rect x="24" y="46" width="288" height="196" fill="#fdf2f6" stroke="#b06a8f" stroke-width="1.5"/>
<text x="168" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#8b2f5c">FEMALE</text>
<text x="36" y="92" font-size="11" fill="#333">Urethra about 4 cm — short.</text>
<text x="36" y="114" font-size="11" fill="#333">Position: supine, knees bent and</text>
<text x="36" y="129" font-size="11" fill="#333">apart, heels together.</text>
<text x="36" y="151" font-size="11" fill="#333">Clean labia front to back, one</text>
<text x="36" y="166" font-size="11" fill="#333">swab per stroke, outer to inner.</text>
<text x="36" y="188" font-size="11" fill="#333">Insert 5 to 6 cm until urine flows,</text>
<text x="36" y="203" font-size="11" fill="#333">then a further 2 cm.</text>
<text x="36" y="228" font-size="11" font-weight="bold" fill="#8b2f5c">Risk: the short urethra means</text>
<text x="36" y="238" font-size="1" fill="#fff">.</text>

<rect x="328" y="46" width="288" height="196" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.5"/>
<text x="472" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3a5c">MALE</text>
<text x="340" y="92" font-size="11" fill="#333">Urethra about 20 cm — long, with</text>
<text x="340" y="107" font-size="11" fill="#333">two curves.</text>
<text x="340" y="129" font-size="11" fill="#333">Hold penis upright at 90 degrees</text>
<text x="340" y="144" font-size="11" fill="#333">to straighten the first curve.</text>
<text x="340" y="166" font-size="11" fill="#333">Retract foreskin to clean, then</text>
<text x="340" y="181" font-size="11" fill="#333">REPLACE IT afterwards.</text>
<text x="340" y="203" font-size="11" fill="#333">Insert 20 to 25 cm, to the bifurcation.</text>
<text x="340" y="228" font-size="11" font-weight="bold" fill="#8b2f2f">Never force against resistance.</text>

<rect x="24" y="250" width="288" height="60" fill="#f7e9e9" stroke="#c78f8f"/>
<text x="168" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b2f2f">FORESKIN LEFT RETRACTED</text>
<text x="34" y="288" font-size="10" fill="#333">causes PARAPHIMOSIS — the tight ring</text>
<text x="34" y="303" font-size="10" fill="#333">strangles the glans. A surgical emergency.</text>

<rect x="328" y="250" width="288" height="60" fill="#f7e9e9" stroke="#c78f8f"/>
<text x="472" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b2f2f">BALLOON INFLATED TOO EARLY</text>
<text x="338" y="288" font-size="10" fill="#333">tears the urethra. Inflate ONLY after urine</text>
<text x="338" y="303" font-size="10" fill="#333">flows, proving the tip is in the bladder.</text>

<rect x="24" y="318" width="592" height="72" fill="#eaf3ea" stroke="#8fb98f"/>
<text x="320" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5c3a">AFTERWARDS — THE SAME FOR BOTH</text>
<text x="34" y="358" font-size="10" fill="#333">Bag below bladder level, off the floor, never inverted.  ·  Closed system: do not disconnect to empty.</text>
<text x="34" y="376" font-size="10" fill="#333">Secure to the thigh.  ·  Daily meatal hygiene with soap and water.  ·  Remove as soon as it is no longer needed —</text>
<text x="34" y="392" font-size="10" fill="#333">every extra day raises the risk of catheter-associated urinary tract infection.</text>
</svg>