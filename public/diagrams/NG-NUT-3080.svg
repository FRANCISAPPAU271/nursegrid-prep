<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" role="img" aria-label="Wernicke encephalopathy triad and the rule to give thiamine before glucose">
<rect width="460" height="250" fill="#ffffff"/>
<text x="230" y="22" text-anchor="middle" font-family="Georgia,serif" font-size="15" font-weight="bold" fill="#14532d">Thiamine before glucose</text>
<rect x="26" y="40" width="130" height="72" rx="5" fill="#fef3c7" stroke="#92400e"/>
<text x="91" y="60" text-anchor="middle" font-family="Georgia,serif" font-size="11.5" font-weight="bold">Confusion</text>
<text x="91" y="80" text-anchor="middle" font-family="Georgia,serif" font-size="10">disorientation,</text>
<text x="91" y="96" text-anchor="middle" font-family="Georgia,serif" font-size="10">apathy, poor recall</text>
<rect x="165" y="40" width="130" height="72" rx="5" fill="#fef3c7" stroke="#92400e"/>
<text x="230" y="60" text-anchor="middle" font-family="Georgia,serif" font-size="11.5" font-weight="bold">Ataxia</text>
<text x="230" y="80" text-anchor="middle" font-family="Georgia,serif" font-size="10">wide unsteady gait,</text>
<text x="230" y="96" text-anchor="middle" font-family="Georgia,serif" font-size="10">cannot stand unaided</text>
<rect x="304" y="40" width="130" height="72" rx="5" fill="#fef3c7" stroke="#92400e"/>
<text x="369" y="60" text-anchor="middle" font-family="Georgia,serif" font-size="11.5" font-weight="bold">Eye signs</text>
<text x="369" y="80" text-anchor="middle" font-family="Georgia,serif" font-size="10">nystagmus,</text>
<text x="369" y="96" text-anchor="middle" font-family="Georgia,serif" font-size="10">gaze palsy</text>
<text x="230" y="134" text-anchor="middle" font-family="Georgia,serif" font-size="12" font-style="italic" fill="#334155">All three together are uncommon — treat on any one of them.</text>
<rect x="60" y="150" width="150" height="52" rx="5" fill="#dcfce7" stroke="#14532d" stroke-width="1.8"/>
<text x="135" y="171" text-anchor="middle" font-family="Georgia,serif" font-size="12" font-weight="bold">1. THIAMINE</text>
<text x="135" y="190" text-anchor="middle" font-family="Georgia,serif" font-size="10.5">given first, parenterally</text>
<rect x="250" y="150" width="150" height="52" rx="5" fill="#e0f2fe" stroke="#1e3a8a" stroke-width="1.8"/>
<text x="325" y="171" text-anchor="middle" font-family="Georgia,serif" font-size="12" font-weight="bold">2. GLUCOSE</text>
<text x="325" y="190" text-anchor="middle" font-family="Georgia,serif" font-size="10.5">only after thiamine</text>
<path d="M212 176 L246 176" stroke="#334155" stroke-width="2" marker-end="url(#a74)"/>
<defs><marker id="a74" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#334155"/></marker></defs>
<text x="230" y="226" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#991b1b" font-weight="bold">Glucose first consumes the last thiamine and can precipitate the damage.</text>
<text x="230" y="243" text-anchor="middle" font-family="Georgia,serif" font-size="10.5" font-style="italic" fill="#334155">Untreated Wernicke becomes irreversible Korsakoff amnesia.</text>
</svg>