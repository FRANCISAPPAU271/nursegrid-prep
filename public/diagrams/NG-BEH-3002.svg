<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 280" role="img">
<rect width="470" height="280" fill="#ffffff"/>
<text x="235" y="26" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Four movement side effects of antipsychotics</text>
<text x="235" y="44" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">Sort them by WHEN they appear</text>
<rect x="30" y="58" width="100" height="150" fill="#fee2e2" stroke="#b91c1c"/>
<text x="80" y="78" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7f1d1d">Hours&#8211;days</text>
<text x="80" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Acute dystonia</text>
<text x="80" y="120" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">sustained spasm:</text>
<text x="80" y="134" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">neck, jaw, eyes</text>
<text x="80" y="148" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">roll upward</text>
<text x="80" y="172" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#b91c1c">EMERGENCY</text>
<text x="80" y="188" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">IM anticholinergic</text>
<rect x="140" y="58" width="100" height="150" fill="#fef3c7" stroke="#b45309"/>
<text x="190" y="78" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350f">Days&#8211;weeks</text>
<text x="190" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Akathisia</text>
<text x="190" y="120" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">inner restlessness;</text>
<text x="190" y="134" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">cannot sit still</text>
<text x="190" y="156" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#b91c1c">mistaken for</text>
<text x="190" y="170" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#b91c1c">agitation &#8212; raising</text>
<text x="190" y="184" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#b91c1c">the dose worsens it</text>
<rect x="250" y="58" width="100" height="150" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="300" y="78" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">Weeks&#8211;months</text>
<text x="300" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Parkinsonism</text>
<text x="300" y="120" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">tremor, rigidity,</text>
<text x="300" y="134" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">shuffling gait,</text>
<text x="300" y="148" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">mask-like face</text>
<text x="300" y="172" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">reduce dose or</text>
<text x="300" y="186" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">add anticholinergic</text>
<rect x="360" y="58" width="100" height="150" fill="#ede9fe" stroke="#6d28d9"/>
<text x="410" y="78" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4c1d95">Months&#8211;years</text>
<text x="410" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Tardive</text>
<text x="410" y="114" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">dyskinesia</text>
<text x="410" y="134" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">lip smacking,</text>
<text x="410" y="148" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">tongue writhing</text>
<text x="410" y="172" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#6d28d9">often irreversible</text>
<text x="410" y="186" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">screen early (AIMS)</text>
<rect x="30" y="222" width="430" height="44" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="245" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Fever + rigidity + confusion + autonomic instability = neuroleptic malignant syndrome.</text>
<text x="245" y="257" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">Stop the antipsychotic and treat as a medical emergency; it is not an extrapyramidal side effect.</text>
</svg>