<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="460" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">HOW IT REACHES THE NEXT PERSON</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">Name the route and the control measure writes itself. Every question about spread is really this question.</text>

<rect x="24" y="60" width="190" height="112" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.7"/>
<text x="119" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">AIR</text>
<g font-size="9.5" fill="#222">
<text x="36" y="100">Tuberculosis, measles,</text>
<text x="36" y="115">chickenpox, meningitis</text>
<text x="36" y="135" font-weight="bold">Control: ventilation,</text>
<text x="36" y="150">open windows, masks,</text>
<text x="36" y="165">vaccination</text>
</g>

<rect x="226" y="60" width="190" height="112" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.7"/>
<text x="321" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5c3a">WATER AND FOOD</text>
<g font-size="9.5" fill="#222">
<text x="238" y="100">Cholera, typhoid,</text>
<text x="238" y="115">hepatitis A, amoebiasis</text>
<text x="238" y="135" font-weight="bold">Control: safe water,</text>
<text x="238" y="150">latrines, handwashing,</text>
<text x="238" y="165">food hygiene</text>
</g>

<rect x="428" y="60" width="188" height="112" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.7"/>
<text x="522" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1e">VECTOR</text>
<g font-size="9.5" fill="#222">
<text x="440" y="100">Malaria, yellow fever,</text>
<text x="440" y="115">onchocerciasis, filariasis</text>
<text x="440" y="135" font-weight="bold">Control: nets, spraying,</text>
<text x="440" y="150">clearing breeding sites,</text>
<text x="440" y="165">mass drug administration</text>
</g>

<rect x="24" y="186" width="190" height="112" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.7"/>
<text x="119" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b3a6b">CONTACT</text>
<g font-size="9.5" fill="#222">
<text x="36" y="226">Scabies, ringworm,</text>
<text x="36" y="241">Lassa, Ebola, leprosy</text>
<text x="36" y="261" font-weight="bold">Control: hand hygiene,</text>
<text x="36" y="276">gloves and gown, no</text>
<text x="36" y="291">sharing of linen</text>
</g>

<rect x="226" y="186" width="190" height="112" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.7"/>
<text x="321" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b2f2f">BLOOD AND FLUIDS</text>
<g font-size="9.5" fill="#222">
<text x="238" y="226">Hepatitis B and C, HIV,</text>
<text x="238" y="241">syphilis, viral fevers</text>
<text x="238" y="261" font-weight="bold">Control: safe injection,</text>
<text x="238" y="276">screened blood, sharps</text>
<text x="238" y="291">box, never re-sheath</text>
</g>

<rect x="428" y="186" width="188" height="112" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.7"/>
<text x="522" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">SOIL AND WATER CONTACT</text>
<g font-size="9.5" fill="#222">
<text x="440" y="226">Hookworm, tetanus,</text>
<text x="440" y="241">schistosomiasis, guinea worm</text>
<text x="440" y="261" font-weight="bold">Control: footwear, safe</text>
<text x="440" y="276">water source, filters,</text>
<text x="440" y="291">no wading in still water</text>
</g>

<rect x="24" y="314" width="592" height="70" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.8"/>
<text x="320" y="334" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a5c3a">BREAK THE CHAIN AT THE EASIEST LINK</text>
<g font-size="10.5" fill="#222">
<text x="38" y="356">Agent, reservoir, exit, route, entry, susceptible host. You rarely destroy the agent, but you can always block</text>
<text x="38" y="374">a route or protect a host. Handwashing, a net, a latrine and a vaccine are the four that break the most chains.</text>
</g>

<text x="320" y="410" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8b2f2f">Notify immediately, by the fastest means available: cholera, meningitis, yellow fever, measles,</text>
<text x="320" y="428" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8b2f2f">viral haemorrhagic fever, acute flaccid paralysis, neonatal tetanus, guinea worm, any unusual cluster.</text>
<text x="320" y="450" text-anchor="middle" font-size="10.5" font-style="italic" fill="#1a3a5c">Do not wait for laboratory confirmation. A suspected case is reportable, and zero reporting is compulsory.</text>
</svg>