<svg xmlns="http://www.w3.org/2000/svg" width="460" height="340" font-family="sans-serif">
<rect width="460" height="340" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="230" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Listening Before Judging</text>
<text x="230" y="42" text-anchor="middle" font-size="10" fill="#64748b">Kleinman's 8 questions — ask, don't assume (NG-TCM-0009)</text>
<g font-size="10" fill="#0f172a">
<rect x="14" y="52" width="216" height="118" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
<text x="24" y="70" font-size="12" font-weight="bold" fill="#1d4ed8">ASK THE PATIENT</text>
<text x="24" y="88">1. What do you call this problem?</text>
<text x="24" y="104">2. What caused it, in your view?</text>
<text x="24" y="120">3. Why did it start when it did?</text>
<text x="24" y="136">4. What does it do to you?</text>
<text x="24" y="152">5. How serious is it? What do</text>
<text x="36" y="164">you fear most?</text>
<rect x="236" y="52" width="210" height="118" fill="#fef2f2" stroke="#b91c1c" stroke-width="2" rx="6"/>
<text x="246" y="70" font-size="12" font-weight="bold" fill="#b91c1c">ASK ABOUT CARE</text>
<text x="246" y="88">6. What treatment do you think</text>
<text x="258" y="100">you should receive?</text>
<text x="246" y="116">7. What results do you hope for?</text>
<text x="246" y="132">8. Who else have you consulted</text>
<text x="258" y="144">— healer, pastor, herbalist?</text>
<text x="246" y="160">Then: "Tell me more about that…"</text>
</g>
<rect x="14" y="180" width="432" height="112" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" rx="6"/>
<text x="24" y="200" font-size="12" font-weight="bold" fill="#1d4ed8">WHY PATIENTS HIDE TM USE — REMOVE THE BARRIERS</text>
<g font-size="10" fill="#0f172a">
<text x="24" y="218">Fear of scolding ("nurse will shout") → ask with warmth, never mock beliefs</text>
<text x="24" y="234">Fear of refusal ("they will send me away") → "You can tell me anything here"</text>
<text x="24" y="250">"Nobody asked" → always ask EVERY admission: herbs? healers? prayer camps?</text>
<text x="24" y="266">"It is not medicine" → "Teas, bitters, creams and prayer water all count"</text>
<text x="24" y="282">Record answers in own words — quoted beliefs guide the whole plan</text>
</g>
<rect x="14" y="300" width="432" height="28" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="4"/>
<text x="230" y="318" text-anchor="middle" font-size="10" fill="#475569">Rule: understanding a belief ≠ agreeing with it — but you cannot negotiate what you never heard. Original NurseGrid content.</text>
</svg>
