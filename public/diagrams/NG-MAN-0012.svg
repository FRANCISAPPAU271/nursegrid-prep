<svg viewBox="0 0 460 210" role="img" aria-labelledby="t4" xmlns="http://www.w3.org/2000/svg">
<title id="t4">Delegation decision by stability, not seniority</title>
<rect width="460" height="210" fill="#f6f8fc"/>
<rect x="140" y="18" width="180" height="34" rx="17" fill="#0a1628"/>
<text x="230" y="40" font-size="12" text-anchor="middle" font-family="system-ui" fill="#fff" font-weight="600">Is the patient PREDICTABLE?</text>
<path d="M180 52 L100 86" stroke="#0a1628" stroke-width="2" fill="none"/>
<path d="M280 52 L360 86" stroke="#0a1628" stroke-width="2" fill="none"/>
<text x="120" y="76" font-size="11" font-family="system-ui" font-weight="600" fill="#0f9d76">YES</text>
<text x="330" y="76" font-size="11" font-family="system-ui" font-weight="600" fill="#e2574c">NO</text>
<rect x="20" y="88" width="170" height="100" rx="8" fill="#fff" stroke="#0f9d76" stroke-width="2"/>
<rect x="270" y="88" width="170" height="100" rx="8" fill="#fff" stroke="#e2574c" stroke-width="3"/>
<text x="105" y="110" font-size="12" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#0f9d76">MAY DELEGATE</text>
<text x="355" y="110" font-size="12" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#e2574c">RN KEEPS</text>
<text x="105" y="132" font-size="10" text-anchor="middle" font-family="system-ui">stable, routine care</text>
<text x="105" y="148" font-size="10" text-anchor="middle" font-family="system-ui">established plan</text>
<text x="105" y="164" font-size="10" text-anchor="middle" font-family="system-ui">outcome expected</text>
<text x="355" y="132" font-size="10" text-anchor="middle" font-family="system-ui">first assessment</text>
<text x="355" y="148" font-size="10" text-anchor="middle" font-family="system-ui">blood / IV push</text>
<text x="355" y="164" font-size="10" text-anchor="middle" font-family="system-ui">teaching, unstable</text>
<text x="230" y="203" font-size="11" text-anchor="middle" font-family="system-ui" fill="#5a6b85" font-weight="600">Years of experience never widen a legal scope of practice</text>
</svg>