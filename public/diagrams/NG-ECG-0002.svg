<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 390" role="img">
<rect width="460" height="390" fill="#ffffff"/>
<text x="230" y="26" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">Atrial rhythms: fibrillation vs flutter</text><text x="40" y="58" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">ATRIAL FIBRILLATION — irregularly irregular, no P waves</text><path d="M40 122 L45 120 L50 124 L52 122 L60 78 L68 122 L73 120 L78 124 L83 120 L88 124 L93 120 L98 124 L103 120 L108 124 L113 120 L118 124 L123 120 L128 124 L132 122 L140 78 L148 122 L153 120 L158 124 L163 120 L168 124 L177 122 L185 78 L193 122 L198 120 L203 124 L208 120 L213 124 L218 120 L223 124 L228 120 L233 124 L238 120 L243 124 L248 120 L253 124 L258 120 L263 124 L272 122 L280 78 L288 122 L293 120 L298 124 L303 120 L308 124 L313 120 L318 124 L327 122 L335 78 L343 122 L348 120 L353 124 L358 120 L363 124 L368 120 L373 124 L378 120 L383 124 L387 122 L395 78 L403 122 L420 122" fill="none" stroke="#b91c1c" stroke-width="2"/><text x="40" y="152" font-family="sans-serif" font-size="10" fill="#7f1d1d">Narrow QRS, chaotic baseline — feel the pulse: chaos plus a pulse deficit.</text><text x="40" y="208" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">ATRIAL FLUTTER — sawtooth baseline, often regular</text><path d="M40 262 L48 272 L56 262 L64 272 L72 262 L80 272 L88 262 L96 272 L104 262 L112 272 L120 262 L128 272 L136 262 L144 272 L152 262 L160 272 L168 262 L176 272 L184 262 L192 272 L200 262 L208 272 L216 262 L224 272 L232 262 L240 272 L248 262 L256 272 L264 262 L272 272 L280 262 L288 272 L296 262 L304 272 L312 262 L320 272 L328 262 L336 272 L344 262 L352 272 L360 262 L368 272 L376 262 L384 272 L392 262 L400 272 L408 262 L416 272" fill="none" stroke="#1d4ed8" stroke-width="2"/><path d="M93 272 L100 226 L107 272" fill="none" stroke="#1d4ed8" stroke-width="2"/><path d="M157 272 L164 226 L171 272" fill="none" stroke="#1d4ed8" stroke-width="2"/><path d="M221 272 L228 226 L235 272" fill="none" stroke="#1d4ed8" stroke-width="2"/><path d="M285 272 L292 226 L299 272" fill="none" stroke="#1d4ed8" stroke-width="2"/><path d="M349 272 L356 226 L363 272" fill="none" stroke="#1d4ed8" stroke-width="2"/><text x="40" y="302" font-family="sans-serif" font-size="10" fill="#1e3a8a">Sawteeth ~300/min, usually 2:1 or 4:1 — vagal or adenosine exposes the teeth.</text><rect x="30" y="322" width="400" height="50" fill="#f1f5f9" stroke="#94a3b8"/><text x="230" y="340" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0f172a">Irregular + narrow + no P = fibrillation. Regular sawteeth = flutter.</text><text x="230" y="355" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#475569">Sawteeth = flutter. Both: rate control plus stroke cover.</text>
</svg>
