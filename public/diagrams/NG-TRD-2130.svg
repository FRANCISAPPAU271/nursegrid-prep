<svg viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect x="0" y="0" width="720" height="480" fill="#f7f9fb"/>
<text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1d3f5e">Traditional practices: sort them before you judge them</text>
<text x="360" y="50" text-anchor="middle" font-size="12.5" fill="#5c6f80">Most are harmless, some are helpful, a few cause the injury you are treating</text>

<rect x="30" y="66" width="212" height="200" rx="7" fill="#e9f2ec" stroke="#8fb59d"/>
<text x="45" y="87" font-size="13" font-weight="bold" fill="#1d5236">Harmless: leave them alone</text>
<text x="45" y="108" font-size="11.5" fill="#26333d">Naming ceremonies and rites</text>
<text x="45" y="127" font-size="11.5" fill="#26333d">Prayer, blessing, holy water</text>
<text x="45" y="146" font-size="11.5" fill="#26333d">Beads and protective threads</text>
<text x="45" y="165" font-size="11.5" fill="#26333d">Herbal baths for a well baby</text>
<text x="45" y="184" font-size="11.5" fill="#26333d">Traditional foods in pregnancy</text>
<text x="45" y="203" font-size="11.5" fill="#26333d">Massage of an aching back</text>
<text x="45" y="226" font-size="11.5" font-weight="bold" fill="#1d5236">Opposing these costs you the</text>
<text x="45" y="243" font-size="11.5" font-weight="bold" fill="#1d5236">trust you need for the rest</text>
<text x="45" y="260" font-size="11" font-style="italic" fill="#7a5a2a">Pick your argument carefully</text>

<rect x="254" y="66" width="212" height="200" rx="7" fill="#f2ece2" stroke="#c9b79c"/>
<text x="269" y="87" font-size="13" font-weight="bold" fill="#5b4a2e">Negotiable: keep, but modify</text>
<text x="269" y="108" font-size="11.5" fill="#3f3428">Birth attended at home</text>
<text x="269" y="127" font-size="11.5" fill="#3f3428">Bone setting for a simple fracture</text>
<text x="269" y="146" font-size="11.5" fill="#3f3428">Herbal treatment of minor illness</text>
<text x="269" y="165" font-size="11.5" fill="#3f3428">Confinement and rest after birth</text>
<text x="269" y="186" font-size="11.5" font-weight="bold" fill="#5b4a2e">Agree the danger signs and</text>
<text x="269" y="203" font-size="11.5" font-weight="bold" fill="#5b4a2e">the route to the facility</text>
<text x="269" y="224" font-size="11" font-style="italic" fill="#7a5a2a">A bone setter who has been taught to</text>
<text x="269" y="240" font-size="11" font-style="italic" fill="#7a5a2a">recognise a swollen cold limb and send</text>
<text x="269" y="256" font-size="11" font-style="italic" fill="#7a5a2a">it in saves the arm</text>

<rect x="478" y="66" width="212" height="200" rx="7" fill="#f6e9e6" stroke="#c98f80"/>
<text x="493" y="87" font-size="13" font-weight="bold" fill="#8a3018">Harmful: act, and report</text>
<text x="493" y="108" font-size="11.5" fill="#3f2b26">Cutting the uvula or the gum buds</text>
<text x="493" y="127" font-size="11.5" fill="#3f2b26">Anything applied into a baby's eye</text>
<text x="493" y="146" font-size="11.5" fill="#3f2b26">Dressings on the umbilical cord</text>
<text x="493" y="165" font-size="11.5" fill="#3f2b26">Enemas and purgatives in infants</text>
<text x="493" y="184" font-size="11.5" fill="#3f2b26">Shared unsterile cutting blades</text>
<text x="493" y="203" font-size="11.5" fill="#3f2b26">Chaining or beating a mentally ill person</text>
<text x="493" y="226" font-size="11.5" font-weight="bold" fill="#8a3018">These injure, infect or kill.</text>
<text x="493" y="243" font-size="11.5" font-weight="bold" fill="#8a3018">Female cutting is a crime.</text>
<text x="493" y="260" font-size="11" font-style="italic" fill="#7a5a2a">Treat first, then address the practice</text>

<rect x="30" y="282" width="660" height="86" rx="7" fill="#eaf1f7" stroke="#9fb9cd"/>
<text x="45" y="303" font-size="13.5" font-weight="bold" fill="#1d3f5e">The conversation that changes something</text>
<text x="52" y="325" font-size="12" fill="#26333d">Ask what the practice is meant to achieve, and you will usually find a reasonable aim behind an unsafe method</text>
<text x="52" y="345" font-size="12" fill="#26333d">Offer a safer way to reach the same aim; do not simply forbid, because forbidding moves the practice out of sight</text>
<text x="52" y="363" font-size="12" font-weight="bold" fill="#8a3018">Replace the method, keep the meaning</text>

<rect x="30" y="380" width="660" height="76" rx="7" fill="#f2ece2" stroke="#c9b79c"/>
<text x="45" y="401" font-size="13.5" font-weight="bold" fill="#5b4a2e">When the patient arrives injured by a practice</text>
<text x="52" y="423" font-size="12" fill="#3f3428">Treat the injury first, without comment. Blame at the door means the next family stays at home.</text>
<text x="52" y="443" font-size="12" font-weight="bold" fill="#8a3018">Record what was done and what you found, in plain factual words. That record is what changes practice, not the argument.</text>
</svg>