<svg viewBox="0 0 470 260" role="img" xmlns="http://www.w3.org/2000/svg"><title>Palliative care compared with hospice</title>
<rect width="470" height="260" fill="#f6f8fc"/>
<text x="235" y="20" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">Palliative care and hospice are not the same thing</text>
<rect x="14" y="30" width="442" height="84" rx="8" fill="#fff" stroke="#2b6fa8" stroke-width="2"/>
<text x="24" y="48" font-size="11" font-family="system-ui" font-weight="700" fill="#2b6fa8">PALLIATIVE CARE</text>
<line x1="40" y1="76" x2="430" y2="76" stroke="#dde5ef" stroke-width="10" stroke-linecap="round"/>
<line x1="40" y1="76" x2="430" y2="76" stroke="#2b6fa8" stroke-width="10" stroke-linecap="round" opacity="0.75"/>
<text x="40" y="96" font-size="9" font-family="system-ui" fill="#5a6b85">diagnosis</text>
<text x="430" y="96" font-size="9" font-family="system-ui" fill="#5a6b85" text-anchor="end">death and bereavement</text>
<text x="235" y="80" font-size="9.5" font-family="system-ui" fill="#fff" text-anchor="middle" font-weight="700">runs ALONGSIDE curative treatment, from diagnosis onward</text>
<text x="235" y="108" font-size="9.5" font-family="system-ui" text-anchor="middle">Any age, any stage, any life-limiting illness — cancer, HIV, heart failure, sickle cell</text>
<rect x="14" y="122" width="442" height="70" rx="8" fill="#fff" stroke="#0f9d76" stroke-width="2"/>
<text x="24" y="140" font-size="11" font-family="system-ui" font-weight="700" fill="#0b7a5c">HOSPICE</text>
<line x1="300" y1="164" x2="430" y2="164" stroke="#0f9d76" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
<text x="365" y="168" font-size="9" font-family="system-ui" fill="#fff" text-anchor="middle" font-weight="700">last months</text>
<text x="150" y="160" font-size="9.5" font-family="system-ui">A subset: comfort-focused care when</text>
<text x="150" y="174" font-size="9.5" font-family="system-ui">cure is no longer the goal</text>
<text x="235" y="186" font-size="9" font-family="system-ui" fill="#5a6b85" text-anchor="middle">All hospice care is palliative. Not all palliative care is hospice.</text>
<rect x="14" y="200" width="442" height="50" rx="8" fill="#fff8e8" stroke="#f2b705" stroke-width="2"/>
<text x="235" y="217" font-size="10.5" text-anchor="middle" font-family="system-ui" font-weight="700">Total pain has four dimensions — treat all four</text>
<text x="235" y="234" font-size="10" text-anchor="middle" font-family="system-ui">Physical · Psychological · Social · Spiritual</text>
<text x="235" y="246" font-size="9" text-anchor="middle" font-family="system-ui" fill="#5a6b85">Morphine alone will not settle pain that is really fear, debt or unfinished business</text>
</svg>