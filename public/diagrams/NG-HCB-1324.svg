<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="460" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">COMMUNITY BASED REHABILITATION IS NOT A THERAPY SERVICE</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">Five components. Health is only one of them, and it is rarely the one that decides a life.</text>

<rect x="20" y="58" width="116" height="120" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.6"/>
<text x="78" y="78" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">HEALTH</text>
<g font-size="9" fill="#222"><text x="28" y="98">Prevention,</text><text x="28" y="113">medical care,</text><text x="28" y="128">rehabilitation,</text><text x="28" y="143">assistive</text><text x="28" y="158">devices.</text></g>

<rect x="144" y="58" width="116" height="120" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.6"/>
<text x="202" y="78" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a5c3a">EDUCATION</text>
<g font-size="9" fill="#222"><text x="152" y="98">Inclusive</text><text x="152" y="113">schooling in the</text><text x="152" y="128">local school,</text><text x="152" y="143">lifelong</text><text x="152" y="158">learning.</text></g>

<rect x="268" y="58" width="116" height="120" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.6"/>
<text x="326" y="78" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1e">LIVELIHOOD</text>
<g font-size="9" fill="#222"><text x="276" y="98">Skills, work,</text><text x="276" y="113">self employment,</text><text x="276" y="128">credit, financial</text><text x="276" y="143">services.</text></g>

<rect x="392" y="58" width="116" height="120" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.6"/>
<text x="450" y="78" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6b3a6b">SOCIAL</text>
<g font-size="9" fill="#222"><text x="400" y="98">Relationships,</text><text x="400" y="113">marriage, family,</text><text x="400" y="128">recreation,</text><text x="400" y="143">culture, faith.</text></g>

<rect x="516" y="58" width="104" height="120" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.6"/>
<text x="568" y="78" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8b2f2f">EMPOWERMENT</text>
<g font-size="9" fill="#222"><text x="524" y="98">Self help</text><text x="524" y="113">groups, advocacy,</text><text x="524" y="128">political voice,</text><text x="524" y="143">communication.</text></g>

<rect x="20" y="192" width="600" height="80" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.8"/>
<text x="320" y="212" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a3a5c">THE MODEL SHIFT THAT EXPLAINS EVERYTHING ELSE</text>
<g font-size="10" fill="#222">
<text x="34" y="234">MEDICAL MODEL: the person is the problem, and the aim is to correct her until she fits the world.</text>
<text x="34" y="252">SOCIAL MODEL: the impairment is real, but the disability is created by steps, attitudes and rules.</text>
<text x="34" y="268" font-style="italic">A wheelchair user is not disabled by her legs on a level floor. She is disabled by the staircase.</text>
</g>

<rect x="20" y="286" width="290" height="96" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.7"/>
<text x="165" y="306" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a5c3a">WHAT MAKES IT COMMUNITY BASED</text>
<g font-size="9.5" fill="#222">
<text x="30" y="326">The person stays in her own home and</text>
<text x="30" y="342">village. Family and neighbours are trained</text>
<text x="30" y="358">to deliver the daily part. The specialist</text>
<text x="30" y="374">supports and supervises rather than owns.</text>
</g>

<rect x="326" y="286" width="294" height="96" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.7"/>
<text x="473" y="306" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8b2f2f">WHAT IT IS NOT</text>
<g font-size="9.5" fill="#222">
<text x="336" y="326">Not an institution moved into a village.</text>
<text x="336" y="342">Not charity handed down to a passive</text>
<text x="336" y="358">recipient. Not a programme designed</text>
<text x="336" y="374">for disabled people without them.</text>
</g>

<rect x="20" y="394" width="600" height="52" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.8"/>
<g font-size="10" fill="#222">
<text x="320" y="416" text-anchor="middle" font-weight="bold" fill="#8a6d1e">Nothing about us without us.</text>
<text x="320" y="436" text-anchor="middle">Ask what the person wants her day to look like, then work backwards to the service.</text>
</g>
</svg>