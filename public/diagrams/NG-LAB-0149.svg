<svg viewBox="0 0 470 220" role="img" xmlns="http://www.w3.org/2000/svg"><title>Urinalysis findings</title>
<rect width="470" height="220" fill="#f6f8fc"/>
<text x="235" y="20" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">What each urinalysis result is telling you</text>
<g font-family="system-ui" font-size="10.5">
<rect x="16" y="32" width="438" height="26" rx="5" fill="#0a1628"/>
<text x="30" y="50" fill="#fff" font-weight="700">FINDING</text><text x="180" y="50" fill="#fff" font-weight="700">SUGGESTS</text>
<text x="340" y="50" fill="#fff" font-weight="700">THINK</text>
<rect x="16" y="60" width="438" height="26" fill="#fff" stroke="#e4e9f2"/>
<text x="30" y="77" font-weight="700">Protein</text><text x="180" y="77">glomerular damage</text><text x="340" y="77" fill="#a8352c">pre-eclampsia, nephritis</text>
<rect x="16" y="88" width="438" height="26" fill="#f9fbfd" stroke="#e4e9f2"/>
<text x="30" y="105" font-weight="700">Glucose</text><text x="180" y="105">renal threshold exceeded</text><text x="340" y="105">diabetes</text>
<rect x="16" y="116" width="438" height="26" fill="#fff" stroke="#e4e9f2"/>
<text x="30" y="133" font-weight="700">Ketones</text><text x="180" y="133">fat being burned for fuel</text><text x="340" y="133" fill="#a8352c">DKA, starvation</text>
<rect x="16" y="144" width="438" height="26" fill="#f9fbfd" stroke="#e4e9f2"/>
<text x="30" y="161" font-weight="700">Nitrites + leucocytes</text><text x="180" y="161">bacterial infection</text><text x="340" y="161">UTI</text>
<rect x="16" y="172" width="438" height="26" fill="#fff" stroke="#e4e9f2"/>
<text x="30" y="189" font-weight="700">Blood</text><text x="180" y="189">bleeding anywhere in tract</text><text x="340" y="189">stone, infection, tumour</text>
</g>
<text x="235" y="214" font-size="10" text-anchor="middle" font-family="system-ui" fill="#5a6b85">Glucose + ketones together in a very unwell patient = suspect DKA and check blood glucose now</text>
</svg>