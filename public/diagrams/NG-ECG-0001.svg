<text x="230" y="26" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">Normal sinus rhythm — the reference trace</text><text x="40" y="58" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e293b">SINUS RHYTHM — rate 75, regular, narrow</text><path d="M30 150 L40 138 L50 150 L70 150 L74 156 L82 96 L88 162 L94 150 L114 150 L114 150 L132 128 L150 150 L150 150 L230 150 L230 150 L240 138 L250 150 L270 150 L274 156 L282 96 L288 162 L294 150 L314 150 L314 150 L332 128 L350 150 L350 150 L430 150" fill="none" stroke="#1e293b" stroke-width="2"/><text x="40" y="128" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0f172a">P</text><text x="82" y="82" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0f172a">QRS</text><text x="104" y="138" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0f172a">ST</text><text x="132" y="114" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0f172a">T</text><text x="60" y="170" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0f172a">PR</text><line x1="40" y1="132" x2="40" y2="140" stroke="#64748b" stroke-width="1"/><line x1="82" y1="88" x2="82" y2="94" stroke="#64748b" stroke-width="1"/><line x1="104" y1="142" x2="104" y2="148" stroke="#64748b" stroke-width="1"/><line x1="132" y1="120" x2="132" y2="126" stroke="#64748b" stroke-width="1"/><line x1="60" y1="156" x2="60" y2="162" stroke="#64748b" stroke-width="1"/><text x="40" y="205" font-family="sans-serif" font-size="10" fill="#475569">One P per QRS • PR 0.12–0.20 s • QRS &lt; 0.12 s • ST flat • T upright</text><rect x="30" y="232" width="400" height="50" fill="#f1f5f9" stroke="#94a3b8"/><text x="230" y="250" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0f172a">Describe every trace the same way:</text><text 