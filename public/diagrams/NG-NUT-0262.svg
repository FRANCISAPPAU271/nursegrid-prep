<svg viewBox="0 0 470 240" role="img" xmlns="http://www.w3.org/2000/svg"><title>Oral rehydration plans</title>
<rect width="470" height="240" fill="#f6f8fc"/>
<text x="235" y="20" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">Dehydration in a child — assess, then choose the plan</text>
<g font-family="system-ui">
<rect x="14" y="30" width="142" height="150" rx="8" fill="#fff" stroke="#0f9d76" stroke-width="2.5"/>
<rect x="164" y="30" width="142" height="150" rx="8" fill="#fff" stroke="#f2b705" stroke-width="2.5"/>
<rect x="314" y="30" width="142" height="150" rx="8" fill="#fff" stroke="#e2574c" stroke-width="2.5"/>
<text x="85" y="50" font-size="12" text-anchor="middle" font-weight="700" fill="#0b7a5c">PLAN A</text>
<text x="235" y="50" font-size="12" text-anchor="middle" font-weight="700" fill="#8a6d00">PLAN B</text>
<text x="385" y="50" font-size="12" text-anchor="middle" font-weight="700" fill="#a8352c">PLAN C</text>
<text x="85" y="66" font-size="9.5" text-anchor="middle" fill="#5a6b85">No dehydration</text>
<text x="235" y="66" font-size="9.5" text-anchor="middle" fill="#5a6b85">Some dehydration</text>
<text x="385" y="66" font-size="9.5" text-anchor="middle" fill="#5a6b85">Severe dehydration</text>
<g font-size="9.5">
<text x="24" y="88" font-weight="700">Signs</text>
<text x="24" y="102">Alert, drinks normally</text>
<text x="24" y="116">Skin pinch returns fast</text>
<text x="174" y="88" font-weight="700">Signs (two or more)</text>
<text x="174" y="102">Restless, irritable</text>
<text x="174" y="116">Sunken eyes, thirsty</text>
<text x="174" y="130">Skin pinch slow</text>
<text x="324" y="88" font-weight="700">Signs (two or more)</text>
<text x="324" y="102">Lethargic or unconscious</text>
<text x="324" y="116">Drinks poorly or not at all</text>
<text x="324" y="130">Skin pinch very slow</text>
<text x="24" y="140" font-weight="700">Treat at home</text>
<text x="24" y="154">Extra fluid, ORS, zinc</text>
<text x="24" y="168">Continue feeding</text>
<text x="174" y="150" font-weight="700">ORS at the facility</text>
<text x="174" y="164">75 mL/kg over 4 hours</text>
<text x="324" y="150" font-weight="700">IV fluid immediately</text>
<text x="324" y="164">Ringer's lactate, refer</text>
</g>
</g>
<rect x="14" y="190" width="442" height="40" rx="8" fill="#fff" stroke="#2b6fa8" stroke-width="2"/>
<text x="235" y="206" font-size="10.5" text-anchor="middle" font-family="system-ui" font-weight="700">Zinc for 10 to 14 days in every case: 10 mg under 6 months, 20 mg from 6 months</text>
<text x="235" y="222" font-size="9.5" text-anchor="middle" font-family="system-ui" fill="#5a6b85">Feeding continues throughout, with one extra meal daily for two weeks after recovery</text>
</svg>