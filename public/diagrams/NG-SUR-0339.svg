<svg viewBox="0 0 470 250" role="img" xmlns="http://www.w3.org/2000/svg"><title>Phases of wound healing</title>
<rect width="470" height="250" fill="#f6f8fc"/>
<text x="235" y="20" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">Four phases of wound healing</text>
<line x1="30" y1="66" x2="450" y2="66" stroke="#dde5ef" stroke-width="3"/>
<g font-family="system-ui">
<circle cx="80" cy="66" r="11" fill="#e2574c"/><circle cx="185" cy="66" r="11" fill="#f2b705"/>
<circle cx="295" cy="66" r="11" fill="#2b6fa8"/><circle cx="405" cy="66" r="11" fill="#0f9d76"/>
<text x="80" y="70" font-size="10" text-anchor="middle" fill="#fff" font-weight="700">1</text>
<text x="185" y="70" font-size="10" text-anchor="middle" fill="#fff" font-weight="700">2</text>
<text x="295" y="70" font-size="10" text-anchor="middle" fill="#fff" font-weight="700">3</text>
<text x="405" y="70" font-size="10" text-anchor="middle" fill="#fff" font-weight="700">4</text>
<text x="80" y="44" font-size="10.5" text-anchor="middle" font-weight="700" fill="#a8352c">Haemostasis</text>
<text x="185" y="44" font-size="10.5" text-anchor="middle" font-weight="700" fill="#8a6d00">Inflammation</text>
<text x="295" y="44" font-size="10.5" text-anchor="middle" font-weight="700" fill="#2b6fa8">Proliferation</text>
<text x="405" y="44" font-size="10.5" text-anchor="middle" font-weight="700" fill="#0b7a5c">Maturation</text>
<text x="80" y="92" font-size="9" text-anchor="middle" fill="#5a6b85">minutes</text>
<text x="185" y="92" font-size="9" text-anchor="middle" fill="#5a6b85">day 0 – 4</text>
<text x="295" y="92" font-size="9" text-anchor="middle" fill="#5a6b85">day 3 – 21</text>
<text x="405" y="92" font-size="9" text-anchor="middle" fill="#5a6b85">3 weeks – 2 years</text>
<g font-size="9.5" text-anchor="middle">
<text x="80" y="112">Vessels constrict</text><text x="80" y="126">Platelet plug forms</text><text x="80" y="140">Clot seals the gap</text>
<text x="185" y="112">Redness, heat,</text><text x="185" y="126">swelling, pain</text><text x="185" y="140">Neutrophils clear debris</text>
<text x="295" y="112">Granulation tissue</text><text x="295" y="126">New vessels grow</text><text x="295" y="140">Wound contracts, closes</text>
<text x="405" y="112">Collagen remodels</text><text x="405" y="126">Scar pales, flattens</text><text x="405" y="140">Regains 80% strength</text>
</g>
</g>
<rect x="14" y="158" width="216" height="76" rx="8" fill="#fff" stroke="#e2574c" stroke-width="2"/>
<text x="122" y="176" font-size="10.5" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#a8352c">What DELAYS healing</text>
<g font-family="system-ui" font-size="9.5"><text x="24" y="194">Infection · poor blood supply</text>
<text x="24" y="208">Diabetes · low protein and vitamin C</text>
<text x="24" y="222">Steroids · smoking · foreign body · age</text></g>
<rect x="240" y="158" width="216" height="76" rx="8" fill="#fff" stroke="#0f9d76" stroke-width="2"/>
<text x="348" y="176" font-size="10.5" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#0b7a5c">Types of closure</text>
<g font-family="system-ui" font-size="9.5"><text x="250" y="194">First intention: clean edges sutured</text>
<text x="250" y="208">Second: left open, granulates in</text>
<text x="250" y="222">Third: delayed closure after cleaning</text></g>
</svg>