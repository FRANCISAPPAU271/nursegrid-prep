<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="400" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">DKA versus HYPOGLYCAEMIA — TELLING THEM APART</text>
<text x="320" y="45" text-anchor="middle" font-size="12" fill="#555">Both alter consciousness in a diabetic patient. The speed of onset separates them.</text>

<rect x="24" y="58" width="288" height="248" fill="#f7e9e9" stroke="#8b2f2f" stroke-width="2"/>
<text x="168" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#8b2f2f">DIABETIC KETOACIDOSIS</text>
<text x="168" y="98" text-anchor="middle" font-size="11" font-style="italic" fill="#8b2f2f">too little insulin — comes on over DAYS</text>
<text x="36" y="122" font-size="11" fill="#333">Skin  ·  dry, flushed, warm</text>
<text x="36" y="144" font-size="11" fill="#333">Breath  ·  smells of acetone</text>
<text x="36" y="166" font-size="11" fill="#333">Breathing  ·  deep and sighing</text>
<text x="46" y="182" font-size="10" font-style="italic" fill="#666">(Kussmaul — blowing off acid)</text>
<text x="36" y="204" font-size="11" fill="#333">Thirst  ·  extreme, passing much urine</text>
<text x="36" y="226" font-size="11" fill="#333">Abdomen  ·  pain and vomiting</text>
<text x="36" y="248" font-size="11" fill="#333">Pulse  ·  rapid, weak, dehydrated</text>
<rect x="36" y="260" width="264" height="38" fill="#fff" stroke="#c78f8f"/>
<text x="168" y="277" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b2f2f">TREAT: fluids FIRST, then insulin,</text>
<text x="168" y="292" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b2f2f">then watch the potassium fall</text>

<rect x="328" y="58" width="288" height="248" fill="#eef4f8" stroke="#1a3a5c" stroke-width="2"/>
<text x="472" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a3a5c">HYPOGLYCAEMIA</text>
<text x="472" y="98" text-anchor="middle" font-size="11" font-style="italic" fill="#1a3a5c">too much insulin — comes on in MINUTES</text>
<text x="340" y="122" font-size="11" fill="#333">Skin  ·  cold, pale, sweating</text>
<text x="340" y="144" font-size="11" fill="#333">Breath  ·  normal</text>
<text x="340" y="166" font-size="11" fill="#333">Breathing  ·  normal or shallow</text>
<text x="340" y="188" font-size="11" fill="#333">Behaviour  ·  confused, aggressive,</text>
<text x="350" y="203" font-size="11" fill="#333">often mistaken for drunkenness</text>
<text x="340" y="226" font-size="11" fill="#333">Tremor  ·  shaky, hungry, anxious</text>
<text x="340" y="248" font-size="11" fill="#333">Pulse  ·  rapid and full</text>
<rect x="340" y="260" width="264" height="38" fill="#fff" stroke="#5a86a8"/>
<text x="472" y="277" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">TREAT: fast sugar NOW if conscious;</text>
<text x="472" y="292" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">IV glucose if not. Then a long-acting snack.</text>

<rect x="24" y="314" width="592" height="80" fill="#fff3cd" stroke="#e0c86a"/>
<text x="320" y="334" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b5410">IF YOU CANNOT TELL, AND CANNOT TEST — TREAT AS HYPOGLYCAEMIA</text>
<text x="34" y="354" font-size="11" fill="#6b5410">Giving sugar to a patient in DKA raises an already high glucose slightly. It causes little harm and is quickly corrected.</text>
<text x="34" y="372" font-size="11" fill="#6b5410">Withholding sugar from a hypoglycaemic patient causes permanent brain injury within minutes.</text>
<text x="34" y="389" font-size="11" font-weight="bold" fill="#6b5410">The two errors are not equal. Always err towards giving glucose.</text>
</svg>