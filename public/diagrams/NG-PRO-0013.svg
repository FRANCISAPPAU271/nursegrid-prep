<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 490" font-family="sans-serif">
<rect x="0" y="0" width="460" height="490" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#111827">The professionalism compass: any dilemma, 6 steps</text>
<g font-size="10" fill="#111827" text-anchor="middle">
<rect x="130" y="38" width="200" height="40" rx="20" fill="#b91c1c"/>
<text x="230" y="55" font-weight="bold" fill="#ffffff">1. SAFETY FIRST (M2/M4)</text>
<text x="230" y="69" font-size="8" fill="#ffffff">Stop harm NOW — ABCs,</text>
<text x="230" y="79" font-size="8" fill="#ffffff">isolate, make safe.</text>
<text x="230" y="100" font-size="14" fill="#6b7280">▼</text>
<rect x="130" y="108" width="200" height="40" rx="20" fill="#3730a3"/>
<text x="230" y="125" font-weight="bold" fill="#ffffff">2. LAW CHECK (M6)</text>
<text x="230" y="139" font-size="8" fill="#ffffff">Statute permits / requires /</text>
<text x="230" y="149" font-size="8" fill="#ffffff">forbids? (857/846/560/732...)</text>
<text x="230" y="170" font-size="14" fill="#6b7280">▼</text>
<rect x="130" y="178" width="200" height="40" rx="20" fill="#065f46"/>
<text x="230" y="195" font-weight="bold" fill="#ffffff">3. ETHICS FILTER (M2)</text>
<text x="230" y="209" font-size="8" fill="#ffffff">Autonomy · beneficence · non-</text>
<text x="230" y="219" font-size="8" fill="#ffffff">maleficence · justice · 4-box</text>
<text x="230" y="240" font-size="14" fill="#6b7280">▼</text>
<rect x="130" y="248" width="200" height="40" rx="20" fill="#713f12"/>
<text x="230" y="265" font-weight="bold" fill="#ffffff">4. CODE + SCOPE (M3)</text>
<text x="230" y="279" font-size="8" fill="#ffffff">Within PIN/scope? Delegate</text>
<text x="230" y="289" font-size="8" fill="#ffffff">right? Escalate if not.</text>
<text x="230" y="310" font-size="14" fill="#6b7280">▼</text>
<rect x="130" y="318" width="200" height="40" rx="20" fill="#0e7490"/>
<text x="230" y="335" font-weight="bold" fill="#ffffff">5. ACT + HANDOVER (M5)</text>
<text x="230" y="349" font-size="8" fill="#ffffff">ISBAR, closed-loop, bedside,</text>
<text x="230" y="359" font-size="8" fill="#ffffff">referrals that answer.</text>
<text x="230" y="380" font-size="14" fill="#6b7280">▼</text>
<rect x="130" y="388" width="200" height="40" rx="20" fill="#111827"/>
<text x="230" y="405" font-weight="bold" fill="#ffffff">6. RECORD + LEARN (M5/M3)</text>
<text x="230" y="419" font-size="8" fill="#ffffff">8 rules, incident chain,</text>
<text x="230" y="429" font-size="8" fill="#ffffff">reflect, fix system.</text>
</g>
<rect x="0" y="438" width="460" height="52" fill="#f1f5f9"/>
<text x="20" y="460" font-size="10" fill="#111827">Stuck between steps? Senior + ethics committee + NMC guidance — never improvise</text>
<text x="20" y="474" font-size="10" fill="#111827">alone. The compass runs in minutes at bedsides, hours in incidents, days in tribunals.</text>
</svg>