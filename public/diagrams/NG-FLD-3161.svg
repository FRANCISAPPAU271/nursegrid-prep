<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 262" role="img" aria-label="Why blood pressure falls late in paediatric shock and which signs appear first">
<rect width="470" height="262" fill="#ffffff"/>
<text x="235" y="22" text-anchor="middle" font-family="Georgia,serif" font-size="15" font-weight="bold" fill="#14532d">In a child, blood pressure falls LAST</text>
<rect x="24" y="38" width="422" height="30" rx="4" fill="#dcfce7" stroke="#14532d"/>
<text x="36" y="58" font-family="Georgia,serif" font-size="11.5" font-weight="bold">EARLY — compensated</text>
<text x="215" y="58" font-family="Georgia,serif" font-size="11">tachycardia · cool peripheries · capillary refill over 2 s</text>
<path d="M235 70 L235 84" stroke="#334155" stroke-width="2" marker-end="url(#s78)"/>
<defs><marker id="s78" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#334155"/></marker></defs>
<rect x="24" y="86" width="422" height="30" rx="4" fill="#fef3c7" stroke="#92400e"/>
<text x="36" y="106" font-family="Georgia,serif" font-size="11.5" font-weight="bold">PROGRESSING</text>
<text x="215" y="106" font-family="Georgia,serif" font-size="11">weak pulses · reduced urine · agitation then drowsiness</text>
<path d="M235 118 L235 132" stroke="#334155" stroke-width="2" marker-end="url(#s78)"/>
<rect x="24" y="134" width="422" height="30" rx="4" fill="#fee2e2" stroke="#991b1b" stroke-width="1.8"/>
<text x="36" y="154" font-family="Georgia,serif" font-size="11.5" font-weight="bold" fill="#991b1b">LATE — decompensated</text>
<text x="215" y="154" font-family="Georgia,serif" font-size="11" font-weight="bold">HYPOTENSION — arrest may be minutes away</text>
<text x="235" y="188" text-anchor="middle" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#7c2d12">A normal blood pressure never excludes shock in a child.</text>
<text x="235" y="212" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#334155">Children compensate hard by raising heart rate and clamping vessels,</text>
<text x="235" y="230" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#334155">so they hold pressure until roughly a third of volume is lost.</text>
<text x="235" y="252" text-anchor="middle" font-family="Georgia,serif" font-size="10.8" font-style="italic" fill="#334155">Act on the earliest sign: heart rate and perfusion, not the cuff.</text>
</svg>