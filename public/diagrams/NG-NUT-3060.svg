<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" role="img" aria-label="Body mass index bands with the double burden of malnutrition">
<rect width="460" height="260" fill="#ffffff"/>
<text x="230" y="22" text-anchor="middle" font-family="Georgia,serif" font-size="15" font-weight="bold" fill="#14532d">Body Mass Index bands (adult, kg/m²)</text>
<rect x="40" y="45" width="80" height="34" fill="#bfdbfe" stroke="#1e3a8a"/>
<rect x="120" y="45" width="110" height="34" fill="#bbf7d0" stroke="#14532d"/>
<rect x="230" y="45" width="90" height="34" fill="#fde68a" stroke="#92400e"/>
<rect x="320" y="45" width="100" height="34" fill="#fecaca" stroke="#991b1b"/>
<text x="80" y="67" text-anchor="middle" font-family="Georgia,serif" font-size="11">Under</text>
<text x="175" y="67" text-anchor="middle" font-family="Georgia,serif" font-size="11">Normal</text>
<text x="275" y="67" text-anchor="middle" font-family="Georgia,serif" font-size="11">Overweight</text>
<text x="370" y="67" text-anchor="middle" font-family="Georgia,serif" font-size="11">Obese</text>
<text x="40" y="94" font-family="Georgia,serif" font-size="10.5">&lt;18.5</text>
<text x="118" y="94" font-family="Georgia,serif" font-size="10.5">18.5</text>
<text x="222" y="94" font-family="Georgia,serif" font-size="10.5">25.0</text>
<text x="313" y="94" font-family="Georgia,serif" font-size="10.5">30.0</text>
<text x="405" y="94" font-family="Georgia,serif" font-size="10.5">40+</text>
<line x1="40" y1="120" x2="420" y2="120" stroke="#cbd5e1"/>
<text x="230" y="142" text-anchor="middle" font-family="Georgia,serif" font-size="12.5" font-weight="bold" fill="#7c2d12">The double burden in one household</text>
<rect x="45" y="155" width="170" height="82" fill="#eff6ff" stroke="#1e3a8a"/>
<text x="130" y="174" text-anchor="middle" font-family="Georgia,serif" font-size="11" font-weight="bold">Stunted child</text>
<text x="55" y="192" font-family="Georgia,serif" font-size="10">low height-for-age</text>
<text x="55" y="208" font-family="Georgia,serif" font-size="10">early-life deficit</text>
<text x="55" y="224" font-family="Georgia,serif" font-size="10">energy-dense, poor diet</text>
<rect x="245" y="155" width="170" height="82" fill="#fef2f2" stroke="#991b1b"/>
<text x="330" y="174" text-anchor="middle" font-family="Georgia,serif" font-size="11" font-weight="bold">Overweight mother</text>
<text x="255" y="192" font-family="Georgia,serif" font-size="10">same cheap staples</text>
<text x="255" y="208" font-family="Georgia,serif" font-size="10">less physical activity</text>
<text x="255" y="224" font-family="Georgia,serif" font-size="10">rising BP and glucose</text>
<text x="230" y="252" text-anchor="middle" font-family="Georgia,serif" font-size="10.5" font-style="italic" fill="#334155">Same kitchen, same poverty, opposite ends of the scale.</text>
</svg>