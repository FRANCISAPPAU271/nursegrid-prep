<svg viewBox="0 0 470 250" role="img" xmlns="http://www.w3.org/2000/svg"><title>Three food groups, Ghanaian examples</title>
<rect width="470" height="250" fill="#f6f8fc"/>
<text x="235" y="20" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">Every meal should draw from all three groups</text>
<g font-family="system-ui">
<rect x="14" y="34" width="142" height="168" rx="10" fill="#fff" stroke="#f2b705" stroke-width="2.5"/>
<text x="85" y="56" font-size="12" text-anchor="middle" font-weight="700" fill="#b58900">ENERGY-GIVING</text>
<text x="85" y="72" font-size="9" text-anchor="middle" fill="#5a6b85">carbohydrate and fat</text>
<text x="26" y="96" font-size="10">Banku, kenkey, fufu</text>
<text x="26" y="114" font-size="10">Rice, yam, plantain</text>
<text x="26" y="132" font-size="10">Gari, cassava, maize</text>
<text x="26" y="150" font-size="10">Palm oil, coconut oil</text>
<text x="26" y="168" font-size="10">Bread, kokonte</text>
<text x="85" y="192" font-size="9.5" text-anchor="middle" font-weight="700">fuel for the body</text>
<rect x="164" y="34" width="142" height="168" rx="10" fill="#fff" stroke="#e2574c" stroke-width="2.5"/>
<text x="235" y="56" font-size="12" text-anchor="middle" font-weight="700" fill="#e2574c">BODY-BUILDING</text>
<text x="235" y="72" font-size="9" text-anchor="middle" fill="#5a6b85">protein</text>
<text x="176" y="96" font-size="10">Fish, keta school boys</text>
<text x="176" y="114" font-size="10">Beans, cowpea, soya</text>
<text x="176" y="132" font-size="10">Groundnut, agushie</text>
<text x="176" y="150" font-size="10">Egg, meat, snail</text>
<text x="176" y="168" font-size="10">Milk, wagashi</text>
<text x="235" y="192" font-size="9.5" text-anchor="middle" font-weight="700">growth and repair</text>
<rect x="314" y="34" width="142" height="168" rx="10" fill="#fff" stroke="#0f9d76" stroke-width="2.5"/>
<text x="385" y="56" font-size="12" text-anchor="middle" font-weight="700" fill="#0f9d76">PROTECTIVE</text>
<text x="385" y="72" font-size="9" text-anchor="middle" fill="#5a6b85">vitamins and minerals</text>
<text x="326" y="96" font-size="10">Kontomire, ayoyo</text>
<text x="326" y="114" font-size="10">Garden eggs, okro</text>
<text x="326" y="132" font-size="10">Mango, pawpaw</text>
<text x="326" y="150" font-size="10">Orange, pineapple</text>
<text x="326" y="168" font-size="10">Tomato, carrot</text>
<text x="385" y="192" font-size="9.5" text-anchor="middle" font-weight="700">resist infection</text>
</g>
<text x="235" y="222" font-size="10.5" text-anchor="middle" font-family="system-ui" fill="#5a6b85">Plain banku is energy only — it needs a protein and a vegetable beside it</text>
<text x="235" y="240" font-size="10" text-anchor="middle" font-family="system-ui" fill="#5a6b85">Red palm oil is an energy food BUT is also rich in vitamin A</text>
</svg>