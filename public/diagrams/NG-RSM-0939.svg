<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="440" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">THE RESEARCH PROCESS — EACH STEP DECIDES THE NEXT</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">You cannot choose a method until you have written the question. The question rules everything after it.</text>

<rect x="30" y="62" width="118" height="62" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.8"/>
<text x="89" y="84" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">1 PROBLEM</text>
<text x="89" y="102" text-anchor="middle" font-size="9.5" fill="#222">What is wrong,</text>
<text x="89" y="116" text-anchor="middle" font-size="9.5" fill="#222">and for whom?</text>

<rect x="160" y="62" width="118" height="62" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.8"/>
<text x="219" y="84" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">2 LITERATURE</text>
<text x="219" y="102" text-anchor="middle" font-size="9.5" fill="#222">What is already</text>
<text x="219" y="116" text-anchor="middle" font-size="9.5" fill="#222">known, and the gap</text>

<rect x="290" y="62" width="118" height="62" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.8"/>
<text x="349" y="84" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a5c3a">3 QUESTION</text>
<text x="349" y="102" text-anchor="middle" font-size="9.5" fill="#222">Objectives and,</text>
<text x="349" y="116" text-anchor="middle" font-size="9.5" fill="#222">if testing, hypothesis</text>

<rect x="420" y="62" width="118" height="62" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.8"/>
<text x="479" y="84" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a5c3a">4 DESIGN</text>
<text x="479" y="102" text-anchor="middle" font-size="9.5" fill="#222">Who, how many,</text>
<text x="479" y="116" text-anchor="middle" font-size="9.5" fill="#222">measured how</text>

<rect x="30" y="142" width="118" height="62" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.8"/>
<text x="89" y="164" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1e">5 APPROVAL</text>
<text x="89" y="182" text-anchor="middle" font-size="9.5" fill="#222">Ethics committee</text>
<text x="89" y="196" text-anchor="middle" font-size="9.5" fill="#222">before any data</text>

<rect x="160" y="142" width="118" height="62" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.8"/>
<text x="219" y="164" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1e">6 PILOT</text>
<text x="219" y="182" text-anchor="middle" font-size="9.5" fill="#222">Test the tool on</text>
<text x="219" y="196" text-anchor="middle" font-size="9.5" fill="#222">a few, then fix it</text>

<rect x="290" y="142" width="118" height="62" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.8"/>
<text x="349" y="164" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1e">7 COLLECT</text>
<text x="349" y="182" text-anchor="middle" font-size="9.5" fill="#222">Same way, every</text>
<text x="349" y="196" text-anchor="middle" font-size="9.5" fill="#222">participant</text>

<rect x="420" y="142" width="118" height="62" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.8"/>
<text x="479" y="164" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6b3a6b">8 ANALYSE</text>
<text x="479" y="182" text-anchor="middle" font-size="9.5" fill="#222">Test chosen at</text>
<text x="479" y="196" text-anchor="middle" font-size="9.5" fill="#222">design, not after</text>

<rect x="550" y="62" width="60" height="142" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.8"/>
<text x="580" y="112" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8b2f2f">9</text>
<text x="580" y="132" text-anchor="middle" font-size="10" fill="#222">SHARE</text>
<text x="580" y="150" text-anchor="middle" font-size="9" fill="#222">Report to</text>
<text x="580" y="163" text-anchor="middle" font-size="9" fill="#222">the people</text>
<text x="580" y="176" text-anchor="middle" font-size="9" fill="#222">studied, not</text>
<text x="580" y="189" text-anchor="middle" font-size="9" fill="#222">the shelf</text>

<rect x="30" y="222" width="580" height="70" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.6"/>
<text x="320" y="242" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a3a5c">THE COMMONEST STUDENT ERROR IS STARTING AT STEP 4</text>
<g font-size="10.5" fill="#222">
<text x="44" y="262">Choosing a questionnaire first, then inventing a question it happens to answer, produces data nobody can use.</text>
<text x="44" y="280">Write the question so precisely that the design and the analysis are almost decided by the wording of it.</text>
</g>

<rect x="30" y="304" width="580" height="86" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.6"/>
<text x="320" y="324" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a5c3a">A GOOD NURSING QUESTION NAMES FOUR THINGS</text>
<g font-size="10.5" fill="#222">
<text x="44" y="346">WHO — postnatal women at a district hospital in the Volta Region</text>
<text x="44" y="364">WHAT — early skin-to-skin contact, compared with routine care</text>
<text x="330" y="346">OUTCOME — exclusive breastfeeding at six weeks</text>
<text x="330" y="364">WHEN — over a six-month period in 2026</text>
</g>

<text x="320" y="414" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">Research answers a question. Audit asks whether we are doing what we already agreed to do.</text>
<text x="320" y="432" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8b2f2f">A study that cannot change anything is a study that should not have been done.</text>
</svg>