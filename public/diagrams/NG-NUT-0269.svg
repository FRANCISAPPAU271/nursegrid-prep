<svg viewBox="0 0 470 230" role="img" xmlns="http://www.w3.org/2000/svg"><title>Iron absorption helpers and blockers</title>
<rect width="470" height="230" fill="#f6f8fc"/>
<text x="235" y="20" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">Getting iron from the plate into the blood</text>
<g font-family="system-ui">
<rect x="14" y="32" width="216" height="56" rx="8" fill="#dff3ec" stroke="#0f9d76" stroke-width="2"/>
<text x="122" y="52" font-size="11.5" text-anchor="middle" font-weight="700" fill="#0b7a5c">HAEM iron — well absorbed</text>
<text x="122" y="68" font-size="10" text-anchor="middle">Liver, red meat, fish, small dried fish</text>
<text x="122" y="82" font-size="10" text-anchor="middle" fill="#5a6b85">Roughly 25 percent absorbed</text>
<rect x="240" y="32" width="216" height="56" rx="8" fill="#eef3f9" stroke="#2b6fa8" stroke-width="2"/>
<text x="348" y="52" font-size="11.5" text-anchor="middle" font-weight="700" fill="#2b6fa8">NON-HAEM iron — poorly absorbed</text>
<text x="348" y="68" font-size="10" text-anchor="middle">Beans, kontomire, cocoyam leaves, millet</text>
<text x="348" y="82" font-size="10" text-anchor="middle" fill="#5a6b85">Roughly 5 percent absorbed</text>
<rect x="14" y="100" width="216" height="110" rx="8" fill="#fff" stroke="#0f9d76" stroke-width="2"/>
<rect x="240" y="100" width="216" height="110" rx="8" fill="#fff" stroke="#e2574c" stroke-width="2"/>
<text x="122" y="120" font-size="11.5" text-anchor="middle" font-weight="700" fill="#0b7a5c">HELPERS — take together</text>
<text x="348" y="120" font-size="11.5" text-anchor="middle" font-weight="700" fill="#a8352c">BLOCKERS — separate by 2 hours</text>
<g font-size="10">
<text x="26" y="142">Vitamin C: orange, tomato, pepper</text>
<text x="26" y="160">A little meat or fish in the meal</text>
<text x="26" y="178">Fermenting, soaking, germinating</text>
<text x="26" y="196">Cooking in an iron pot</text>
<text x="252" y="142">Tea and coffee — tannins</text>
<text x="252" y="160">Milk and calcium tablets</text>
<text x="252" y="178">Phytates in unrefined bran</text>
<text x="252" y="196">Antacids and acid suppressors</text>
</g>
</g>
</svg>