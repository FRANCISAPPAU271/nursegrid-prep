<svg viewBox="0 0 470 250" role="img" xmlns="http://www.w3.org/2000/svg"><title>Sex determination Punnett square</title>
<rect width="470" height="250" fill="#f6f8fc"/>
<text x="235" y="20" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">Sex determination — the father's sperm decides</text>
<text x="150" y="44" font-size="10.5" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#e2574c">MOTHER  XX</text>
<text x="150" y="58" font-size="9" text-anchor="middle" font-family="system-ui" fill="#5a6b85">every egg carries X</text>
<text x="150" y="196" font-size="10.5" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#2b6fa8">FATHER  XY</text>
<text x="150" y="210" font-size="9" text-anchor="middle" font-family="system-ui" fill="#5a6b85">half the sperm X, half Y</text>
<g font-family="system-ui">
<rect x="90" y="70" width="60" height="30" fill="#fde8e6" stroke="#e2574c" stroke-width="1.5"/>
<rect x="150" y="70" width="60" height="30" fill="#fde8e6" stroke="#e2574c" stroke-width="1.5"/>
<text x="120" y="90" font-size="12" text-anchor="middle" font-weight="700" fill="#a8352c">X</text>
<text x="180" y="90" font-size="12" text-anchor="middle" font-weight="700" fill="#a8352c">X</text>
<rect x="30" y="100" width="60" height="40" fill="#e8f1f8" stroke="#2b6fa8" stroke-width="1.5"/>
<rect x="30" y="140" width="60" height="40" fill="#e8f1f8" stroke="#2b6fa8" stroke-width="1.5"/>
<text x="60" y="125" font-size="12" text-anchor="middle" font-weight="700" fill="#2b6fa8">X</text>
<text x="60" y="165" font-size="12" text-anchor="middle" font-weight="700" fill="#2b6fa8">Y</text>
<rect x="90" y="100" width="60" height="40" fill="#fff" stroke="#5a6b85" stroke-width="1.5"/>
<rect x="150" y="100" width="60" height="40" fill="#fff" stroke="#5a6b85" stroke-width="1.5"/>
<rect x="90" y="140" width="60" height="40" fill="#fff" stroke="#5a6b85" stroke-width="1.5"/>
<rect x="150" y="140" width="60" height="40" fill="#fff" stroke="#5a6b85" stroke-width="1.5"/>
<text x="120" y="125" font-size="13" text-anchor="middle" font-weight="700" fill="#a8352c">XX</text>
<text x="180" y="125" font-size="13" text-anchor="middle" font-weight="700" fill="#a8352c">XX</text>
<text x="120" y="165" font-size="13" text-anchor="middle" font-weight="700" fill="#2b6fa8">XY</text>
<text x="180" y="165" font-size="13" text-anchor="middle" font-weight="700" fill="#2b6fa8">XY</text>
</g>
<rect x="236" y="70" width="220" height="110" rx="8" fill="#fff" stroke="#0f9d76" stroke-width="2"/>
<text x="346" y="90" font-size="11" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#0b7a5c">Every pregnancy independently</text>
<text x="346" y="112" font-size="10.5" text-anchor="middle" font-family="system-ui">50 percent girl, 50 percent boy</text>
<text x="346" y="132" font-size="10" text-anchor="middle" font-family="system-ui" fill="#5a6b85">Previous children change nothing.</text>
<text x="346" y="148" font-size="10" text-anchor="middle" font-family="system-ui" fill="#5a6b85">Four girls already still means 50:50.</text>
<text x="346" y="168" font-size="10" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#a8352c">The mother cannot determine sex</text>
<rect x="30" y="216" width="410" height="26" rx="8" fill="#fff" stroke="#e2574c" stroke-width="2"/>
<text x="235" y="233" font-size="10" text-anchor="middle" font-family="system-ui" font-weight="700">Blaming a woman for the sex of her children has no biological basis — correct this teaching gently</text>
</svg>