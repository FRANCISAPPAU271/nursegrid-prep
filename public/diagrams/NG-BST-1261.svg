<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="440" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">THE TWO WAYS A STUDY CAN BE WRONG</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">You either see something that is not there, or miss something that is.</text>

<rect x="150" y="62" width="230" height="30" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.4"/>
<text x="265" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">TRUTH: no real difference</text>
<rect x="382" y="62" width="230" height="30" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.4"/>
<text x="497" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a5c">TRUTH: a real difference</text>

<rect x="24" y="94" width="124" height="86" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.4"/>
<text x="86" y="130" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#6b3a6b">You concluded</text>
<text x="86" y="146" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#6b3a6b">there IS one</text>

<rect x="150" y="94" width="230" height="86" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.8"/>
<text x="265" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b2f2f">TYPE I ERROR</text>
<text x="265" y="138" text-anchor="middle" font-size="9.5" fill="#222">A false alarm. You claim a treatment</text>
<text x="265" y="153" text-anchor="middle" font-size="9.5" fill="#222">works when it does not.</text>
<text x="265" y="171" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8b2f2f">Its size is the p value threshold, 0.05</text>

<rect x="382" y="94" width="230" height="86" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.6"/>
<text x="497" y="130" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a5c3a">CORRECT</text>
<text x="497" y="150" text-anchor="middle" font-size="9.5" fill="#222">You found the real effect.</text>

<rect x="24" y="182" width="124" height="86" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.4"/>
<text x="86" y="218" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#6b3a6b">You concluded</text>
<text x="86" y="234" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#6b3a6b">there is NONE</text>

<rect x="150" y="182" width="230" height="86" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.6"/>
<text x="265" y="218" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a5c3a">CORRECT</text>
<text x="265" y="238" text-anchor="middle" font-size="9.5" fill="#222">Nothing there, and you said so.</text>

<rect x="382" y="182" width="230" height="86" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.8"/>
<text x="497" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1e">TYPE II ERROR</text>
<text x="497" y="226" text-anchor="middle" font-size="9.5" fill="#222">A miss. A real benefit existed and</text>
<text x="497" y="241" text-anchor="middle" font-size="9.5" fill="#222">the study failed to detect it.</text>
<text x="497" y="259" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a6d1e">Usually because the sample was small</text>

<rect x="24" y="284" width="592" height="70" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.8"/>
<text x="320" y="304" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a3a5c">POWER IS THE ABILITY TO FIND WHAT IS THERE</text>
<g font-size="10.5" fill="#222">
<text x="38" y="326">Power is the chance of detecting a real effect, conventionally set at 80% or more. It is decided BEFORE</text>
<text x="38" y="344">the study, mainly by the sample size, and it cannot be repaired afterwards.</text>
</g>

<rect x="24" y="366" width="592" height="48" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.7"/>
<text x="320" y="386" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8b2f2f">No significant difference is not the same as no difference.</text>
<text x="320" y="405" text-anchor="middle" font-size="10.5" fill="#222">An underpowered study proves nothing. Absence of evidence is not evidence of absence.</text>

<text x="320" y="434" text-anchor="middle" font-size="10.5" font-style="italic" fill="#1a3a5c">Test twenty things at the 0.05 level and one will come out significant by chance alone. Decide your question first.</text>
</svg>