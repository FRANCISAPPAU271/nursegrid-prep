<svg viewBox="0 0 640 390" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="390" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">HYPOVOLAEMIC SHOCK — WHY BLOOD PRESSURE FALLS LAST</text>
<text x="320" y="45" text-anchor="middle" font-size="12" fill="#555">The young patient compensates beautifully, then collapses without warning</text>

<rect x="24" y="58" width="592" height="26" fill="#1a3a5c"/>
<text x="90" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">BLOOD LOST</text>
<text x="215" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">PULSE</text>
<text x="330" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">BLOOD PRESSURE</text>
<text x="450" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">MENTAL STATE</text>
<text x="565" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">URINE</text>

<rect x="24" y="84" width="592" height="40" fill="#e2f0e2" stroke="#8fb98f"/>
<text x="90" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a5c3a">up to 15%</text>
<text x="215" y="108" text-anchor="middle" font-size="11" fill="#333">under 100</text>
<text x="330" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a5c3a">NORMAL</text>
<text x="450" y="108" text-anchor="middle" font-size="11" fill="#333">slightly anxious</text>
<text x="565" y="108" text-anchor="middle" font-size="11" fill="#333">normal</text>

<rect x="24" y="124" width="592" height="40" fill="#f3f7d9" stroke="#c9c227"/>
<text x="90" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b6a2f">15 – 30%</text>
<text x="215" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b2f2f">over 100</text>
<text x="330" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b6a2f">STILL NORMAL</text>
<text x="330" y="157" text-anchor="middle" font-size="9" fill="#555">but pulse pressure narrows</text>
<text x="450" y="148" text-anchor="middle" font-size="11" fill="#333">anxious, restless</text>
<text x="565" y="148" text-anchor="middle" font-size="11" fill="#333">reduced</text>

<rect x="24" y="164" width="592" height="40" fill="#faf0d6" stroke="#c9a227"/>
<text x="90" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b6a2f">30 – 40%</text>
<text x="215" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b2f2f">over 120, weak</text>
<text x="330" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b2f2f">FALLING at last</text>
<text x="450" y="188" text-anchor="middle" font-size="11" fill="#333">confused</text>
<text x="565" y="188" text-anchor="middle" font-size="11" fill="#333">scanty</text>

<rect x="24" y="204" width="592" height="40" fill="#f7d9d9" stroke="#8b2f2f" stroke-width="2"/>
<text x="90" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b2f2f">over 40%</text>
<text x="215" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b2f2f">over 140, thready</text>
<text x="330" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b2f2f">very low</text>
<text x="450" y="228" text-anchor="middle" font-size="11" fill="#333">lethargic, unconscious</text>
<text x="565" y="228" text-anchor="middle" font-size="11" fill="#333">none</text>

<rect x="24" y="256" width="592" height="52" fill="#fff3cd" stroke="#e0c86a"/>
<text x="320" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b5410">READ THE PULSE AND THE MIND, NOT THE BLOOD PRESSURE</text>
<text x="34" y="294" font-size="11" fill="#6b5410">A rising pulse with a restless, anxious patient is EARLY shock. By the time the blood pressure falls, 30% of the</text>
<text x="34" y="304" font-size="11" font-weight="bold" fill="#6b5410">circulating volume has already gone. Restlessness is hypoxia, not anxiety — never sedate it.</text>

<rect x="24" y="318" width="288" height="66" fill="#eaf3ea" stroke="#8fb98f"/>
<text x="168" y="338" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a5c3a">IMMEDIATE ACTION</text>
<text x="34" y="356" font-size="10" fill="#333">Lay flat, raise the legs · oxygen · two large</text>
<text x="34" y="370" font-size="10" fill="#333">cannulae · warmed fluid · STOP THE BLEEDING</text>
<text x="34" y="381" font-size="10" fill="#333">with direct pressure · keep the patient warm.</text>

<rect x="328" y="318" width="288" height="66" fill="#f7e9e9" stroke="#c78f8f"/>
<text x="472" y="338" text-anchor="middle" font-size="11" font-weight="bold" fill="#8b2f2f">CONCEALED BLEEDING</text>
<text x="338" y="356" font-size="10" fill="#333">Chest, abdomen, pelvis, both thighs and the</text>
<text x="338" y="370" font-size="10" fill="#333">floor. Litres can be lost with nothing visible.</text>
<text x="338" y="381" font-size="10" fill="#333">No wound does not mean no haemorrhage.</text>
</svg>