<svg viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect x="0" y="0" width="720" height="470" fill="#f7f9fb"/>
<text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1d3f5e">Judging dehydration at the bedside</text>
<text x="360" y="50" text-anchor="middle" font-size="12.5" fill="#5c6f80">Blood pressure falls last. By then the child is already in trouble.</text>

<rect x="30" y="66" width="660" height="150" rx="7" fill="#fff" stroke="#9fb9cd"/>
<text x="45" y="87" font-size="13.5" font-weight="bold" fill="#1d3f5e">The order in which signs appear</text>
<line x1="60" y1="112" x2="660" y2="112" stroke="#9fb9cd" stroke-width="2"/>
<circle cx="110" cy="112" r="7" fill="#8fb59d"/><circle cx="260" cy="112" r="7" fill="#d8c07a"/>
<circle cx="410" cy="112" r="7" fill="#c98f80"/><circle cx="580" cy="112" r="8" fill="#a8321c"/>
<text x="110" y="134" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1d5236">Thirst</text>
<text x="110" y="150" text-anchor="middle" font-size="10.5" fill="#26333d">dry mouth</text>
<text x="260" y="134" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6a1a">Less urine</text>
<text x="260" y="150" text-anchor="middle" font-size="10.5" fill="#26333d">dark, concentrated</text>
<text x="410" y="134" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3018">Fast pulse</text>
<text x="410" y="150" text-anchor="middle" font-size="10.5" fill="#26333d">sunken eyes, slow skin pinch</text>
<text x="580" y="134" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a8321c">BP falls</text>
<text x="580" y="150" text-anchor="middle" font-size="10.5" fill="#26333d">cold, mottled, drowsy</text>
<text x="45" y="177" font-size="12" font-weight="bold" fill="#8a3018">A normal blood pressure does not mean a normal circulating volume.</text>
<text x="45" y="196" font-size="11.5" fill="#26333d">The young compensate hard and then fail suddenly. Watch the pulse and the urine, not the BP.</text>
<text x="45" y="211" font-size="11" font-style="italic" fill="#7a5a2a">Urine output is the cheapest continuous monitor of perfusion you have.</text>

<rect x="30" y="232" width="325" height="222" rx="7" fill="#e9f2ec" stroke="#8fb59d"/>
<text x="45" y="253" font-size="13.5" font-weight="bold" fill="#1d5236">The numbers worth carrying</text>
<text x="45" y="276" font-size="11.5" fill="#26333d">Adult urine output: at least 0.5 mL/kg/hour</text>
<text x="45" y="295" font-size="11.5" fill="#26333d">Child: at least 1 mL/kg/hour</text>
<text x="45" y="314" font-size="11.5" fill="#26333d">Capillary refill: under 3 seconds</text>
<text x="45" y="337" font-size="11.5" font-weight="bold" fill="#1d5236">Maintenance fluid, the 4-2-1 rule per hour</text>
<text x="52" y="356" font-size="11.5" fill="#26333d">4 mL/kg for the first 10 kg</text>
<text x="52" y="374" font-size="11.5" fill="#26333d">2 mL/kg for the next 10 kg</text>
<text x="52" y="392" font-size="11.5" fill="#26333d">1 mL/kg for every kg after that</text>
<text x="52" y="412" font-size="11" font-style="italic" fill="#7a5a2a">A 25 kg child: 40 + 20 + 5 = 65 mL/hour</text>
<text x="45" y="437" font-size="11.5" font-weight="bold" fill="#8a3018">Maintenance replaces normal losses only.</text>
<text x="45" y="452" font-size="11.5" font-weight="bold" fill="#8a3018">Deficit and ongoing losses are added on top.</text>

<rect x="365" y="232" width="325" height="222" rx="7" fill="#f2ece2" stroke="#c9b79c"/>
<text x="380" y="253" font-size="13.5" font-weight="bold" fill="#5b4a2e">The chart most nurses fill in wrongly</text>
<text x="380" y="276" font-size="11.5" fill="#3f3428">IN: oral, IV, NG feeds, IV drug volumes,</text>
<text x="380" y="293" font-size="11.5" fill="#3f3428">the flush that nobody records</text>
<text x="380" y="315" font-size="11.5" fill="#3f3428">OUT: urine, vomit, stool, drains, stoma,</text>
<text x="380" y="332" font-size="11.5" fill="#3f3428">blood loss, wound exudate</text>
<text x="380" y="354" font-size="11.5" font-weight="bold" fill="#8a3018">Insensible loss — sweat and breath — is real</text>
<text x="380" y="371" font-size="11.5" font-weight="bold" fill="#8a3018">and never appears on the chart. Fever and</text>
<text x="380" y="388" font-size="11.5" font-weight="bold" fill="#8a3018">the harmattan increase it substantially.</text>
<text x="380" y="412" font-size="11.5" font-weight="bold" fill="#5b4a2e">Daily weight beats the chart every time.</text>
<text x="380" y="430" font-size="11.5" fill="#3f3428">One litre of fluid weighs one kilogram, and</text>
<text x="380" y="447" font-size="11.5" fill="#3f3428">the scale cannot forget to write things down.</text>
</svg>