<svg viewBox="0 0 470 180" role="img" xmlns="http://www.w3.org/2000/svg"><title>Ghana EPI schedule by visit</title>
<rect width="470" height="180" fill="#f6f8fc"/>
<line x1="40" y1="90" x2="440" y2="90" stroke="#0a1628" stroke-width="2"/>
<g font-family="system-ui" text-anchor="middle">
<circle cx="60" cy="90" r="9" fill="#0f9d76"/><text x="60" y="118" font-size="11" font-weight="700">Birth</text>
<text x="60" y="134" font-size="9.5">BCG</text><text x="60" y="146" font-size="9.5">OPV 0</text>
<circle cx="150" cy="90" r="9" fill="#0f9d76"/><text x="150" y="118" font-size="11" font-weight="700">6 wks</text>
<text x="150" y="134" font-size="9.5">Penta 1 · OPV 1</text><text x="150" y="146" font-size="9.5">PCV 1 · Rota 1</text>
<circle cx="240" cy="90" r="9" fill="#0f9d76"/><text x="240" y="118" font-size="11" font-weight="700">10 wks</text>
<text x="240" y="134" font-size="9.5">Penta 2 · OPV 2</text><text x="240" y="146" font-size="9.5">PCV 2 · Rota 2</text>
<circle cx="330" cy="90" r="9" fill="#0f9d76"/><text x="330" y="118" font-size="11" font-weight="700">14 wks</text>
<text x="330" y="134" font-size="9.5">Penta 3 · OPV 3</text><text x="330" y="146" font-size="9.5">PCV 3</text>
<circle cx="415" cy="90" r="9" fill="#f2b705"/><text x="415" y="118" font-size="11" font-weight="700">9 mo</text>
<text x="415" y="134" font-size="9.5">MR 1</text><text x="415" y="146" font-size="9.5">Yellow fever</text>
</g>
<text x="235" y="30" font-size="12" text-anchor="middle" font-family="system-ui" font-weight="700">Learn the VISIT, not the vaccine</text>
<text x="235" y="52" font-size="10.5" text-anchor="middle" font-family="system-ui" fill="#5a6b85">Rotavirus at 6 and 10 weeks only · MR 2 at 18 months</text>
</svg>