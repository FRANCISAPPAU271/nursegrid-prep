<svg viewBox="0 0 640 370" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="370" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">STROKE — RECOGNISE IT, THEN PROTECT WHAT IS LEFT</text>

<rect x="24" y="42" width="592" height="26" fill="#8b2f2f"/>
<text x="320" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">F A S T — and the clock starts at the LAST TIME SEEN WELL</text>

<rect x="24" y="68" width="148" height="86" fill="#fff" stroke="#d8d2c4"/>
<text x="98" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#8b2f2f">F</text>
<text x="98" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">FACE</text>
<text x="98" y="128" text-anchor="middle" font-size="10" fill="#555">Ask them to smile.</text>
<text x="98" y="144" text-anchor="middle" font-size="10" fill="#555">One side droops.</text>

<rect x="172" y="68" width="148" height="86" fill="#f6f3ec" stroke="#d8d2c4"/>
<text x="246" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#8b2f2f">A</text>
<text x="246" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">ARMS</text>
<text x="246" y="128" text-anchor="middle" font-size="10" fill="#555">Both arms raised.</text>
<text x="246" y="144" text-anchor="middle" font-size="10" fill="#555">One drifts down.</text>

<rect x="320" y="68" width="148" height="86" fill="#fff" stroke="#d8d2c4"/>
<text x="394" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#8b2f2f">S</text>
<text x="394" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">SPEECH</text>
<text x="394" y="128" text-anchor="middle" font-size="10" fill="#555">Slurred, jumbled,</text>
<text x="394" y="144" text-anchor="middle" font-size="10" fill="#555">or cannot speak.</text>

<rect x="468" y="68" width="148" height="86" fill="#f7d9d9" stroke="#8b2f2f" stroke-width="2"/>
<text x="542" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#8b2f2f">T</text>
<text x="542" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">TIME</text>
<text x="542" y="128" text-anchor="middle" font-size="10" fill="#8b2f2f">Any one sign —</text>
<text x="542" y="144" text-anchor="middle" font-size="10" font-weight="bold" fill="#8b2f2f">refer NOW.</text>

<rect x="24" y="164" width="288" height="90" fill="#f7e9e9" stroke="#c78f8f"/>
<text x="168" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b2f2f">THE FIRST NURSING PRIORITY</text>
<text x="34" y="204" font-size="10" fill="#333">Airway. A drooping face and weak swallow mean</text>
<text x="34" y="219" font-size="10" fill="#333">secretions pool and are aspirated.</text>
<text x="34" y="238" font-size="10" font-weight="bold" fill="#8b2f2f">NIL BY MOUTH — including drinks and oral</text>
<text x="34" y="251" font-size="10" font-weight="bold" fill="#8b2f2f">medicines — until swallowing is screened.</text>

<rect x="328" y="164" width="288" height="90" fill="#eaf3ea" stroke="#8fb98f"/>
<text x="472" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5c3a">WHY NOT LOWER THE BP QUICKLY?</text>
<text x="338" y="204" font-size="10" fill="#333">The brain around the damaged area survives on</text>
<text x="338" y="219" font-size="10" fill="#333">a raised pressure to keep blood flowing.</text>
<text x="338" y="238" font-size="10" fill="#333">Dropping it fast extends the infarct. Blood</text>
<text x="338" y="251" font-size="10" fill="#333">pressure is lowered slowly and cautiously.</text>

<rect x="24" y="262" width="592" height="26" fill="#1a3a5c"/>
<text x="320" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">FROM DAY ONE — REHABILITATION IS PREVENTION</text>

<rect x="24" y="288" width="592" height="74" fill="#fff" stroke="#d8d2c4"/>
<text x="34" y="308" font-size="10" fill="#333">Position the weak limbs correctly · two-hourly turns for pressure areas · passive movements to prevent contractures</text>
<text x="34" y="326" font-size="10" fill="#333">Speak to the patient even if they cannot reply — receptive understanding is often intact · approach from the unaffected side</text>
<text x="34" y="344" font-size="10" fill="#333">Bladder and bowel routine · mood: depression after stroke is common and treatable · involve the family early for home care</text>
<text x="34" y="359" font-size="10" font-style="italic" fill="#8b2f2f">The complications of immobility disable more stroke patients than the stroke itself.</text>
</svg>