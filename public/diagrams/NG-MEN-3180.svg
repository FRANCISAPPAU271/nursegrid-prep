<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 286" role="img" aria-label="Screening for physical causes before attributing new psychiatric symptoms to mental illness">
<rect width="470" height="286" fill="#ffffff"/>
<text x="235" y="22" text-anchor="middle" font-family="Georgia,serif" font-size="15" font-weight="bold" fill="#14532d">New psychiatric symptoms: exclude the body first</text>
<rect x="24" y="36" width="422" height="30" rx="4" fill="#e0f2fe" stroke="#1e3a8a"/>
<text x="235" y="56" text-anchor="middle" font-family="Georgia,serif" font-size="12" font-weight="bold">Sudden onset · fluctuating · clouded consciousness · over 40 · abnormal observations</text>
<path d="M235 68 L235 82" stroke="#334155" stroke-width="2" marker-end="url(#o79)"/>
<defs><marker id="o79" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#334155"/></marker></defs>
<rect x="24" y="84" width="422" height="26" fill="#e2e8f0" stroke="#334155"/>
<text x="36" y="102" font-family="Georgia,serif" font-size="11.5" font-weight="bold">Look for</text>
<text x="215" y="102" font-family="Georgia,serif" font-size="11.5" font-weight="bold">Common in Ghana</text>
<rect x="24" y="110" width="422" height="24" fill="#fefce8" stroke="#92400e"/>
<text x="36" y="126" font-family="Georgia,serif" font-size="11">Infection</text>
<text x="215" y="126" font-family="Georgia,serif" font-size="11">cerebral malaria · typhoid · meningitis · HIV · sepsis</text>
<rect x="24" y="134" width="422" height="24" fill="#ffffff" stroke="#92400e"/>
<text x="36" y="150" font-family="Georgia,serif" font-size="11">Metabolic</text>
<text x="215" y="150" font-family="Georgia,serif" font-size="11">hypoglycaemia · low sodium · uraemia · liver failure</text>
<rect x="24" y="158" width="422" height="24" fill="#fefce8" stroke="#92400e"/>
<text x="36" y="174" font-family="Georgia,serif" font-size="11">Endocrine</text>
<text x="215" y="174" font-family="Georgia,serif" font-size="11">thyroid disease · steroid treatment</text>
<rect x="24" y="182" width="422" height="24" fill="#ffffff" stroke="#92400e"/>
<text x="36" y="198" font-family="Georgia,serif" font-size="11">Substances</text>
<text x="215" y="198" font-family="Georgia,serif" font-size="11">alcohol or benzodiazepine withdrawal · cannabis · tramadol</text>
<rect x="24" y="206" width="422" height="24" fill="#fefce8" stroke="#92400e"/>
<text x="36" y="222" font-family="Georgia,serif" font-size="11">Neurological</text>
<text x="215" y="222" font-family="Georgia,serif" font-size="11">head injury · post-ictal state · stroke · space-occupying lesion</text>
<rect x="24" y="238" width="422" height="38" rx="4" fill="#fee2e2" stroke="#991b1b" stroke-width="1.8"/>
<text x="235" y="256" text-anchor="middle" font-family="Georgia,serif" font-size="12" font-weight="bold" fill="#991b1b">Check glucose, temperature and oxygen saturation every time.</text>
<text x="235" y="270" text-anchor="middle" font-family="Georgia,serif" font-size="10.8" font-style="italic" fill="#334155">Acute confusion is a physical emergency until proved otherwise.</text>
</svg>