<svg viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect x="0" y="0" width="720" height="480" fill="#f7f9fb"/>
<text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1d3f5e">A fall is never one thing</text>
<text x="360" y="50" text-anchor="middle" font-size="12.5" fill="#5c6f80">Remove three small risks and the fall does not happen</text>

<rect x="30" y="66" width="212" height="160" rx="7" fill="#eaf1f7" stroke="#9fb9cd"/>
<text x="45" y="87" font-size="13" font-weight="bold" fill="#1d3f5e">Inside the person</text>
<text x="45" y="108" font-size="11.5" fill="#26333d">Weak legs, poor balance</text>
<text x="45" y="127" font-size="11.5" fill="#26333d">Dizzy on standing</text>
<text x="45" y="146" font-size="11.5" fill="#26333d">Poor vision, new glasses</text>
<text x="45" y="165" font-size="11.5" fill="#26333d">Painful feet, long toenails</text>
<text x="45" y="184" font-size="11.5" fill="#26333d">Confusion, low mood</text>
<text x="45" y="203" font-size="11.5" fill="#26333d">Needing to rush to pass urine</text>
<text x="45" y="220" font-size="11" font-style="italic" fill="#7a5a2a">Most are treatable</text>

<rect x="254" y="66" width="212" height="160" rx="7" fill="#f6e9e6" stroke="#c98f80"/>
<text x="269" y="87" font-size="13" font-weight="bold" fill="#8a3018">In the medicine cupboard</text>
<text x="269" y="108" font-size="11.5" fill="#3f2b26">Sedatives and sleeping tablets</text>
<text x="269" y="127" font-size="11.5" fill="#3f2b26">Blood pressure drugs</text>
<text x="269" y="146" font-size="11.5" fill="#3f2b26">Water tablets, and the rush</text>
<text x="269" y="162" font-size="11.5" fill="#3f2b26">to the toilet they cause</text>
<text x="269" y="181" font-size="11.5" fill="#3f2b26">Anything causing drowsiness</text>
<text x="269" y="200" font-size="11.5" font-weight="bold" fill="#8a3018">Four or more medicines</text>
<text x="269" y="219" font-size="11" font-style="italic" fill="#7a5a2a">Read the chart before the room</text>

<rect x="478" y="66" width="212" height="160" rx="7" fill="#efe4d4" stroke="#c9a678"/>
<text x="493" y="87" font-size="13" font-weight="bold" fill="#7a4a12">Around the house</text>
<text x="493" y="108" font-size="11.5" fill="#3f2b26">Dark passage to the latrine</text>
<text x="493" y="127" font-size="11.5" fill="#3f2b26">Uneven step at the doorway</text>
<text x="493" y="146" font-size="11.5" fill="#3f2b26">Wet bathroom floor</text>
<text x="493" y="165" font-size="11.5" fill="#3f2b26">Loose mat, trailing cloth</text>
<text x="493" y="184" font-size="11.5" fill="#3f2b26">Chair or bed too low to rise from</text>
<text x="493" y="203" font-size="11.5" fill="#3f2b26">Slippers without a back</text>
<text x="493" y="220" font-size="11" font-style="italic" fill="#7a5a2a">All cheap to change</text>

<rect x="30" y="244" width="660" height="92" rx="7" fill="#e9f2ec" stroke="#8fb59d"/>
<text x="45" y="265" font-size="13.5" font-weight="bold" fill="#1d5236">Why single-cause thinking fails</text>
<text x="52" y="288" font-size="12" fill="#26333d">Falls are usually three or four small risks acting together on one occasion</text>
<text x="52" y="309" font-size="12" font-weight="bold" fill="#1d5236">You cannot fix ageing, but removing any two of the small risks may stop the next fall</text>
<text x="52" y="328" font-size="11.5" font-style="italic" fill="#7a5a2a">Which is why the assessment covers the person, the drugs and the house &#8212; not one of them</text>

<rect x="30" y="354" width="325" height="110" rx="7" fill="#f6e2de" stroke="#c98f80"/>
<text x="45" y="375" font-size="13.5" font-weight="bold" fill="#8a3018">The response that causes the next fall</text>
<text x="45" y="396" font-size="11.5" fill="#3f2b26">Putting her to bed &#8220;so she is safe&#8221; costs</text>
<text x="45" y="412" font-size="11.5" fill="#3f2b26">muscle within days and balance after that</text>
<text x="45" y="433" font-size="11.5" fill="#3f2b26">Cot sides make a fall from higher up</text>
<text x="45" y="452" font-size="11.5" font-weight="bold" fill="#8a3018">Restriction presented as safety is the harm</text>

<rect x="365" y="354" width="325" height="110" rx="7" fill="#eaf1f7" stroke="#9fb9cd"/>
<text x="380" y="375" font-size="13.5" font-weight="bold" fill="#1d3f5e">Fear of falling</text>
<text x="380" y="396" font-size="11.5" fill="#26333d">After a fall she stops going out, stops</text>
<text x="380" y="412" font-size="11.5" fill="#26333d">walking, and grows weaker &#8212; so the</text>
<text x="380" y="431" font-size="11.5" fill="#26333d">next fall becomes more likely, not less</text>
<text x="380" y="452" font-size="11.5" font-weight="bold" fill="#26333d">Ask what she has stopped doing</text>
</svg>