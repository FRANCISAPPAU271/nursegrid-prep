<svg viewBox="0 0 460 200" role="img" xmlns="http://www.w3.org/2000/svg"><title>Checking nasogastric tube position</title>
<rect width="460" height="200" fill="#f6f8fc"/>
<rect x="20" y="60" width="130" height="100" rx="10" fill="#fff" stroke="#0f9d76" stroke-width="3"/>
<rect x="165" y="60" width="130" height="100" rx="10" fill="#fff" stroke="#8aa0bf" stroke-width="2"/>
<rect x="310" y="60" width="130" height="100" rx="10" fill="#fff" stroke="#e2574c" stroke-width="2"/>
<text x="85" y="86" font-size="12" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#0f9d76">1st LINE</text>
<text x="85" y="110" font-size="11" text-anchor="middle" font-family="system-ui" font-weight="600">Aspirate + pH strip</text>
<text x="85" y="130" font-size="14" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#0f9d76">pH 1–5.5</text>
<text x="85" y="147" font-size="10" text-anchor="middle" font-family="system-ui">= safe to use</text>
<text x="230" y="86" font-size="12" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#5a6b85">IF IN DOUBT</text>
<text x="230" y="110" font-size="11" text-anchor="middle" font-family="system-ui">Chest x-ray</text>
<text x="230" y="130" font-size="10" text-anchor="middle" font-family="system-ui">the definitive check</text>
<text x="375" y="86" font-size="12" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#e2574c">NEVER</text>
<text x="375" y="110" font-size="11" text-anchor="middle" font-family="system-ui">&quot;Whoosh&quot; test</text>
<text x="375" y="128" font-size="11" text-anchor="middle" font-family="system-ui">Bubbling in water</text>
<text x="375" y="146" font-size="10" text-anchor="middle" font-family="system-ui">unreliable — people died</text>
<text x="230" y="30" font-size="12.5" text-anchor="middle" font-family="system-ui" font-weight="700">Never feed until position is confirmed</text>
<text x="230" y="185" font-size="10.5" text-anchor="middle" font-family="system-ui" fill="#5a6b85">Check before every feed, every medicine, and after any vomiting or coughing</text>
</svg>