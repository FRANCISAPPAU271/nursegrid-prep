<svg viewBox="0 0 470 220" role="img" xmlns="http://www.w3.org/2000/svg"><title>Negative feedback loop</title>
<rect width="470" height="220" fill="#f6f8fc"/>
<rect x="165" y="14" width="140" height="34" rx="8" fill="#0a1628"/>
<text x="235" y="36" font-size="12" text-anchor="middle" font-family="system-ui" fill="#fff" font-weight="700">SET POINT</text>
<rect x="20" y="90" width="120" height="46" rx="8" fill="#fff" stroke="#e2574c" stroke-width="2"/>
<text x="80" y="110" font-size="11" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#e2574c">STIMULUS</text>
<text x="80" y="126" font-size="10" text-anchor="middle" font-family="system-ui">value moves away</text>
<rect x="175" y="90" width="120" height="46" rx="8" fill="#fff" stroke="#0a1628" stroke-width="2"/>
<text x="235" y="110" font-size="11" text-anchor="middle" font-family="system-ui" font-weight="700">SENSOR</text>
<text x="235" y="126" font-size="10" text-anchor="middle" font-family="system-ui">detects the change</text>
<rect x="330" y="90" width="120" height="46" rx="8" fill="#fff" stroke="#0f9d76" stroke-width="2"/>
<text x="390" y="110" font-size="11" text-anchor="middle" font-family="system-ui" font-weight="700" fill="#0f9d76">EFFECTOR</text>
<text x="390" y="126" font-size="10" text-anchor="middle" font-family="system-ui">opposes the change</text>
<path d="M140 113 h30" stroke="#0a1628" stroke-width="2" marker-end="url(#a3)"/>
<path d="M295 113 h30" stroke="#0a1628" stroke-width="2" marker-end="url(#a3)"/>
<defs><marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#0a1628"/></marker></defs>
<path d="M390 90 V62 H80 V90" fill="none" stroke="#0f9d76" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a4)"/>
<defs><marker id="a4" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#0f9d76"/></marker></defs>
<text x="235" y="56" font-size="10.5" text-anchor="middle" font-family="system-ui" fill="#0f9d76" font-weight="600">response REVERSES the original change</text>
<text x="235" y="175" font-size="12" text-anchor="middle" font-family="system-ui" font-weight="700">Negative = opposes · Positive = amplifies</text>
<text x="235" y="196" font-size="10.5" text-anchor="middle" font-family="system-ui" fill="#5a6b85">Positive feedback is rare: labour contractions, blood clotting</text>
</svg>