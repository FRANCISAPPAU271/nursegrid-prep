<svg viewBox="0 0 640 450" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="450" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">THE ENDOCRINE CHAIN OF COMMAND</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">Three links. Find the broken link and you have found the diagnosis.</text>

<rect x="215" y="60" width="210" height="46" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.8"/>
<text x="320" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a3a5c">HYPOTHALAMUS</text>
<text x="320" y="97" text-anchor="middle" font-size="9.5" fill="#222">the brain's link to the glands</text>
<line x1="320" y1="106" x2="320" y2="126" stroke="#5a86a8" stroke-width="2"/>

<rect x="215" y="126" width="210" height="46" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.8"/>
<text x="320" y="146" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a3a5c">PITUITARY</text>
<text x="320" y="163" text-anchor="middle" font-size="9.5" fill="#222">sends the trophic hormone</text>
<line x1="320" y1="172" x2="320" y2="192" stroke="#5a86a8" stroke-width="2"/>

<rect x="180" y="192" width="280" height="46" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.8"/>
<text x="320" y="212" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a5c3a">TARGET GLAND — thyroid, adrenal cortex, gonad</text>
<text x="320" y="229" text-anchor="middle" font-size="9.5" fill="#222">makes the hormone that acts on the body</text>

<path d="M180 215 L110 215 L110 83 L215 83" fill="none" stroke="#8b2f2f" stroke-width="1.8" stroke-dasharray="5,4"/>
<text x="60" y="150" font-size="10" font-weight="bold" fill="#8b2f2f">NEGATIVE</text>
<text x="60" y="164" font-size="10" font-weight="bold" fill="#8b2f2f">FEEDBACK</text>
<text x="60" y="180" font-size="9" fill="#8b2f2f">enough is</text>
<text x="60" y="192" font-size="9" fill="#8b2f2f">enough</text>

<rect x="470" y="126" width="150" height="112" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.6"/>
<text x="545" y="146" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1e">TWO PITUITARY LOBES</text>
<g font-size="9.5" fill="#222">
<text x="480" y="166">ANTERIOR — makes its</text>
<text x="480" y="179">own hormones</text>
<text x="480" y="199">POSTERIOR — makes</text>
<text x="480" y="212">nothing. It only stores</text>
<text x="480" y="225">and releases ADH and</text>
</g>
<text x="480" y="236" font-size="9.5" fill="#222">oxytocin from above.</text>

<rect x="30" y="258" width="580" height="76" fill="#f7ecec" stroke="#8b2f2f" stroke-width="1.7"/>
<text x="320" y="278" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8b2f2f">READ THE PAIR OF RESULTS, NOT ONE OF THEM</text>
<g font-size="10.5" fill="#222">
<text x="44" y="300">Low thyroid hormone with a HIGH pituitary signal — the gland itself has failed. The pituitary is shouting.</text>
<text x="44" y="320">Low thyroid hormone with a LOW pituitary signal — the pituitary has failed. The gland was never asked.</text>
</g>

<rect x="30" y="350" width="285" height="70" fill="#f4eaf4" stroke="#8a5c8a" stroke-width="1.6"/>
<text x="172" y="370" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6b3a6b">MOST FEEDBACK IS NEGATIVE</text>
<g font-size="10" fill="#222">
<text x="44" y="390">The product switches off its own</text>
<text x="44" y="406">production. Stability is the purpose.</text>
</g>

<rect x="325" y="350" width="285" height="70" fill="#eaf3ea" stroke="#1a5c3a" stroke-width="1.6"/>
<text x="467" y="370" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a5c3a">TWO ARE POSITIVE</text>
<g font-size="10" fill="#222">
<text x="339" y="390">Labour and breastfeeding. The product</text>
<text x="339" y="406">causes MORE of itself, until birth or feed ends.</text>
</g>

<text x="320" y="440" text-anchor="middle" font-size="10.5" font-style="italic" fill="#1a3a5c">A gland can be over-active, under-active, or perfectly normal but wrongly instructed. Ask which.</text>
</svg>