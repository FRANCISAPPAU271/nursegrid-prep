<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, serif">
<rect width="640" height="400" fill="#fbfaf7"/>
<text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a3a5c">"NATURAL" DOES NOT MEAN "SAFE"</text>
<text x="320" y="45" text-anchor="middle" font-size="11" fill="#555">A plant is a mixture of active chemicals. That is why it works — and why it can harm.</text>

<rect x="20" y="58" width="192" height="150" fill="#f7ecec" stroke="#c08a8a" stroke-width="1.5"/>
<text x="116" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b2f2f">DOSE IS UNCERTAIN</text>
<g font-size="10.5" fill="#222">
<text x="30" y="98">The strength of a plant varies</text>
<text x="30" y="114">with species, soil, season,</text>
<text x="30" y="130">the part used and how it</text>
<text x="30" y="146">was prepared.</text>
<text x="30" y="170">Two cups of the same brew</text>
<text x="30" y="186">may not carry the same dose.</text>
</g>

<rect x="224" y="58" width="192" height="150" fill="#fdf6e6" stroke="#c8a54b" stroke-width="1.5"/>
<text x="320" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1e">CONTAMINATION</text>
<g font-size="10.5" fill="#222">
<text x="234" y="98">Unregulated products have</text>
<text x="234" y="114">been found to contain</text>
<text x="234" y="130">bacteria and moulds,</text>
<text x="234" y="146">heavy metals such as lead</text>
<text x="234" y="162">and mercury, and hidden</text>
<text x="234" y="178">orthodox drugs such as</text>
<text x="234" y="194">steroids and analgesics.</text>
</g>

<rect x="428" y="58" width="192" height="150" fill="#eef4f8" stroke="#5a86a8" stroke-width="1.5"/>
<text x="524" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">INTERACTION</text>
<g font-size="10.5" fill="#222">
<text x="438" y="98">Plant chemicals compete for</text>
<text x="438" y="114">the same liver enzymes as</text>
<text x="438" y="130">prescribed drugs, so blood</text>
<text x="438" y="146">levels rise or fall silently.</text>
<text x="438" y="170">Highest risk with warfarin,</text>
<text x="438" y="186">antiretrovirals, antiepileptics,</text>
<text x="438" y="202">insulin and digoxin.</text>
</g>

<rect x="20" y="222" width="600" height="26" fill="#8b2f2f"/>
<text x="320" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">THE MOST COMMON HARM IS NOT POISONING — IT IS DELAY</text>

<rect x="20" y="258" width="600" height="60" fill="#f7ecec" stroke="#c08a8a" stroke-width="1.5"/>
<text x="34" y="280" font-size="10.5" fill="#222">A child with severe malaria, a woman with a breast lump, a man with a strangulated hernia: each treated at home for</text>
<text x="34" y="298" font-size="10.5" fill="#222">weeks first, then arriving at the facility too late for the treatment that would have worked. Time is the lost resource.</text>

<rect x="20" y="330" width="600" height="56" fill="#eaf3ea" stroke="#8fb98f" stroke-width="1.5"/>
<text x="320" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5c3a">THE NURSE'S POSITION</text>
<text x="34" y="370" font-size="10.5" fill="#222">Not to condemn and not to endorse, but to ask, record, watch for interaction and toxicity, report adverse events,</text>
<text x="34" y="382" font-size="10.5" fill="#222">and be absolutely clear about the conditions where delay itself is the danger.</text>
</svg>